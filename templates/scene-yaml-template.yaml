# シーン YAML の雛形。台本 Markdown（script-template.md）と対で作成する
# （台本 = 人間用マスター、この YAML = script-to-video のレンダリング指示書）。
#
# 仕様（正）は script-to-video 側のドキュメント。ここには複製しない。
#   ローカル: C:\Users\shuya\Projects\script-to-video\docs\schema.md
#   GitHub:  https://github.com/shuyahara/script-to-video/blob/main/docs/schema.md
#   サンプル: script-to-video/examples/sns-lookism-sample.yaml
#
# 検証:
#   cd C:\Users\shuya\Projects\script-to-video
#   .venv\Scripts\python.exe -m script_to_video validate <このファイル>
#
# 未知のフィールドはエラーになる（extra="forbid"）。仕様にない項目を書かない。
#
# シーンごとに、図解・検索クエリ・生成プロンプトより先に「ビジュアル意図」（visual_intent。
# どんな絵で見せたいか）を1〜2文で決める。画面構成は3種類（全画面実写=assetsのみ／
# 図解のみ=diagramのみ／背景付き図解=diagram+assets併記）。詳細はCLAUDE.md「図解スクリプト」を参照。

video:
  title: "{動画タイトル}"
  speaker: "青山龍星"        # 任意。既定値のため省略可（VOICEVOX話者名）
  resolution:                # 任意。既定 1920x1080
    width: 1920
    height: 1080
  style: null                 # 任意。生成AI用の共通スタイルプロンプト（全シーン共通。シーン別 gen_prompt と連結）
  bgm: null                   # 任意。BGMファイルのパス（ファイル自体はユーザーが配置。候補選定はテキストで報告する）
  bgm_credit: null            # 任意。BGM確定後にクレジット表記文字列を記録（例: "「落ち着いた？」ミルアージュ（DOVA-SYNDROME）"）。description.txtに自動転記される

scenes:
  - id: 1                     # 必須。1から始まる連番（scenes全体で検証される）
    title: "フック"            # 必須。シーン見出し
    visual_intent: "{どんな絵で見せたいか。1〜2文。例: 街とスマホ画面を交互に見せ、SNSの日常への浸透を印象づける}"  # 任意。レンダリングには使わず候補ギャラリーに表示するだけ。図解/検索クエリ/生成プロンプトはここから導く
    narration:                 # 必須（1件以上）。間を入れたい箇所でセグメントを分割する
      - text: "{読み上げ文その1（日本語ダブルクォート1行。折りたたみスカラー >- は使わない）}"
        pause_after: 0.5       # 任意。このセグメント後の無音秒数。不要なら省略（0は不可）
      - text: "{読み上げ文その2（ポーズ不要ならpause_afterを省略）}"
    telop: "{画面テロップ}"     # 任意
    readings:                   # 任意。誤読しやすい語の読み修正
      - surface: "{表記の例: 日陰}"
        reading: "{カタカナ読みの例: ヒカゲ}"
    search_query: "{素材検索クエリ（英語。Pixabay/Pexels/Commons向け）}"  # 任意
    assets:                      # 任意。候補素材（シーンごと2〜4件を目安に記録）
      # commercial-ok: Pixabay/Pexels等の商用利用可素材。source_url・attributionとも不要
      - url: "{素材URL}"
        kind: image                # image | video
        license: commercial-ok     # pd | cc-by | commercial-ok | unknown
        source_name: "Pixabay"
      # cc-by: Wikimedia Commons等でCC-BYの場合、source_urlとattributionが必須
      # - url: "{素材URL}"
      #   kind: image
      #   license: cc-by
      #   source_url: "{出典URL}"
      #   attribution: "{出典表記文字列（例: 著者名 / CC BY 4.0）}"
      # unknown: 汎用検索由来でライセンス不明。source_urlが必須（権利要確認）
      # - url: "{素材URL}"
      #   kind: image
      #   license: unknown
      #   source_url: "{出典URL}"
      #   note: "権利要確認。存命人物が写る場合は肖像権・パブリシティ権に注意"
    gen_prompt: null             # 任意。生成AI用のシーン別プロンプト（video.styleと連結して使用）

  - id: 2
    title: "問題提起"
    visual_intent: "{どんな絵で見せたいか。1〜2文}"  # 任意
    narration:
      - text: "{読み上げ文}"
    telop: "{画面テロップ}"
    search_query: "{素材検索クエリ（英語）}"

  # 以降、論証・反証・結論のシーンを id を連番で追加する。
  # 論証・手順・比較・データのシーンは、実写素材の代わりに図解（diagram）を使う
  # （CLAUDE.md「図解スクリプト」の使い分け基準を参照。1シーンでdiagramとassetsは併用不可）。
  # 座標・サイズ・色・アニメーションの数値は書かない。書くのは型・要素・id・ラベル・
  # 出現セグメント（at）だけ。仕様はscript-to-videoのdocs/schema.mdが正。

  - id: 3                       # buildup型の例: 主張を積み上げる／原因から結果へ
    title: "論証: ハロー効果"
    visual_intent: "外見→好印象→性格評価という因果の連鎖を積み上げて見せる。情景の支えは不要（画面は持つ）ので無地下地の図解のみ"  # 画面構成: 図解のみ（diagramだけでassetsは書かない）
    narration:
      - text: "外見の魅力は，第一印象に影響します。"
      - text: "その好印象は，性格の評価にも波及します。"
      - text: "これが，美しいものは善いという思い込みです。"
    telop: "外見の魅力 → 好印象 → 性格評価への波及"
    key_color: "#2E4A7D"        # 任意。章ごとに変える（省略時は既定色 #1a2233）。#RRGGBB形式。色相しか使われない
    diagram:
      type: buildup              # 省略可（既定値）。3〜12要素・5行まで
      rows:
        - items:
            - id: face
              icon: face          # Material Symbolsのアイコン名（スネークケース）
              text: 魅力的な外見    # 12文字以内推奨（20文字超はエラー）
              at: 1               # 出現するナレーションセグメント番号（1始まり）
        - items:
            - id: warm
              text: 好印象
              at: 2
        - items:
            - id: halo
              text: 美しいものは善い
              accent: true        # 強調色。1シーンに1つまで推奨
              at: 3
      arrows:
        - from: face
          to: warm                # at省略時はto側要素のatと同時に出現
        - from: warm
          to: halo
          at: 3

  - id: 4                       # flow型の例: 実験の手順・時間順に進む処理
    title: "論証: 実験の手順"
    visual_intent: "実験の4手順を流れ図で見せる。無地下地の図解のみ（画面構成: 図解のみ）"
    narration:
      - text: "実験の手順は，次の4段階です。"
      - text: "まず，写真を提示します。"
      - text: "次に，人物像を推測してもらいます。"
      - text: "評価を集計し，魅力度との相関を確認します。"
    telop: "実験の手順"
    diagram:
      type: flow                 # 3〜6ステップ。矢印は自動で引かれるので書かない
      steps:
        - id: s1
          icon: photo_camera
          text: 写真を提示
          at: 2
        - id: s2
          icon: psychology
          text: 人物像を推測
          at: 3
        - id: s3
          icon: query_stats
          text: 評価を集計
          at: 4
        - id: s4
          icon: trending_up
          text: 魅力度と相関
          at: 4

  - id: 5                       # 背景付き図解の例: diagramとassetsを併記（排他ではない）
    title: "問題提起"
    visual_intent: "定義を2つ並べて示しつつ、背景は夜の繁華街のにぎわいで受容の空気感を出す。無地下地では画面が寂しいと判断"  # 画面構成: 背景付き図解（diagram+assetsの併記）
    narration:
      - text: "「受け入れられている」とは，公言する人が増え，好意的に受け取られる場面が増えたことを指します。"
      - text: "背景には，日常に浸透したSNSの気配を敷きます。"
    telop: "「受容」とは何か／問いの定義"
    search_query: "night city crowd neon street bokeh"  # assetsを併記する場合もsearch_queryは書く
    diagram:
      type: buildup
      rows:
        - items:
            - id: disclose
              text: 公言する人が増えた
              at: 1
            - id: accept
              text: 好意的・中立に受容
              at: 1
      arrows:
        - from: disclose
          to: accept
    assets:                      # diagramと併記すると「背景付き図解」（採用素材にぼかし＋暗色スクリムをかけて図解を重ねる）
      - url: "{素材URL}"
        kind: video
        license: commercial-ok
        source_name: "Pixabay"

  # 以降、映像リズムの新フィールド（chapter_title / emphasis / cutaways / diagrams）の例。
  # 詳細はCLAUDE.md「映像リズムの設計」を参照。画面が10〜20秒に1回は変わるように、
  # シーン内でも変化点を作る。効果音（SE）はツール既定で自動付与されるため書かない。

  - id: 6                       # chapter_title / chapter_bgm / emphasis の例
    title: "論証②: 見た目と社会的評価"
    visual_intent: "外見の良さが、就職や昇進など社会的な場面の評価にも影響することを示す"
    chapter_title: "論証2 見た目の社会的評価"  # 任意。章の先頭シーンに付ける（3秒の章カードを自動挿入。最大24文字、18文字超はvalidateが警告）
    chapter_bgm: "bgm/argument2.mp3"            # 任意。このシーンの開始時刻から曲を切り替える（2秒クロスフェード）。パスはvideo.bgmと同じくYAMLからの相対パス
    chapter_bgm_credit: "「歩幅」ミルアージュ（DOVA-SYNDROME）"  # 任意。省略時はファイル名ベースのフォールバック表記
    narration:
      - text: "見た目の良さは，就職や昇進といった社会的な場面でも，評価に影響することが分かっています。"
      - text: "これは，容姿による格差そのものです。"
    telop: "外見が社会的評価に影響する"
    emphasis:                                   # 任意。決め文のセグメントに付ける（1シーン最大2件。1章に1〜2箇所が目安）
      - at: 2                                   # 必須。このセグメントを読み終えた直後に強調カットが入る
        text: "外見による格差"                   # 必須。1〜16文字

  - id: 7                       # cutaways の例: ナレーションが具体物に触れる箇所に全画面インサートを挟む
    title: "論証③: 実験の紹介"
    visual_intent: "1972年の実験室で参加者が写真を見比べている場面を、具体例として一瞬だけ差し込む"
    narration:
      - text: "1972年，ディオンらは，顔写真の魅力度と，性格の評価との関係を調べる実験を行いました。"
      - text: "参加者は，複数の顔写真を見比べ，それぞれの人物の性格を推測しました。"
      - text: "結果，魅力的な顔ほど，親切で有能だと評価される傾向が見られました。"
    telop: "ディオンら（1972）の実験"
    search_query: "psychology experiment portrait photographs comparison"
    cutaways:
      - slot: 1                                 # 必須。採用素材は scene_07_cut1.* として保存される（シーン内で一意）
        from: 1                                 # 必須。開始セグメント番号（1始まり）
        to: 2                                    # 任意。終了セグメント番号（含む）。省略時はfromと同じ
        visual_intent: "1972年の実験室で参加者が写真を見比べている場面"
        gen_prompt: "participants in a 1970s psychology lab comparing portrait photographs, full-bleed composition"
        search_query: "psychology experiment participants photographs"
        telop: "ディオンら（1972）"

  - id: 8                       # diagrams（複数図解）の例: 1シーンの中で論点が転換する場合、diagramの代わりに使う
    title: "論証④: 背景の整理と対策"
    visual_intent: "前半は背景の整理（buildup）、後半は対策の手順（flow）と場面が転換するので、diagramではなくdiagramsで2つに分ける"
    narration:
      - text: "ルッキズムが強まる背景には，SNSでの比較機会の増加があります。"
      - text: "投稿の閲覧が増えるほど，容姿への言及も増える傾向が確認されています。"
      - text: "対策として，まず，比較を誘発する機能を見直します。"
      - text: "次に，容姿に関する話題の投稿指針を整備します。"
      - text: "最後に，運用状況を定期的に点検します。"
    telop: "背景の整理 → 対策の手順"
    diagrams:                                   # 任意。diagram（単一）とは排他。各要素はfrom/toが必須で、範囲は重ならないこと
      - type: buildup
        from: 1
        to: 2
        rows:
          - items:
              - id: sns_exposure
                icon: photo_camera
                text: SNSでの比較機会増
                at: 1
          - items:
              - id: appearance_mention
                text: 容姿への言及増加
                at: 2
        arrows:
          - from: sns_exposure
            to: appearance_mention
      - type: flow
        from: 3                                 # 前のスロット（1〜2）と重ならない範囲
        to: 5
        steps:
          - id: measure1
            icon: settings
            text: 比較機能の見直し
            at: 3
          - id: measure2
            icon: policy
            text: 投稿指針の整備
            at: 4
          - id: measure3
            icon: fact_check
            text: 運用の定期点検
            at: 5
