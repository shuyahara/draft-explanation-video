scenes:
- id: 1
  title: フック（じゃら付けのずんだもん）
  chapter_title: null
  narration:
  - text: めたん、見てほしいのだ。めじるしアクセサリー、5個目なのだ。
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: 傘やバッグに付ける、あの小さなマスコットね。バッグがじゃらじゃら。それ、今朝も並んだの？
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 開店前から並んだのだ。でも、欲しいキャラは出なかったのだ…。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: それ、6年前からカプセルトイの棚にあったの、知ってる？
    speaker: めたん
    expression: normal
    pause_after: 0.8
  - text: 6年前？ そんなに前からあったら、僕が知らないはずないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: 最初は電車で見かけただけだったのに、気づいたら5個なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 2020年の6月よ。傘の目印として、200円で売られていたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 誰も並んでなかったし、誰も転売しなかった。リングもチャームも、形は今と同じよ。
    speaker: めたん
    expression: normal
    pause_after: 1.0
  - text: 同じものなのに、なんで今になってみんな欲しがるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 答えは、商品の中にはないのよ。あなたが並んだ理由の方にあるわ。
    speaker: めたん
    expression: smile
    pause_after: 1.6
  beats:
  - type: image
    cut_reason: 【冒頭】バッグに5個ぶら下がったチャームの手元で開く
    from: 1
    slot: 1
