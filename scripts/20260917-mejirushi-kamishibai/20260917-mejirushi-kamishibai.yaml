- id: 6
  title: なぜ「目印」だったのか
  chapter_title: なぜ「目印」だったのか
  narration:
  - text: 釣られた部分は、たぶんあるわね。でも、釣られるものなら何でもいいわけじゃないの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: めじるしは、自分の持ち物を、他人のものと区別する道具でしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 傘を間違えないための目印なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: なのに、全員が同じものを付けている。おかしいと思わない？
    speaker: めたん
    expression: smile
    pause_after: 0.8
  - text: 言われてみれば、目印にならないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 欲しくなる理由には、二つの向きがあるの。「他人が買っているから欲しくなる」と、「他人が持っているから欲しくなくなる」。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 名づけたのは、経済学者のハーヴェイ・ライベンシュタイン。1950年よ。前がバンドワゴン効果、後ろがスノッブ効果。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 普通は、どちらかしか満たせない。でも、めじるしは同じブランドの同じ枠の中で、キャラだけが違うの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: みんなと同じでいたい気持ちと、私だけ違っていたい気持ちを、一つで両方満たせるのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 僕のちいかわは、僕だけのもの。めじるしは、みんなと同じなのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: ここは実験で確かめた話じゃなくて、商品を見て私が考えたことだけどね。
    speaker: めたん
    expression: normal
    pause_after: 0.6
  - text: ただ、逆向きの動きなら研究があるわ。あるリストバンドを着けていた大学生たちの話よ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 隣の寮の学生が同じものを着け始めた途端、みんな外したの。隣の寮は、周りから「ガリ勉」と見られていたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ペンシルベニア大学のジョナ・バーガーたちが2008年に調べたの。「あの人たちと同じに見られる」と分かると、人は離れるのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 「めじるしおばさん」って言葉も…。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.6
  - text: そうね。「ブーム、早く終わってほしい」というファンの声もあるわ。同じに見られたくない人が出てきたなら、折り返しが近いのかもしれない。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: じゃあ、このブームはどうなるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
