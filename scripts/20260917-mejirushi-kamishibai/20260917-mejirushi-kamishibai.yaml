- id: 5
  title: なぜ他人に合わせるのか
  chapter_title: なぜ他人に合わせるのか
  narration:
  - text: 他人の行動は、情報になるからよ。行列の前に立ったときのことを考えてみて。
    speaker: めたん
    expression: explain
    pause_after: 0.6
  - text: 自分では良し悪しが分からないとき、先に並んだ人を見て決める方が、理にかなっている場面があるの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: これを数式にしたのが、UCLAの3人の経済学者よ。1992年に「情報カスケード」と名づけたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 最初の2人が同じものを選ぶと、3人目からは自分の判断を捨てて、同じものを選ぶ方が得になる。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 2人で、もう決まるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.6
  - text: 計算上はね。判断の材料がほとんど当てにならなくても、10人並べば、行列ができる確率は99.9%を超えるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 行列に並ぶのは、ばかにされがちだけど、材料がないときは賢い選び方なのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: じゃあ、材料があるときは並ばないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: それが、答えが見えていても、人は周りに合わせるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 線の長さを答えるだけの実験があるの。1本の線と同じ長さの線を、3本の中から選ぶ。普通に答えれば、間違える人は1%もいないわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 1955年、スワースモア大学のソロモン・アッシュ教授の実験よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そこで、周りの全員がわざと間違った答えを言う状況を作ったのよ。本当の参加者は、1人だけ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 見えてる答えなのに？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.6
  - text: 123人のうち、4人に3人が、少なくとも一度は間違った答えに合わせたわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 面白いのは人数よ。わざと間違える相手が1人なら、ほとんど引きずられない。3人になると、3割を超える。それ以上増やしても、ほぼ変わらないの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 3人いれば十分なのだ。電車で3人が付けてたら…。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。ミーハーは弱さじゃないわ。他人を情報源にするのは、人の標準装備よ。
    speaker: めたん
    expression: smile
    pause_after: 1.8
  - text: じゃあ僕は、ちいかわが好きで買ったんじゃなくて、周りに釣られただけなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
