- id: 8
  title: 結び（商品は同じ、変わったのは周り）
  chapter_title: null
  narration:
  - text: それで、6年前と今で何が違ったか。商品はほとんど同じで、周りが持っているかどうかが違ったの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 人は品質より、他人の選択を見て買う。誰にでもあることよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: めじるしは、そこに一番うまくはまった商品だったの。みんなと同じで、自分だけ違う。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕のバッグの5個、見直してみるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.6
  - text: 転売で買ったのは、外すのだ。並んで出なかったのも、もう追わないのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: 本当に好きなのは、このちいかわ1個なのだ。これだけ残すのだ。
    speaker: ずんだもん
    expression: delighted
    pause_after: 1.2
  - text: それなら、6年後も付けていられるわ。頑張って、ずんだもん。
