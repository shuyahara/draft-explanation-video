- id: 3
  title: 誰が付けているのか
  chapter_title: null
  narration:
  - text: 先に言っておくわね。誰が買っているかの公式な数字は、どこからも出ていないの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: あるのは、10代20代の女性に聞いたランキングだけ。最初から若い女性にしか聞いていないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ、分からないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 分からない。だから、ここからは世間で言われている噂よ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 報道でいちばん多いのは、Z世代の女子中高生のもの、という説。でも根拠は、若い女性だけに聞いた調査よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 若い女性に聞いたら、若い女性が出てくるのは当たり前なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そうなの。次に多いのが、平成のキャラで育った30代40代の大人。「駅のガチャの列に大人が並ぶ」という観察は、いくつも記事に出てくるわ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 子どもと一緒に集めるお母さん、好きなキャラのグッズを集める推し活の延長で集める人、という説もあるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: それから、「めじるしおばさん」。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 悪口なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.6
  - text: SNSのXで、2026年の9月に集中して使われている言葉よ。朝から店に張り付いて何度も並び直す、買い占める、交換待ちでたむろする。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そういう人たちを、ほかの客やファンがそう呼んでいるの。30代から50代の女性だと書く人もいれば、「その場にいたのは20代30代だった」と書く人もいるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕も朝から並んだのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.8
  - text: どれも公式の数字の裏付けはなくて、互いに食い違っているの。「若い子のもの」と「おばさんのもの」が、同時に言われている。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 誰が買っているかで説明しようとすると、うまくいかないのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
  - text: 層で決まらないなら、何で決まるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【冒頭】駅ナカのガチャコーナーに並ぶ大人たちで開く
    from: 1
    slot: 1
