- id: 4
  title: 人気は何で決まるのか
  chapter_title: 人気は何で決まるのか
  narration:
  - text: それを確かめるために、実験用の音楽サイトを作った人たちがいるの。コロンビア大学のマシュー・サルガニックたち、2006年よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 1万4千人を集めて、無名のバンドの48曲を聴かせて、気に入ったらダウンロードしてもらう。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 一部の人には、他の人が何回ダウンロードしたかを見せない。残りの人には、見せるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 見せる方は、互いに交わらない8つの「世界」に分けたわ。世界ごとに、ダウンロード数が別々に積み上がるの。
    speaker: めたん
    expression: normal
    pause_after: 0.6
  - text: 同じ48曲を、8つの世界で別々に聴くのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 数字を見せた世界では、人気が一部の曲に集中したわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: しかも、どの曲が上位になるかは、世界ごとにバラバラだったの。同じ曲が、ある世界では上位で、別の世界では下位。
    speaker: めたん
    expression: surprised
    pause_after: 0.45
  - text: 曲は同じなのに？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.6
  - text: 曲の良さは、下限と上限を決めるだけだったの。一番良い曲が最下位にはならないし、一番悪い曲が1位にもならない。でも、その間はほぼ運よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 人気は、曲の良さより、先に押した人で決まっていたのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.8
  - text: めじるしも、それなのだ？ 街でぶら下がってる数が、ダウンロード数なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そういうこと。他人が選んだ数が見える、というところが同じなの。6年前は街で見かけなかった。今は、電車に乗れば見えるわ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: でも、他人が押したからって、なんで自分も押すのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: image
    cut_reason: 【冒頭】ヘッドホンで音楽を聴く人（ストック）で開く
