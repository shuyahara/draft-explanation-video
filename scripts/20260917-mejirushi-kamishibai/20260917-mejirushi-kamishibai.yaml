- id: 2
  title: 6 年間に何があったのか
  chapter_title: 6年間に何があったのか
  narration:
  - text: 2020年6月、バンダイが「めじるしアクセサリー サンリオキャラクターズ」を出したの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 値段は200円。公式の商品説明には「憂鬱な梅雨も」と書いてあるわ。傘の目印ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 傘の目印…。地味な使い道なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 同じ年の10月に第2弾。ここまでは、静かなものだったの。
    speaker: めたん
    expression: smile
    pause_after: 0.6
  - text: 2024年に入ると、お文具といっしょや、ムーミンとのコラボ商品が出てくるわ。値段は300円になった。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そして2026年5月。マリオのヨッシー版が、メルカリで高値で転売されたの。買い占めで、販売をやめた店も出たわ。
    speaker: めたん
    expression: normal
    pause_after: 0.6
  - text: そこから一気に広まったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 6月、10代20代の女性に聞いたトレンド調査で、モノ部門の1位。日経新聞が「売り切れ続出」と書いたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 9月には、あちこちのガシャポン専門店が販売をやめたの。理由は「混雑をやわらげるため」よ。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: 6年で、何が変わったのだ？ 形も使い道も同じで、値段が100円上がっただけなのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そう。商品はほとんど変わっていない。いちばん変わったのは、街で見かける数よ。
    speaker: めたん
    expression: smile
    pause_after: 1.6
  - text: でも、みんなが持ってるなら、みんな同じ理由で欲しくなったはずなのだ。どんな人が買ってるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.8
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: image
    cut_reason: 【冒頭】傘の持ち手のチャーム（S1と同じ）を背景に、静かだった発売当時から始める
