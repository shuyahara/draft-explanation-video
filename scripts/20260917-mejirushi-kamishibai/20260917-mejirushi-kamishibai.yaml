- id: 7
  title: このブームはどうなるのか
  chapter_title: このブームはどうなるのか
  narration:
  - text: 手がかりは、赤ちゃんの名前にあるわ。フランスとアメリカの、100年分の名前のデータを調べた研究があるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: さっきのジョナ・バーガーが、スタンフォード大学のガエル・ル・マンスと2009年に発表したものよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 急に人気が上がった名前ほど、そのあとすぐに使われなくなっていたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: これから親になる人は、直近で急に増えた名前を避けていたの。「一時の流行に見える」からよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 早く広まったものは、早く消えるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.6
  - text: 名前の話だから、めじるしがそうなると決まったわけじゃないわ。でも、転売、買い占め、販売中止は、一気に上がった印よ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: みんなが持っているから欲しかったものは、みんなが持たなくなったら、欲しくなくなるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 自分の推しだから持っているものは、そのまま残るわ。
    speaker: めたん
    expression: smile
    pause_after: 2.0
  - text: 僕のは、どっちなのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.8
