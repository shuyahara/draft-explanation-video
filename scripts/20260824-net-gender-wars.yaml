# シーン YAML（ビート運用）。台本 Markdown（scripts/20260824-net-gender-wars.md、r2）に対応する
# レンダリング指示書。Issue #14。
# 仕様（正）: C:\Users\shuya\Projects\script-to-video\docs\schema.md（beats[] 節）
#             C:\Users\shuya\Projects\script-to-video\docs\design-beat-rendering.md
# 検証: cd C:\Users\shuya\Projects\script-to-video && .venv\Scripts\python.exe -m script_to_video validate <このファイル>
#
# ナレーション本文は台本 Markdown から一字一句そのまま転記（文言変更なし）。
# セグメント分割は「発音・ポーズメモ」に指定された間の位置で行い、文中（読点）での分割も
# メモの指示がある箇所（例: シーン4の数字直後、シーン7「男は、女は、」）でのみ行っている。
#
# 章構成: シーン1-2（導入・章カードなし）／章1 探索I（シーン3-7、key_color #2E4A7D）／
#         章2 中盤の反転（シーン8-10、#7D5A2E）／章3 環を閉じる（シーン11-12、#2E7D5B）／
#         章4 回帰と結び（シーン13、#2E4A7D＝章1と同色で「回帰」を示す）
#
# emphasis（強調カット）は各章1箇所、計4箇所: シーン5・8・11・13（理由は制作報告を参照）。
# chart はシーン5の1箇所のみ（CLAUDE.md規約）。

video:
  title: "男女論はなぜネット上で盛り上がるのか"
  speaker: "青山龍星"
  resolution:
    width: 1920
    height: 1080
  style: "cinematic film still, dramatic chiaroscuro lighting, a single warm key light cutting through deep shadow, high contrast, low saturation with amber highlights and cold blue shadows, shallow depth of field, subtle film grain, wide cinematic framing, dark moody atmosphere, large areas of near-black negative space, no text, no lettering, no watermark, no logo, no caption"
  bgm: "bgm/kousatsu.mp3"
  bgm_credit: "「考察」shimtone（DOVA-SYNDROME）"

scenes:
  # ============================================================
  # シーン1「フック」 キュー8本
  #  1 夜中、布団の中でスマートフォンを開く。
  #  2 眠る前の、ほんの数分のつもりだった。
  #  3 指がタイムラインをなぞるたびに、男か女か、どちらかを一方的に責める投稿が流れてくる。
  #  4 誰かの一言に、何百件もの怒りのコメントがぶら下がっている。
  #  5 既視感がある。
  #  6 似たような言い争いを、もう何度も見た気がする。
  #  7 それでも、指は止まらない。
  #  8 あなたにも、覚えがあるかもしれない。
  # ============================================================
  - id: 1
    title: "フック（つかみ）"
    visual_intent: "暗い寝室で布団にくるまり、スマートフォンの光だけが手元と親指を照らす。顔にも身体全体にも寄らない構図で、スクロールする指が途中で止まる変化を見せる"
    narration:
      - text: "夜中、布団の中でスマートフォンを開く。眠る前の、ほんの数分のつもりだった。指がタイムラインをなぞるたびに、男か女か、どちらかを一方的に責める投稿が流れてくる。誰かの一言に、何百件もの怒りのコメントがぶら下がっている。"
        pause_after: 0.3
      - text: "既視感がある。似たような言い争いを、もう何度も見た気がする。それでも、指は止まらない。あなたにも、覚えがあるかもしれない。"
        pause_after: 1.0
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "暗い寝室でスマホをスクロールする親指のクローズアップ。眠る前の数分のつもりが始まる"
        cut_reason: "【つかみの導入①】キュー1〜2『夜、布団の中でスマホを開く。眠る前の、ほんの数分のつもりだった』という導入の一続き"
        gen_prompt: "a thumb scrolling a smartphone in a dark bedroom at night, close-up on the glowing screen and hand only, face and body kept out of frame, blurred illegible text on the screen, low-key cinematic lighting, no lettering"
        search_query: "hand scrolling smartphone dark bedroom night close up"
        assets:
          - url: "https://www.pexels.com/photo/crop-person-using-smartphone-in-dark-room-3348724/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
            note: "手元クローズアップのみで顔が写らない候補。冒頭は静止画優先の規約に合致"
          - url: "https://pixabay.com/videos/smart-phone-mobile-phone-scrolling-169445/"
            kind: video
            license: commercial-ok
            source_name: "Pixabay"
            note: "暗い部屋でスマホをスクロールする手元の動画。冒頭は静止画優先のため予備候補扱い"

      - type: image
        from: 3
        slot: 2
        visual_intent: "同じ手元のまま、対立を煽る投稿が次々流れてくる。指の動きが速まる"
        cut_reason: "【つかみの導入②】キュー3〜4『指がタイムラインをなぞるたびに対立を煽る投稿が流れてくる』『何百件もの怒りのコメントがぶら下がっている』。一枚絵の保持が20秒を超えないよう、投稿が流れ始める瞬間で1枚に分ける（R19.12）"
        gen_prompt: "a thumb scrolling faster across a smartphone screen in a dark bedroom at night, close-up on the glowing screen and hand only, face and body kept out of frame, blurred illegible post text streaming past on the screen, low-key cinematic lighting, no lettering"

      - type: image
        from: 5
        slot: 3
        motion: zoom_in
        visual_intent: "同じ手元の構図のまま、指の動きが止まる。既視感と内省への転換"
        cut_reason: "【内面の反応への転換】キュー5〜8『既視感がある、指が止まる、あなたにも覚えがあるかもしれない』で、スクロールから静止・内省へ転じる。動きの止まりをズームで際立たせる"
        gen_prompt: "a thumb frozen mid-scroll above a smartphone screen in a dark bedroom at night, close-up on the glowing screen and hand only, face and body kept out of frame, blurred illegible text on the screen, low-key cinematic lighting, a sense of hesitation, no lettering"

  # ============================================================
  # シーン2「問題提起（問いへの変換）」 キュー12本
  # ============================================================
  - id: 2
    title: "問題提起（問いへの変換）"
    visual_intent: "無地下地の図解（narrative・converge）。日常のどこにでもある対立の種が、際限なく続く炎上として積み重なり、中央の問い『本当に憎み合っているのか』へ収束する"
    narration:
      - text: "男女のどちらが得をしているか、どちらが被害者なのか。おごるべきか、割り勘か。家事は誰の仕事か。賃金の差は、誰のせいか。入り口は、日常のどこにでもある。そしてこの手の話題は、投稿するたびに反応が押し寄せ、際限なく続いていくように見える。似たようなやり取りが、毎日どこかのタイムラインで繰り返されている。コメント欄を閉じても、また別の投稿が同じ話題で燃えている。だが、少し立ち止まって考えてみてほしい。"
        pause_after: 0.3
      - text: "世の中は、本当にこんなに憎み合っているのだろうか。"
        pause_after: 0.7
      - text: "あなたも、そんな違和感を覚えたことがあるかもしれない。だとしたら、何がこの対立を、ここまで燃え上がらせているのだろうか。"
    telop: "世の中は、本当にこんなに憎み合っているのか"
    beats:
      - type: diagram
        from: 1
        cut_reason: "【問いへの収束】シーン全体が『日常の対立の種→際限なく続く→本当に憎み合っているのか』という一つの収束構造。引き締めたい導入場面のため無地下地の図解のみで通す"
        diagram:
          type: narrative
          layout: converge
          items:
            - id: trigger
              text: 入り口はどこにでも
              at: 5
              after: 日常のどこにでもある
            - id: spread
              text: 際限なく続く
              at: 6
              after: 際限なく続いていくように見える
            - id: repeat
              text: 毎日繰り返される
              at: 7
              after: 繰り返されている
          result:
            text: 本当に憎み合っているのか
            at: 10
            after: 憎み合っているのだろうか

  # ============================================================
  # 章1「探索I」 シーン3-7（key_color #2E4A7D）
  # ============================================================

  # シーン3「燃える仕組み・理論的枠組み」 キュー5本
  - id: 3
    title: "探索I① 燃える仕組み（Crockett・理論的枠組み）"
    chapter_title: "何が対立を燃え上がらせているのか"
    key_color: "#2E4A7D"
    visual_intent: "学問的背景の提示から、ふいごで火を煽るメタファーへ。理論の紹介から『データはどう裏付けるか』という問いへつなぐ"
    narration:
      - text: "手がかりは、感情を研究する心理学にある。イェール大学の心理学者クロケットは、ネット空間には道徳的な怒りを煽る仕掛けが備わっていると指摘した。"
        pause_after: 0.3
      - text: "怒りの引き金を増やし、怒りを表明するコストを下げ、怒ることで得られる満足感を増幅する。対面なら気まずくなるような発言も、画面の向こうでは驚くほど気軽に投稿できてしまう。"
        pause_after: 0.3
      - text: "これは理論として提示された枠組みだが、実際のデータはこれをどう裏付けているのだろうか。"
    telop: "怒りの「引き金」を増幅する設計"
    readings:
      - surface: "クロケット"
        reading: "クロケット"
    beats:
      - type: chapter
        slot: 1
        cut_reason: "章の頭。ふいごで火を煽る画を落として章名を重ねる"

      - type: image
        from: 1
        slot: 2
        visual_intent: "学問的背景の提示。クロケットの理論を暗示する静物"
        cut_reason: "【学問的背景の提示】キュー1〜2はどちらも『心理学の知見を持ち出す』という同じ動作なので1枚で持たせる"
        gen_prompt: "a worn hardcover psychology book lying open on a dark wooden desk under a single narrow shaft of warm light, dust motes drifting in the beam, the rest of the room swallowed in blackness, pages out of focus with no readable print, no lettering"

      - type: image
        from: 3
        slot: 3
        visual_intent: "★キービジュアル。ふいごで小さな炎に風を送る静物。引き金を増やし・コストを下げ・満足感を増幅するメカニズムのメタファー"
        cut_reason: "【メカニズムの提示】キュー3〜4『引き金を増やし、コストを下げ、満足感を増幅する』『対面なら気まずい発言も画面越しなら気軽にできる』。理論の中身を静物のメタファーで見せる"
        gen_prompt: "a small flame being fanned by an old bellows on a dark wooden table, macro shot, glowing embers scattering into the darkness, no lettering, cinematic minimal lighting"

      - type: image
        from: 5
        slot: 4
        motion: zoom_in
        visual_intent: "データはこれを裏付けるのかという問い。灯る前の一つの燠火"
        cut_reason: "【次章への橋渡し】キュー5『理論として提示された枠組みだが、データはどう裏付けているのだろうか』。まだ答えの出ていない緊張を、燃え始める前の燠火で示す"
        gen_prompt: "a single glowing ember pulsing in complete darkness on a bed of ash, no flame yet visible, faint smoke curling upward, cinematic minimal lighting, no lettering"

  # シーン4「Brady 2017・数字先出し」 キュー6本
  - id: 4
    title: "探索I② 感情語の拡散効果（Brady 2017）"
    key_color: "#2E4A7D"
    visual_intent: "大規模データの分析風景から、テーマ別の数字が同じ傾向へ収束する図解へ"
    narration:
      - text: "ある大規模な分析が、数字で示している。投稿に道徳や感情に関わる言葉を一語加えるだけで、拡散される確率はおよそ二割上がる。"
        pause_after: 0.3
      - text: "銃規制や気候変動、同性婚といった主張の強いテーマで、五十六万件を超える投稿を分析した、"
        pause_after: 0.4
      - text: "ニューヨーク大学の研究グループが導き出した数字だ。銃規制でおよそ19パーセント、同性婚でおよそ17パーセント、気候変動でおよそ24パーセント。テーマが変わっても、同じ傾向が確認された。怒りや義憤を込めた一言が、投稿の運命を左右している。"
    telop: "感情の言葉ひとつで拡散+20%"
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "大規模なSNS投稿データを分析する女性研究者の横顔（モニターの光）"
        cut_reason: "【分析の提示】キュー1〜2『大規模な分析が数字で示している』『感情語を一語加えるだけで拡散確率が二割上がる』という導入の一続き"
        gen_prompt: "a female researcher seen in profile, her face lit by the glow of a monitor showing blurred social media analytics in a dark office, the charts and text on screen reduced to an unreadable blur, no lettering, cinematic minimal lighting"

      - type: image
        from: 3
        slot: 2
        visual_intent: "五十六万件を超える投稿カードが壁一面に並ぶ研究資料"
        cut_reason: "【調査規模の提示】キュー3『五十六万件を超える投稿を分析した、ニューヨーク大学の研究グループ』。規模の大きさを画で示す"
        gen_prompt: "a corkboard covered edge to edge with hundreds of small printed social media post cards pinned in dense rows in a dim office, each card blurred with no readable text, a researcher's hand pointing at one cluster, no lettering, cinematic minimal lighting"

      - type: diagram
        from: 5
        cut_reason: "【数値の提示】キュー5〜7は3テーマの数字とその一致という主張そのものが図。3つのテーマが同じ傾向という結論へ収束する構造なのでconvergeで見せる"
        diagram:
          type: narrative
          layout: converge
          items:
            - id: guns
              text: 銃規制+19%
              at: 5
              after: 銃規制でおよそ19パーセント
            - id: marriage
              text: 同性婚+17%
              at: 5
              after: 同性婚でおよそ17パーセント
            - id: climate
              text: 気候変動+24%
              at: 5
              after: 気候変動でおよそ24パーセント
          result:
            text: どのテーマでも同傾向
            at: 6
            after: 同じ傾向が確認された

  # シーン5「Rathje 2021・結論先出し／chart使用」 キュー6本
  - id: 5
    title: "探索I③ 敵対語の拡散効果（Rathje 2021）"
    key_color: "#2E4A7D"
    visual_intent: "『誰を敵と呼ぶか』という着眼への転換から、感情語効果との倍率比較を裏取り済みの棒グラフで見せる"
    narration:
      - text: "実は、怒りの言葉そのものより、もっと効くものがある。相手陣営を名指しする言葉だ。ケンブリッジ大学とニューヨーク大学の共同研究によれば、敵対する側を指す言葉を一語加えるだけで、シェアされる確率はおよそ67パーセント上がる。"
        pause_after: 0.4
      - text: "ニュースメディアや政治家のアカウント、あわせて270万件以上の投稿を対象にした分析だ。これは、先ほどの道徳や感情の言葉が生む効果のおよそ六点七倍にあたる。感情を煽るだけでなく、誰を敵として名指しするかが、拡散の強さを決めている。"
    telop: "「誰を敵と呼ぶか」が拡散を左右する"
    emphasis:
      - at: 2
        text: "誰を敵と呼ぶかが拡散を左右"
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "相手陣営を名指しする言葉。無地の名札に狙いを定めるような赤い照準の光"
        cut_reason: "【着眼の転換】キュー1〜2『怒りの言葉よりもっと効くものがある。相手陣営を名指しする言葉だ』。名指しという行為そのものを静物のメタファーで示す"
        gen_prompt: "a small red circular target mark of light projected onto a blank unmarked nameplate card on a dark wooden table, no lettering, cinematic minimal lighting"

      - type: image
        from: 3
        slot: 2
        visual_intent: "ニュースメディアや政治家アカウント、270万件以上の投稿を分析する研究の場面"
        cut_reason: "【研究の提示】キュー3〜4『ケンブリッジ大学とニューヨーク大学の共同研究』『270万件以上の投稿を対象にした分析』。研究の規模を画で示す"
        gen_prompt: "two researchers silhouetted against a wall of monitors displaying blurred social media feeds in a dark research lab, no readable text or lettering on the screens, cinematic minimal lighting"

      - type: diagram
        from: 5
        cut_reason: "【倍率の提示】キュー5〜6は裏取り済みの数値（感情語効果を基準にした6.7倍）そのものが主張。本動画で唯一のchart使用箇所"
        diagram:
          type: chart
          chart: bar
          title: 拡散への影響倍率
          unit: "倍"
          source: "Rathje et al. (2021), PNAS 118(26)"
          series:
            - color: accent
              at: 5
              points:
                - {label: 道徳感情語, value: 1.0}
                - {label: ネガティブ感情語, value: 1.4}
                - {label: 敵対語, value: 6.7}

      - type: typo
        at: 2
        cut_reason: "【無音3秒】決め文「誰を敵と呼ぶかが拡散を左右」の強調カット（章1の強調・1箇所目）"

  # シーン6「Robertson 2023・意外性の転回」 キュー10本
  - id: 6
    title: "探索I④ 意外な転回（Robertson 2023・怒りではなく悲しみ）"
    key_color: "#2E4A7D"
    visual_intent: "見出し比較実験の紹介から、怒りは無関係・効くのは悲しみという意外な結果への収束。二人称の呼びかけと、政治・宗教と男女論を分ける問いで章を閉じる"
    narration:
      - text: "では、怒りという感情そのものはどうなのか。ここで意外な結果が出てくる。あるニュースサイトは、同じ記事の見出しの言葉だけを変えて配信する比較実験を、日々繰り返していた。その記録、五百七十万回分のクリックを、ニューヨーク大学などの研究チームが分析している。見出しにネガティブな言葉が一語増えるごとに、クリック率はおよそ二点三パーセント上がっていた。ただし、怒りという感情単体には、統計的に見て有意な効果がなかった。効いていたのは、むしろ悲しみの表現だったという。"
        pause_after: 0.3
      - text: "あなたが思わずクリックしてしまった見出しにも、同じ仕掛けが隠れていたかもしれない。"
        pause_after: 0.4
      - text: "だが、燃える仕組みが同じなら、政治も宗教も、同じように燃えるはずだ。なぜ、男と女の話だけが、これほど特別に燃え続けるのだろうか。"
        pause_after: 1.0
    telop: "効くのは「怒り」ではなく「悲しみ」だった"
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "見出しの比較実験を始める前の一瞬。手元でスマホの画面をためらう"
        cut_reason: "【問いの転換】キュー1〜2『怒りという感情そのものはどうなのか』『ここで意外な結果が出てくる』。次の意外な展開を予告する導入"
        gen_prompt: "a hand hovering hesitantly over a smartphone displaying a blurred news headline in a dim room, no readable text or lettering on the screen, cinematic minimal lighting"

      - type: image
        from: 3
        slot: 2
        visual_intent: "見出しのA/B比較実験と、五百七十万回分のクリックデータを分析する研究チーム"
        cut_reason: "【実験の提示】キュー3〜4『同じ記事の見出しの言葉だけを変えて配信する比較実験』『五百七十万回分のクリックを分析している』。一つの状態の画（複数見出しの併記は避ける）で示す"
        gen_prompt: "a hand adjusting a headline preview on a glowing screen, a stack of printed click-through reports beside it on a dark desk showing rows of blurred numbers, no readable text or lettering, cinematic minimal lighting"

      - type: diagram
        from: 5
        cut_reason: "【結果の提示】キュー5〜7『クリック率+2.3%』『怒りは有意差なし』『効くのは悲しみ』という3段階の意外な結果。converge型で時系列順に見せる"
        diagram:
          type: narrative
          layout: converge
          items:
            - id: negative
              text: ネガティブ語で反応増
              at: 5
              after: クリック率はおよそ二点三パーセント上がっていた
            - id: anger_null
              text: 怒りは無関係
              at: 6
              after: 有意な効果がなかった
