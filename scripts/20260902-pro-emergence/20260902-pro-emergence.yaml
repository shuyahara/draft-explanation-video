        pause_after: 0.2
      - text: "すでにあった流れを鉄道が後押しした、というのが歴史家の慎重な見方だ。"
        pause_after: 0.2
      - text: "1884年、プレストンがロンドンのクラブから、プロを使っていると告発された。"
        pause_after: 0.2
      - text: "会長は支払いの事実を認め、プレストンは大会から締め出された。"
        pause_after: 0.2
      - text: "だが締め出された側は、引き下がらなかった。"
        pause_after: 0.2
      - text: "金を払っているクラブが集まって、別の協会を作ると言い出したのだ。"
        pause_after: 0.6
      - text: "FAは折れた。"
        pause_after: 0.2
      - text: "1885年7月20日、一定の条件のもとでプロ選手を認めると発表する。"
        pause_after: 0.2
      - text: "告発から、わずか1年半。"
        pause_after: 0.2
      - text: "3年後の1888年には、定期的な対戦を保証するフットボールリーグが発足した。"
        pause_after: 0.2
      - text: "順序を見てほしい。"
        pause_after: 0.2
      - text: "金を払う観客が先にいて、その金で選手を雇うクラブが次にできて、協会の規則は、いちばん最後に、しぶしぶ追いついた。"
        pause_after: 0.8
      - text: "ただし、FAは抵抗した。"
        pause_after: 0.2
      - text: "規則は自動的には変わらない。"
        pause_after: 0.2
      - text: "押し切るには、綱引きが必要だった。"
        pause_after: 0.2
      - text: "では、抵抗した側は、何を守ろうとしていたのか。"
