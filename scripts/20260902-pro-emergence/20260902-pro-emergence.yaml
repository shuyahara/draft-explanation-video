  - id: 10
    title: "説③の検討（ローゼンとアドラー → 複製技術は増幅する力）"
    readings:
      - surface: "シャーウィン・ローゼン"
        reading: "シャーウィンローゼン"
      - surface: "モシェ・アドラー"
        reading: "モシェアドラー"
      - surface: "十人"
        reading: "ジュウニン"
      - surface: "一回分"
        reading: "イッカイブン"
      - surface: "二番目"
        reading: "ニバンメ"
    narration:
      - text: "シカゴ大学の経済学者シャーウィン・ローゼンは、1981年、アメリカン・エコノミック・レビューに、スーパースターの経済学という論文を書いた。"
        pause_after: 0.2
      - text: "問いはこうだ。"
        pause_after: 0.2
      - text: "なぜ、才能のわずかな差が、収入の巨大な差になるのか。"
        pause_after: 0.7
      - text: "ローゼンの答えは、条件が二つ重なったときにそれが起きる、というものだった。"
        pause_after: 0.2
      - text: "ひとつは、代わりが効かないこと。"
        pause_after: 0.2
      - text: "並の歌手を十人続けて聴いても、一人の傑出した歌手の一回分にはならない。"
        pause_after: 0.2
      - text: "もうひとつは、一人の演奏を、費用をほとんど増やさずに大勢へ届けられること。"
        pause_after: 0.2
      - text: "録音、放送、そして今なら、配信だ。"
        pause_after: 0.5
      - text: "この二つが重なると、市場は一人に集中する。"
        pause_after: 0.2
      - text: "かつて歌手の市場は、会場に入れる人数が上限だった。"
        pause_after: 0.2
      - text: "レコードとラジオが、その上限を外した。"
        pause_after: 0.2
      - text: "すると、多くの人が最上位の歌手を選べるようになり、需要はトップへ集中していく。"
        pause_after: 0.8
      - text: "ただし、才能だけの話ではない。"
        pause_after: 0.2
      - text: "1985年、経済学者モシェ・アドラーは、同じ雑誌で反論した。"
        pause_after: 0.2
      - text: "人は、みんなが知っている演奏家について語り合いたいから、すでに人気のある人を選ぶ。"
        pause_after: 0.2
      - text: "才能に差がなくても、人気が、人気を呼ぶ。"
        pause_after: 0.5
      - text: "その後の実証研究では、才能と人気の両方が効く、というのが大方の結論だ。"
        pause_after: 0.7
      - text: "どちらにせよ、鍵は複製技術だ。"
        pause_after: 0.2
      - text: "新聞は棋譜を複製した。"
        pause_after: 0.2
      - text: "テレビは試合を複製した。"
        pause_after: 0.2
      - text: "複製が観客の上限を外したとき、トップの数人だけが、それまで不可能だった規模で稼ぎ始める。"
        pause_after: 0.2
      - text: "これが、第三の説の正体だ。"
        pause_after: 0.2
      - text: "複製技術は、プロを生むというより、プロの規模を増幅する。"
        pause_after: 2.0
      - text: "では、規模さえ増えれば、プロは自分の足で立てるのか。"
        pause_after: 0.2
      - text: "ここに、意外な事実がある。"
        pause_after: 1.2
