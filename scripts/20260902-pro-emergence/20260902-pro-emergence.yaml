  - id: 12
    title: "三説の決着（章「三つの説の、どれが正しいのか」）"
    chapter_title: "三つの説の、どれが正しいのか"
    readings:
      - surface: "金"
        reading: "カネ"
      - surface: "三つの層"
        reading: "ミッツノソウ"
    narration:
      - text: "三つの説を、並べ直そう。"
        pause_after: 0.2
      - text: "第一の説、金を払う仕組み。"
        pause_after: 0.2
      - text: "将棋では幕府の扶持と、新聞の対局料。"
        pause_after: 0.2
      - text: "フットボールでは、入場料。"
        pause_after: 0.2
      - text: "音楽では、興行と楽譜。"
        pause_after: 0.2
      - text: "どの事例でも、これがいちばん先に来た。"
        pause_after: 0.2
      - text: "そして、コスト病が示したように、これが続く間だけ、プロは存在する。"
        pause_after: 0.2
      - text: "プロを生み、支えるのは、この仕組みだ。"
        pause_after: 0.6
      - text: "第二の説、認定と排除の装置。"
        pause_after: 0.2
      - text: "家元、協会の規則、アカデミー、アマチュア規定。"
        pause_after: 0.2
      - text: "これらはプロが生まれたあとに、その地位を固め、参入を絞るために作られた。"
        pause_after: 0.2
      - text: "生む力ではなく、固める力。"
        pause_after: 0.5
      - text: "第三の説、複製技術。"
        pause_after: 0.2
      - text: "楽譜、新聞、放送、配信。"
        pause_after: 0.2
      - text: "これは観客の上限を外して、収入を一部に集中させる。"
        pause_after: 0.2
      - text: "生む力ではなく、規模を増やす力。"
        pause_after: 0.6
      - text: "つまり三つは、対立する説ではなかった。"
        pause_after: 0.2
      - text: "順番の違う、三つの層だ。"
        pause_after: 0.2
      - text: "払う仕組みが生み、装置が固め、複製が増幅する。"
        pause_after: 2.2
      - text: "ひとつだけ、付け加えておく。"
        pause_after: 0.2
      - text: "払う仕組みは、需要がすでに芽生えている場所でしか、働かない。"
        pause_after: 0.2
      - text: "金が、見たい気持ちを作るのではない。"
        pause_after: 0.2
      - text: "見たい気持ちに、金が形を与えるのだ。"
        pause_after: 0.8
      - text: "では、この三層を、冒頭の配信者に当ててみよう。"
        pause_after: 1.2
    beats:
