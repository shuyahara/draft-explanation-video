video:
  title: "なぜ将棋やスポーツには「プロ」が生まれるのか"
  style: "muted illustrated style evoking aged engravings and sepia archival photographs, fine paper grain, restrained warm lamplight for historical scenes, cool natural light and soft screen glow for present-day scenes, figures shown at a distance without facial close-ups, no text, no lettering, no watermark, no logo, no caption"
  bgm: "../bgm/tooku-inori-no-hate.mp3"
  bgm_credit: "BGM: 遠く、祈りの果て / のる（DOVA-SYNDROME）"

scenes:
  - id: 1
    title: "フック（深夜の配信者 → 将棋のくっきりした線 → 問い）"
    readings:
      - surface: "金"
        reading: "カネ"
      - surface: "奨励会"
        reading: "ショウレイカイ"
      - surface: "四段"
        reading: "ヨダン"
      - surface: "数十人"
        reading: "スウジュウニン"
    narration:
      - text: "深夜2時。"
        pause_after: 0.2
      - text: "画面の中で、誰かがゲームをしている。"
        pause_after: 0.2
      - text: "見ている人は、数十人。"
        pause_after: 0.2
      - text: "画面の端に、500円の投げ銭が流れる。"
        pause_after: 0.2
      - text: "この人は、プロだろうか。"
        pause_after: 1.0
      - text: "ゲームがうまいから、というだけでは、答えは出ない。"
        pause_after: 0.2
      - text: "この人より上手な人は、いくらでもいる。"
        pause_after: 0.2
      - text: "金をもらっているから、というなら、月にいくらからがプロなのか。"
        pause_after: 0.2
      - text: "誰が、それを決めるのか。"
        pause_after: 0.2
      - text: "一方で、将棋の世界には、はっきりした線がある。"
        pause_after: 0.2
      - text: "四段という段位を認められた人だけが、プロ棋士と呼ばれる。"
        pause_after: 0.2
      - text: "線は、くっきりしている。"
        pause_after: 0.2
      - text: "なぜある競技には、こんなにはっきりしたプロがいて、ある遊びには、いないのか。"
        pause_after: 0.2
      - text: "そもそもプロというものは、なぜ生まれるのか。"
        pause_after: 0.2
      - text: "この動画が答えたい問いは、これだ。"
        pause_after: 0.7
      - text: "素朴な答えは、こうだろう。"
        pause_after: 0.2
      - text: "強い人がいるから。"
        pause_after: 0.2
      - text: "うまい人がいるから。"
        pause_after: 0.2
      - text: "だが、この答えには、はっきりした反例がある。"
        pause_after: 1.2
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "暗い部屋、モニターの光に照らされてゲームをする配信者の後ろ姿。画面の内容は読めない"
        gen_prompt: "a person seen from behind playing a video game late at night in a dark room, lit only by the monitor glow, a small webcam on the desk, screen contents blurred and unreadable, cool blue light"
        search_query: "person streaming video game dark room night"
        assets:
          - url: "https://www.pexels.com/photo/side-view-of-a-gamer-wearing-a-cap-and-headphones-10350851/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
          - url: "https://www.pexels.com/photo/young-man-focused-on-gaming-with-headset-sitting-at-a-computer-9072271/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
          - url: "https://www.pexels.com/photo/man-in-plaid-shirt-playing-a-video-game-7046699/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
        cut_reason: "【配信の場面】キュー1〜3は同じ深夜の配信という場面なので1枚で持たせる。冒頭の実写を使う場合は静止画。問い「この人は、プロだろうか。」が開始15秒以内に来るよう情景描写は3文に絞った"

      - type: image
        from: 4
        slot: 2
        visual_intent: "配信画面の端に流れる通知の手元。文字は読めない"
        gen_prompt: "a close-up of a computer monitor edge in a dark room showing a small glowing notification popup with unreadable blurred text, a hand resting on a mouse"
        search_query: "computer screen notification popup dark room close up"
        cut_reason: "【投げ銭の通知】具体物（通知）にナレーションが触れる瞬間なので寄る"

      - type: image
        from: 6
        slot: 3
        visual_intent: "同じ配信者が椅子にもたれて画面を見ている、少し引いた構図"
        gen_prompt: "the same dark room from a wider angle, a person leaning back in a chair looking at a glowing monitor, headphones around the neck, quiet late-night mood"
        search_query: "man leaning back chair looking at monitor night"
        assets:
          - url: "https://www.pexels.com/photo/from-above-side-view-of-thoughtful-ethnic-man-watching-photos-on-desktop-computer-while-sitting-at-table-leaned-on-hand-at-home-at-night-4327409/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
          - url: "https://www.pexels.com/photo/man-holding-his-headphones-while-playing-on-a-computer-7858761/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
        cut_reason: "【プロかどうかの問い】問いの検討に入るので配信の手元から人物の全体へ引く"

      - type: image
        from: 10
        slot: 4
        visual_intent: "将棋の対局室。和室、盤と駒、二人の対局者を引きで"
        gen_prompt: "two players facing each other over a shogi board in a quiet traditional Japanese tatami room, soft daylight from a paper window, seen from a distance, no text, no lettering"
        search_query: "shogi players tatami room traditional"
        cut_reason: "【将棋の線】場面が配信から将棋へ転換する"

      - type: image
        from: 13
        slot: 5
        visual_intent: "空の将棋盤と、暗い部屋の配信機材を対比させない。問いの提示は将棋盤のクローズアップ（駒の文字は読めない角度）で保持"
        gen_prompt: "a shogi board with pieces seen from a low angle in warm lamplight, shallow depth of field so the piece characters are blurred and unreadable, still and quiet"
        search_query: "shogi board pieces close up lamplight"
        cut_reason: "【問いの提示】この動画の問いを言語化する箇所なので静かな一枚で保持する"

      - type: image
        from: 16
        slot: 6
        visual_intent: "素朴な答え（強い人がいるから）を、盤に向かう熟達した手つきで直接描写する"
        gen_prompt: "a skilled shogi player's hand confidently moving a piece across the board, quiet focus, warm lamplight, seen close, no readable text"
        search_query: "hand moving shogi piece confidently close up"
        cut_reason: "【分割】元ビート5の20秒超を節目で分割。「素朴な答えは、こうだろう。強い人がいるから。」を語る場面を、熟達した手つきの直接描写で受け、最後の「反例がある。」の後の間まで持たせる"

  - id: 2
    title: "問題提起（強さとプロは別物 → 三つの説の提示）"
    readings:
      - surface: "金"
        reading: "カネ"
      - surface: "将棋指し"
        reading: "ショウギサシ"
    narration:
      - text: "1868年。"
        pause_after: 0.2
      - text: "江戸幕府が消えた年。"
        pause_after: 0.2
      - text: "日本でいちばん強い将棋指したちは、その年に、収入を失った。"
        pause_after: 0.2
      - text: "腕が落ちたわけではない。"
        pause_after: 0.2
      - text: "前の年と同じように、強い。"
        pause_after: 0.2
      - text: "それなのに、将棋で食うという職業のほうが、消えたのだ。"
        pause_after: 0.7
      - text: "反対の例もある。"
        pause_after: 0.2
      - text: "1880年代のイングランド。"
        pause_after: 0.2
      - text: "フットボール協会は、まだプロを認めていなかった。"
        pause_after: 0.2
      - text: "けれど北部の工業都市では、観客席がすでに労働者で埋まり、クラブは選手に、こっそり金を払っていた。"
        pause_after: 0.2
      - text: "プロは、認められる前から、いた。"
        pause_after: 0.7
      - text: "強さがあってもプロは消える。"
        pause_after: 0.2
      - text: "認められる前からプロはいる。"
        pause_after: 0.2
      - text: "つまり、プロを生むのは、強さでも、肩書きでもない、別の何かだ。"
        pause_after: 0.8
      - text: "その何かについて、考えられる説は、大きく三つある。"
        pause_after: 0.2
      - text: "ひとつ。"
        pause_after: 0.4
      - text: "その技に金を払う仕組みがあるから。"
        pause_after: 0.2
      - text: "ふたつ。"
        pause_after: 0.4
      - text: "本物を認定して、他を締め出す装置があるから。"
        pause_after: 0.2
      - text: "みっつ。"
        pause_after: 0.4
      - text: "技を複製して、大勢に届ける技術があるから。"
        pause_after: 0.2
      - text: "今日はこの三つの説を、将棋、スポーツ、そして音楽と美術の歴史に当てて、比較検討していく。"
        pause_after: 0.2
      - text: "あなたなら、どれに賭けるだろうか。"
        pause_after: 1.5
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "明治初年、荒れた屋敷の縁側で盤に向かう和装の将棋指し。扶持を失った静けさ"
        gen_prompt: "a man in worn Edo-period kimono sitting alone before a shogi board on the veranda of a dilapidated Japanese house, overcast light, muted sepia tones like an old woodblock print, no readable text"
        search_query: "man traditional kimono shogi board veranda old house"
        cut_reason: "【幕府消滅の年】キュー1〜6は同じ「収入を失った将棋指し」の場面"

      - type: image
        from: 7
        slot: 2
        visual_intent: "反対の例の導入。フットボール協会がまだプロを認めていなかった制度的な段階を直接描写"
        gen_prompt: "a Victorian FA committee meeting room, gentlemen in formal dress seated around a table with a formal minute book, unanimous solemn mood, papers blank and unreadable, gaslight"
        search_query: "victorian committee meeting room formal minute book"
        cut_reason: "【分割】元ビート2の20秒超を節目で分割。「反対の例もある。1880年代のイングランド。フットボール協会は、まだプロを認めていなかった。」を委員会の場面で受ける"

      - type: image
        from: 10
        slot: 3
        visual_intent: "1880年代イングランド北部、工場の煙突を背景にしたフットボールの観客席、労働者の群衆"
        gen_prompt: "a crowd of working-class men in flat caps packed along the rope of a football pitch in an 1880s northern English industrial town, factory chimneys behind, engraving-like muted tones, no readable text"
        search_query: "victorian football crowd factory town"
        cut_reason: "【分割】場面が日本からイングランドへ転換。「観客席がすでに労働者で埋まり」「プロは、認められる前から、いた。」を観客席の画で受ける"

      - type: image
        from: 12
        slot: 4
        visual_intent: "主張の整理。前ビートの観客席を保持せず、無人の将棋盤とボールを描かない。1枚の静物：古い帳簿の上に置かれた駒（文字は読めない）"
        gen_prompt: "a single shogi piece resting on a closed antique ledger book on a dark wooden desk, warm lamplight, book cover and piece characters blurred and unreadable"
        search_query: "shogi piece antique ledger book desk"
        cut_reason: "【中間の結論】主張の整理に入るので、人物のいない静物で一段落ち着かせる"

      - type: image
        from: 15
        slot: 5
        visual_intent: "三つの説の提示の導入。机上に広げた古地図と資料を前に考える人物の手元（文字は読めない）"
        gen_prompt: "a person's hands resting on a desk covered with old documents, maps and a magnifying glass in a study, papers blurred and unreadable, warm lamp light, seen from above at an angle"
        search_query: "hands desk old documents maps study"
        cut_reason: "【三つの説の導入】キュー「その何かについて、」の1文だけ"

      - type: image
        from: 16
        slot: 6
        visual_intent: "説①の直接描写: 入場口の小窓で硬貨を渡す手元（19世紀）"
        gen_prompt: "a close-up of a hand passing coins through the small window of a wooden ticket booth at a 19th-century sports ground, another hand receiving them, sepia tones, no readable text"
        search_query: "ticket booth coins hand 19th century sports ground"
        telop: "説① 金を払う仕組み"
        cut_reason: "【説①・金を払う仕組み】「ひとつ。」のリズムに合わせて画を切る。telop「説① 金を払う仕組み」"

      - type: image
        from: 18
        slot: 7
        visual_intent: "説②の直接描写: 封蝋と印章の押された免状を手にする人物の手元（文字は読めない）"
        gen_prompt: "hands holding an old certificate with a red wax seal and a stamped emblem, the text blurred and unreadable, warm lamplight, close on the document"
        search_query: "hands holding old certificate wax seal"
        telop: "説② 認定と排除の装置"
        cut_reason: "【説②・認定と排除の装置】列挙の2つ目で画を切る。telop「説② 認定と排除の装置」。文字物なので偽文字対策の句を添える"

      - type: image
        from: 20
        slot: 8
        visual_intent: "説③の直接描写: 手動の印刷機から刷り上がった紙が重なる（文字は読めない）"
        gen_prompt: "a 19th-century hand printing press with freshly printed sheets stacking up beside it, the print blurred and unreadable, warm workshop light, no people"
        search_query: "19th century hand printing press stacking sheets"
        telop: "説③ 複製技術"
        cut_reason: "【説③・複製技術】列挙の3つ目で画を切る。telop「説③ 複製技術」"

      - type: image
        from: 22
        slot: 9
        visual_intent: "三つの説を持って歴史へ向かう。ビート4と同じ机上資料の画を再提示"
        gen_prompt: "a person's hands resting on a desk covered with old documents, maps and a magnifying glass in a study, papers blurred and unreadable, warm lamp light, seen from above at an angle"
        search_query: "hands desk old documents maps study"
        cut_reason: "【歴史への出発】列挙が終わったので机上へ戻し、「どれに賭けるだろうか。」の後の間まで保持"

  - id: 3
    title: "説①の検証・将棋の起源（章「将棋のプロは、誰が作ったのか」）"
    chapter_title: "将棋のプロは、誰が作ったのか"
    readings:
      - surface: "金"
        reading: "カネ"
      - surface: "慶長"
        reading: "ケイチョウ"
      - surface: "大橋宗桂"
        reading: "オオハシソウケイ"
      - surface: "五十石五人扶持"
        reading: "ゴジッコクゴニンブチ"
      - surface: "将棋所"
        reading: "ショウギドコロ"
      - surface: "幕臣"
        reading: "バクシン"
      - surface: "御城将棋"
        reading: "オシロショウギ"
      - surface: "吉宗"
        reading: "ヨシムネ"
    narration:
      - text: "最初の説から見ていこう。"
        pause_after: 0.2
      - text: "金を払う仕組みが、プロを生む。"
        pause_after: 0.2
      - text: "この説をいちばん素直に確かめられるのが、将棋だ。"
        pause_after: 0.2
      - text: "日本で将棋が職業になった瞬間は、はっきりしている。"
        pause_after: 0.2
      - text: "1612年、慶長17年。"
        pause_after: 0.2
      - text: "徳川家康が、大橋宗桂という将棋指しに、五十石五人扶持を与えた。"
        pause_after: 0.2
      - text: "米で払う俸禄と、家来を養う手当。"
        pause_after: 0.2
      - text: "将棋の指南役としての、給料だ。"
        pause_after: 0.2
      - text: "これによって将棋所という、将棋界を束ねる役職が生まれ、大橋家は、幕府に仕える武士に近い身分を得た。"
        pause_after: 0.2
      - text: "以後、大橋本家、大橋分家、伊藤家の三つの家が、家元、つまり技と称号を世襲で管理する家として、将棋を継いでいく。"
        pause_after: 0.2
      - text: "年に一度、旧暦の11月17日には、江戸城で将軍の前で対局する御城将棋が行われた。"
        pause_after: 0.2
      - text: "8代将軍吉宗の時代、1716年からのことだ。"
        pause_after: 0.2
      - text: "ここで注意してほしいのは、順序だ。"
        pause_after: 0.2
      - text: "強い将棋指しが現れたから幕府が雇ったのではなく、幕府が雇ったから、将棋指しが職業になった。"
        pause_after: 0.2
      - text: "もちろん宗桂は強かった。"
        pause_after: 0.2
      - text: "だが強い人なら、その前にも後にもいる。"
        pause_after: 0.2
      - text: "将棋のプロは、強さではなく、幕府が作った。"
        pause_after: 2.2
      - text: "そして幕府が作ったものは、幕府と一緒に消える。"
        pause_after: 1.2
    beats:
      - type: chapter
        slot: 1
        cut_reason: "章の頭"

      - type: image
        from: 1
        slot: 2
        visual_intent: "江戸初期の城内、将棋盤を挟んで対局する二人と上座から見る人物を引きで（顔は描き込まない）"
        gen_prompt: "an early Edo-period Japanese castle interior, two men playing shogi on the tatami while a lord watches from a raised seat, gold folding screens, candlelight, seen from a distance, no readable text"
        search_query: "edo castle interior shogi players lord watching"
        telop: "1612年 大橋宗桂に五十石五人扶持（日本将棋連盟の史料による）"
        cut_reason: "【説①の導入】キュー1〜5は「最初の説から見ていこう」の導入場面"

      - type: image
        from: 6
        slot: 3
        visual_intent: "家康が大橋宗桂に扶持を与える場面を直接描写"
        gen_prompt: "an Edo-period lord seated on a raised dais handing a folded document of stipend to a kneeling shogi player before him, gold folding screens behind, candlelight, seen from a respectful distance, no text, no lettering"
        search_query: "edo period lord handing document to kneeling man"
        cut_reason: "【分割】元ビート1の20秒超を節目で分割。「徳川家康が、大橋宗桂という将棋指しに、五十石五人扶持を与えた。」以下、家康の扶持授与の具体的な場面を受ける"

      - type: image
        from: 10
        slot: 4
        visual_intent: "三つの家元が世襲で将棋を継いでいく場面を直接描写"
        gen_prompt: "three generations of an Edo-period family kneeling together before a shogi board in a modest formal room, an elder passing a wooden name plaque to a younger man, muted ink-wash tones, no readable text"
        search_query: "edo period family generations shogi board succession"
        cut_reason: "【分割】三つの家が家元として将棋を世襲していく場面を直接描写する"

      - type: image
        from: 11
        slot: 5
        visual_intent: "御城将棋の場面。江戸城の広間、居並ぶ家臣と中央の盤"
        gen_prompt: "a formal ceremony in a large Edo castle hall, rows of samurai seated in silence, a shogi board at the center under the gaze of the shogun on a dais, muted ink-wash and gold tones, wide shot"
        search_query: "edo castle hall ceremony shogi board samurai"
        telop: "御城将棋 旧暦11月17日・1716年から年1回"
        cut_reason: "【御城将棋】年中行事へ場面が広がる"

      - type: image
        from: 13
        slot: 6
        visual_intent: "幕府が将棋指しを選んで雇ったという順序を、選抜の場面で直接描写"
        gen_prompt: "an Edo-period lord's attendant presenting several kneeling men before the lord, one man distinguished by being handed a document while the others remain still, candlelight, seen from a distance, no text, no lettering"
        search_query: "edo period lord attendant presenting kneeling men"
        cut_reason: "【分割】元ビート3の20秒超を節目で分割。「ここで注意してほしいのは、順序だ。幕府が雇ったから、将棋指しが職業になった。」を選抜の場面で受ける"

      - type: image
        from: 15
        slot: 7
        visual_intent: "順序の主張。前ビートの広間を保持せず、家康から扶持を受ける将棋指しの手元（書状と駒。文字は読めない）"
        gen_prompt: "a kneeling man in Edo-period dress receiving a folded document from an attendant, a shogi piece and the document on the tatami before him, paper blank and unreadable, soft lamplight, close on hands"
        search_query: "edo period man receiving document hands close up"
        cut_reason: "「もちろん宗桂は強かった。だが強い人なら、その前にも後にもいる。」の決め文へ向けて具体物に寄る。決め文「幕府が作った。」で画面保持"

      - type: image
        from: 18
        slot: 8
        visual_intent: "予告。夕暮れの江戸城の石垣と堀、人はいない"
        gen_prompt: "the stone walls and moat of Edo Castle at dusk with no people, long shadows, muted sepia tones, quiet and foreboding"
        search_query: "edo castle stone walls moat dusk empty"
        cut_reason: "【次章への予告】幕府の消滅を暗示する無人の城で章を閉じる"

  - id: 4
    title: "断絶と再生（幕府 → 新聞）"
    readings:
      - surface: "契約金"
