        pause_after: 0.2
      - text: "なぜ競技にはプロが生まれるのか。"
        pause_after: 0.2
      - text: "強い人がいるからではない。"
        pause_after: 0.2
      - text: "その技に金を払う仕組みを、社会が持ったからだ。"
        pause_after: 0.2
      - text: "装置はあとから地位を固め、複製技術はあとから規模を増やす。"
        pause_after: 0.8
      - text: "プロとは、腕前の証明書ではない。"
        pause_after: 0.2
      - text: "あなたの技に、誰かが金を払い続ける仕組みができた、という事実の名前だ。"
        pause_after: 2.5
      - text: "あなたが今、金にならないと思いながら続けている何かも、払い続ける誰かが現れ、それが仕組みになったとき、職業になる。"
        pause_after: 0.2
