# シーン YAML（v6・ビート運用）。台本 Markdown（scripts/20260819-sns-lookism-v6.md）に対応する
# レンダリング指示書。
# 仕様（正）: C:\Users\shuya\Projects\script-to-video\docs\schema.md（beats[] 節）
#             C:\Users\shuya\Projects\script-to-video\docs\design-beat-rendering.md
# 検証: cd C:\Users\shuya\Projects\script-to-video && .venv\Scripts\python.exe -m script_to_video validate <このファイル>
#
# v5（scripts/20260629-sns-lookism-acceptance.yaml）からの差分:
#   1) タイトル変更（「なぜ今〜受け入れられていくのか」→「なぜ近年〜受け入れられていく傾向にあるのか」）。
#      シーン1の telop も同じ言い換えに合わせた。
#   2) シーン4のナレーション1セグメントのみ事実修正（Hamermesh & Biddle 1994 の一次資料に合わせ、
#      「賃金が最大で十数パーセント高く」→「賃金が高く／低い。その差は合わせて一割を超えていました」）。
#      裏取り: references/20260819-beauty-premium-chart.md（男女計 +4.9% / −6.9%）。
#      同シーンに chart 図解ビート（-6.9 / 0 / +4.9）を初投入した。
#   3) 映像トラックを全シーン beats[] へ移行（v5 の assets/gen_prompt/diagram/cutaways は撤去）。
#      video.style をシネマティック（R19.6 推奨文言）へ差し替え。
#   上記以外のナレーション文言・readings・telop・key_color・emphasis・chapter_title・BGM は v5 のまま。
#
# シーン3・シーン8のビート割り・gen_prompt・motion は R19.12 の検証済みシーン YAML
# （script-to-video/build/r19-12/scene38-beats.yaml）をそのまま流用した（slot 番号も同一）。

video:
  title: "なぜ近年、キャバ嬢・AV女優は受け入れられていく傾向にあるのか — 写真SNSとルッキズムの社会学"
  speaker: "青山龍星"
  resolution:
    width: 1920
    height: 1080
  style: "cinematic film still, dramatic chiaroscuro lighting, a single warm key light cutting through deep shadow, high contrast, low saturation with amber highlights and cold blue shadows, shallow depth of field, subtle film grain, wide cinematic framing, dark moody atmosphere, large areas of near-black negative space, no text, no lettering, no watermark, no logo, no caption"
  bgm: "../bgm/main.mp3"
  bgm_credit: "「落ち着いた？」ミルアージュ（DOVA-SYNDROME）"

scenes:
  # ============================================================
  # シーン1「フック」 キュー11本 / 推定 61秒
  #   1 街を歩けば、SNSを開けば、テレビをつければ。
  #   2 かつては「夜の世界」「日陰の職業」と呼ばれ、…
  #   3 キャバクラで働く女性、いわゆるキャバ嬢。
  #   4 あるいは、アダルトビデオに出演する女優。
  #   5 ほんの二十年ほど前なら、これらの職業は強い偏見の対象でした。
  #   6 ところが、今はどうでしょう。
  #   7 彼女たちはユーチューブで人生を語り、…
  #   8 世間のまなざしは、明らかに変わりつつあります。
  #   9 いったい、なぜなのでしょうか。
  #  10 今日はこの問いを、…考えていきます。
  #  11 そして見えてくるのは、…事実です。
  # ============================================================
  - id: 1
    title: "フック"
    visual_intent: "夜の街とスマートフォンの光で開き、路地の看板・語り手のリングライト・観客のまなざしと画を継いで、変化の気配だけでつかみを作る"
    key_color: "#2E4A7D"
    narration:
      - text: "街を歩けば、SNSを開けば、テレビをつければ。かつては「夜の世界」「日陰の職業」と呼ばれ、人前で語ることがためらわれた仕事があります。キャバクラで働く女性、いわゆるキャバ嬢。あるいは、アダルトビデオに出演する女優。ほんの二十年ほど前なら、これらの職業は強い偏見の対象でした。"
        pause_after: 0.6
      - text: "ところが、今はどうでしょう。彼女たちはユーチューブで人生を語り、本を出版し、ファッションのお手本として何十万人ものフォロワーを集めています。"
        pause_after: 0.4
      - text: "世間のまなざしは、明らかに変わりつつあります。いったい、なぜなのでしょうか。"
        pause_after: 0.5
      - text: "今日はこの問いを、単なる印象論ではなく、心理学と経済学の研究を手がかりに、ひとつずつ論拠を積み上げて考えていきます。そして見えてくるのは、私たち自身の「美しさ」との付き合い方が、ここ十数年で大きく変わったという事実です。"
    telop: "なぜ近年、受け入れられていくのか"
    readings:
      - surface: "日陰"
        reading: "ヒカゲ"
    beats:
      - type: image
        from: 1
        slot: 1
        motion: parallax_left
        visual_intent: "夜の街を歩く人々と、その手元のスマートフォンの光。街・SNS・テレビという三つの入口を一つの夜景に束ねる"
        cut_reason: "【つかみの提示】キュー1〜2は『街でもSNSでもテレビでも見かける、かつて語りにくかった仕事』という一つの導入なので1枚で持たせる"
        gen_prompt: "pedestrians walking along a dark city street at night, each of them holding a glowing smartphone that lights their face from below, shop windows behind them reduced to smears of amber light, no text, no lettering anywhere"

      - type: image
        from: 3
        slot: 2
        motion: parallax_right
        visual_intent: "「夜の世界」「日陰の職業」と呼ばれた場所＝雨あがりの路地に灯る看板の列と、その下をうつむいて通る人影"
        cut_reason: "【対象の名指し】キュー3〜5でキャバ嬢・AV女優と対象を名指しし、二十年前の偏見を語る。俯瞰から、その仕事が置かれていた場所へ寄る"
        gen_prompt: "a lone woman in a long coat walking past a narrow alley lined with small nightclub entrances, the signboards above her glowing but completely blank with no text and no lettering, wet asphalt reflecting the light, the far end of the alley swallowed in blackness"

      - type: image
        from: 6
        slot: 3
        motion: parallax_in
        visual_intent: "「今はどうでしょう」＝暗い部屋でリングライトを浴び、カメラに向かって自分の人生を語る女性。傍らに自著が置かれている"
        cut_reason: "【時制の反転】キュー6『ところが、今はどうでしょう』で現在に切り替わる。シーン最大の転換なので、暗い路地から明るいリングライトへ画そのものを反転させる"
        gen_prompt: "a woman sitting alone in a dark room talking straight into a camera on a tripod, a ring light throwing a clean circle of light onto her face, a hardcover book lying beside her with a blank unmarked cover and no readable print, the rest of the room unlit"

      - type: image
        from: 8
        slot: 4
        motion: parallax_left
        visual_intent: "世間のまなざしが変わりつつある＝暗がりで一斉に同じ方向を見る観客の顔が、画面外の光にほのかに照らされる"
        cut_reason: "【問いの提示】キュー8〜9『世間のまなざしは変わりつつある。いったい、なぜなのでしょうか』。動画全体の問いが立つ位置なので、視線そのものを画にする"
        gen_prompt: "rows of faces in a dark audience all turned toward the same light source outside the frame, only the edges of their cheeks and eyes catching the pale glow, the seats and walls swallowed in blackness"

      - type: image
        from: 10
        slot: 5
        visual_intent: "心理学と経済学の研究を手がかりに＝暗い机に積まれた論文の束と、そこへ落ちる一条の光"
        cut_reason: "【方法の宣言】キュー10『心理学と経済学の研究を手がかりに、論拠を積み上げて考えていきます』。情景から研究の机へ移り、この動画の進め方を示す"
        gen_prompt: "a researcher's hands resting on a thick stack of academic papers on a dark desk, one narrow beam of warm light falling across the top sheet, the pages out of focus with no readable print, the room behind completely dark"

      - type: image
        from: 11
        slot: 6
        motion: parallax_in
        visual_intent: "私たち自身の「美しさ」との付き合い方＝暗い洗面所で、鏡に映る顔の半分だけが小さな灯りを受けている"
        cut_reason: "【私たちの話へ】キュー11『私たち自身の美しさとの付き合い方が、ここ十数年で大きく変わった』。社会の話から視聴者自身の話へ引き寄せてシーンを閉じる"
        gen_prompt: "a person standing in front of a bathroom mirror in a dark room, only one half of their reflected face lit by a small warm bulb above the mirror, condensation blurring the edge of the glass"

  # ============================================================
  # シーン2「問題提起」 キュー12本 / 推定 70秒（＋章カード3秒＋強調3秒）
  #   1 まず、言葉の意味をはっきりさせておきましょう。
  #   2 ここで言う「受け入れられている」とは、…
  #   3 そうではなく、第一に、これらの職業を公言する人が増えたこと。
  #   4 第二に、その人たちが好意的に、…増えたこと。
  #   5 この二つを指しています。
  #   6 実際、かつては隠すものだった経歴を、自分から語る人が増えました。
  #   7 では、なぜ社会のまなざしはやわらいだのか。
  #   8 よくある説明は「多様性の時代になったから」というものです。
  #   9 しかし、これでは答えになっていません。
  #  10 なぜ多様性が認められるようになったのか、…
  #  11 そこでこの動画では、…一つの変化に注目します。
  #  12 それが、写真を中心としたSNSの広がりと、…ルッキズムの加速です。
  # ============================================================
  - id: 2
    title: "問題提起"
    chapter_title: "問題提起"
    visual_intent: "辞書の紙面で「受容」を定義し、収束の図解で二つの意味を束ねたあと、行き止まりの壁と一本の柱で通説の却下と注目点の宣言をつなぐ"
    key_color: "#2E4A7D"
    narration:
      - text: "まず、言葉の意味をはっきりさせておきましょう。ここで言う「受け入れられている」とは、これらの職業をすばらしいと全員が称賛している、という意味ではありません。"
        pause_after: 0.2
      - text: "そうではなく、第一に、これらの職業を公言する人が増えたこと。"
        pause_after: 0.2
      - text: "第二に、その人たちが好意的に、あるいは少なくとも中立的に受け取られる場面が増えたこと。"
        pause_after: 0.2
      - text: "この二つを指しています。"
        pause_after: 0.3
      - text: "実際、かつては隠すものだった経歴を、自分から語る人が増えました。"
        pause_after: 0.5
      - text: "では、なぜ社会のまなざしはやわらいだのか。よくある説明は「多様性の時代になったから」というものです。しかし、これでは答えになっていません。"
        pause_after: 0.2
      - text: "なぜ多様性が認められるようになったのか、その中身を説明していないからです。"
        pause_after: 0.6
      - text: "そこでこの動画では、複数の要因の中でも、とりわけ大きな柱だと考えられる一つの変化に注目します。それが、写真を中心としたSNSの広がりと、それがもたらした「外見の価値の上昇」、すなわちルッキズムの加速です。"
    telop: "「受容」とは何か／問いの定義"
    readings:
      - surface: "多様性"
        reading: "タヨウセイ"
    emphasis:
      - at: 8
        text: "外見の価値の上昇"
    beats:
      - type: chapter
        slot: 1
        cut_reason: "章の頭。辞書のページの画を強く落として章名を重ねる"

      - type: image
        from: 1
        slot: 2
        motion: zoom_in
        visual_intent: "言葉の意味をはっきりさせる＝暗い机の上で開かれた分厚い辞書のページに指を置く手元"
        cut_reason: "【定義の宣言】キュー1〜2は『まず言葉の意味をはっきりさせる』という一つの動作。紙面は平面的で視差が出ないためズームで持たせる"
        gen_prompt: "a hand resting on the open page of a thick dictionary on a dark desk under a single lamp, the printed columns out of focus with no readable print, the rest of the room black"
        search_query: "dictionary definition page close up"
        assets:
          - url: "https://pixabay.com/photos/dignity-definition-dictionary-2724770/"
            kind: image
            license: commercial-ok
            source_name: "Pixabay"
            note: "v5 で採用実績のある候補（build/sns-lookism-assets/scene_02.jpg）。辞書で言葉の定義を引く画"
          - url: "https://pixabay.com/photos/dictionary-book-learn-learning-613910/"
            kind: image
            license: commercial-ok
            source_name: "Pixabay"
            note: "予備候補。辞書のクローズアップ"

      - type: diagram
        from: 3
        cut_reason: "【定義の中身】キュー3〜5は『第一に／第二に／この二つ』という列挙と収束。語順に合わせて2つの定義が現れ、1つの結論へ束ねる"
        diagram:
          type: narrative
          layout: converge
          items:
            - id: disclose
              text: 公言する人が増加
              at: 3
              after: 公言する人が
            - id: accept
              text: 中立以上に受容
              at: 4
              after: 中立的に
          result:
            text: この二つを受容と呼ぶ
            at: 5
            after: この二つを

      - type: image
        from: 6
        slot: 3
        visual_intent: "かつて隠していた経歴を自分から語る＝暗い部屋でカメラに向かい、静かに話し始める人物"
        cut_reason: "【実例へ】キュー6『実際、かつては隠すものだった経歴を、自分から語る人が増えました』。定義の図解から具体的な人の場面へ落とす"
        gen_prompt: "a person sitting in a dark room facing a small camera, mouth just opening to speak, a single warm lamp lighting one side of their face, their hands folded still on the table"

      - type: image
        from: 7
        slot: 4
        motion: parallax_right
        visual_intent: "なぜまなざしはやわらいだのか＝夜の交差点を思い思いの方向へ渡っていく、装いのまるで違う人々"
        cut_reason: "【問いと通説】キュー7〜8『なぜやわらいだのか』『よくある説明は多様性の時代になったから』。通説を象徴する多様な人波を出す"
        gen_prompt: "a crowd of very different looking pedestrians crossing a wide intersection at night from every direction, their coats and bags catching scattered amber light, the buildings behind them almost black"

      - type: image
        from: 9
        slot: 5
        motion: parallax_in
        visual_intent: "それでは答えになっていない＝霧の中、行き止まりの壁に突き当たって立ちつくす人影"
        cut_reason: "【通説の却下】キュー9〜10『しかし、これでは答えになっていません』。説明がそこで止まることを行き止まりの画で受ける"
        gen_prompt: "a person standing still in front of a blank concrete dead end wall in thick fog, a single overhead lamp lighting the top of the wall, their long shadow stretching back toward the camera"

      - type: image
        from: 11
        slot: 6
        visual_intent: "とりわけ大きな柱＝真っ暗な広間に一本だけ立つ太い石柱を、下から光が舐める"
        cut_reason: "【注目点の宣言】キュー11『とりわけ大きな柱だと考えられる一つの変化に注目します』。ここから注目点が一つに絞られる"
        gen_prompt: "a person standing at the base of one massive stone pillar in a pitch dark hall, a low warm light raking up the pillar so its full height emerges from the blackness"

      - type: image
        from: 12
        slot: 7
        motion: parallax_in
        visual_intent: "写真SNSの広がりと外見の価値の上昇＝広場で自撮りする女性の光が、周囲の人々の顔まで照らし出す"
        cut_reason: "【主題の提示】キュー12『写真SNSの広がりと、それがもたらした外見の価値の上昇』。動画の主題が置かれる位置なので、静物の柱から人の場面へ切り替える"
        gen_prompt: "a woman raising her phone to take a selfie in a dark plaza, the light from the phone spilling outward and catching the faces of dozens of other people around her, the plaza beyond them unlit, no text, no lettering on the screen"

      - type: typo
        at: 8
        cut_reason: "【無音3秒】主題の決め文「外見の価値の上昇」の強調カット"

  # ============================================================
  # シーン3「論証1 ハロー効果」 キュー11本 / 推定 63秒
  # ビート割り・gen_prompt・motion は R19.12 検証済み（build/r19-12/scene38-beats.yaml のシーン1）
  # をそのまま流用。
  # ============================================================
  - id: 3
    title: "論証① ハロー効果（土台となる心理）"
    chapter_title: "論証1 ハロー効果"
    visual_intent: "書斎の一条の光から履歴書の光の輪（キービジュアル）へ進み、実験室の場面と放射図解で「美しいものは善い」を積み上げる"
    key_color: "#2E7D5B"
    narration:
      - text: "まず、土台となる人間の根深い心理から確認しましょう。心理学に「ハロー効果」という有名な現象があります。ある目立った特徴が、その人の他の評価まで引きずってしまう、という認知の偏りです。"
        pause_after: 0.2
      - text: "なかでも、見た目に関するものは古くから知られています。"
        pause_after: 0.4
      - text: "1972年、心理学者のカレン・ディオンらは、ある実験を行いました。"
        pause_after: 0.2
      - text: "参加者に、魅力の高い人、普通の人、低い人の写真を見せ、それぞれがどんな人物かを推測してもらったのです。"
        pause_after: 0.4
      - text: "結果は明快でした。"
        pause_after: 0.5
      - text: "人は、外見の魅力が高い人ほど、性格も温かく、社交的で、能力も高く、幸せな人生を送るだろうと推測したのです。"
        pause_after: 0.3
      - text: "この研究には「美しいものは善い」という象徴的な題名がつけられました。"
      - text: "私たちは無意識のうちに、美しさを内面の良さと結びつけてしまう。これは特別に意地悪な人だけの話ではなく、人間に広く共通する傾向なのです。"
    telop: "ハロー効果 ―「美しいものは善い」"
    readings:
      - surface: "偏り"
        reading: "カタヨリ"
    emphasis:
      - at: 7
        text: "美しいものは善い"
    beats:
      - type: chapter
        slot: 1
        cut_reason: "章の頭。キービジュアル（天使の輪に照らされた履歴書）を強く落として章名を重ねる"

      - type: image
        from: 1
        slot: 2
        motion: parallax_in
        visual_intent: "人間の根深い心理という土台を、暗い書斎の机に置かれた古い心理学書と一条の斜光で示す"
        cut_reason: "【学問的背景の提示】キュー1「土台となる人間の根深い心理から確認しましょう」＋キュー2「心理学にハロー効果という有名な現象があります」。どちらも『これから心理学の知見を持ち出す』という同じ動作なので1枚で持たせる"
        gen_prompt: "a worn hardcover book lying open on a dark wooden desk in an unlit study, a single narrow shaft of warm light falling across its blank pages from a high window, dust motes drifting in the beam, the rest of the room swallowed in blackness, pages out of focus with no readable print"

      - type: image
        from: 3
        slot: 3
        motion: parallax_left
        visual_intent: "★キービジュアル。ハロー効果＝暗い面接室の机で、履歴書の顔写真の部分だけが天使の輪のような光の環に照らされている"
        cut_reason: "【名前から中身へ】キュー3で初めてハロー効果の定義（ある目立った特徴が他の評価まで引きずる）が語られる。ここがキービジュアル投入の瞬間。続くキュー4も同じ紹介ブロックの締めなので同じ画のまま保持する"
        gen_prompt: "a single sheet of blank unmarked paper lying on a dark interview room table with a small portrait photograph clipped to its top corner, a bright glowing circular halo ring of warm light floating in the air just above that photograph and casting a pool of light down onto it, two empty chairs dissolving into the unlit background, blank paper with no writing"

      - type: image
        from: 5
        slot: 4
        motion: parallax_right
        visual_intent: "1972年ディオンらの実験。白衣の研究者がクリップボードを持ち、机上に写真を並べている"
        cut_reason: "【場面転換：論から実験室へ】「1972年、カレン・ディオンらは、ある実験を行いました」。抽象的な概念説明から具体的な研究の場面に移る、シーン中もっとも強い場面転換"
        gen_prompt: "a researcher in a white lab coat standing at a table in a 1970s university laboratory, holding a clipboard and laying out printed photographs in a row, one desk lamp casting warm light on the table while the room behind stays dark, vintage reel-to-reel equipment barely visible in the shadows"

      - type: image
        from: 6
        slot: 5
