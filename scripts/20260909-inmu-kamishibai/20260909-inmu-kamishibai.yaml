- id: 3
  title: 切り貼りしやすい形とは何か（章カードなし）
  chapter_title: null
  narration:
  - text: 真似され続ける動画には、共通の形があるの。普通の人が出ていて、男らしさがどこか欠けて見えて、単純で、繰り返しがあって、奇妙で、そして笑える。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: この六つは、イスラエルのヘブライ大学のリモール・シフマンが、二千十二年に取り出した特徴よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: YouTube で真似され続けた動画を、分析したものなの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 男らしさが欠けて見える、というのはどういうことなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 強くて格好いい人ではなく、どこか締まらない人のほうが、真似されやすいということね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 淫夢の素材に当てはめてみましょう。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 素人に近い出演者、締まらない演技、短い言い回し、繰り返せる場面、意味の分からないやり取り。普通の人、欠けた男らしさ、単純、繰り返し、奇妙の五つは、はっきり当てはまるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 「笑える」かどうかは人によるから、そこは空けておくわね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: シフマンの研究は、淫夢を調べたわけじゃないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ、YouTube 全体の話よ。淫夢への当てはめは、私たちの見立て。だから、あとで淫夢そのものを調べた研究も見るわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕なりに言うと、面白い作品だったというより、切り刻んで遊ぶのにちょうどいい形をしてた、ということなのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: そういうこと。でも、形がよかっただけなら、使う側がここまで夢中になる理由にはならないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.7
  - text: 確かに、三千いいねは多すぎるのだ。使う側は、何が嬉しいのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【比喩の直接化】自宅で自撮り動画を撮る普通の人。真似される動画のイメージを直接描写（図解の保持74秒が長すぎたため前半をimageビートへ）
    from: 1
    slot: 1
    credit: 'Photo: Gustavo Fring / Pexels'
  - type: image
    cut_reason: 【間】同じ絵のまま、シフマンの研究紹介へ尺を分ける（保持38秒を短縮するため分割）
