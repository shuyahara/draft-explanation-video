- id: 8
  title: 結び
  chapter_title: null
  narration:
  - text: めたんの最後の話、重かったのだ。でも、ちゃんと受け取ったうえで、僕の言葉でまとめてみるのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.35
  - text: 二十五年前のビデオの台詞が今も合言葉なのは、動画が面白かったからじゃないのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: 四つの理由が、重なったからなのだ。
    speaker: ずんだもん
    expression: point
    pause_after: 0.45
  - text: 切り貼りしやすい形をしていたこと。通じるだけで仲間だと分かること。口に出しにくいものを安全な場所で触れること。そして、何百回も触れる場所があったこと。
    speaker: ずんだもん
    expression: point
    pause_after: 0.45
  - text: その通りよ。熱狂の正体は、動画そのものではなく、合言葉の仕組みなの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: だから、あなたが次に「やりますねぇ」を見て笑ったとき、三つのことを分けて思い出してほしいの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 面白がっているのは、合言葉が通じた自分たち。その声は、外からは同性愛を笑う声に聞こえうる。そして、その合言葉の元になった人は、何も選んでいない。
    speaker: めたん
    expression: normal
    pause_after: 2.5
  - text: 笑うのをやめろ、という話ではないのだ。何を笑っていて、それが誰にどう聞こえるかを、知っておこう、という話なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: それで十分よ。今日の話はここまで。
    speaker: めたん
    expression: smile
    pause_after: 2.5
