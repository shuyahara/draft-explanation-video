- id: 5
  title: なぜタブーほど笑えるのか
  chapter_title: なぜタブーほど笑えるのか
  narration:
  - text: 人はどういうときに笑うのか。アメリカのコロラド大学のマグロウとウォレンが、二千十年に「良性侵犯理論」という答えを出したの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: りょうせいしんぱん？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 何かの決まりが破られていると感じて、それでいて自分は傷つかない、と同時に感じたとき。そのときに人は笑う、という理論よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 破られているだけなら不快。傷つかないだけなら退屈。両方が重なった瞬間に、笑いが起きるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 当時のネットの人たちにとって、成人向けで、しかも男性同士のビデオは、口に出しにくいものだったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう受け取られていたの。それ自体が悪いことだという意味ではないわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 当時の多くの人が、口に出しにくいものとして扱っていた、ということね。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そして、それを画面越しに、仲間内で、台詞だけ切り出して使うなら、自分は傷つく側にはならない。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 口に出しにくいものを、安全な場所で触るとき、人は笑うの。
    speaker: めたん
    expression: normal
    pause_after: 1.5
  - text: だから、普通の台詞より、言ってはいけない感じの台詞のほうが、合言葉として強かったのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: もう一つ、繰り返しの力もあるわ。同じものに何度も触れるだけで好きになっていく。単純接触効果と呼ばれる現象よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: アメリカのミシガン大学のロバート・ザイアンスが、千九百六十八年に示したの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 意味のない図形や文字でも、見た回数が多いほど好ましく感じるの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 「やりますねぇ」も、何百回も聞いているうちに、気づいたら好きになってた、ということなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 最初は意味不明だった台詞が、聞くたびに馴染んで、ついには自分でも言いたくなる。ミームが広がるときの道筋そのものね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: でも、何百回も触れるには、何百回も出てくる場所が要るのだ。それがニコニコ動画だったのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
