- id: 2
  title: そもそも何が起きたのか
  chapter_title: そもそも何が起きたのか
  narration:
  - text: まず、何が起きたのかを順番に見ましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 元は、二千一年に発売された一本の成人向けビデオよ。あとから同じ制作会社の作品まで含めて、ネットの人たちはまとめて「淫夢」と呼ぶようになったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 二千七年ごろ、ニコニコ動画にその映像が転載されたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 二千八年ごろからは、台詞や場面を切り貼りした音MADの素材にされ始めたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 音MADって、台詞を音楽に合わせて刻むやつなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そう。二千十年には、ニコニコ動画に「例のアレ」というカテゴリができたの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: そこが、淫夢の動画の置き場になっていったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 二千十四年には、週間のタグ人気で一位になったこともあるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そして二千二十年代の今は、TikTok のダンスや、さっきの料理動画のコメント欄みたいな形で広がっているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 元の動画を見たことがない世代にまで、ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 見たことがないのに使ってるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ええ。世の中に面白い動画はいくらでもあるのに、なぜこれだけが二十五年も生き残ったのか。
    speaker: めたん
    expression: normal
    pause_after: 0.8
  - text: 面白かったから、じゃないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 面白さだけでは、二十五年は続かないの。切り貼りしやすい形をしていたから広まった、と考えるほうが説明がつくのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: 切り貼りしやすい形って、どういう形なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.7
  beats:
