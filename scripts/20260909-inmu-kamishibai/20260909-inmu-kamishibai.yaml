- id: 1
  title: フック（料理動画のコメント欄）
  chapter_title: null
  narration:
  - text: めたん、昨日、料理の動画を見てたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: そうしたら、コメント欄のいちばん上に「やりますねぇ」とだけ書いてあったのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.35
  - text: それに、三千もいいねが付いてたのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: その下にも、同じ台詞をもじった返信が、ずらっと並んでたのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: 料理と何の関係があるのか、僕にはさっぱり分からなかったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ああ、それは知っている人にだけ通じる合言葉ね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 元ネタは、二十五年くらい前に出た、成人向けのビデオの一場面よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 二十五年前！？ しかも成人向け！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: そんな古いものの台詞が、なんで今の料理動画で笑いになるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.9
  - text: それが今日の問いね。二十五年前のビデオの台詞が、なぜ今も笑いの合言葉として使われているのか。
    speaker: めたん
    expression: normal
    pause_after: 1.2
  - text: 作品の中身は説明しないわ。人が何に熱狂しているのかを研究で確かめて、最後に、その笑いが誰にどう届いているのかまで見るつもりよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 中身の話じゃないなら、僕も安心して聞けるのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 1.2
  beats:
