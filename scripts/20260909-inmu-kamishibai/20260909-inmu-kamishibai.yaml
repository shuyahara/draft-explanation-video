- id: 6
  title: なぜニコニコで増殖したのか
  chapter_title: なぜニコニコで増殖したのか
  narration:
  - text: ええ。あの場所には、二つの仕組みがあったの。批評家の濱野智史さんが、二千八年の『アーキテクチャの生態系』で指摘したものよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 一つは、動画の上に視聴者のコメントが流れること。別の時間に見ているのに、同じ瞬間に同じ場所で笑っているように感じる。これを擬似同期と呼んだわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 一人で見てるのに、みんなで見てる気がするのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: もう一つは、誰かの作った動画を、別の誰かが切り貼りして、さらに別の誰かが作り替えていくこと。N次創作と呼ばれているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 淫夢の素材は、短い台詞と単純な場面の集まりだったから、切り貼りの部品としてちょうどよかったの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 部品を組み合わせた動画が上がり、その上にコメントで合言葉が流れ、それを見た人がまた部品を組み合わせる。この輪が、何年も回り続けたの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕の予想だと、その輪の中にいると、何百回も触れることになって、どんどん好きになるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: その通り。一人で見る動画ではなく、みんなで書き込んで、みんなで作り替える動画だったのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: これで、あなたの最初の疑問には答えが出たわ。二十五年も続いた理由は、面白さではなく仕組みだった。
    speaker: めたん
    expression: explain
    pause_after: 0.9
  - text: すっきりしたのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: ただ、ここまでは、熱狂する側から見た話なの。さっき、笑うのは「自分は傷つかない」と感じたときだと言ったでしょう。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 言ってたのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 自分が傷つかないということは、傷つく側が、別にいるかもしれないということよ。
    speaker: めたん
    expression: normal
    pause_after: 2.0
