- id: 4
  title: なぜ通じるだけで嬉しいのか
  chapter_title: なぜ通じるだけで嬉しいのか
  narration:
  - text: 笑ったというより、「自分は分かる側だ」と確かめられたのが嬉しいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 分かる側？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 社会的アイデンティティ理論、という考え方があるの。イギリスのブリストル大学のタジフェルとターナーが、千九百七十九年に出したものよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 人は、自分が属する集団とそうでない集団の境目をはっきりさせることで、自分の価値を感じる。そして、その境目を作る道具の一つが言葉なの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 合言葉が、仲間かどうかの境目になるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 一万例以上。アメリカのノースカロライナ大学のコニー・イーブルが集めた、大学生の俗語の数よ。調べて分かった俗語の役割は、仲間意識を作ることと、大人や権威に対抗することだったの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 淫夢の語録は、まさにこれね。元ネタが成人向けだから、大っぴらには言えない。だからこそ、通じた相手は確実に仲間なの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 言えないことが、逆に合言葉として強いのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ここで、淫夢そのものを調べた研究を見ましょう。早稲田大学の打田秀太さんが、二千二十二年に、淫夢の文化に関わる十四人から聞き取りをしたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 分かったのは、使う人たちは、これを表に出したいわけではない。でも、広まってはほしい。その二つを同時に成り立たせているのが、この文化の形だ、ということよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 表に出したくないけど、広まってほしい？ 矛盾してるのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 合言葉と考えれば、矛盾しないわ。合言葉は、みんなに知られたら合言葉でなくなる。でも、仲間が増えないと使う場所がない。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 語録は笑いの道具というより、仲間を見分ける合言葉なのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: じゃあ、僕が料理動画のコメント欄で笑えなかったのは、僕がまだ仲間じゃなかったから、ということなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。あなたも、通じる相手を見つけたときの嬉しさは知っているでしょう。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: でも、まだ説明できていないことがあるわ。なぜ、よりによって成人向けの、それも男性同士のビデオが合言葉になったのか。
    speaker: めたん
    expression: explain
    pause_after: 0.8
  - text: 確かに、合言葉ならアニメの台詞でもよかったはずなのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
