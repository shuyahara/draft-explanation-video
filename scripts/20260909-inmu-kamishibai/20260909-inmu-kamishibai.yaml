- id: 7
  title: その笑いは誰の上に立っているのか
  chapter_title: その笑いは誰の上に立っているのか
  narration:
  - text: 二つの問題があるの。一つは、その笑いが外からどう聞こえるか。もう一つは、笑いの素材にされた人よ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: まず聞こえ方。特定の集団をからかう笑いは、その場に「この集団は軽く扱っていい」という空気を作る。もともと偏見を持っていた人は、その空気の中で、偏見を行動に出しやすくなる。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: これは、アメリカのウェスタンカロライナ大学のフォードとファーガソンが示したことよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 二千四年の、「偏見規範理論」という説明ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 笑ってる本人に悪気がなくても、そうなるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 悪気の有無とは別に、空気ができてしまう、という話なの。淫夢の元ネタは男性同士のビデオでしょう。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: だから同性愛の当事者や活動家からは、この文化そのものが差別だという批判が続いているわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 使っている側は「同性愛を笑っているのではなく、締まらない演技や意味不明なやり取りを笑っている」と言う。それが本当だとしても、外から聞けば区別はつかないのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 合言葉のつもりが、誰かにとっては、自分を笑う声に聞こえるのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そして、もう一つ。笑いの素材にされた人は、実在するの。
    speaker: めたん
    expression: serious
    pause_after: 0.9
  - text: 出演者たちは、二十五年前に一本の仕事をしただけの、普通の人たちよ。本人は、この文化に参加していない。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: それなのに、出演者が誰で、今どこにいるのかを探し出そうとする動きが、何度も起きたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そのたびに、批判されてきたわ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: それは、もう遊びじゃないのだ。
    speaker: ずんだもん
    expression: angry
    pause_after: 0.45
  - text: 比べてほしい人がいるの。ビリー・ヘリントンというアメリカの俳優よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 同じころ、彼の出演作もニコニコ動画で切り貼りされて、大流行したの。二千七年の夏に投稿された動画は、二か月で十四万回以上再生されたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 彼は、それを知って、自分から受け入れたの。二千九年に日本に来て、ファンのイベントに何度も出た。二千十八年に亡くなったとき、日本中のファンが追悼したわ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 同じ切り貼りなのに、片方は本人が選んで表に出て、片方は選んでいないのに引き出されたのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ヘリントンは、自分で選んで表に出た。淫夢の出演者は、選んでいないのに引き出されたの。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 熱狂に仕組みがあることと、その笑いが誰も傷つけないことは、別なのよ。
    speaker: めたん
    expression: normal
    pause_after: 2.0
