scenes:
- id: 1
  title: フック（元キャバ嬢の動画）
  chapter_title: null
  narration:
  - text: めたん、この人の動画、面白いのだ。元キャバ嬢で、今はユーチューバーをやってるのだ。
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.35
  - text: 昔の仕事の話まで、自分で笑いながら話してるのだ。本も出してて、フォロワーは何十万人。すごいのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 隠さずに、自分から語っているのね。二十年くらい前なら、人前では言いにくい仕事だったのよ。
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: え、なんで言いにくいのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: キャバクラで働くことは、「夜の世界」「日陰の仕事」と呼ばれて、偏見を持たれていたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: アダルトビデオに出る女優さんも、別の仕事だけれど、同じように強い偏見を向けられていたのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 今は、この人をファッションのお手本にしてる人までいるのだ。きれいだし、話も面白いし。二十年で、そんなに変わったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 確かに、世間の見る目は変わってきているわ。ねえ、ずんだもん。どうしてだと思う？
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: うーん……。時代が変わったから、なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: それだと、何も言っていないのと同じよ。
    speaker: めたん
    expression: smug
    pause_after: 0.45
  - text: 一秒でボツにされたのだ……。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: せっかくだから、心理学と経済学の研究を根拠にして、理由を順に考えてみましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 調べていくとね、私たちが外見をどう評価して、外見にお金や手間をかけることをどう考えるか。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: それがこの十数年で大きく変わったことが見えてくるのよ。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: キャバ嬢の話だと思ってたのに、僕たちにも関係あるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  readings:
