- id: 4
  title: 美の経済的プレミアムと、フィルター時代の追試
  chapter_title: 美しさは、お金になるのか
  narration:
  - text: 次は1994年よ。テキサス大学の経済学者ダニエル・ハマーメッシュと、ミシガン州立大学のジェフ・ビドルの研究なの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 二人が調べたのは、容姿と収入の関係。アメリカとカナダの大規模な調査データを使ったのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 容姿と収入……。見た目がいいと、給料が高いのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ、実際にそういう差が出たの。見た目が平均より良いとされた人は、賃金がおよそ5パーセント高かったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 一方、平均より劣るとされた人は、およそ7パーセント低かったの。上と下を比べると、一割を超える差になるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 一割！ でも、見た目がいい人は、たまたま学歴も高かった、とかじゃないのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 鋭いわね。学歴や経験など、賃金に影響する条件を統計的に考慮しても、差は残ったの。こうした差は、「美の経済的プレミアム」と呼ばれているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: それだけではないの。見た目の良い人ほど、外見が有利に働く職業を選びやすいことも分かったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: でも、「見た目が生きる仕事を選んだから」だけでは、賃金の差を説明しきれなかった。どの職業でも差が残っていたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 外見が有利に働く職業……。キャバ嬢も、その一つなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そうね。だから今日の話と無関係ではないの。美しさは、SNSが生まれる前から、実際にお金に結びついていたのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: じゃあ、SNSの時代になって、この偏りは弱まったのだ？ みんな加工できるなら、差はなくなりそうなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ところが、むしろ逆かもしれないのよ。2024年に、スペインの研究チームが、美顔フィルターを使って調べているわ。
    speaker: めたん
    expression: smug
    pause_after: 0.35
  - text: 参加したのは2748人。462人分の顔写真について、加工前と、フィルターをかけた後を、それぞれ評価してもらったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 写っているのは同じ人なのに、魅力的に見える写真のほうが、知性も信頼性も高く評価されたの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 効果は加工前より少し弱かったけれど、消えなかったのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 同じ人なのに、そこまで変わるのだ？ 顔を加工しただけで、頭まで良さそうに見えるのだ？ そのフィルター、資格欄まで加工してないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: フィルターで美しく見せやすくなった。それでも、「美しいものは善い」と感じる心理までは消えなかった、ということね。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 偏りが給料にも出て、フィルターを使っても消えないのは分かったのだ。でも、それがどうしてキャバ嬢につながるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そこをつなぐのが、写真SNSよ。私たちが人を見るときの入口が、どう変わったのかを考えてみましょう。
    speaker: めたん
    expression: explain
    pause_after: 1.2
