- id: 3
  title: ハロー効果（土台の心理）
  chapter_title: 見た目は、中身の評価まで変えるのか
  narration:
  - text: 心理学に「ハロー効果」という有名な現象があるの。目立つ特徴が一つあると、その印象に引っぱられるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 関係のない性格や能力まで、同じ方向に評価してしまうのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 引っぱられる？ たとえば、どういうことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: その代表例が、見た目よ。1972年に、ミネソタ大学の心理学者、カレン・ディオンたちの実験を見てみましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 男女60人の大学生に、あらかじめ容姿の魅力が高い、普通、低いと評価された人の顔写真を見せたの。そして、写真の人がどんな人物か、推測してもらったのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 写真だけで、性格を当てるのだ？ 分かるわけないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そう、分かるはずはないわよね。ところが答えは、はっきり偏ったの。魅力が高い写真の人ほど、温かくて社交的で、能力も高そうだと思われたのよ。
    speaker: めたん
    expression: smug
    pause_after: 0.45
  - text: 顔しか見てないのに、そこまで決めるのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 結婚も仕事もうまくいって、幸せな人生を送りそうだ、とまで思われたの。題名も、ずばり「美しいものは善い」よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 写真一枚で、人生の最終回まで決められてるのだ！ ひどい話なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 顔を見ただけで中身まで良く推測してしまうのは、意地悪な人だけではないのよ。誰でも、ついやってしまうの。私も、ずんだもんもね。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 僕も……。さっきの動画の人も、きれいだから「いい人そう」って思ってたかもしれないのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: つまり私たちは、無意識に「美しい人は、中身もきっと良い」と結びつけてしまうの。まず、これを覚えておいてね。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: 心の中の偏りは分かったのだ。でも、それが世の中を変えるほど大きい力なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 心の中だけの話なら、ここまで大きくならなかったでしょうね。この偏りは、賃金の差にも表れるの。
    speaker: めたん
    expression: smile
    pause_after: 1.2
