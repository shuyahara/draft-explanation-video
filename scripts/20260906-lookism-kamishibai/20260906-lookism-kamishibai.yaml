- id: 2
  title: 「受け入れられている」の定義と問い直し
  chapter_title: 『受け入れられている』とは何か
  narration:
  - text: その前に、「受け入れられている」の意味をそろえておきましょう。みんなが「すばらしい仕事だ」と褒めている、という意味ではないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 確かに、コメント欄にはきつい言葉もあるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そうでしょう。ここで言う「受け入れられている」には、二つあるの。まず、キャバ嬢だったことを、隠さずに自分から話す人が増えたこと。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: もう一つは、話した人が応援される場面が増えたこと。少なくとも、昔の仕事だけを理由に責められない、という場面ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: さっきのユーチューバーは、どっちも当てはまるのだ。隠さないし、応援してる人が多いのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: そうね。じゃあ、どうして見る目がやわらいだのかしら。よく聞くのは、「多様性の時代になったから」という説明ね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: さっきの「時代が変わった」より、それっぽいのだ。それで正解なのだ？
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: さっきよりはいい答えよ。でも、まだ足りないの。なぜ多様性が認められるようになったのか、が残っているでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: うっ……。言われてみれば、「変わったから変わった」と言ってるだけなのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 要因はいくつもあるけれど、今日はその中でも大きいと私が考える変化に注目するわね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: それが、写真中心のSNSの広がりよ。SNSによって、外見が他人からの評価や収入につながりやすくなった。つまり、ルッキズムが加速したの。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: ルッキズムって、見た目で人を判断することなのだ？ それが、受け入れられる方に働くのだ？ 逆な気がするのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: いい疑問ね。そこをつなぐために、まずは人間がもともと持っている心理から見てみましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  readings:
  - surface: 多様性
    reading: タヨウセイ
