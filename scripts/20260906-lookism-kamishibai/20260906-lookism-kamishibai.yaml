- id: 7
  title: 補強する二つの変化
  chapter_title: null
  narration:
  - text: ここからは研究ではなく、私たちが日々見ている変化の話よ。まず大きいのは、働き方が増えたことね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 動画配信やSNSが広がって、個人が自分の名前で発信して、収入を得られるようになったの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: さっきの元キャバ嬢の人も、今は自分の名前で稼いでるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: そういう人は、日常や考え方を、毎日のように見せているでしょう？ そうなると、肩書きだけでなく、「この人はどんな人なんだろう」と見てもらえるようになるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 「キャバ嬢」って肩書きだけ見てたときは、遠い人だったのだ。動画で毎日の話を聞いてると、知り合いみたいなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう、その「知り合いみたい」という感覚よ。「キャバ嬢」「AV女優」という肩書きの一括りではなく、一人の人として見るようになる。それが、偏見を弱めるの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: それから、ずんだもん。自分の体や生き方は、自分で決めていいという考え方も広がったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 本人が選んだ働き方なら、事情も知らない人が頭ごなしに責めるべきではない。そう考える人が、以前より増えたのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 本人が決めたことを、外野が頭ごなしに責めるなって話なのだ。
    speaker: ずんだもん
    expression: point
    pause_after: 0.45
  - text: ええ。ただしそれは、働く環境の問題を批判してはいけない、という意味ではないのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 本人の選択を尊重することと、安全や搾取の問題を指摘することは両立するの。
    speaker: めたん
    expression: serious
    pause_after: 0.6
  - text: この二つも、外見の価値が上がった流れと結びついて、互いを強めているのよ。SNSは、外見と、その人の物語を、同時に見せているから。
    speaker: めたん
    expression: explain
    pause_after: 0.8
  - text: 説明としては、きれいにまとまってる気がするのだ。でも、きれいすぎて、少し怖いのだ。穴はないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 疑ってくれてうれしいわ。では、この説明の足りないところを、反対側から三つ確かめてみましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  beats:
