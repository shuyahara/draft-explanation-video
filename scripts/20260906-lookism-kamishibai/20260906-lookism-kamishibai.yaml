- id: 6
  title: 整形容認から、見た目を仕事にする人への見方へ（推論）
  chapter_title: null
  narration:
  - text: 分かったのだ。推論として聞くのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: まず、整形を受け入れるって、どんな考えが広がることかしら。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 生まれつきの顔じゃなくて……。努力やお金で、美しさを手に入れてもいい、という考えなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そのとおりよ。「美しさは努力や投資で手に入れてよいものだ」という考え方が広がるの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: そう考える人が増えると、見た目を磨いて、それを仕事の強みにする人にも、前ほど抵抗を感じにくくなる。そう私は見ているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 自分も見た目にお金をかけてるなら、見た目で稼ぐ人だけ責めるのは変なのだ。
    speaker: ずんだもん
    expression: point
    pause_after: 0.45
  - text: もう一つは、ハロー効果よ。美しい人は、人柄まで好意的に見られやすかったでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 見た目が評価に大きく関わる仕事の女性なら、「きれいで、きっと魅力的な人なんだ」と思われやすくなるの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ハロー効果が弱めるのは、まず、顔と人柄が見える一人ひとりへの偏見よ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: それが積み重なって、仕事への見方も変わっていく。そう考えているの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 外見の価値が上がれば、その魅力を仕事に生かす人も、評価されやすくなる。そういう関係なのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 冒頭の疑問が、ここでつながったのだ。でも、SNSと見た目の話だけで、全部説明できるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: できないわ。重なり合う、ほかの変化も見ておきましょう。
    speaker: めたん
    expression: smile
    pause_after: 0.9
