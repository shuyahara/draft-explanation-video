- id: 5
  title: 写真SNSが変えたもの（見る入口と、整形容認）
  chapter_title: 写真SNSは、何を変えたのか
  narration:
  - text: ずんだもん、写真中心のSNSを開いたとき、最初に目に入るのは何かしら。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: まず顔なのだ。それから服とか、映ってる場所が目に入るのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: そうよね。プロフィールを読むより先に、顔や姿が飛び込んでくるでしょう？ つまりSNSでは、見た目が、人を評価するときの最初の判断材料になるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そこに、さっきのハロー効果も働くの。最初に「きれいな人だ」と思うと、あとから知る人柄まで、よく見えやすくなるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: SNSを開くたびに、ハロー効果まで育ててるみたいなのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 見るだけでなく、行動まで変わるのかを調べた研究もあるわ。2021年、イタリアのフィレンツェ大学の研究チームが、19歳から32歳の女性305人を調べたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: インスタグラムで有名人の写真を見たり、自分の写真を投稿したりする。そういう活動が多い人ほど、他人と容姿を比べやすかったのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そして、比べることが多い人ほど、自分の体への不満が強かった。自分が美容整形を受けることへの抵抗も、弱かったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 見れば見るほど比べちゃって、最後は「直したい」になるのだ……。SNS、目だけじゃなくて心まで忙しいのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ただし、これは関連を調べた研究よ。もともと比べやすい人がインスタをよく使う、という向きもありえるの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: だから、順番まで証明したわけではないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: それでも、つながりはあるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: そうね。整形を望む人の変化は、医師への調査にも出ているわ。アメリカの顔面形成外科医の学会が、会員に聞いたのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 2021年には、77パーセントの医師が、自撮りでよく見せるために整形を望む患者が増えた、と答えたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 自撮りのために整形するのだ！ 写真が先で、顔が後なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 「写真が先で、顔が後」とは、うまく言ったわね。写真SNSは、見た目の評価を強めて、見た目を変える行動まで広げた。ここまでが、研究で分かっていることよ。
    speaker: めたん
    expression: smile
    pause_after: 0.8
  - text: じゃあ、それがどうやってキャバ嬢の話につながるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ここからは研究ではなくて、研究を材料にした私の推論よ。理由は二つ考えているの。
    speaker: めたん
    expression: explain
    pause_after: 0.9
