- id: 8
  title: 反証の検討
  chapter_title: この説明に、穴はないのか
  narration:
  - text: まず、原因と結果の向きね。SNSがルッキズムを生んだのか。それとも、もともとの傾向を強めただけなのかしら。
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: ディオンの実験は1972年なのだ。SNSより、ずっと前なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: いいところに気づいたわね。偏りそのものは、SNSより前からあった。SNSが生んだというより、もともとの偏りを強めた。そう見るほうが正確ね。
    speaker: めたん
    expression: smile
    pause_after: 0.6
  - text: 次は、ルッキズムの反対側よ。美しい人が好かれやすくなる一方で、誰もが見た目で値踏みされやすくなるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 社会が魅力的だとみなす基準に合わない人は、低く評価されたり、はじかれたりしやすくなる。つまり、受け入れる力と、はじく力が一緒に強まるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.7
  - text: 両方強まるなら、なんでキャバ嬢は受け入れられる側になるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: キャバ嬢は、接客に加えて、見た目の魅力も評価や収入に結びつきやすい仕事でしょう？ 外見が高く評価される時代では、その魅力を持つ人が有利になりやすいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ただ、受け入れられやすくなったのは、まず、見た目や発信で有利な一部の人。キャバ嬢全体への偏見が消えた、とまでは言えないの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 逆に、基準に合わないと言われた人は、前より厳しく見られるのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そう。その話は、最後にもう一度戻るわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 三つ目は、同じものとして扱えない点よ。整形を受け入れることと、性産業を受け入れることは別の問題だから、ひとまとめにするのは乱暴ね。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 確かに、整形は自分の顔の話で、性産業はお客さんがいる仕事の話なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ただ、どちらにも、美や性について個人の選択を認める考え方が広がった影響は見えるわ。そこまでなら言えそうね。
    speaker: めたん
    expression: normal
    pause_after: 0.8
  - text: 弱いところはあるけど、全部まちがいってわけでもないのだ。じゃあ、結局どう答えるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: まとめましょう。冒頭の問いに答える時間よ。
    speaker: めたん
    expression: smile
    pause_after: 0.9
