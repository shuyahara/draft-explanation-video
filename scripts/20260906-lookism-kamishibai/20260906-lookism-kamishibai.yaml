- id: 9
  title: 結び
  chapter_title: null
  narration:
  - text: 結論から言えば、キャバ嬢が以前より受け入れられるようになった理由は、一つではないわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ただ、大きな柱の一つとして、写真中心のSNSが強めた「外見の価値の上昇」があると、私は考えているの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 僕の言葉で整理してみるのだ。まず、きれいな人を見ると、中身までよさそうに感じてしまう。ディオンの実験で出てきた癖なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: しかも美しさは、SNSより前から、賃金に差がつくほど価値を持っていたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: そこへ写真SNSが来て、みんなが見た目をもっと比べるようになった。整形も、「美は手に入れていい」という感覚に変わってきたのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: さらに、自分の名前で発信できる時代と、自分のことは自分で決める考え方も重なった。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.35
  - text: だから、見た目を仕事に生かす人への偏見が弱まったのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: ええ、ちゃんと一本につながったわね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: でも、めたん。さっき「最後にもう一度戻る」って言ってたのだ。はじく力の話なのだ。
    speaker: ずんだもん
    expression: point
    pause_after: 0.45
  - text: そう。忘れてはいけないことよ。同じルッキズムの力は、人を見た目で選別する圧力にもなるの。採用でも、評価でも、SNSのコメントでもね。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 受け入れられた人の裏で、前より厳しく見られてる人がいるのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: だから、受け入れられたという表側だけでなく、その裏で誰が厳しく見られているのかも忘れないこと。私は、それがいちばん大切だと思うわ。
    speaker: めたん
    expression: serious
    pause_after: 0.9
  - text: あの動画、また見るのだ。でも今度は、「きれいだから、いい人」じゃなくて、話の中身を聞くのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: それでいいのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: 見た目で選ばれやすくなった社会は、見た目で落とされやすくなった社会でもあるのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
