    from: 10
    telop: 合図 → ジュース ／ 発火は「合図」の瞬間へ移る
  - type: board
    cut_reason: 【報酬予測誤差】黒板に用語を書く
    from: 18
    telop: 報酬予測誤差 ＝ 予想と現実のズレ
- id: 4
  title: 反転①後半（ベリッジの wanting / liking）
  chapter_title: null
  narration:
  - text: 「欲しい」と「好き」。この二つ、似ているようで、脳の中では別々に処理されているの。その違いを研究してきたのが、ミシガン大学の神経科学者、ケント・ベリッジたちよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 欲しいと好きが、別？ 同じじゃないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 実験で、ラットの脳からドーパミンをほとんど取り除いても、甘いものを「おいしい」と感じる反応は消えなかったの。逆にドーパミン系を強く働かせると、求めにいく行動だけがぐっと増える。好きの度合いは、変わらないのにね。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 好きは変わらないのに、欲しいだけが増えるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: ベリッジはこれを、ウォンティングとライキングに分けたの。ウォンティングは、「欲しくてたまらない」の強さ。ライキングは、味わったときの「いいなあ」の強さ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ドーパミンが強く動かすのは、ウォンティングのほう。予想と現実がズレるたびに、「次も確かめたい」という力が強まるのよ。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: ふむ……。それ、昨夜の僕にも関係あるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 大いにあるわ。これは、依存症の治療でよく聞く言葉と重なるの。「もう楽しくないんです。楽しくないのに、やめられないんです」。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: ……それ、そのまんま、昨夜の僕なのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: そうね。面白いかどうかも分からないのに、親指だけは動いて動画を見てた。あれは、快楽に負けていたわけじゃないのよ。面白さはもう薄れていた。それでも「次が欲しい」という信号だけが、空回りしていたの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: じゃあ、「ドーパミン中毒でバカになった」っていう自虐は、ずれてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 半分は当たっているのよ。ドーパミンが深く関わっているのは、本当。ただ、その言葉が想像させる筋書きが違うの。
    speaker: めたん
    expression: thinking
    pause_after: 0.35
  - text: 「快楽に溺れて、自分がだらしなくなった」という話ではなくて、「楽しくもないのに、欲しいの信号だけが空回りしている」という話。快楽の問題ではなく、予想のズレに反応する仕組みの問題なのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: それに、この仕組みは誰の脳にもあるものよ。ずんだもんの弱さが犯人なわけじゃない。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 溺れてるんじゃなくて、空回りしてるだけなのだ……。でも、「バカになった」のほうは？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: それは別の問いね。次に、確かめましょう。
    speaker: めたん
    expression: smile
    pause_after: 2.0
  beats:
  - type: image
    cut_reason: 【ラットの実験】実験動物の写真
    from: 1
    slot: 1
    credit: 'Photo: Nikolett Emmert / Pexels'
