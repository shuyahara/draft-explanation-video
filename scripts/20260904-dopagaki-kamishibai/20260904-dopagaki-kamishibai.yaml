scenes:
- id: 1
  title: フック（夜ふかしの自白 → 命名 → 問い）
  chapter_title: null
  narration:
  - text: ふぁ……。おはようなのだ、めたん。
    speaker: ずんだもん
    expression: sleepy
    pause_after: 0.4
  - text: おはよう、ずんだもん。……その顔、何時に寝たの。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 寝ようと思ったのは、夜中の1時なのだ。でも、気づいたら2時だったのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 1時間。何をしていたの？
    speaker: めたん
    expression: thinking
    pause_after: 0.4
  - text: ショート動画なのだ。15秒で終わって、次の動画が、勝手に始まるのだ。面白いかどうかは、正直、もう分かってなかったのだ。ただ、親指だけが動いてたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 覚えのある人、多いと思うわ。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: そのとき、コメント欄にこう書いてあったのだ。おれはドパガキだから、集中とか無理。……ずんだもんも、たぶんドパガキなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: ドパガキ。ドーパミン中毒のガキ、という意味のネットスラングね。ショート動画やゲームの強い刺激に慣れて、集中力が続かなくなった人のこと。若い世代が、他人ではなく自分を笑うために使い始めた言葉。
    speaker: めたん
    expression: thinking
    pause_after: 0.4
  - text: 笑えるけど、ちょっと刺さるのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: じゃあ今日は、その言葉をほどいてみましょう。この動画が答えたい問いは、ひとつ。なぜ現代人は、ドパガキになってしまうのか。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 答えは、ずんだもんの脳が弱いから、なのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: 先に言っておくわ。答えは、あなたの脳の弱さの中にはない。犯人は、ポケットの中の画面の、その設計のほう。
    speaker: めたん
    expression: smug
    pause_after: 0.4
  - text: えっ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: それともうひとつ。世間で流通しているドーパミン中毒という説明には、実は大きな間違いが含まれているの。画面の設計と、説明の間違い。今夜は、その二つを、順番にほどいていくわ。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  beats:
  - type: image
    cut_reason: 【夜ふかしの自白】布団の中のスマホの光。冒頭の場面をそのまま見せる
    from: 1
    slot: 1
