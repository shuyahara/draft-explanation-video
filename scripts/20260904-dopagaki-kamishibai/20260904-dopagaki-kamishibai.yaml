- id: 6
  title: 反転②前半（文字批判と読書熱）
  chapter_title: この不安は、いつから続いているのか
  narration:
  - text: 実はね、文字だって、「人をだめにする」と心配されたことがあるの。紀元前4世紀、プラトンの対話篇「パイドロス」に、文字の発明をめぐる、エジプトの神と王の議論が出てくるわ。作中で語られる物語として、ね。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 文字まで心配されてたのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 神は、「文字があれば、記憶も知恵も助けられる」と誇ったの。でも王は、こう答える。文字に頼れば、自分の頭で覚えようとしなくなって、忘れっぽくなる。内側から思い出すのではなく、外側の印に頼るようになる、と。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 文字が、悪者扱いなのだ！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 「新しいメディアが、人の知的な力を弱らせる」という不安は、記録に残る範囲では、文字にまでさかのぼるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 文字がダメなら、何で勉強すればいいのだ……。石板に書いたら、腕のほうが先に音を上げるのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 時代は下って、18世紀の末。今度は、小説が問題にされたの。当時のドイツでは、若者や女性が小説を読みふけることを、「読書熱」、「読書中毒」と呼んで心配した。1795年には、「読書熱は疫病だ」と断じる本まで出たのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 本を読むだけで、中毒や病気扱いなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 当時はこう言われたの。刺激の強い物語に慣れると、感受性が鈍って、義務もおろそかになって、社会まで不安定になる、って。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: あれ。刺激が強い。慣れる。堕落する。……どこかで聞いた筋書きなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 小説がショート動画に替わっただけ。心配する話の型は、二百年前とほとんど同じなのよ。
    speaker: めたん
    expression: smug
    pause_after: 1.0
