- id: 2
  title: 通説の提示（ドーパミン中毒という筋書き）
  chapter_title: null
  narration:
  - text: まずは、よく聞く通説から見てみましょう。「ショート動画やスマホゲームは、刺激が強い。強い刺激を受けると、脳の中でドーパミンという「快楽物質」がたくさん出る」。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: それ、僕も聞いたことあるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 「脳が快楽に慣れると、もっと強い刺激がないと満足できなくなる。最後には薬物依存みたいになって、集中もできなくなる」。そういう筋書きよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: だから、ドーパミン断ちなのだ！ 刺激を断って脳を休ませる、ドーパミンデトックスでリセットするのだ！
    speaker: ずんだもん
    expression: point
    pause_after: 0.4
  - text: よく知ってるわね。この考え方は、世界中に広まっているの。スタンフォード大学の依存症臨床医、アンナ・レンブケが2021年に出した「ドーパミン・ネイション」は、世界的なベストセラーになったわ。SNSにも、デトックスの体験談があふれているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: なるほど。だから「ドーパミンが出すぎて、中毒になったガキ」で、ドパガキなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 話としては、よくできているのよ。原因があって、仕組みがあって、対策まであるでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 完璧なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.4
  - text: ただ、この説明には問題があるの。いちばん最初の前提が、科学的には正しくないのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: ドーパミンは、快楽物質ではない。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: えっ。そこから、なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 1.0
  beats:
  - type: image
    cut_reason: 【通説の筋書き】昼の電車でスマホを見る人々
    from: 1
    slot: 1
    credit: 'Photo: Muhamad Guruh Budi Hartono / Pexels'
  - type: image
    cut_reason: 【世界的な広がり】書影（実物）を貼る
    from: 10
    slot: 2
    credit: 'Book cover: Dopamine Nation, Anna Lembke (Dutton, 2021)'
    telop: Anna Lembke『Dopamine Nation』2021
  - type: image
    cut_reason: 【デトックス】スマホを引き出しにしまう手
    from: 15
    slot: 3
    credit: 'Photo: Eren Li / Pexels'
  - type: board
    cut_reason: 【決め文】写真をはずして間。反転の一撃
    from: 19
    telop: ドーパミン ≠ 快楽物質
- id: 3
  title: 反転①前半（シュルツの報酬予測誤差）
  chapter_title: ドーパミンは、快楽の物質なのか
  narration:
  - text: 1997年に、ケンブリッジ大学の神経科学者、ウォルフラム・シュルツたちが、科学誌サイエンスで、ある実験を発表したの。サルの脳で、ドーパミン神経の動きを、ひとつずつ記録したのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: サルの脳の動きを、直接記録したのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: そう。サルにジュースをあげると、ドーパミン神経はたしかに強く動く。これを「発火」と呼ぶの。ここまでは、快楽物質のイメージどおりでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: ジュースは嬉しいのだ。ずんだ味なら、もっと発火しそうなのだ。
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.4
  - text: でもね。光の合図のあとに必ずジュースが出る、と学習させると、変なことが起きるの。ジュースをもらった瞬間の発火が、消えてしまう。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 消えるのだ？ ジュースは、ちゃんともらってるのに？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 代わりに、合図の瞬間に発火するようになる。それで、合図があったのにジュースが出ないと、今度はドーパミン神経の動きが、むしろ沈み込むの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: ……つまりこの神経は、気持ちよさの量を測ってるんじゃないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: そのとおり。見ているのは、予想と現実のズレ。予想より良ければ発火、予想どおりなら静か、予想より悪ければ落ち込む。研究者たちはこれを、報酬予測誤差と呼ぶの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 名前は難しいのに、やってることは「あれ、次は？」なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: いい言い方ね。ドーパミンは、快楽そのものというより、「次はどうなる？」の答え合わせをする信号なのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: でも、快楽そのものじゃないなら、僕がやめられないあの感じは、いったい何なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.0
  readings:
  - surface: 報酬予測誤差
    reading: ホウシュウヨソクゴサ
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: image
    cut_reason: 【1997年の実験】脳波キャップを付けた被験者の後ろ姿（脳の実験と一目で分かる絵）
    from: 1
