- id: 8
  title: 反証の検討（何かは起きている。しかし）
  chapter_title: 本当に、何も起きていないのか
  narration:
  - text: ここまで聞いて、なんだ、今回もただのパニックか、と思ったかもしれない。でも、この動画は、そこで終わるわけにはいかないの。今回は、無視できないデータも存在するから。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: 無視できないデータ、なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: グリフィス大学のグエンらの研究チームは2025年、たくさんの研究結果をまとめて分析する、メタ分析という手法の結果を、心理学の主要誌に発表した。対象は、ショート動画と心の状態についての71の研究、のべおよそ9万8千人分。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 9万8千人。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 結論はこう。ショート動画の利用が多い人ほど、注意力や、衝動を抑える力が低く、不安や抑うつも強い傾向がある。関連の強さは中程度。無視できる大きさではないが、すべてを説明するほど強くもない。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: ……やっぱり、ずんだもんは。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: まだ結論を急がないで。学力の側にも、動きはあるの。日本は3位に上がったと言ったけど、OECD全体の平均点は、2022年の調査で大きく下がった。しかも、この低下はコロナ禍の前から始まっていたと、OECD自身が分析している。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: プラットフォームの内側からも、声が出ている。2021年、フェイスブックの元社員フランシス・ハウゲンが、内部文書を持って議会で証言した。表示する内容を自動で選ぶ仕組み、アルゴリズムが10代の心の健康を害しうると、会社は社内調査で知っていた、と。SNS全般の話で、ショート動画そのものの証拠ではないけれど。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: じゃあ、何も起きていない、とは言えないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: そう。ただし、よ。さきほどのメタ分析の研究チーム自身が、はっきり書いていることがある。これらの大半は、ある一時点の相関を見た研究であって、ショート動画のせいで注意力が下がったのか、もともと注意や気分に課題のある人がショート動画に引き寄せられるのか、方向は決められない、と。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 卵が先か、ニワトリが先か、なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: もうひとつ、規模の感覚をつかむための数字があるの。オックスフォード大学のオーベンとプシビルスキが、35万人分のデータを解析した研究。対象はショート動画に限らない、デジタル機器の利用全般だから直接の比較ではないけれど、それが若者の幸福度に与える影響は、あったとしても、幸福度の変動のわずか0.4パーセントほどだった。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 0.4パーセント……。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: ここで一度、整理するわ。関連は、ある。因果の方向は、決められない。規模は、大きいとは言えない。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: ある、決められない、大きくない。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 何かは、起きている。しかし、若者の脳が壊れた、という強い物語を支えるほどの証拠は、今回も、まだ見つかっていない。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: じゃあ、めたん。本当の原因は、どこにあるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.0
