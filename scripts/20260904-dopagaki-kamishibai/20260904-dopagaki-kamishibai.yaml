scenes:
- id: 1
  title: フック（夜ふかしの自白 → 命名 → 問い）
  chapter_title: null
  narration:
  - text: ふぁ……。おはようなのだ、めたん。
    speaker: ずんだもん
    expression: sleepy
    pause_after: 0.45
  - text: おはよう、ずんだもん。……その顔、何時に寝たのかしら。
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: 寝ようと思ったのは夜中の12時なのだ。でも、気づいたら3時だったのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 3時間も。何をしていたの？
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: ショート動画を見ていたのだ。すぐ終わるのに、次が勝手に始まるから、延々と見ちゃうのだ〜。「あと一個だけ」が、百個くらいあったのだ……。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: なるほどね。一度見始めると、止まらないわよね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: そういえば、この前「ドパガキ」という言葉を見たのだ。僕もたぶんドパガキなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ドパガキ。「ドーパミン中毒のガキ」を縮めたネットスラングね。強い刺激に慣れて、集中が続かないことを揶揄した言葉ね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 笑えるけど、ちょっと刺さるのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: じゃあ今日は、その言葉を紐解いてみましょう。「なぜ現代人は、ドパガキになってしまうのか」について解説してあげるわ。
    speaker: めたん
    expression: smug
    pause_after: 0.45
  - text: 答えは……僕の脳が弱いせいなのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 先に言っておくわ。ずんだもんの脳が弱いせいじゃないの。犯人は、ずんだもんが持っているスマホ。その中の設計のほうよ。
    speaker: めたん
    expression: serious
    pause_after: 0.55
  - text: えっ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: それともうひとつ。「ドーパミン中毒」っていう説明にも、大きな勘違いが混じっているの。画面の設計と、その勘違い。この二つを順番に紐解いていきましょう。
    speaker: めたん
    expression: explain
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【夜ふかしの自白】ベッドで横になりスマホを見る人。枕元の明かり。冒頭の場面をそのまま見せる
    from: 1
    slot: 1
    credit: 'Photo: cottonbro studio / Pexels'
