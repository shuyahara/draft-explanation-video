    from: 28
    telop: 「溺れている」のではなく「空回りしている」
- id: 5
  title: 「47秒」の誤読（グロリア・マーク）
  chapter_title: null
  narration:
  - text: でも、めたん。実際、集中できなくなってる気はするのだ。現代人の集中力は47秒しか続かないって、聞いたことがあるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: その数字、ちゃんとした出どころがあるのよ。カリフォルニア大学アーバイン校のグロリア・マークは、20年以上、働く人がパソコンの画面をどれくらいで切り替えるか、調べてきたの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: マーク自身の振り返りだと、2004年には、ひとつの画面に向かう時間が、平均でおよそ2分半あったそうよ。それが近年では、平均47秒になっているのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 2分半が、47秒に！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 平均値だけじゃないわ。真ん中の値、中央値で見ても、40秒なの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 僕も、今日もう何回画面を切り替えたか、数えたくないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.35
  - text: 数え始めたら、その回数ぶん、また画面を切り替えそうなのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.4
  - text: たしかに、画面の前での私たちは、どんどんせわしなくなっているわ。ただ、この数字は、正確に受け取る必要があるの。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: どういうことなのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: ここで測っているのは、別の画面へ切り替えるまでの時間。「人間の脳は47秒しか集中できない」と結論付けられるわけじゃないのよ。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: あ。僕も、好きな映画なら2時間見続けられるのだ。面白い本なら、1時間は読めるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: そう。集中する力そのものが、みんな47秒になったわけじゃない。変わったと分かるのは、画面の前での行動のほうよ。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 僕の脳、壊れてないのだ。
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.4
  - text: 少なくともこの数字だけでは、「脳が壊れた」証拠にはならないわ。……それでも、どうして私たちは、「若者の脳が壊れた」という話を信じたくなるのかしら。
    speaker: めたん
    expression: thinking
    pause_after: 0.4
  - text: 言われてみれば、どうしてなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 実はね、この不安には、長い長い前例があるの。
    speaker: めたん
    expression: smug
    pause_after: 0.4
  - text: ショート動画にも、前例があるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: もっと前よ。「新しいものが人をだめにする」という不安なら、二千年以上前からあるの。
    speaker: めたん
    expression: normal
    pause_after: 1.0
  beats:
