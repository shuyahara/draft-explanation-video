- id: 7
  title: 反転②後半（ワーサムの捏造・日本の学力パニック・モラルパニック）
  chapter_title: null
  narration:
  - text: 20世紀には、この不安が、データまで伴って社会を大きく動かした例があるの。1954年、アメリカの精神科医、フレドリック・ワーサムが、「漫画は少年犯罪の温床だ」と告発する本を出したわ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 漫画と少年犯罪が、結び付けられたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 根拠にされたのは、彼が診てきた非行少年たちの臨床データ。世論は沸騰して、上院では公聴会まで開かれたの。その年のうちに出版社は続々と廃業して、業界は、自主規制の検閲機関を作らされたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: でも、データ付きなら、本当だったんじゃないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: この話には、後日談があるの。2012年、イリノイ大学の図書館情報学者、キャロル・ティリーが、公開された研究資料を詳しく調べた。すると、臨床データには改変や誇張があって、一部は捏造だったと分かったのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: 捏造！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 子供の年齢は書き換えられ、発言は歪められ、家庭環境という別の要因は無視されていた。社会を動かしたパニックの土台は、信用できるものじゃなかったの。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: ひどい話なのだ。
    speaker: ずんだもん
    expression: angry
    pause_after: 0.4
  - text: 日本にも、似た繰り返しがあるわ。2004年、OECDの国際学力調査で、日本の読解力の順位が8位から14位に下がったの。学力低下だと大騒ぎになって、ゆとり教育が戦犯にされた。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: ゆとり教育が全部悪い、で話は終わったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 2012年には4位まで戻った。教育政策を変えた効果もあったのかもしれない。ところが2018年に、また15位まで落ちたの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: また落ちたのだ？ 今度は何が犯人にされたのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: スマホと、読書離れ。そして2022年、今度は3位に上がった。このときは、誰も「スマホのおかげ」とは言わなかったわね。
    speaker: めたん
    expression: smug
    pause_after: 0.35
  - text: 順位は、調査のやり方や参加国の数でも動くもの。でも落ちるたびに犯人が用意されて、上がると忘れられる。この型のほうが、問題なのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: こういう繰り返しには、社会学の名前があるの。モラルパニック。1972年に、社会学者スタンリー・コーエンが名付けた言葉よ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: モラル、パニック。……みんなで慌てる、って感じなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 近いわ。何かを社会の脅威として祭り上げて、メディアがあおって、世論が恐れて、規制まで動く。若者の新しい楽しみは、いつの時代も、その標的になりやすかったの。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 文字、小説、漫画、そしてショート動画。……じゃあ今回もまた、ただの騒ぎなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: ただ、そうも言い切れないところもあるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
