- id: 9
  title: 真因（wanting を突く設計）
  chapter_title: わたしたちは、何に負けているのか
  narration:
  - text: やめられなさを考える手がかりは、さっきのウォンティングよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 1950年代、ハーバード大学の心理学者スキナーは、ハトやネズミでこんな実験をしたの。どんな報酬の出し方なら、行動がいちばん止まらなくなるのか。答えは、毎回エサが出るレバーでも、決まった回数で出るレバーでもなかったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ、どんなレバーなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 何回押せば出るか分からないレバー。報酬が予測できないと、動物はいちばん速く、いちばんしつこくレバーを押し続ける。報酬が止まっても、なかなかやめないの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 出ないのに、押し続けるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そう。これを可変比率強化と呼ぶわ。スロットマシンが人を離さない理由を説明するときに、長く使われてきた仕組みよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 何回引けば当たるか分からない……ガチャなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: いい例ね。思い出して。ドーパミンは、予想と現実のズレに反応する信号だった。次に何が出るか分からないと、予想が外れやすいでしょう。するとこの信号が鳴りやすくなって、「次を確かめたい」が止まりにくくなるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 面白いからじゃなくて、「次は当たりかも」で、指が動いてたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ずんだもんのスマホで、おすすめ動画が次々に並ぶフィードにも、似たところがあるわ。スロットとまったく同じ機械、とは言わないわ。でも指で払うたびに、次に何が出るか分からない。当たりの動画もあれば、外れもある。何回めくれば当たりが出るか、分かる？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 分からないのだ。「あと一回だけ」がいちばん信用できないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: その一回だけ、昨日から何回目かしら。……誰にも分からないわ。それはそう設計されているからなのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 2023年には、ブリティッシュコロンビア大学でギャンブルを研究するクラークたちも、こう論じているわ。報酬の予測できなさは、ギャンブルだけでなく、SNSなどへの依存的な行動にも共通する条件になりうる、とね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: しかもスマホの画面は、やめるきっかけになる「段差」まで減らしているの。ページの終わりは無限スクロールで消えて、動画の切れ目も自動再生で埋まる。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: やめられないように、設計されてるのだ……。
    speaker: ずんだもん
    expression: angry
    pause_after: 0.45
  - text: 無限スクロールを考案したと話すデザイナー、アザ・ラスキンは後になって、その設計を公の場で悔いているわ。使いやすくすることが、人にとっての最善とは限らなかった、と。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 僕は、自分の脳が壊れたと思ってたのだ。悪いのは脳じゃなくて、画面設計の方なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: その通り。少なくとも、脳が弱いからだけじゃないわ。ずんだもんが見ていたショート動画は、動物の行動実験と、欲求の神経科学が突き止めた急所を、正確に突いてくる装置なのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
