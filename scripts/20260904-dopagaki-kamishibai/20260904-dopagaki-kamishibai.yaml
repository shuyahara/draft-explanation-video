- id: 10
  title: 結論（問いに答え、冒頭に戻る）
  chapter_title: null
  narration:
  - text: 最初の問いに、答えを出しましょう。なぜ現代人は、ドパガキになってしまうのか。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 聞かせてほしいのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 現代人の脳が弱くなったからではないし、ドーパミンの快楽に溺れているからでもないわ。「欲しい」を生む脳の仕組みは、大昔から変わっていない。はっきり変わったと言えるのは、環境のほう。予測できない報酬を無限に流して、やめる段差まで取り除いた画面が、ポケットに入ってしまったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ずんだもんの脳が弱くなったんじゃないのよ。相手の方が強くなったのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: ……僕、ドパガキじゃなかったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 「ドパガキ」という言葉そのものも、少し疑ってほしいの。この言葉は、原因を個人の脳に、しかも若者に置いてしまうでしょう。でも、ドーパミン中毒という説明は、科学的に正確じゃない。若者が堕落したという物語も、二千年以上、繰り返されては崩れてきた。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: それに、47秒の話は、働く大人の計測だったのだ。せわしなくなってるのは、若者だけじゃないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: そう。少なくともあの調査は、仕事中の大人が画面を切り替える時間を測ったものよ。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: じゃあ、どうすればいいのだ？ 気合いで我慢するのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 方向はひとつだけ覚えておけばいいわ。意志の力だけで、刺激に勝とうとしないこと。段差を、自分の側に戻すこと。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 段差を、戻す。どういうことなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 通知をひとつ切る。アプリを、ホーム画面の奥にしまう。画面設計や仕組みの方から変えていくのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: スマホは、寝室の外で充電するのだ。目覚まし時計を、再雇用するのだ。
    speaker: ずんだもん
    expression: point
    pause_after: 0.4
  - text: そのとおり。設計されたものには、こっちも設計で返す。それだけで、勝負の場所が変わるの。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: ホーム画面の奥は、僕にとって、ほぼ異界なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.35
  - text: でも、今夜もまた、寝ようと思ったあとで、親指が動き出すかもしれないのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: そのときは、自分を責める前に、思い出して。あなたは、中毒のガキなんかじゃないわ。二千年前から続く古い不安と、最新の設計のあいだで、それでも自分の時間を取り返そうとしている、ふつうの人間なのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: ……今夜は、スマホを居間で充電するのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.4
  - text: おやすみ、ずんだもん。
    speaker: めたん
    expression: smile
    pause_after: 1.0
