- id: 8
  title: 反証の検討（何かは起きている。しかし）
  chapter_title: 本当に、何も起きていないのか
  narration:
  - text: ここまでだと、「今回もただのパニックじゃないの？」と思うわよね。でも、そう片づけられないデータもあるの。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: じゃあ、ショート動画に問題がないとも、言えないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: グリフィス大学のグエンたちの研究チームは2025年、メタ分析の結果を、心理学の主要誌に発表したの。ショート動画と心の状態を調べた71の研究、のべおよそ9万8千人分をまとめた分析よ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 9万8千人！すごいのだ。
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.4
  - text: 結論はこう。ショート動画をよく使う人ほど、注意力や、衝動を抑える力が低くて、不安や抑うつも強い傾向があった。関連の強さは中程度。無視できるほど小さくはないけれど、これだけですべてを説明できるほど強くもないわ。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: ……やっぱり、僕の集中力は落ちてるのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: まだ結論を急がないで。学力についても、気になる動きはあるの。日本は3位に上がったけれど、OECD全体の平均点は、2022年に大きく下がった。しかもこの低下は、コロナ禍の前から始まっていたと、OECD自身が分析しているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: プラットフォームの内側からも、警告は出ている。2021年、フェイスブックの元社員、フランシス・ハウゲンが、内部文書を持って議会で証言したの。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: 会社の中にいた人が、告発したのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: そう。表示する内容を自動で選ぶ仕組み、アルゴリズムが10代の心の健康を害しうると、会社は社内調査で知っていた、という内容よ。SNS全般の話で、ショート動画そのものの証拠ではないけれどね。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: じゃあ、何も起きていない、とは言えないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: そう。ただし、ここが大事よ。さっきのメタ分析の研究チーム自身が、はっきり書いていることがあるの。これらの大半は、ある一時点の関連を見た研究。ショート動画のせいで注意力が下がったのか、もともと注意や気分に課題のある人が、ショート動画に引き寄せられたのか。その向きまでは、決められないと。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 卵が先か、ニワトリが先か、なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: もうひとつ、規模を考える手がかりがあるわ。オックスフォード大学のオーベンとプシビルスキは、35万人分のデータを解析したの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 35万人！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: ショート動画に限らない、デジタル機器全般の研究だから、直接は比べられないわ。それでも、若者の幸福度への影響は、あったとしても、変動のわずか0.4パーセントほどだったの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 0.4パーセント……。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: ここで一度整理するわ。関連は、ある。でも、因果の向きは、決められない。規模も、大きいとは言えないのよ。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: つまり、怪しいところはある。でも「全部お前のせいなのだ！」と逮捕できる証拠では、ないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 何かは起きているわ。でも、若者の脳が壊れた、という強い物語を支えるほどの証拠は、今回もまだ見つかっていないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: じゃあ、めたん。本当の原因は、どこにあるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.0
