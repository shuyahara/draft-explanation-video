    credit: 'Photo: cottonbro studio / Pexels'
- id: 5
  title: 「47秒」の誤読（グロリア・マーク）
  chapter_title: null
  narration:
  - text: でも、めたん。理屈はどうあれ、実際に集中力は落ちてるのだ。現代人の集中力は、47秒しか続かないって聞いたのだ。
    speaker: ずんだもん
    expression: angry
    pause_after: 0.4
  - text: その数字、ちゃんとした出どころがあるのよ。カリフォルニア大学アーバイン校のグロリア・マークは、20年以上にわたって、働く人がパソコンの画面をどれくらいで切り替えるかを計測し続けてきた。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: マーク自身の振り返りによれば、2004年の調査では、人がひとつの画面に向かう時間は、平均でおよそ2分半あった。それが近年の計測では、平均47秒。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 2分半が、47秒。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 平均は極端な人に引っ張られるから、全体のちょうど真ん中の人、中央値で見ても、40秒。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: ずんだもん、今日もう何回画面を切り替えたか、数えたくないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 確かに、画面の上の私たちは、どんどんせわしなくなっている。ただし、この数字の意味は、正確に受け取る必要があるの。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: どういうことなのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 計測されているのは、ひとつの画面から別の画面へ切り替えるまでの時間。人間の脳が47秒しか集中できなくなった、という測定ではないの。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: あ。ずんだもん、好きな映画なら2時間見続けられるのだ。面白い本なら1時間読めるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: そう。集中する力そのものが、一律に47秒へ縮んだわけじゃない。測られているのは、脳の性能ではなく、画面の前での行動の変化。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: ずんだもんの脳、壊れてないのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.4
  - text: 少なくとも、この数字は、脳が壊れた証拠にはなっていない。……それなのに、なぜ私たちは、若者の脳が壊れた、という話にこれほど説得力を感じてしまうのかしら。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 言われてみれば、なんでなのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 実はこの不安には、長い長い前例があるの。
    speaker: めたん
    expression: smug
    pause_after: 0.4
  - text: 前例？ ショート動画に、なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: もっと前。二千年以上前から。
    speaker: めたん
    expression: normal
    pause_after: 1.0
  beats:
  - type: image
    cut_reason: 【47秒】複数ウィンドウを行き来するオフィスの手元
    from: 1
    slot: 1
    credit: 'Photo: Christina Morillo / Pexels'
