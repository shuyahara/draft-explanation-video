- id: 10
  title: 結論（問いに答え、冒頭に戻る）
  chapter_title: null
  narration:
  - text: 冒頭の問いに、答えを出しましょう。なぜ現代人は、ドパガキになってしまうのか。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 聞かせてほしいのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: それは、現代人の脳が弱くなったからでも、ドーパミンの快楽に溺れているからでもない。欲しい、を作り出す脳の仕組みは、大昔から変わっていない。はっきり変わったと言えるのは、環境の側。予測できない報酬を無限に流し込み、やめる段差を取り除いた画面が、ポケットの中に入った。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 弱くなったのは、あなたじゃない。強くなったのは、相手のほう。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: ……ずんだもん、ドパガキじゃなかったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: その言葉そのものも、少しだけ疑ってほしいの。ドパガキという言葉は、原因を個人の脳に置き、しかも、若者に置く。でも、見てきたとおり。ドーパミン中毒という説明は科学的に不正確で、若者が堕落したという物語は、二千年以上前から、繰り返されては崩れてきた。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: それに、47秒の話は、働く大人の計測だったのだ。画面の前でせわしなくなってるのは、若者だけじゃないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: そう。統計を見る限り、ね。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: じゃあ、どうすればいいのだ？ 気合いで我慢するのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 方向はひとつだけ、覚えておけばいいわ。意志の力で刺激と殴り合わないこと。段差を、自分の側に戻すこと。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 段差を、戻す。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 通知をひとつ切る。アプリをホーム画面の奥にしまう。スマホを寝室の外で充電する。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 設計されたものには、設計で返す、なのだ。
    speaker: ずんだもん
    expression: point
    pause_after: 0.4
  - text: それだけで、勝負の場所が変わるの。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: でも、今夜もまた、寝ようと思ったあとで親指が動き出すかもしれないのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: そのときは、自分を責める代わりに、思い出して。あなたは、中毒のガキなんかじゃない。二千年前から続く古い不安と、最新の設計とに挟まれながら、それでも自分の時間を取り返そうとしている、ふつうの人間。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: ……今夜は、スマホを居間で充電するのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.4
  - text: おやすみ、ずんだもん。
    speaker: めたん
    expression: smile
