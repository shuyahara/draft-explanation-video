- id: 6
  title: 反転②前半（文字批判と読書熱）
  chapter_title: この不安は、いつから続いているのか
  narration:
  - text: 紀元前4世紀。プラトンが書いた対話篇、パイドロスに、こんな場面があるの。作中で語られる物語として、文字の発明をめぐって、エジプトの神と王が議論する。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 文字の発明、なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 文字は記憶と知恵の秘薬になる、と誇る神に、王はこう答える。これを学んだ者は、記憶の訓練をしなくなり、魂に忘却が生まれるだろう。自分の内側から思い出すのではなく、外側の印に頼るようになるからだ、と。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 文字が、悪者扱いなのだ！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 新しいメディアが、人間の知的な力を衰えさせる。この不安の、記録に残る最も古い標的は、文字そのものだった。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 文字がダメなら、何で勉強すればいいのだ……。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 時代は下って、18世紀の末。今度は、小説がやり玉に挙がった。当時のドイツでは、若者や女性が小説を読みふけることが、読書熱、読書中毒と呼ばれ、社会問題として真剣に論じられたの。1795年には、読書熱は疫病だ、と断じる本まで出ている。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: 読書中毒……。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 刺激の強い物語が感受性を鈍らせ、義務を怠らせ、社会を不安定にする、と。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: あれ。刺激が強い。慣れる。堕落する。……どこかで聞いた筋書きなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 対象が小説からショート動画に変わっただけ。文法は二百年前と、ほとんど同じ。
    speaker: めたん
    expression: smug
    pause_after: 1.0
