- id: 9
  title: 真因（wanting を突く設計）
  chapter_title: わたしたちは、何に負けているのか
  narration:
  - text: 鍵は、さきほどのウォンティングに戻るの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 1950年代、ハーバード大学の心理学者スキナーは、ハトやネズミの実験で、行動が最も止まらなくなる報酬の与え方を突き止めていた。毎回エサが出るレバーでも、決まった回数で出るレバーでもない。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: じゃあ、どんなレバーなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 何回押せば出るか分からないレバー。報酬が予測できないとき、動物は最も速く、最も執拗にレバーを押し続ける。そして報酬が止まっても、なかなかやめない。可変比率強化と呼ばれるこの仕組みは、スロットマシンが人を離さない理由の説明として、長く使われてきた。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 何回引けば当たるか分からない……ガチャなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: いい例ね。思い出して。ドーパミンは、予想と現実のズレに反応する信号だった。次に何が出るか分からない構造では、当たりも外れも、毎回予想とズレる。だからこの信号が鳴りやすく、次を確かめる行動が止まりにくいの。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: 確かめたくなるのが、止まらないのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: そして、あなたのスマホの画面。スロットとまったく同じ機械だとは言わない。でも、指で払うたびに、次に何が出るか分からないフィード。当たりの動画もあれば、外れもある。予測できない当たりが繰り返しを促す点は、共通している。何回めくれば当たりが出るか、ずんだもんに分かる？
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 分からないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 誰にも分からない。そう設計されているから。ブリティッシュコロンビア大学でギャンブルを研究するクラークらは2023年、こうした報酬の変動性が、ギャンブルだけでなく、SNSなどのデジタル製品への依存的な行動にも共通する条件になりうる、と論じている。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: しかもこの機械からは、やめるための段差が、ていねいに取り除かれているの。ページの終わりは無限スクロールで消され、動画の切れ目は自動再生で埋められた。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 段差を、取り除いた。……つまり、わざとなのだ。
    speaker: ずんだもん
    expression: angry
    pause_after: 0.4
  - text: 無限スクロールを考案したと語るデザイナー、アザ・ラスキンは、後年、その設計を公の場で悔いている。使いやすさの最適化が、人にとっての最善とは限らなかった、と。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: ずんだもんは、負けたのは自分の脳だと思ってたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: ドパガキという言葉は、その前提に立っている。だけど、あなたの目の前にあるのは、動物の行動実験と、欲求の神経科学が突き止めた急所を、正確に突いてくる画面なの。
    speaker: めたん
    expression: serious
    pause_after: 2.0
