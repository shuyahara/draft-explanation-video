- id: 2
  title: 通説の提示（ドーパミン中毒という筋書き）
  chapter_title: null
  narration:
  - text: まず、いま世間に流通している説明を確認しておきましょう。筋書きは、だいたいこう。ショート動画やスマホゲームは、刺激が強い。強い刺激を受けると、脳の中でドーパミンという快楽物質が大量に出る。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: それ、ずんだもんも聞いたことあるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 脳が快楽に慣れると、より強い刺激がないと満足できなくなる。こうして脳は薬物依存に似た状態になり、集中力が壊れていく。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: だから、ドーパミン断ち。刺激を断って脳を休ませる、ドーパミンデトックスで脳をリセットしよう、なのだ！
    speaker: ずんだもん
    expression: point
    pause_after: 0.4
  - text: よく知ってるわね。この筋書きは、世界的に広まっているの。スタンフォード大学の依存症臨床医、アンナ・レンブケが2021年に出した本、ドーパミン・ネイションは世界的なベストセラーになった。SNSには、デトックスの体験談があふれている。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: ドパガキって言葉も、この筋書きが土台なのだ。ドーパミンが出すぎて、中毒になったガキ、なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 筋書きとしては、よくできている。原因があり、メカニズムがあり、対策まである。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 完璧なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.4
  - text: ただ、この説明には問題があるの。出発点の一文が、すでに科学的には正しくない。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: ドーパミンは、快楽物質ではない。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: えっ。そこから、なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 1.0
  beats:
  - type: image
    cut_reason: 【通説の筋書き】昼の電車でスマホを見る人々
    from: 1
    slot: 1
    credit: 'Photo: Muhamad Guruh Budi Hartono / Pexels'
  - type: image
    cut_reason: 【世界的な広がり】書影（実物）を貼る
    from: 10
    slot: 2
    credit: 'Book cover: Dopamine Nation, Anna Lembke (Dutton, 2021)'
    telop: Anna Lembke『Dopamine Nation』2021
  - type: image
    cut_reason: 【デトックス】スマホを離れた場所に置く
    from: 14
    slot: 3
    credit: 'Photo: Barbara Olsen / Pexels'
  - type: board
    cut_reason: 【決め文】写真をはずして間。反転の一撃
    from: 19
    telop: ドーパミン ≠ 快楽物質
- id: 3
  title: 反転①前半（シュルツの報酬予測誤差）
  chapter_title: ドーパミンは、快楽の物質なのか
  narration:
  - text: 1997年のこと。ケンブリッジ大学の神経科学者、ウォルフラム・シュルツらが、科学誌サイエンスに、ある実験の結果を発表したの。サルの脳で、ドーパミン神経の活動を、ひとつずつ記録した実験。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: サルの脳を、直接なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: サルにジュースを与えると、ドーパミン神経は確かに活動を強める。これを、発火と呼ぶ。ここまでは、快楽物質のイメージ通り。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: ジュースは嬉しいのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.4
  - text: ところが。光の合図のあとに必ずジュースが出る、と学習させると、奇妙なことが起きる。ジュースをもらった瞬間の発火が、消えるの。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: 消える？ ジュースはもらってるのに、なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 代わりに、合図の瞬間に発火するようになる。そして、合図があったのにジュースが出ないと、ドーパミン神経の活動は、むしろ沈み込む。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: ……つまりこの神経は、気持ちよさの量を測ってるんじゃないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: そのとおり。伝えているのは、予想と現実のズレ。予想より良ければ発火し、予想通りなら沈黙し、予想より悪ければ落ち込む。研究者たちはこれを、報酬予測誤差と呼ぶの。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: 報酬、予測、誤差。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: ドーパミンは、快楽を運ぶ物質というより、次はどうなる、という予測の答え合わせをする信号なのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: でも、快楽じゃないなら。ずんだもんがやめられない、あの感じは、いったい何なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.0
  readings:
  - surface: 報酬予測誤差
    reading: ホウシュウヨソクゴサ
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: image
    cut_reason: 【1997年の実験】研究室でモニターに向かう研究者
    from: 1
