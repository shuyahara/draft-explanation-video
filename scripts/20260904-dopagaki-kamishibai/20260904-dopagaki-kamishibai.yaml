    credit: 'Photo: Tima Miroshnichenko / Pexels'
    telop: Schultz et al., Science (1997)
  - type: board
    cut_reason: 【奇妙なこと】写真をはずし、実験の核心（合図→ジュース、発火の移動）をチョークで示す
    from: 9
    telop: 合図 → ジュース ／ 発火は「合図」の瞬間へ移る
  - type: board
    cut_reason: 【報酬予測誤差】黒板に用語を書く
    from: 17
    telop: 報酬予測誤差 ＝ 予想と現実のズレ
- id: 4
  title: 反転①後半（ベリッジの wanting / liking）
  chapter_title: null
  narration:
  - text: 欲しい、と、好き。この二つは同じもののように見えて、脳の中では別々に処理されているの。そう実証してきたのが、ミシガン大学の神経科学者ケント・ベリッジの研究室。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 欲しいと好きが、別？ 同じじゃないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 実験で、ラットの脳からドーパミンをほとんど取り除いても、甘い味への、おいしい、という反応は消えなかった。逆にドーパミン系を強く働かせると、対象を求める行動だけが跳ね上がる。好きの度合いは、変わらないのに。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 好きは変わらないのに、欲しいだけが増えるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: ベリッジはこの二つを、ウォンティングとライキングと呼び分けた。ウォンティングは、欲しくてたまらない、という欲求の強さ。ライキングは、実際に味わったときの、いいなあ、という快感の強さ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ドーパミンが強く動かしているのは、ウォンティングの側。さきほどの、予測の答え合わせをする信号が強く鳴るほど、次を求める力も強まる。つまりあの信号は、快感を作る回路ではなく、次を求める力の側で働いている。
    speaker: めたん
    expression: point
    pause_after: 0.4
  - text: ふむ……。それ、昨夜のずんだもんにも関係あるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: 大いにあるわ。この区別は、依存症の治療の場で、患者がしばしば口にする言葉と重なるの。もう楽しくないんです。楽しくないのに、やめられないんです。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: ……それ、そのまんま、昨夜のずんだもんなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.4
  - text: そうね。面白いかどうか、もう分かっていないのに、親指だけが動いていた。あれは、快楽に負けている状態じゃない。快楽はとっくに薄れているのに、欲しい、という信号だけが空回りし続けている状態。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: じゃあ、ドーパミン中毒でバカになった、っていう自虐は。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: 言葉の使い方として、すでにずれているの。
    speaker: めたん
    expression: normal
    pause_after: 1.0
  beats:
  - type: image
    cut_reason: 【ラットの実験】実験動物の写真
    from: 1
    slot: 1
    credit: 'Photo: Nikolett Emmert / Pexels'
    telop: Berridge & Robinson (2016)
  - type: board
    cut_reason: 【二つの言葉】黒板に wanting / liking
    from: 10
    telop: wanting（欲しい）／ liking（好き）
  - type: image
    cut_reason: 【冒頭の再演】昨夜のずんだもん＝冒頭の写真を再掲
    from: 22
