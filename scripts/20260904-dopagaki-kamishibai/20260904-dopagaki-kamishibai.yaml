- id: 7
  title: 反転②後半（ワーサムの捏造・日本の学力パニック・モラルパニック）
  chapter_title: null
  narration:
  - text: そして20世紀には、この不安がデータ付きで社会を動かした事件があるの。1954年、アメリカの精神科医フレドリック・ワーサムが、漫画は少年犯罪の温床だ、と告発する本を出版した。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 漫画、なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 根拠は、彼が診てきた非行少年たちの臨床データ。世論は沸騰し、上院で公聴会が開かれ、その年のうちに出版社が続々と廃業した。業界は、自主規制の検閲機関を作らされた。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: でも、データ付きなら、本当だったんじゃないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.4
  - text: この話には、後日談があるの。2012年、イリノイ大学の図書館情報学者キャロル・ティリーが、公開されたワーサムの研究資料を精査した。そして、根拠とされた臨床データが、改変され、誇張され、一部は捏造されていたことを突き止めた。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: 捏造！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 子供の年齢は書き換えられ、発言は歪められ、家庭環境という別の要因は無視されていた。社会を動かしたパニックの土台は、偽物だったの。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: ひどいのだ。
    speaker: ずんだもん
    expression: angry
    pause_after: 0.4
  - text: 日本にも、覚えがあるわ。2004年、OECDの国際学力調査で日本の読解力の順位が8位から14位に急落し、学力低下と活字離れが大騒ぎになった。ゆとり教育が戦犯とされ、教育政策は転換された。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: それは聞いたことあるのだ。で、その後どうなったのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.4
  - text: 同じ調査で、日本の読解力は回復を続け、2022年には、81の国と地域の中で3位。
    speaker: めたん
    expression: smile
    pause_after: 0.4
  - text: 3位！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.4
  - text: 順位は参加国の数にも左右されるから、慎重に言うわ。少なくとも日本では、若者の読む力が下がり続けている、という単純な物語は、データのほうが裏切ったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 社会学には、この繰り返しを指す言葉がある。モラルパニック。1972年に、社会学者スタンリー・コーエンが名付けた。何かが社会への脅威として祭り上げられ、メディアが誇張し、世論が恐れ、規制が動く。若者の新しい楽しみは、いつの時代も、その格好の標的だった。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 文字、小説、漫画、そしてショート動画。……じゃあ今回もまた、ただの騒ぎなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.4
  - text: そう言い切れたら、楽なんだけどね。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  readings:
  - surface: 捏造
    reading: ネツゾウ
  - surface: OECD
    reading: オーイーシーディー
