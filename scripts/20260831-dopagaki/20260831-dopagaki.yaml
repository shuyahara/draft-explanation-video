  - id: 9
    title: "真因: wantingを突く設計"
    chapter_title: "わたしたちは、何に負けているのか"
    readings:
      - surface: "執拗"
        reading: "シツヨウ"
      - surface: "公の場"
        reading: "オオヤケノバ"
    narration:
      - text: "では、本当の原因は、どこにあるのか。"
        pause_after: 0.2
      - text: "鍵は、さきほどのウォンティングに戻る。"
        pause_after: 0.7
      - text: "1950年代、ハーバード大学の心理学者スキナーは、ハトやネズミの実験で、行動が最も止まらなくなる報酬の与え方を突き止めていた。"
        pause_after: 0.2
      - text: "毎回エサが出るレバーでも、決まった回数で出るレバーでもない。"
        pause_after: 0.2
      - text: "何回押せば出るか分からないレバーだ。"
        pause_after: 0.2
      - text: "報酬が予測できないとき、動物は最も速く、最も執拗にレバーを押し続け、報酬が止まっても、なかなかやめない。"
        pause_after: 0.2
      - text: "可変比率強化と呼ばれるこの仕組みは、スロットマシンが人を離さない理由の説明として、長く使われてきた。"
        pause_after: 0.7
      - text: "思い出してほしい。"
        pause_after: 0.2
      - text: "ドーパミンは、予想と現実のズレに反応する信号だった。"
        pause_after: 0.2
      - text: "次に何が出るか分からない、という構造は、この信号を、絶え間なく鳴らし続けやすい構造でもある。"
        pause_after: 0.7
      - text: "そして、あなたのスマホの画面。"
        pause_after: 0.2
      - text: "指で払うたびに、次に何が出るか分からないフィード。"
        pause_after: 0.2
      - text: "当たりの動画もあれば、外れもある。"
        pause_after: 0.2
      - text: "何回めくれば当たりが出るか、あなたに分かるだろうか。"
        pause_after: 0.2
      - text: "誰にも分からない。"
        pause_after: 0.2
      - text: "そう設計されているからだ。"
        pause_after: 0.2
      - text: "ブリティッシュコロンビア大学でギャンブルを研究するクラークらは2023年、こうした報酬の変動性が、ギャンブルだけでなく、SNSなどのデジタル製品への依存的な行動にも共通する条件になりうる、と論じている。"
        pause_after: 0.7
      - text: "しかもこの機械からは、やめるための段差が、ていねいに取り除かれている。"
        pause_after: 0.2
      - text: "ページの終わりは無限スクロールで消され、動画の切れ目は自動再生で埋められた。"
        pause_after: 0.2
      - text: "無限スクロールを考案したと語るデザイナー、アザ・ラスキンは、後年、その設計を公の場で悔いている。"
        pause_after: 0.2
      - text: "使いやすさの最適化が、人にとっての最善とは限らなかった、と。"
        pause_after: 0.7
      - text: "ドパガキという言葉は、負けたのは自分の脳だ、という前提に立っている。"
        pause_after: 0.2
      - text: "だが、あなたの目の前にあるのは、動物の行動実験と、欲求の神経科学が突き止めた急所を、正確に突いてくる画面なのだ。"
