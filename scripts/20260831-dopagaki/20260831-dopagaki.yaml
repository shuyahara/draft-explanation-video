video:
  title: "なぜ現代人はドパガキになってしまうのか"
  style: "soft warm illustrated style contrasting deep night blues with warm amber lamp and phone glow, gentle diffused lighting, calm non-gritty texture with minimal grain, muted engraving-like tones for historical scenes, no text, no lettering, no watermark, no logo, no caption"
  bgm: "../bgm/kimito-odayakana-gogo.mp3"
  bgm_credit: "BGM: 君と穏やかな午後 / のる（DOVA-SYNDROME）"

scenes:
  - id: 1
    title: "フック"
    telop: "ドパガキ＝ドーパミン中毒のガキ（ネットスラング）"
    readings:
      - surface: "一言"
        reading: "ヒトコト"
    narration:
      - text: "夜。"
        pause_after: 0.2
      - text: "もう寝よう、と思ったのは、40分前だ。"
        pause_after: 0.2
      - text: "部屋は暗く、顔のあたりだけが、スマホの光でぼんやり照らされている。"
        pause_after: 0.2
      - text: "動画は15秒で終わり、次の動画が、勝手に始まる。"
        pause_after: 0.2
      - text: "面白いかどうかは、正直、もう分かっていない。"
        pause_after: 0.2
      - text: "ただ、親指だけが動き続けている。"
        pause_after: 0.2
      - text: "あなたにも、覚えはないだろうか。"
        pause_after: 0.7
      - text: "ある夜、そんな動画のコメント欄に、こんな一言があった。"
        pause_after: 0.2
      - text: "おれはドパガキだから、集中とか無理。"
        pause_after: 0.2
      - text: "ドパガキ。"
        pause_after: 0.2
      - text: "ドーパミン中毒のガキ、という意味のネットスラングだ。"
        pause_after: 0.2
      - text: "ショート動画やゲームの強い刺激に慣れて、集中力が続かなくなった人のこと。"
        pause_after: 0.2
      - text: "若い世代が、他人ではなく自分を笑うために使い始めた言葉だ。"
        pause_after: 0.7
      - text: "少し笑って、少し、刺さらなかっただろうか。"
        pause_after: 0.2
      - text: "この動画が答えたい問いは、ひとつ。"
        pause_after: 0.2
      - text: "なぜ現代人は、ドパガキになってしまうのか。"
        pause_after: 0.2
      - text: "先に言っておくと、答えは、あなたの脳の弱さの中にはない。"
        pause_after: 0.2
      - text: "そして、世間で流通しているドーパミン中毒という説明にも、実は大きな間違いが含まれている。"
        pause_after: 0.2
      - text: "今夜は、その二つを、順番にほどいていく。"
        pause_after: 1.2
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "夜の寝室、布団の中でスマホの光だけに照らされる人物の情景（顔は伏せ気味・クローズアップ回避）"
        gen_prompt: "a person half-hidden under a blanket in a dark bedroom at night, only their lowered face faintly lit by a smartphone screen glow, cinematic soft blue light, no readable text"
        search_query: "person phone dark bedroom night"
        assets:
          - url: "https://www.pexels.com/photo/a-man-lying-in-the-dark-room-using-a-phone-6943430/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
          - url: "https://www.pexels.com/photo/a-woman-using-a-mobile-phone-while-on-lying-on-the-bed-8036934/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
          - url: "https://www.pexels.com/photo/a-man-lying-on-the-bed-while-using-his-mobile-phone-6943426/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
        cut_reason: "【夜、布団の中でスマホを見る人】フックとなる情景を最初の4文で保持する"

      - type: image
        from: 5
        slot: 2
        visual_intent: "スマホを持つ手元のクローズアップ。画面の文字は読めない"
        gen_prompt: "an extreme close-up of a thumb scrolling a smartphone screen in the dark, the screen content abstract and unreadable, warm glow against a dark background"
        cut_reason: "【親指だけが動き続ける手元】面白さを感じていないのに指が止まらない様子へ寄る"

      - type: image
        from: 8
        slot: 3
        visual_intent: "スマホ画面に浮かぶコメント欄の一言（文字は読めない）"
        gen_prompt: "a close-up of a smartphone screen showing a blurred comment section with unreadable text, held in the dark by a person's hand, soft screen glow"
        cut_reason: "【コメント欄の一言が浮かぶ】名指しの言葉が出てくる瞬間を手元のまま見せる"

      - type: image
        from: 11
        slot: 4
        visual_intent: "同じ画面を保持したまま、用語の定義を説明する間つなぐ"
        gen_prompt: "the same close-up of a glowing smartphone screen in the dark, unreadable blurred text, held steady"
        cut_reason: "【ドパガキの定義】用語の意味を説明する間、同じ画に留まる"

      - type: image
        from: 14
        slot: 5
        visual_intent: "少し笑って刺さる表情の余韻から、問いへの導入として引きの画に転換する"
        gen_prompt: "a wide shot of a dark bedroom at night, a person sitting up in bed looking thoughtfully at their glowing phone, soft ambient blue light"
        cut_reason: "【笑いながらも刺さる感覚】問いへの導入として引きの画に転換"

      - type: image
        from: 16
        slot: 6
        visual_intent: "このシーンの核心の問いを画面いっぱいに保持する"
        gen_prompt: "a still, quiet dark bedroom scene, a person's silhouette by phone glow, calm held frame emphasizing a pause of thought"
        cut_reason: "【中心の問いを言い切る】このシーンの核心の問いを画面いっぱいに保持"

      - type: image
        from: 17
        slot: 7
        visual_intent: "結びの断定を、同じ静かな寝室で保持して章転換の間へつなぐ"
        gen_prompt: "a still dark bedroom at night, a person's phone-lit face partly turned away, calm and contemplative, cinematic blue tones fading to black"
        cut_reason: "【答えは弱さの中にない、と宣言する】結びの断定を保持したまま章転換の間へつなぐ"

  - id: 2
    title: "通説の提示"
    narration:
      - text: "まず、いま世間に流通している説明を確認しておこう。"
        pause_after: 0.2
      - text: "あなたも、どこかで聞いたことがないだろうか。"
        pause_after: 0.2
      - text: "筋書きは、だいたいこうだ。"
        pause_after: 0.2
      - text: "ショート動画やスマホゲームは、刺激が強い。"
        pause_after: 0.2
      - text: "強い刺激を受けると、脳の中でドーパミンという快楽物質が大量に出る。"
        pause_after: 0.2
      - text: "脳が快楽に慣れると、より強い刺激がないと満足できなくなる。"
        pause_after: 0.2
      - text: "こうして脳は薬物依存に似た状態になり、集中力が壊れていく。"
        pause_after: 0.2
      - text: "だから、ドーパミン断ち、いわゆるドーパミンデトックスで脳をリセットしよう。"
        pause_after: 0.7
      - text: "この筋書きは、世界的に広まっている。"
        pause_after: 0.2
      - text: "スタンフォード大学の依存症臨床医、アンナ・レンブケが2021年に出した本、ドーパミン・ネイションは世界的なベストセラーになった。"
        pause_after: 0.2
      - text: "SNSには、デトックスの体験談があふれている。"
        pause_after: 0.2
      - text: "ドパガキという言葉も、この筋書きを土台にしている。"
        pause_after: 0.2
      - text: "ドーパミンが出すぎて、中毒になったガキ、というわけだ。"
        pause_after: 0.7
      - text: "筋書きとしては、よくできている。"
        pause_after: 0.2
      - text: "原因があり、メカニズムがあり、対策まである。"
        pause_after: 0.2
      - text: "ただ、この説明には問題がある。"
        pause_after: 0.2
      - text: "出発点の一文が、すでに科学的には正しくないのだ。"
        pause_after: 0.2
      - text: "ドーパミンは、快楽物質ではない。"
        pause_after: 2.2
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "昼の電車でスマホを見る人々の情景で、まず通説を確認する語りを開く"
        gen_prompt: "commuters on a daytime train looking at their smartphones, natural daylight, ordinary everyday commute atmosphere"
        search_query: "commuters smartphone train daytime"
        assets:
          - url: "https://www.pexels.com/photo/metro-train-full-of-people-during-busy-day-2741671/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
          - url: "https://www.pexels.com/photo/black-man-using-mobile-while-commuting-by-train-4559759/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
        cut_reason: "【通説の導入】まず一般に流通する説明を確認する語りに合わせ電車の情景で開く"

      - type: image
        from: 4
        slot: 2
        visual_intent: "電車内でスマホの画面に見入る手元のクローズアップで、刺激とドーパミンの説明を支える"
        gen_prompt: "a close-up of a hand holding a smartphone on a train, screen glow visible but content abstract and unreadable, focused absorbed mood"
        search_query: "person smartphone train close up"
        assets:
          - url: "https://www.pexels.com/photo/person-using-a-smartphone-while-riding-a-train-7251087/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
        cut_reason: "【刺激とドーパミンの説明】同じ電車内の情景を保ちながら本題のメカニズム説明に入る"

      - type: image
        from: 7
        slot: 3
        visual_intent: "薬物依存に似た状態、デトックスへの言及に合わせ電車の情景を保つ"
        gen_prompt: "the same daytime train commute scene, a passenger gazing at their phone with a slightly weary expression, natural light"
        cut_reason: "【薬物依存への例え】デトックスという対策への言及へ橋渡しする"

      - type: image
        from: 9
        slot: 4
        visual_intent: "レンブケの著作の言及に合わせ、書店に積まれた本の情景で言及を裏付ける（表紙は白紙・読めない）"
        gen_prompt: "a stack of hardcover books displayed at a bookstore, covers blank with no writing, warm bookstore lighting, out of focus enough that no text is readable"
        telop: "Anna Lembke, Dopamine Nation (2021)"
        cut_reason: "【レンブケの著作の言及】書店に積まれた本の情景で言及を裏付ける"

      - type: image
        from: 11
        slot: 5
        visual_intent: "SNSのデトックス体験談とドパガキという俗語の由来を、書店の情景を保ったまま語る"
        gen_prompt: "a present-day smartphone held in a hand showing a scrolling social media feed, all screen content blurred and unreadable, warm evening light, modern interior background"
        cut_reason: "【SNSのデトックス体験談とドパガキの由来】書店の情景を保ったままSNS・俗語との接続を語る"

      - type: image
        from: 14
        slot: 6
        visual_intent: "スマホを離れた場所に置いて座る人物（デトックス）の情景を保持したまま、決め文『ドーパミンは快楽物質ではない』の言い切りとポーズを支える"
        gen_prompt: "a person sitting calmly at a table in a present-day modern room wearing contemporary casual clothing, their smartphone placed at a distance, natural daylight, quiet deliberate stillness, no period furniture"
        cut_reason: "【筋書きは崩れる、決め文】デトックスする人物の情景を保持したまま、決め文の言い切りとポーズを支える"

  - id: 3
    title: "反転1前半: 報酬予測誤差"
    chapter_title: "ドーパミンは、快楽の物質なのか"
    readings:
      - surface: "報酬予測誤差"
        reading: "ホウシュウヨソクゴサ"
    narration:
      - text: "1997年、ケンブリッジ大学の神経科学者ウォルフラム・シュルツらが、科学誌サイエンスに、ある実験の結果を発表した。"
        pause_after: 0.2
      - text: "サルの脳で、ドーパミン神経の活動を、ひとつずつ記録したのだ。"
        pause_after: 0.2
      - text: "サルにジュースを与えると、ドーパミン神経は確かに活動を強める。"
        pause_after: 0.2
      - text: "これを、発火と呼ぶ。"
        pause_after: 0.2
      - text: "ここまでは、快楽物質のイメージ通りだ。"
        pause_after: 0.2
      - text: "ところが、光の合図のあとに必ずジュースが出る、と学習させると、奇妙なことが起きる。"
        pause_after: 0.2
      - text: "ジュースをもらった瞬間の発火が、消えるのだ。"
        pause_after: 0.2
      - text: "代わりに、合図の瞬間に発火するようになる。"
        pause_after: 0.2
      - text: "そして、合図があったのにジュースが出ないと、ドーパミン神経の活動は、むしろ沈み込む。"
        pause_after: 0.7
      - text: "つまり、この神経が伝えているのは、気持ちよさの量ではない。"
        pause_after: 0.2
      - text: "予想と現実のズレだ。"
        pause_after: 0.2
      - text: "予想より良ければ発火し、予想通りなら沈黙し、予想より悪ければ落ち込む。"
        pause_after: 0.2
      - text: "研究者たちはこれを、報酬予測誤差と呼ぶ。"
        pause_after: 0.2
      - text: "ドーパミンは、快楽を運ぶ物質というより、次はどうなる、という予測の答え合わせをする信号なのだ。"
        pause_after: 0.7
      - text: "では、快楽でないのなら、私たちがやめられない、あの感じは、いったい何なのか。"
        pause_after: 0.7
    beats:
      - type: chapter
        cut_reason: "章の頭"

      - type: image
        from: 1
        slot: 1
        visual_intent: "研究者がモニターに向かう後ろ姿で、1997年の学術的な発表を導入として示す"
        gen_prompt: "a researcher viewed from behind, silhouetted against a glowing monitor displaying abstract brainwave-like traces in a dim laboratory, cinematic side light, no readable text"
        cut_reason: "【1997年の発表】研究者がモニターに向かう後ろ姿で学術的な導入を示す"

      - type: image
        from: 2
        slot: 2
        visual_intent: "サルとジュース、発火の定義を直接描写する"
        gen_prompt: "a macaque monkey in a primate research lab reaching for a small cup of juice, a researcher's hand nearby, warm laboratory lighting, no readable text or labels"
        cut_reason: "【サルの実験と発火の定義】記録実験とジュースへの発火反応を直接描写する"

      - type: image
        from: 6
        slot: 3
        visual_intent: "学習後、ジュース到達時の発火が消える転換を示す"
        gen_prompt: "a macaque monkey pausing calmly as a juice reward arrives after a learned soft light cue, quiet laboratory setting, no readable text"
        cut_reason: "【学習後に発火が消える】光の合図学習後、ジュース到達時の発火が消える転換を見せる"

      - type: image
        from: 8
        slot: 4
        visual_intent: "発火のタイミングが合図へ移り、裏切られると沈み込む様子を描く"
        gen_prompt: "a dim laboratory scene with a soft light cue glowing above an empty tray where an expected juice reward fails to appear, quiet contemplative mood"
        cut_reason: "【合図で発火・裏切りで沈む】発火のタイミングが合図へ移り、裏切られると沈み込む様子まで描く"

      - type: diagram
        from: 10
        cut_reason: "【予想と現実のズレの構造】3つの反応パターンが知見そのものなので、ここだけ図解に切り替える"
        diagram:
          type: narrative
          layout: chain
          items:
            - id: unexpected
              text: "予想外の報酬"
              icon: bolt
              at: 12
              after: "発火し"
            - id: expected
              text: "予想通りは沈黙"
              icon: pause_circle
              at: 12
              after: "沈黙し"
            - id: betrayed
              text: "裏切られた報酬"
              icon: trending_down
              at: 12
              after: "落ち込む"
          caption:
            text: "報酬予測誤差"
            at: 13

      - type: image
        from: 15
        slot: 5
        visual_intent: "次のwanting/likingへの橋渡しとして静かな一枚に戻す"
        gen_prompt: "a quiet dim room with a single soft light source, a contemplative empty desk, cinematic mood evoking an unanswered question"
        telop: "報酬予測誤差＝予想と現実のズレ"
        cut_reason: "【問いの投げかけ】次のwanting/likingへの橋渡しとして静かな一枚に戻す"

  - id: 4
    title: "反転1後半: wanting/liking"
    telop: "wanting（欲しい）／ liking（好き）"
    narration:
      - text: "欲しい、と、好き。"
        pause_after: 0.2
      - text: "この二つは同じもののように見えて、脳の中では別々に処理されている。"
        pause_after: 0.2
      - text: "そう実証してきたのが、ミシガン大学の神経科学者ケント・ベリッジの研究室だ。"
        pause_after: 0.2
      - text: "実験で、ラットの脳からドーパミンをほとんど取り除いても、甘い味への、おいしい、という反応は消えなかった。"
        pause_after: 0.2
      - text: "逆にドーパミン系を強く働かせると、対象を求める行動だけが跳ね上がる。"
        pause_after: 0.2
      - text: "好きの度合いは、変わらないのにだ。"
        pause_after: 0.7
      - text: "ベリッジはこの二つを、ウォンティングとライキングと呼び分けた。"
        pause_after: 0.2
      - text: "ウォンティングは、欲しくてたまらない、という欲求の強さ。"
        pause_after: 0.2
      - text: "ライキングは、実際に味わったときの、いいなあ、という快感の強さ。"
        pause_after: 0.2
      - text: "ドーパミンが強く動かしているのは、ウォンティングの側だ。"
        pause_after: 0.2
      - text: "さきほどの、予測の答え合わせをするあの信号は、快感を作る回路ではなく、次を求める力の側で働いている。"
        pause_after: 0.7
      - text: "この区別は、依存症の治療の場で、患者がしばしば口にする言葉と重なる。"
        pause_after: 0.2
      - text: "もう楽しくないんです。"
        pause_after: 0.2
      - text: "楽しくないのに、やめられないんです。"
        pause_after: 0.2
      - text: "快楽に溺れているのではない。"
        pause_after: 0.2
      - text: "快楽はとっくに薄れているのに、欲しい、という信号だけが空回りし続けている。"
        pause_after: 0.7
      - text: "ここで、冒頭の夜を思い出してほしい。"
        pause_after: 0.2
      - text: "面白いかどうか、もう分かっていないのに、親指だけが動いていた。"
        pause_after: 0.2
      - text: "あれは、快楽に負けている状態ではない。"
        pause_after: 0.2
      - text: "ウォンティングだけが回り続けている状態だ。"
        pause_after: 0.7
      - text: "だとすれば、ドーパミン中毒でバカになった、という自虐は、言葉の使い方として、すでにずれていることになる。"
        pause_after: 0.7
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "欲しいと好きの分離を示すベリッジの研究室を学術的な情景で導入する"
        gen_prompt: "a calm neuroscience laboratory desk with observation notes and equipment, cinematic soft light, no readable text on any documents"
        cut_reason: "【欲しいと好きの分離】ベリッジの研究室を示す学術的な情景で導入する"

      - type: image
        from: 4
        slot: 2
        visual_intent: "ドーパミンを除いても『おいしい』反応は消えない実験結果を示す"
        gen_prompt: "a laboratory rat near a small dish in a calm clinical setting, soft warm lighting, no readable text, gentle scientific mood"
        cut_reason: "【実験結果】ドーパミンを除いても「おいしい」反応は消えない実験結果を一枚で保持する"

      - type: diagram
        from: 7
        cut_reason: "【wantingへの一方向の伸び】欲しさの3つの側面だけがドーパミンから伸びる構造を図解にする（likingは意図的に描かない＝二系統分離の知見）"
        diagram:
          type: narrative
          layout: radiate
          center:
            icon: bolt
            text: "ドーパミン信号"
            at: 10
          items:
            - id: want1
              text: "欲しくてたまらない"
              at: 8
              after: "欲しくてたまらない"
            - id: want2
              text: "欲求の強さ"
              at: 8
              after: "欲求の強さ"
            - id: want3
              text: "次を求める力"
              at: 11
              after: "次を求める力"
          turn:
            at: 10
            after: "ウォンティングの側だ"

      - type: image
        from: 12
        slot: 3
        visual_intent: "依存症の治療の場を思わせる静かな情景の中で、患者の言葉を引用する"
        gen_prompt: "a quiet counseling room setting, soft empathetic lighting, an empty chair suggesting a therapy conversation, calm mood, no visible faces"
        telop: "Berridge & Robinson (2016)"
