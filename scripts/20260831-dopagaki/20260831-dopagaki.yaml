  - id: 5
    title: "47秒の誤読"
    telop: "Gloria Mark（UC Irvine）『Attention Span』(2023)"
    narration:
      - text: "とはいえ、こう思ったかもしれない。"
        pause_after: 0.2
      - text: "理屈はどうあれ、実際に集中力は落ちているじゃないか、と。"
        pause_after: 0.2
      - text: "よく引用される数字がある。"
        pause_after: 0.2
      - text: "現代人の集中力は、47秒しか続かない、というものだ。"
        pause_after: 0.7
      - text: "この数字には、ちゃんとした出どころがある。"
        pause_after: 0.2
      - text: "カリフォルニア大学アーバイン校のグロリア・マークは、20年以上にわたって、働く人がパソコンの画面をどれくらいで切り替えるかを計測し続けてきた。"
        pause_after: 0.2
      - text: "マーク自身の振り返りによれば、2004年の調査では、人がひとつの画面に向かう時間は、平均でおよそ2分半あった。"
        pause_after: 0.2
      - text: "それが近年の計測では、平均47秒。"
        pause_after: 0.2
      - text: "中央値、つまり全体のちょうど真ん中の値で見ても、40秒だ。"
        pause_after: 0.2
      - text: "あなたは今日、何回、画面を切り替えただろうか。"
        pause_after: 0.2
      - text: "確かに、画面の上の私たちは、どんどんせわしなくなっている。"
        pause_after: 0.7
      - text: "ただし、この数字の意味は、正確に受け取る必要がある。"
        pause_after: 0.2
      - text: "計測されているのは、ひとつの画面から別の画面へ切り替えるまでの時間であって、人間の脳が47秒しか集中できなくなった、という測定ではない。"
        pause_after: 0.2
      - text: "実際、私たちは今でも、好きな映画なら2時間見続けられるし、面白い本なら1時間読み続けられる。"
        pause_after: 0.2
      - text: "集中する力そのものが、一律に47秒へ縮んだわけではない。"
        pause_after: 0.2
      - text: "測られているのは、脳の性能ではなく、画面の前での行動の変化なのだ。"
        pause_after: 0.7
      - text: "この数字は、脳が壊れた証拠には、なっていない。"
        pause_after: 0.2
      - text: "それなのに、なぜ私たちは、若者の脳が壊れた、という話にこれほど説得力を感じてしまうのだろうか。"
        pause_after: 0.2
      - text: "実は、この不安には、長い長い前例がある。"
        pause_after: 1.2
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "通説を疑う視聴者の気持ちに寄り添う場面を挟む"
        gen_prompt: "a person pausing thoughtfully while looking at a smartphone, a subtle question in their expression, soft daylight, contemplative setting, no readable text"
        cut_reason: "【47秒という数字への疑問】通説を疑う視聴者の気持ちに寄り添う場面を挟む"

      - type: image
        from: 5
        slot: 2
        visual_intent: "20年におよぶ計測研究の背景を一枚で示す"
        gen_prompt: "a researcher's desk with a computer monitor and notes, evoking two decades of workplace-attention research, calm academic office setting, no readable text on any documents"
        cut_reason: "【グロリア・マークの調査の紹介】20年におよぶ計測研究の背景を一枚で示す"

      - type: diagram
        from: 7
        cut_reason: "【裏取り済み数値2点+中央値】本動画唯一のchartで2004年→近年の変化を正確な数値で見せる"
        diagram:
          type: chart
          chart: bar
          title: "画面滞在時間の変化"
          unit: "秒"
          source: "Gloria Mark, Attention Span (2023) / UC Irvine (2023-01-26)"
          series:
            - color: accent
              at: 8
              points:
                - {label: "2004年", value: 150}
                - {label: "近年 平均", value: 47}
                - {label: "近年 中央値", value: 40}

      - type: image
        from: 12
        slot: 3
        visual_intent: "切り替え時間の測定であって集中力の限界ではないと説明する、複数ウィンドウを行き来する手元の情景"
        gen_prompt: "a close-up of hands switching between multiple overlapping windows on a computer screen in an office, screen content abstract and unreadable, focused work atmosphere"
        search_query: "office desk multiple computer monitors screens"
        assets:
          - url: "https://www.pexels.com/photo/photo-of-workspace-with-two-monitors-and-keyboard-on-table-8353774/"
            kind: image
            license: commercial-ok
            source_name: "Pexels"
