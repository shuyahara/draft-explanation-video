        gen_prompt: "a person relaxed and fully absorbed watching a film in a cozy dim room, or reading a book with its pages blurred and unreadable, calm focused atmosphere, warm ambient light"
        cut_reason: "【脳は壊れていない】映画や読書に没頭できる様子を見せ、集中力そのものは健在だと示す"

      - type: image
