      - text: "もし対策を考えるなら、方向はひとつだけ、覚えておけばいい。"
        pause_after: 0.2
      - text: "意志の力で刺激と殴り合わないこと。"
        pause_after: 0.2
      - text: "段差を、自分の側に戻すことだ。"
        pause_after: 0.2
      - text: "通知をひとつ切る。"
        pause_after: 0.2
      - text: "アプリをホーム画面の奥にしまう。"
        pause_after: 0.2
      - text: "スマホを寝室の外で充電する。"
