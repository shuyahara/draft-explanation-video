  - id: 7
    title: "反転2後半: モラルパニック"
    readings:
      - surface: "捏造"
        reading: "ネツゾウ"
      - surface: "OECD"
        reading: "オーイーシーディー"
    narration:
      - text: "そして20世紀には、この不安がデータ付きで社会を動かした事件がある。"
        pause_after: 0.2
      - text: "1954年、アメリカの精神科医フレドリック・ワーサムが、漫画は少年犯罪の温床だ、と告発する本を出版した。"
        pause_after: 0.2
      - text: "根拠は、彼が診てきた非行少年たちの臨床データ。"
        pause_after: 0.2
      - text: "世論は沸騰し、上院で公聴会が開かれ、その年のうちに出版社が続々と廃業した。"
        pause_after: 0.2
      - text: "業界は、自主規制の検閲機関を作らされた。"
        pause_after: 0.7
      - text: "この話には、後日談がある。"
        pause_after: 0.2
      - text: "2012年、イリノイ大学の図書館情報学者キャロル・ティリーが、公開されたワーサムの研究資料を精査した。"
        pause_after: 0.2
      - text: "そして、根拠とされた臨床データが、改変され、誇張され、一部は捏造されていたことを突き止めた。"
        pause_after: 0.2
      - text: "子供の年齢は書き換えられ、発言は歪められ、家庭環境という別の要因は無視されていた。"
        pause_after: 0.2
      - text: "社会を動かしたパニックの土台は、偽物だったのだ。"
        pause_after: 0.7
      - text: "日本にも、覚えがある。"
        pause_after: 0.2
      - text: "2004年、OECDの国際学力調査で日本の読解力の順位が8位から14位に急落し、学力低下と活字離れが大騒ぎになった。"
        pause_after: 0.2
      - text: "ゆとり教育が戦犯とされ、教育政策は転換された。"
        pause_after: 0.2
      - text: "では、その後どうなったか。"
        pause_after: 0.2
      - text: "日本の読解力は回復を続け、2022年の調査では、81の国と地域の中で3位。"
        pause_after: 0.2
      - text: "少なくとも、若者の読む力が下がり続けている、という単純な物語は、データのほうが裏切ったのだ。"
        pause_after: 0.7
      - text: "社会学には、この繰り返しを指す言葉がある。"
        pause_after: 0.2
      - text: "モラルパニック。"
        pause_after: 0.2
      - text: "1972年に、社会学者スタンリー・コーエンが名付けた。"
        pause_after: 0.2
      - text: "何かが社会への脅威として祭り上げられ、メディアが誇張し、世論が恐れ、規制が動く。"
        pause_after: 0.2
      - text: "若者の新しい楽しみは、いつの時代も、その格好の標的だった。"
        pause_after: 0.7
      - text: "では、今回もまた、ただの騒ぎなのだろうか。"
        pause_after: 1.2
    beats:
