        pause_after: 0.2
      - text: "この言葉は、原因を個人の脳に置き、しかも、若者に置く。"
        pause_after: 0.2
      - text: "だが、見てきたとおりだ。"
        pause_after: 0.2
      - text: "ドーパミン中毒という説明は科学的に不正確で、若者が堕落したという物語は、二千年以上前から、繰り返されては崩れてきた。"
        pause_after: 0.2
      - text: "そして、画面の前でせわしなくなっているのは、統計を見る限り、若者だけではない。"
