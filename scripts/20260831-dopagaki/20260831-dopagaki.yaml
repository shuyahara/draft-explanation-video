      - text: "今回は、無視できないデータも存在するからだ。"
        pause_after: 0.7
      - text: "グリフィス大学のグエンらの研究チームは2025年、たくさんの研究結果をまとめて分析する、メタ分析という手法の結果を、心理学の主要誌に発表した。"
        pause_after: 0.2
      - text: "対象は、ショート動画と心の状態についての71の研究、のべおよそ9万8千人分。"
        pause_after: 0.2
      - text: "結論はこうだ。"
        pause_after: 0.2
      - text: "ショート動画の利用が多い人ほど、注意力や、衝動を抑える力が低く、不安や抑うつも強い傾向がある。"
        pause_after: 0.2
      - text: "関連の強さは中程度。"
        pause_after: 0.2
      - text: "無視できる大きさではないが、すべてを説明するほど強くもない。"
        pause_after: 0.7
      - text: "学力の側にも、動きはある。"
        pause_after: 0.2
      - text: "日本は3位に上がったと言ったが、OECD全体の平均点は、2022年の調査で大きく下がった。"
        pause_after: 0.2
      - text: "しかも、この低下はコロナ禍の前から始まっていたと、OECD自身が分析している。"
        pause_after: 0.2
      - text: "日本国内でも、1か月に本を1冊も読まなかった高校生は、2025年の調査で55.7パーセントにのぼった。"
        pause_after: 0.2
      - text: "プラットフォームの内側からも、声が出ている。"
        pause_after: 0.2
      - text: "2021年、フェイスブックの元社員フランシス・ハウゲンが、内部文書を持って議会で証言した。"
        pause_after: 0.2
      - text: "アルゴリズムが10代の心の健康を害しうると、会社は社内調査で知っていた、と。"
        pause_after: 0.7
      - text: "だから、何も起きていない、とは言えない。"
        pause_after: 0.2
      - text: "ただし、だ。"
        pause_after: 0.2
      - text: "さきほどのメタ分析の研究チーム自身が、はっきり書いていることがある。"
        pause_after: 0.2
      - text: "これらの大半は、ある一時点の相関を見た研究であり、ショート動画のせいで注意力が下がったのか、もともと注意や気分に課題のある人がショート動画に引き寄せられるのか、方向は決められない、と。"
        pause_after: 0.2
      - text: "もうひとつ、規模の大きな数字がある。"
        pause_after: 0.2
      - text: "オックスフォード大学のオーベンとプシビルスキが、35万人分のデータを解析した研究だ。"
        pause_after: 0.2
      - text: "対象はショート動画に限らない、デジタル機器の利用全般だが、それが若者の幸福度に与える影響は、あったとしても、幸福度の変動のわずか0.4パーセントほどだった。"
        pause_after: 0.7
      - text: "何かは、起きている。"
        pause_after: 0.2
      - text: "しかし、若者の脳が壊れた、という強い物語を支えるほどの証拠は、今回も、まだ見つかっていない。"
        pause_after: 1.2
