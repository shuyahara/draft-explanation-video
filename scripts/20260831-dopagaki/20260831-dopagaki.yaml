        cut_reason: "【脳は壊れていないという結論、章転換への間】不安の根深さへの問いを保持したまま次章への長い間につなぐ"

  - id: 6
    title: "反転2前半: 文字批判と読書熱"
    chapter_title: "この不安は、いつから続いているのか"
    readings:
      - surface: "対話篇"
        reading: "タイワヘン"
      - surface: "二百年前"
        reading: "ニヒャクネンマエ"
    narration:
      - text: "紀元前4世紀に、プラトンが書いた対話篇、パイドロスに、こんな場面がある。"
        pause_after: 0.2
      - text: "文字の発明をめぐって、エジプトの神と王が議論するのだ。"
        pause_after: 0.2
      - text: "文字は記憶と知恵の秘薬になる、と誇る神に、王はこう答える。"
        pause_after: 0.2
      - text: "これを学んだ者は、記憶の訓練をしなくなり、魂に忘却が生まれるだろう。"
        pause_after: 0.2
      - text: "自分の内側から思い出すのではなく、外側の印に頼るようになるからだ。"
        pause_after: 0.7
      - text: "新しいメディアが、人間の知的な力を衰えさせる。"
        pause_after: 0.2
      - text: "この不安の、記録に残る最も古い標的は、文字そのものだった。"
        pause_after: 0.7
      - text: "18世紀の末には、小説がやり玉に挙がった。"
        pause_after: 0.2
      - text: "当時のドイツでは、若者や女性が小説を読みふけることが、読書熱、読書中毒と呼ばれ、社会問題として真剣に論じられた。"
        pause_after: 0.2
      - text: "1795年には、読書熱は疫病だ、と断じる本まで出ている。"
        pause_after: 0.2
      - text: "今の目には冗談のように見えるが、当時の知識人は本気だった。"
        pause_after: 0.2
      - text: "刺激の強い物語が感受性を鈍らせ、義務を怠らせ、社会を不安定にする、と。"
        pause_after: 0.7
      - text: "どこかで聞いた筋書きではないだろうか。"
        pause_after: 0.2
      - text: "刺激が強い。"
        pause_after: 0.2
      - text: "慣れる。"
        pause_after: 0.2
      - text: "堕落する。"
        pause_after: 0.2
      - text: "対象が小説からショート動画に変わっただけで、文法は二百年前と、ほとんど同じだ。"
        pause_after: 0.7
    beats:
