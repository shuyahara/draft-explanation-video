- id: 5
  title: 優しさの隣に、何が足りないのか（会ったあと②）
  chapter_title: 優しさの隣に、何が足りないのか
  narration:
  - text: 人の魅力は、二つのものさしで見ると分かりやすいの。一つは、人に良くする力。優しさ、誠実さ、思いやり。もう一つは、自分から前に出る力。自信や積極性を、姿勢や発言で相手に見せることよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 優しい人の反対が、自信のある人ってことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そこが勘違いされやすいところ。反対ではないのよ。二つは別々のものさしで、両方高い人も、両方低い人もいるわ。
    speaker: めたん
    expression: smile
    pause_after: 1.0
  - text: そのうえで、さっきの四つを思い出して。犯罪をしない、浮気をしない、働いている、優しい。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 四つとも、さっき定義した二つ、悪いことをしないか、相手に誠実か、のどちらかなの。自分から前に出る力は、一つも入っていないわ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: あっ…。本当に入ってないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そして前に出る力は、会った瞬間に見えるの。2016年、カリフォルニア大学バークレー校の研究チームが、スピードデートと出会い系アプリで試したわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 体を開いた、ゆったりした姿勢の人と、縮こまった姿勢の人を比べたの。開いていた人の方が、「また会いたい」と選ばれやすさがおよそ1.76倍だったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 姿勢だけで！？ じゃあ僕、胸を張って、腕を組んで、声を低くすれば完璧なのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: 待って。そこで急ぐと間違えるわ。前に出る力にも、二種類あるの。相手を威圧して従わせるやり方と、能力で尊敬されるやり方。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 2025年、トロント大学のニコラス・ルール教授たちの研究があるわ。威圧するやり方に惹かれるのは、短い関係を探している人だけだったの。長く続く関係を探している人は、むしろ避けていたわ。尊敬されるやり方は、どちらでもプラスよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 威張るんじゃなくて、尊敬される方なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 会ったあとの段階で効くのは、見た目と、人当たりと、前に出る力。そして「まとも」には、三つ目が入っていないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: でも、なんで人は、そんな4分で見えるものに惹かれるようにできてるのだ？ まともさの方が、大事な気がするのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
