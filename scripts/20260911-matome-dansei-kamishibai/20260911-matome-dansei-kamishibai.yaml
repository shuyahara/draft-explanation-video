- id: 11
  title: その「時間」は、誰が用意していたのか
  chapter_title: その『時間』は、誰が用意していたのか
  narration:
  - text: いい問いね。実はその時間、昔は自分で用意しなくてよかったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 最初に出した、国立社会保障・人口問題研究所の2021年の調査に戻るわ。夫婦がどうやって出会ったかを、結婚した年ごとに聞いているの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 1930年代に結婚した夫婦では、見合い結婚が69.0パーセント。7割近くが見合いよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 7割！ ほとんど見合いなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: それが、2019年から2021年に結婚した夫婦では、9.9パーセントまで下がっているわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 職場で出会って結婚した割合も減っているの。前回の2015年の調査では28.2パーセント、2021年の調査では21.4パーセントよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 見合いも職場も、減ってるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そのかわりに増えたのが、ネットで出会う形ね。2019年から2021年では15.2パーセント。見合いを追い抜いたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: それの何がまずいのだ？ 出会いの数は、増えてる気がするのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 数はそうかもしれないわ。でも、見合いと職場には、共通していたものが二つあるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.6
  - text: 一つは、周りの人がその人を保証してくれること。「この人はちゃんとした人ですよ」と、誰かが言ってくれるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 紹介状みたいなものなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 近いわね。もう一つは、何度も会う時間が、先に決まっていること。職場なら毎日顔を合わせるし、見合いも、話が進めば仲を取り持つ人がついて、何度か会うことになるわ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: さっきの「遅れて効いてくるもの」が、育つ時間なのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そういうことよ。それに、人は繰り返し会う相手に好意を持ちやすい、という効果も知られているわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 昔は、まともさを他人が保証してくれて、しかも何度も会う時間が、先に決まっていたのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: ただし、断っておくわね。この効果には限界があるの。最初の印象が悪い相手だと、何度会っても好意は上がらない、と報告されているわ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 会えば何とかなる、ではないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ。会う回数を増やせばうまくいく、とまでは、研究は言っていないわ。それに、こういう出会い方が減った、というだけで、なくなったわけでもないの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 減った分は、今は誰がやってるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
