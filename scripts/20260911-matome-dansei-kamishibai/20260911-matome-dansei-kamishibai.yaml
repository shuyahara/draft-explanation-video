- id: 3
  title: 感じのいい男は、会う前に損をするのか（会う前）
  chapter_title: 感じのいい男は、会う前に損をするのか
  narration:
  - text: 会う前の段階から。写真と紹介文で伝わるのは、感じの良さまでよ。それが損になるのか、試した実験があるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2003年、サウスカロライナ大学の研究チームが、女子学生に男性の写真と紹介文を見せたの。見た目の良し悪しと、態度の良し悪しを組み合わせてね。たとえば、見た目は良いけれど意地悪な男性と、見た目は劣るけれど感じがいい男性。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 顔がいい方なのだ。絶対そうなのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 選ばれたのは、感じがいい方だったの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: えっ、顔がいい方が負けたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ええ。結婚相手でも、交際相手でも、友人でも、感じのいい方が高く評価されたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: でも、見た目の力と態度の力が、混ざってるんじゃないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 組み合わせて見せているから、別々に確かめられるの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 評価が低かったのは、見た目のいい男性ではなく、態度が意地悪な男性の方だったの。少なくとも感じの良さは、紹介文で伝わりさえすれば、会う前でも負けていないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 伝わりさえすれば…。じゃあ僕のプロフィールの「まじめです」は、伝わってなかったのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そこは、あとで戻ってくるわ。プロフィールの次は、実際に会った場面よ。
    speaker: めたん
    expression: normal
    pause_after: 1.2
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: board
    cut_reason: 【道しるべ】章頭に三つの段階の板を出し、この章が①会う前の話だと示す
    from: 1
    telop: '三つの段階

      ①会う前＝写真とプロフィール

      ②初対面＝会って数回まで

      ③長い関係＝付き合いが続いてから'
    highlight_lines:
    - 2
  - type: image
    cut_reason: 【二人の男性】カフェで向かい合う男性二人に替え、2003年の実験の組み立てに入る
    from: 3
    slot: 1
    credit: 'Urbaniak & Kilmann (2003) Sex Roles 49(9/10)／Photo: RDNE Stock project / Pexels'
  - type: diagram
    cut_reason: 【実験の骨格】二人の男性→女子学生に聞いた→感じがいい方が選ばれた、を格子で見せる
    from: 6
    diagram:
      type: sketch
      rows:
      - - id: mean_man
          at: 6
          icon: person
          text: 見た目◎ 意地悪
        - id: ask
