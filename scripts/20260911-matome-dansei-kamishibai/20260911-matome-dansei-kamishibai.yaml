      - text: "ふつうは、男性が席を移動して、女性が座って待つわ。それを逆にして、女性に移動してもらったの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "席を替えただけなのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "それだけよ。すると、ふだんのスピードデートで見られる「男性の方が相手を広く受け入れる」という男女の差が、消えたの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "消えたのだ！？ 男女の生まれつきの違いじゃなかったのだ？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "少なくとも、それだけでは説明がつかないわね。移動する側は相手を受け入れやすくなって、座って待つ側が、相手を厳しく選ぶようになったの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "選り好みしているのが女性だから、じゃないのよ。座って待つ役をやっている側が、選ぶ側になるの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "僕はずっと、送る側で、移動する側だったのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "ただ、席を移ることと、アプリでメッセージを送ることは、同じ行動ではないわ。自分から近づく役、という点が共通している。そこまでね。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "めたん、結局、僕は何に負けてるのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 13
    title: "まともな男性は、何に負けているのか"
    chapter_title: null
    narration:
      - text: "ここまでを、四つにまとめるわね。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "一つ目。優しさは負けていないわ。実験でも、実際に会ったあとの評価でも、ちゃんと効いていたの。負けていたのは、意地悪な態度の方よ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "そこは、疑わなくていいのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "二つ目。でも「まとも」という言葉には、人に良くする力しか入っていないの。自分から前に出る力は、抜けているわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "僕が数えた四つ、全部そっちだったのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "三つ目。その前に出る力も、二種類あるのよ。威圧して従わせるやり方は、長く続く関係では避けられていたわ。好かれているのは、能力で尊敬される方ね。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "威張る方じゃなくて、尊敬される方なのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "四つ目。そして、まともさは効き始めるまでに時間がかかるのに、その時間をくれていた出会い方が、この数十年で減ったの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "四つとも、僕の人格が悪いって話じゃないのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "ええ。少なくとも、ずんだもんが悪い人だからではないわね。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.35
      - text: "まともな男性がモテなくなったんじゃないのよ。まともさが伝わる前に、判断が終わる場面が、増えたの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "伝わる前に、終わってるのだ…。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.35
      - text: "じゃあ、僕はどうしたらいいのだ？ 真のモテ要素って、結局なんなのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 14
    title: "結び（真のモテ要素とは何か）"
    chapter_title: null
    narration:
      - text: "研究から言えることなら、あるわ。ただし、これをやれば必ずうまくいく、という話ではないの。そこは先に言っておくわね。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.45
      - text: "それでいいのだ。聞きたいのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "最初に決めた三つの段階ごとに、分けて答えるわ。全部が同じものさしに並んでいるわけではないから。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "まず、会ったあと。実際に人が惹かれていたのは、見た目の魅力、人当たりの良さ、そして能力で尊敬される強さね。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "この中で、人当たりの良さは、稼ぐ力より強く効いていたわ。尊敬される強さの方は、短い関係でも、長い関係でも、ずっとプラスだったの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "威張る方じゃなくて、尊敬される方なのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "ええ。威圧する方は、短い関係では選ばれることがあっても、長く続く関係では避けられていたわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "次に、続いてから。協調性も誠実性も、ちゃんと効くの。ただし、関係が始まったあとで、ね。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "始まったあと…。だから、始めるところが要るのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "そして、会う前。ここがいちばん薄いわ。写真とプロフィールからは、優しさも誠実さも、ほとんど読み取れないもの。文字で「まじめです」と書いても、伝わらないのよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "僕が半年やってたのは、そこなのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "繰り返し会って相手を知る機会が、以前より減っている。昔は他人が用意してくれた場所を、今は自分で見つけないといけないわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "それが、いちばんむずかしいのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "そうね。むずかしいわ。だから、うまくいっていないことを、自分の人格のせいにしなくていいのよ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.35
      - text: "まともさは、持っているだけでは伝わらないの。伝わる場所まで、行かないといけないのよ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "僕、プロフィールを書き直すのは、もうやめるのだ。"
        speaker: "ずんだもん"
        expression: "smug"
        pause_after: 0.45
      - text: "あら。どうするの。"
        speaker: "めたん"
        expression: "surprised"
        pause_after: 0.45
      - text: "書き直すより、同じ人と何回か会える場所を探すのだ。そっちの方が、僕の誠実さを知ってもらえる気がするのだ。"
        speaker: "ずんだもん"
        expression: "smile"
        pause_after: 0.45
      - text: "それは、この動画の研究から出てきた見立てで、確かめられた方法ではないわ。でも、筋は通っているわね。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 2.5
