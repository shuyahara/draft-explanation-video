- id: 12
  title: 近づく役を、誰がやっているか
  chapter_title: null
  narration:
  - text: 今は、自分でやるしかないわ。そして、その役が誰に偏っているかも、数字で出ているのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 2014年に、オンラインの出会いのサービスを6か月分調べた研究があるの。対象は、男女合わせて1万4千人あまりよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: その半年で送られた最初のメッセージは、男性からがおよそ14万件。女性からは、およそ3万5千件。4対1ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 4倍も男から送ってるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 返事をもらえた割合も見てみましょう。女性が最初に送った場合の方が、男性が最初に送った場合の、およそ2倍だったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 送れば返ってくるのに、送ってないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そこまでは言えないの。送る相手の選び方が違うかもしれないもの。分かるのは、送っている数と、返事が返る割合が、男女で逆だった、ということね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 男が数を打って、女性が選んでるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そこで、その「近づく役」そのものを入れ替えた実験があるのよ。2009年、さっきと同じイーストウィックたちが、350人でスピードデートをしたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ふつうは、男性が席を移動して、女性が座って待つわ。それを逆にして、女性に移動してもらったの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 席を替えただけなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: それだけよ。すると、ふだんのスピードデートで見られる、あの男女の差が消えたの。「男性の方が相手を広く受け入れる」という差よ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 消えたのだ！？ 男女の生まれつきの違いじゃなかったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 少なくとも、それだけでは説明がつかないわね。移動する側は相手を受け入れやすくなって、座って待つ側が、相手を厳しく選ぶようになったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 選り好みしているのが女性だから、じゃないのよ。座って待つ役をやっている側が、選ぶ側になるの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 僕はずっと、送る側で、移動する側だったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ただ、席を移ることと、アプリでメッセージを送ることは、同じ行動ではないわ。自分から近づく役、という点が共通している。そこまでね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: めたん、結局、僕は何に負けてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
