- id: 9
  title: 結び（真のモテ要素とは何か）
  chapter_title: null
  narration:
  - text: 整理するわね。冒頭の一行に戻るわ。モテる要素は、段階ごとに違う。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 会う前。写真と文字では、感じの良さは少し伝わっても、誠実さや責任感までは確認できない。「まじめです」と書いても、それだけでは伝わらないの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕が半年やってたのは、そこなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 会ったあと。効くのは、見た目、人当たりの良さ、そして前に出る力。威張る方ではなく、尊敬される方ね。人当たりの良さは、稼ぐ力より強く効いていたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 続いてから。協調性も誠実性も、ちゃんと効く。ただし、関係が始まったあとで。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 「まとも」は、三つ目の段階の力なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。まともさが弱いんじゃない。効き始めるのが遅いの。そして、その時間を用意してくれていた仕組みが、この数十年で薄くなったわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: まともさが弱いから、ではないのよ。まともさが伝わる前に判断が終わる場面が、増えたの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 伝わる前に、終わってるのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: だから、うまくいっていないことを、自分の人格のせいにしなくていいのよ。ただし、これをやれば必ずうまくいく、という話でもないわ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: まともさは、持っているだけでは伝わらないの。伝わる場所まで、行かないといけないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 僕、プロフィールだけを書き直し続けるのは、もうやめるのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: あら。どうするの。
    speaker: めたん
    expression: surprised
    pause_after: 0.45
  - text: 書き直すより、同じ人と何回か会える場所を探すのだ。そっちの方が、僕の誠実さを知ってもらえる気がするのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: それは研究で確かめられた方法ではないけれど、筋は通っているわね。
    speaker: めたん
    expression: smile
    pause_after: 2.5
