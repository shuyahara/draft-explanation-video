- id: 7
  title: なぜ、まともさは最初に見えないのか（続いてから）
  chapter_title: なぜ、まともさは最初に見えないのか
  narration:
  - text: やっと、ずんだもんの良さが分かる段階の話になるわ。付き合いが始まってから、ね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 協調性と誠実性の高い人は、関係の満足度も高い。それを、19の調査、合わせて3,848人分をまとめて確かめた分析があるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2010年、オーストラリアのニューイングランド大学の准教授、ジョン・マラフたちの仕事よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 協調性と誠実性！ それ、僕が持ってるやつなのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: そうね。だから、まともさが弱いわけではないのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: ただし、この研究が見ているのは、関係が始まったあとの満足度なの。誰が最初に選ばれるかは、測っていないわ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: ここからは、研究そのものではなく、私の推論として聞いてちょうだい。約束を守る人かどうか、4分で見きわめられるかしら。困ったときに逃げない人かどうかは、どうかしら。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 分からないのだ…。何回か会って、何かあって、やっと分かるやつなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 日本の実際のデータでも、同じ形が出ているのよ。男性825人、女性757人。大手の結婚相談サービスに入会した人たちを、およそ1年4か月追いかけた研究が、2018年に出ているの。秋田大学と明星大学などの研究チームよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: お見合いを申し込まれた数で見ると、学歴が高い、収入が高い、背が高い、細身。どれも人気と結びついていたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: それ、僕にないものばかりな気がするのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: まだ半分よ。実際に結婚まで行ったかどうかで見ると、学歴も身長も体型も、結婚する確率とは結びついていなかったの。例外は収入だけ。
    speaker: めたん
    expression: smile
    pause_after: 2.0
  - text: 人気なのに、結婚できてないのだ！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: この研究が言えるのは、申し込まれる段階と、結ばれる段階で、効くものが違っていた、というところまでよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そこに、さっきの推論を重ねると、こうなるわ。まともさが弱いんじゃないのよ。効き始めるのが、遅いの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 遅いなら、その時間は、どこで手に入れるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
