scenes:
- id: 1
  title: フック（半年でマッチ3件）
  chapter_title: null
  narration:
  - text: めたん、僕、マッチングアプリを始めて半年になるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: プロフィールは何回も書き直したのだ。仕事も趣味も、具体的に書いたのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: それで、成立したマッチは、半年で3件なのだ。実際に会えたのは1人で、その1人とも、1回きりで終わったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 会う前で止まったのが2件、会ったあとで止まったのが1件。それは、こたえるわね。
    speaker: めたん
    expression: sad
    pause_after: 0.45
  - text: 僕、嘘はつかないし、約束も守るのだ。掲示板には「誠実な男ほどモテない」って書いてあったのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.35
  - text: 本当にそうなのだ？ 誠実にしてたら、損をするのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.9
  - text: 誠実な男性は本当にモテないのか、一緒に確かめましょう。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 先に、答えだけ言っておくわね。誠実さが嫌われている、という部分は違うわ。でも、誠実さは初対面では確かめようがない、という部分は当たっているの。
    speaker: めたん
    expression: explain
    pause_after: 1.2
  - text: 嫌われてはいない。でも、確かめようがない…。その違いが、僕には分からないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【半年の書き直し】夜の部屋でスマホを見る手元から始める（台本指定の静止画）。性別設定の注記は小さく（クレジット欄）
    from: 1
    slot: 1
    credit: '※本動画ではずんだもんは男の子という設定です／Photo: Jaroslav Maler / Pexels'
  - type: image
