- id: 1
  title: フック（半年でマッチ3件）
  chapter_title: null
  narration:
  - text: めたん、僕、マッチングアプリを始めて半年になるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: プロフィールは何回も書き直したのだ。仕事も趣味も、ちゃんと埋めたのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: それで、成立したマッチは、半年で3件なのだ。実際に会えたのは1人で、その1人とも、1回きりで終わったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 会う前で止まったのが2件、会ったあとで止まったのが1件。それは、こたえるわね。
    speaker: めたん
    expression: sad
    pause_after: 0.45
  - text: 僕、変なことは書いてないし、悪いこともしてないつもりなのだ。掲示板には「まともな男ほどモテない」って書いてあったのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.35
  - text: 本当にそうなのだ？ まともにしてたら、損をするのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.9
  - text: それを、一緒に確かめましょう。まともな男性は、本当にモテないのか。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 先に、答えの形だけ言っておくわね。まともさが嫌われている、という部分は違うわ。でも、まともさは最初のうちは見えない、という部分は当たっているの。
    speaker: めたん
    expression: explain
    pause_after: 1.2
  - text: 嫌われてはいない。でも、見えない…。その違いが、僕には分からないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
