- id: 13
  title: まともな男性は、何に負けているのか
  chapter_title: null
  narration:
  - text: ここまでを、四つにまとめるわね。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 一つ目。優しさは負けていないわ。実験でも、実際に会ったあとの評価でも、ちゃんと効いていたの。負けていたのは、意地悪な態度の方よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: そこは、疑わなくていいのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 二つ目。でも「まとも」という言葉には、人に良くする力しか入っていないの。自分から前に出る力は、抜けているわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕が数えた四つ、全部そっちだったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 三つ目。その前に出る力も、二種類あるのよ。威圧して従わせるやり方は、長く続く関係では避けられていたわ。好かれているのは、能力で尊敬される方ね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 威張る方じゃなくて、尊敬される方なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 四つ目。そして、まともさは効き始めるまでに時間がかかるの。なのに、その時間をくれていた出会い方が、この数十年で減ったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 四つとも、僕の人格が悪いって話じゃないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ。少なくとも、ずんだもんが悪い人だからではないわね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: まともな男性がモテなくなったんじゃないのよ。まともさが伝わる前に、判断が終わる場面が、増えたの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 伝わる前に、終わってるのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.35
  - text: じゃあ、僕はどうしたらいいのだ？ 真のモテ要素って、結局なんなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
