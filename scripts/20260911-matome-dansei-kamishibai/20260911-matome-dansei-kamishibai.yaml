- id: 8
  title: 僕の1回は、何だったのか（章カードなし・図解なし）
  chapter_title: null
  narration:
  - text: ここで少し、研究から離れましょう。ずんだもんの、その1回のデートの話を聞かせてほしいの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 会ったのは、カフェなのだ。1時間くらいだったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 何を話したの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 相手の仕事の話を聞いたのだ。趣味の話も聞いたのだ。僕は、聞かれたことに、まじめに答えたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 自分からは、何か切り出した？
    speaker: めたん
    expression: normal
    pause_after: 0.6
  - text: …切り出してないのだ。失礼があったら困るから、聞かれるまで待ってたのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: それ、さっきの二本のものさしで言うと、どっちの話かしら。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 人に良くする方、なのだ。前に出る方は、たぶん、ゼロなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 失礼がなかった、というのは、減点がなかった、ということね。相手から見て、ずんだもんがどんな人か分かる材料は、あったかしら。
    speaker: めたん
    expression: serious
    pause_after: 0.6
  - text: …ないのだ。僕、まじめに聞いてただけなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: それは、悪いことではないのよ。ただ、1回で伝わるのは、そこまでね。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  - text: 僕は「変な人じゃない」までは伝えられて、「どんな人か」は伝えてなかったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そういうことだと思うわ。そして、それでも2回目があれば、話は違ったかもしれないの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: でも、2回目に進めてる人って、モテてる人なのだ？ モテてる人は、そのまま結婚できてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
