- id: 3
  title: 「優しい男は損をする」は、本当なのか
  chapter_title: 『優しい男は損をする』は、本当なのか
  narration:
  - text: そこを最初に確かめましょう。いまの問いは、会ったあとの段階の話ね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2003年、サウスカロライナ大学の研究チームが、女子学生を相手に、こんな実験をしたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 二人の男性を、写真と紹介文で見せるの。一人は見た目の評価が高いけれど、態度が意地悪。もう一人は見た目の評価は低いけれど、感じがいい人よ。どちらがいいか、と聞いたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 顔がいい方なのだ。絶対そうなのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 選ばれたのは、感じがいい方だったの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: えっ、負けたのだ！？ 顔がいい方が負けたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.6
  - text: ええ。この実験は二度行われていて、48人でも194人でも、同じ方向の結果が出ているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 結婚相手にするなら、交際相手にするなら、友人にするなら。どの聞き方でも、感じのいい方が高く評価されたの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: でも、見た目と態度の両方が違うのだ。それ、優しさだけの力なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: いい疑問ね。この実験では、見た目の良さと態度の良さが、それぞれ別々に効いていたことも確かめられているわ。混ざってはいないのよ。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: この実験で評価が低かったのは、見た目のいい男性ではなく、態度が意地悪な男性の方だったの。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: じゃあ「優しい男は損をする」っていうのは、何だったのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: その言い方と関係が深い、別の研究もあるのよ。1999年、カナダのゲルフ大学の研究チームの調査よ。優しいけれど奥手な男性と、魅力的で経験の多い男性の、どちらを選ぶか聞いたの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 優しい方を選んだ女性が54パーセント。魅力的な方は18パーセントだったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 3倍じゃないか！ 言われてることと逆なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ただし、こちらは優しさ以外もいろいろ違う比較だから、この数字を優しさの力とは読めないわ。俗説のもとになった設定でも、優しい方が選ばれた、というところまでね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: じゃあ僕の「優しい」は、どこで止まってるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  beats:
