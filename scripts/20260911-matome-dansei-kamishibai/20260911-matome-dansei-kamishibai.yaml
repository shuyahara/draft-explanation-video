- id: 7
  title: 男らしさには、二種類ある
  chapter_title: null
  narration:
  - text: 待って。そこで急ぐと、間違えるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 人が高い位置に立つやり方には、二種類あるの。2013年、ブリティッシュコロンビア大学の研究チームが、二つを分けて測っているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 一つ目は、相手を威圧して従わせるやり方。怖がらせて、言うことを聞かせるのね。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 二つ目は、能力で尊敬されるやり方。この人はすごい、と思わせて、自然に耳を傾けてもらうのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: どっちも強そうなのだ。似たようなものじゃないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: それが、ほとんど関係がなかったの。二つの結びつきを表す数字は0.01。さっきの言い方なら、ほぼ0ね。片方が強い人ほどもう片方も強い、とは言えなかったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 本当に別物なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そして、好かれ方がまるで違うのよ。尊敬されるやり方は、好感度と強く結びついていたわ。威圧するやり方は、好感度とほとんど結びついていなかったの。好かれてはいないの。恐れられてはいても。
    speaker: めたん
    expression: normal
    pause_after: 2.0
  - text: でも、怖い人がモテてるのは見たことがあるのだ。あれは何なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: それも、完全に間違いではないのよ。2025年、トロント大学のニコラス・ルール教授たちが、そこを調べたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 短い関係を探している人ほど、威圧するやり方に強く惹かれていたの。数字は0.58。かなり高いわね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: やっぱりモテてるじゃないか！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ところが、長く続く関係を探している人では、マイナス0.55。好まれる、から、避けられる、へ変わるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: プラスからマイナス！？ 真逆なのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: いっぽう、尊敬されるやり方は、短くても長くても、どちらでもプラスのままだったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 威圧して従わせるやり方と、能力で尊敬されるやり方は、別物なのよ。好かれているのは、尊敬される方なの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: ここで言う「モテてる」は、短い関係の方の話なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そこを分けられたなら、大丈夫よ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: もう一つ断っておくわね。この二種類は、男らしさを全部二つに分けた、という話ではないの。高い位置に立つやり方を二つに分けた研究、ということよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: …めたん、僕、自分のあの1回を思い出して、嫌な予感がしてきたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 1.2
