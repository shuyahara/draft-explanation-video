- id: 2
  title: 三つの段階
  chapter_title: null
  narration:
  - text: ここで言う誠実さは、嘘をつかない、約束を守る、困ったときに逃げない、ということよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 全部、やってるつもりなのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: そして、この話は段階を分けないと混ざるの。出会いから付き合いが続くまでを、三つに分けるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 一つ目は、会う前。写真とプロフィールしか見えていない段階ね。二つ目は、初対面。実際に会って、数回目までよ。三つ目は、長い関係。付き合いが続いてからの段階ね。
    speaker: めたん
    expression: explain
    pause_after: 0.6
  - text: この三つで、選ばれやすくなる要素が違うの。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 僕は、会う前でも、初対面でも止まってるのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 誠実さが有利に働くのは、三つ目の段階、長い関係よ。会う前と初対面では、確かめようがないの。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: なのに今は、長い関係まで届く前に、判断が終わる出会い方が増えたの。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: 途中で、よく聞く常識が三つ、ひっくり返るわ。悪い男の方がモテるという説。恋人の3人に2人は友人から始まっている、という事実。そして、誠実さが伝わる時間を、昔は誰が用意していたか。
    speaker: めたん
    expression: explain
    pause_after: 0.7
  - text: ここから、会う前、初対面、長い関係の順に確かめるわ。
    speaker: めたん
    expression: normal
    pause_after: 2.0
  - text: 確かめようがないだけなら、まだいいのだ。でも、誠実な男は損をするって言う人もいるのだ。会う前から嫌われてるんじゃないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
