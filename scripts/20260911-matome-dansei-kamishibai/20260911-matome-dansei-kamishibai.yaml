- id: 3
  title: 「優しい男は損をする」は、本当なのか（会う前）
  chapter_title: 『優しい男は損をする』は、本当なのか
  narration:
  - text: 会う前の段階から始めましょう。写真と紹介文だけを見た相手に、優しい男性は損をするのか。これは実験されているのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2003年、サウスカロライナ大学の研究チームが、女子学生に二人の男性を写真と紹介文で見せたの。一人は見た目の評価が高いけれど、態度が意地悪。もう一人は見た目の評価は低いけれど、感じがいい。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 顔がいい方なのだ。絶対そうなのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 選ばれたのは、感じがいい方だったの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: えっ、顔がいい方が負けたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ええ。48人でも194人でも、同じ方向の結果よ。結婚相手でも、交際相手でも、友人でも、感じのいい方が高く評価されたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: でも、見た目と態度の両方が違うのだ。優しさだけの力なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: いい疑問ね。この実験では、見た目の良さと態度の良さが、別々に効いていたことも確かめられているの。混ざってはいないのよ。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: 評価が低かったのは、見た目のいい男性ではなく、態度が意地悪な男性の方だったの。紹介文で優しさが伝わりさえすれば、会う前でも負けていないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 伝わりさえすれば…。じゃあ僕のプロフィールの「まじめです」は、伝わってなかったのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: board
    cut_reason: 【道しるべ】章頭に三つの段階の板を出し、この章が①会う前の話だと示す
    from: 1
    telop: '三つの段階

      ①会う前＝写真とプロフィール ← いまここ

      ②会ったあと＝初対面〜数回

      ③続いてから＝関係が始まった後'
  - type: image
    cut_reason: 【二人の男性】カフェで向かい合う男性二人に替え、2003年の実験に入る
    from: 3
    slot: 1
    credit: 'Urbaniak & Kilmann (2003) Sex Roles 49(9/10)／Photo: RDNE Stock project / Pexels'
  - type: diagram
    cut_reason: 【実験の骨格】二人の男性→女子学生に聞いた→感じがいい方が選ばれた、を格子で見せる
