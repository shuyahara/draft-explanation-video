- id: 4
  title: 人は、誰に惹かれるか分かっているのか
  chapter_title: 人は、誰に惹かれるか分かっているのか
  narration:
  - text: そこを考えるために、会う前と、会ったあとを並べてみましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: まず、会う前の話ね。さっきと同じ2021年の調査で、女性に「結婚相手の男性の何を重視しますか」と聞いているの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: いちばん多かったのは「人柄」よ。重視すると答えた人は88.2パーセント。いっぽう「容姿」は18.8パーセントだったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: それなら僕の人柄、かなり有利なはずなのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 待って。ここからが本題よ。
    speaker: めたん
    expression: smile
    pause_after: 0.6
  - text: 2008年、ノースウェスタン大学のポール・イーストウィックたちが、163人の学生を集めて実験したの。当時の彼は、まだ博士課程の大学院生だったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: まず全員に、理想の相手に何を求めるかを書いてもらうの。そのあと、一人4分ずつ、9人から13人と実際に会ってもらったわ。数分ずつ相手を替えて話していく、スピードデートという形式ね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 書いたとおりの人を、ちゃんと好きになってたのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ほとんど、当たらなかったわ。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: ほとんど当たらなかったのだ？ じゃあ、何を基準に好きになってたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: それは次に見るわ。先に、この結果がどのくらい確かかを言っておくわね。2014年には、同じ問いを扱った97本の研究をまとめた分析も出ているの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 事前に挙げた理想に合う人ほど実際にも好きになる、という関係は、そこでもほとんど見られなかったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: それ、女性だけの話なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: いいえ。男性も同じだったの。自分が誰を好きになるかを、男女とも、うまく言い当てられなかったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: じゃあ、あの88.2パーセントは嘘なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 嘘とは言えないわ。「誠実な人がいい」という気持ちは本物よ。ただ、本人の答えだけでは、実際に誰に惹かれるかまでは分からないの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: それに、調査が聞いているのは結婚相手の条件で、実験が見ているのは初対面の惹かれ方。同じものさしではないわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 人は、自分がなぜその相手に惹かれたのかを、正確には説明できないことがあるの。聞かれると、理由をあとから、もっともらしく整えてしまうのよ。これは、この研究者たちが挙げている説明ね。
    speaker: めたん
    expression: normal
    pause_after: 2.5
  - text: 本人にも分からない…。
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
