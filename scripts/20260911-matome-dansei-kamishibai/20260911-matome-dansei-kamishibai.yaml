- id: 5
  title: 自信と積極性、そして「悪い男」（初対面②）
  chapter_title: 自信と積極性、そして『悪い男』
  narration:
  - text: 人の魅力は、二つに分けると見やすいの。一つは、人に良くする力。優しさ、誠実さ、思いやり。もう一つは、自信と積極性。自分から話しかける、姿勢や発言で堂々と見せる、という力よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 優しい人の反対が、自信のある人ってことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 反対ではないのよ。二つは別々のものさしで、両方高い人も、両方低い人もいるわ。
    speaker: めたん
    expression: smile
    pause_after: 1.0
  - text: そして、最初に決めた誠実さの中身を思い出して。嘘をつかない、約束を守る、逃げない。この中に、自信と積極性は入っていないわ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: あっ…。本当に入ってないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そして自信と積極性は、会った瞬間に見えるの。2016年、カリフォルニア大学バークレー校の研究チームが、スピードデートと出会い系アプリで試したわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 体を開いた、ゆったりした姿勢の人と、縮こまった姿勢の人を比べたの。開いていた人の方が、「また会いたい」と選ばれる見込みが、およそ1.76倍だったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 姿勢だけで！？ じゃあ僕、胸を張って、腕を組んで、声を低くすれば完璧なのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.35
  - text: 聞いたことあるのだ。ちょっと悪い男の方が、モテるって。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 待って。そこで急ぐと間違えるわ。自信の見せ方には、二種類あるの。相手を威圧して従わせるやり方と、能力で尊敬されるやり方。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 2025年、トロント大学のニコラス・ルール教授たちの研究があるわ。威圧するやり方に惹かれるのは、短い関係を探している人だけだったの。長く続く関係を探している人は、むしろ避けていたわ。尊敬されるやり方は、短い関係を望む人にも、長い関係を望む人にも好まれたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 悪い男が有利なのは、初対面の、しかも短い関係を探している相手にだけなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そういうことね。威張るんじゃなくて、尊敬される方よ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 初対面で有利に働くのは、見た目と、人当たりと、自信と積極性。この三つの中に、誠実さは入っていないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: でも、なんで人は、4分で見えるものに惹かれるようにできてるのだ？ 誠実さの方が、大事な気がするのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
