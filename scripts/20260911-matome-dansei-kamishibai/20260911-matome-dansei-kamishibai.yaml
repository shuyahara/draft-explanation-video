- id: 2
  title: 「まとも」の中身を、ほどく
  chapter_title: null
  narration:
  - text: まず、その「まとも」という言葉に何が入っているのか、一つずつ分けてみましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ずんだもんが自分をまともだと思うとき、頭に浮かんでいるのは、どんなことかしら。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: えっと…犯罪はしてないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: 浮気もしないのだ。ちゃんと働いてるのだ。人にも優しくしてるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: いいわ。今の四つを並べてみると、何か気づかないかしら。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: うーん…当たり前のことばかりなのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 犯罪をしない。浮気をしない。働いている。優しい。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 最初の二つは、「悪いことをしていない」という話ね。三つ目の「働いている」も、無職ではない、という意味で挙げているでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: あっ、そうなのだ。マイナスがない、って言ってるだけなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 四つのうち三つは、減点がないという話なの。相手に向かっているのは、四つ目だけよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: そしてこれは、ずんだもん一人の話ではないわ。数字も見ておきましょう。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 国立社会保障・人口問題研究所が、2021年に行った調査があるの。18歳から34歳の未婚男性のうち、72.2パーセントに交際相手がいなかったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 7割以上！ 僕だけじゃなかったのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 同じ調査で、結婚するつもりがあるのに独身の人に、理由も聞いているわ。25歳から34歳でいちばん多かったのは、調査の言葉で「適当な相手にまだめぐり会わない」。つまり、自分に合う相手とまだ出会っていない、ね。男性で43.3パーセントよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 断られてるんじゃなくて、出会えてないと感じてる人が多いのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ。ただ、この調査はその人が優しいかどうかまでは測っていないの。背景の数字として見てちょうだい。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: それと、先に決めておきたいことがあるわ。この話は、段階を分けないと混ざるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 写真とプロフィールしか見えていない、会う前。実際に会ったあと。そして、付き合いが始まってから。この三つで、効くものが違うの。
    speaker: めたん
    expression: normal
    pause_after: 0.6
  - text: 僕は、会う前でも、会ったあとでも止まってるのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: だから、三つとも見ていくわ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: でも、優しくしてるのに選ばれないなら…優しさが嫌われてるんじゃないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
