- id: 6
  title: なぜ、見た目と自信に惹かれるようにできたのか（起源）
  chapter_title: null
  narration:
  - text: いい問いね。それには、よく聞く言い方があるわ。「人間の脳は石器時代から変わっていない。だから恋愛の好みも、そのころのままだ」。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 聞いたことあるのだ。だから見た目と強さで選ばれる、って話なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 半分だけ、当たっているの。当たっている部分から言うわね。子どもを持つときの負担は、男女で同じではないでしょう？ 妊娠と授乳を抱える側の負担が、ずっと重いわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 1972年に提案された「親の投資」という考え方があるの。負担が重い側が相手を選ぶ側になり、軽い側が競う側になる、という説明よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 選ぶ側は、相手を短い時間で見きわめないといけない。だから、見て分かる手がかりが使われるようになった、と説明されるの。健康そうか、力がありそうか、周りから尊敬されているか。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 4分で見えるものに惹かれるのは、そういう仕組みだったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ここまでは、当たっている部分。言い過ぎの部分も言うわね。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 相手に求める条件は、社会によって変わるの。地位や経済力を求める男女の差は、男女が平等な国ほど小さいわ。石器時代のままなら、こうはならないでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ、どこが昔のままで、どこが変わったのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 残っているのは、相手を一瞬で、見た目と自信で判断する癖よ。変わったのは、その一瞬の判断だけで終わる出会い方が増えたことなの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 判断する癖は古くて、出会い方が新しいのだ。僕のアプリも、その一瞬で終わってたのだ。じゃあ、誠実さみたいに時間がかかるものは、いつ有利になるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
