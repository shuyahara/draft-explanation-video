- id: 2
  title: 「まとも」の中身と、三つの段階
  chapter_title: null
  narration:
  - text: まず、その「まとも」に何が入っているのか、分けてみましょう。ずんだもんが自分をまともだと思うとき、頭に浮かぶのはどんなことかしら。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 犯罪はしてないのだ。浮気もしないのだ。ちゃんと働いてるし、人にも優しくしてるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 最初の二つは「悪いことをしていない」。三つ目の「働いている」も、無職ではない、という意味で挙げているでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: あっ、そうなのだ。マイナスがない、って言ってるだけなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 四つのうち三つは、減点がないという話。相手に向かっているのは、四つ目だけよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: だから、この動画で言う「まとも」は、こう定義しておくわね。悪いことをしない。そして、相手に誠実である。この二つがそろっていることよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 減点がない、と、相手に向かう。二つで一組なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。そして、どちらも一目では分からないものよ。悪いことをしないかどうかは、見せて証明できないし、誠実さは、続けて初めて分かるの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そしてこれは、ずんだもん一人の話ではないわ。国立社会保障・人口問題研究所が、2021年に行った調査があるの。18歳から34歳の未婚男性のうち、72.2パーセントに交際相手がいなかったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 7割以上！ 僕だけじゃなかったのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ここで、先に決めておきたいことがあるの。この話は、段階を分けないと混ざるのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 写真とプロフィールしか見えていない、会う前。実際に会ったあと。そして、付き合いが始まってから。この三つで、効くものが違うわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕は、会う前でも、会ったあとでも止まってるのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: だから今日の結論も、先に一行で言っておくわね。モテる要素は、段階ごとに違うの。そして「まとも」は、最後の段階でしか効かない力なのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: なのに今は、そこまで届く前に、判断が終わってしまう。それを三つの段階で、順番に確かめていくわ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 相手に向いているのは、優しさだけなのだ。じゃあ僕が選ばれないのは、優しさが嫌われてるからなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【当たり前の暮らし】朝の駅のホームで「まとも」の中身をほどく前振り
    from: 1
    slot: 1
