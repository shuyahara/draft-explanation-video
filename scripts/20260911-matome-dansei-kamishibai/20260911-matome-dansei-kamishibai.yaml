- id: 6
  title: 優しさの隣に、何が足りないのか
  chapter_title: 優しさの隣に、何が足りないのか
  narration:
  - text: そこよ。ここからが、この動画のいちばん大事なところ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 人の魅力は、二つのものさしで見ると分かりやすいのよ。一つは、人に良くする力。優しさ、誠実さ、思いやりね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: もう一つは、自分から前に出る力。自信や積極性を、姿勢や発言で相手に見せることよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 優しい人の反対が、自信のある人ってことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そこが、いちばん勘違いされやすいところね。反対ではないのよ。二つは別々のものさしなの。両方高い人も、両方低い人もいるわ。
    speaker: めたん
    expression: smile
    pause_after: 1.0
  - text: 一本の線の右と左じゃないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ええ。だから「優しさを捨てて男らしくなれ」という話ではないの。優しさを減らしたからって、自信が上がるわけじゃないもの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 断っておくと、この二つで人の魅力が全部説明できる、という話でもないわ。人の評価を整理するのに、よく使われる二本、ということね。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そのうえで、さっきずんだもんが挙げた四つを、思い出してほしいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 犯罪をしない、浮気をしない、働いてる、優しい…。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 四つとも、問題を起こさないか、相手に良くするか、という話なの。自分から前に出る力は、一つも入っていないわ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: あっ…。本当に入ってないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: だから、「まとも」だと言えるだけでは、前に出る力までは伝わらないのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: その前に出る力が実際に効くことも、調べられているわ。2016年、カリフォルニア大学バークレー校の研究チームの実験よ。スピードデートと、出会い系のアプリの両方で試したの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 体を開いて、ゆったりした姿勢をしていた人と、縮こまった姿勢の人を比べたの。開いていた人の方が、「また会いたい」と選ばれやすさが、およそ1.76倍だったわ。アプリの方でも1.27倍よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 姿勢だけで！？ 性格じゃなくて、姿勢なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ただし、姿勢が伝えていたのが余裕だけ、とは限らないわ。自信、開放感、存在感。いろいろ混ざっているはずよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: それでも、胸を張れば効くのだ！ 腕も組んで、声も低くすれば完璧なのだ？
    speaker: ずんだもん
    expression: delighted
    pause_after: 1.2
