  - type: image
    cut_reason: 【再現性】大学の校舎に替え、二度の実験の人数を出す
    from: 10
    slot: 2
    credit: 'Photo: Pixabay'
    telop: 感じがいい方が選ばれた（N=48／N=194）
  - type: image
    cut_reason: 【交絡への疑問】別の校舎の絵に替え、感じの良さだけの力かという疑問と、その答えまで
