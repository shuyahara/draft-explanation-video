- id: 8
  title: 長い関係で有利なのは、誠実さ（長い関係②）
  chapter_title: 長い関係で有利なのは、誠実さ
  narration:
  - text: ええ、その根拠があるわ。ただし、ここで測っているのは、誰が選ばれるかではなく、付き合ってから満足しているかよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 性格検査で測った協調性と誠実性。人に合わせる力と、決めたことをやり通す力ね。これが高い人ほど、関係の満足度が高いの。19の調査、合わせて3,848人分をまとめた分析があるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2010年、オーストラリアのニューイングランド大学の准教授、ジョン・マラフたちの研究よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 協調性と誠実性！ それ、僕が持ってるやつなのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: つまり、関係が続くほど、誠実さは有利に働く。ただし、最初に選ばれるかどうかは、この研究では測っていないわ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: ここからは研究結果ではなく、私の推論よ。約束を守る人かどうか、4分で分かるかしら。困ったときに逃げない人かどうかは、どうかしら。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 分からないのだ…。何回か会って、約束や困りごとへの対応を見て、やっと分かるものなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 日本のデータでも、段階で有利なものが変わる、という同じ結果が出ているのよ。男性825人、女性757人。大手の結婚相談サービスに入会した人たちを、およそ1年4か月追跡した研究が、2018年に出ているの。秋田大学と明星大学などの研究チームよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: お見合いを申し込まれた数で見ると、学歴が高い、収入が高い、背が高い、細身。どれも、申し込まれる数の多さと関連していたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: それ、僕にないものばかりな気がするのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: まだ半分よ。実際に結婚したかどうかで見ると、学歴も身長も体型も、結婚する確率とは結びついていなかったの。例外は収入だけ。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  - text: 人気なのに、結婚できてないのだ！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: この研究が言えるのは、ここまでよ。申し込まれる段階と、結ばれる段階で、有利に働くものが違っていた。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 直接の証明ではないけれど、ここまでを重ねると、こう言えるわ。誠実さが弱いんじゃない。有利に働き始めるのが、遅いの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 遅いなら、その時間は、どこで手に入れるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
