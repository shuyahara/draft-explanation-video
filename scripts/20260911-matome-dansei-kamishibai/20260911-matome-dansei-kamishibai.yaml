- id: 10
  title: 遅れて効いてくるもの
  chapter_title: null
  narration:
  - text: やっと、ずんだもんの良さが分かる話になるわ。ここからは、付き合いが始まってからの段階ね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 協調性と誠実性の高い人は、関係の満足度も高い。それを、19の調査、合わせて3,848人分をまとめて確かめた分析があるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2010年、オーストラリアのニューイングランド大学の准教授、ジョン・マラフたちの仕事よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: どんな性格の人が、うまくいってたのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 協調性の高さ。誠実性の高さ。それに、感情が安定していること。この三つが、満足度と結びついていたわ。数字は0.25から0.29。強くはないけれど、はっきりプラスね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 協調性と誠実性！ それ、僕が持ってるやつなのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: そうね。だから、まともさが弱いわけではないのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: ただし、この研究が見ているのは、関係が始まったあとの満足度なの。誰が最初に選ばれるか、は測っていないわ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: 始まったあとの話なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ここからは、研究そのものではなく、私の推論として聞いてちょうだい。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 考えてみて。約束を守る人かどうか、4分で見きわめられるかしら。困ったときに逃げない人かどうかは、どうかしら。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 分からないのだ…。何回か会って、何かあって、やっと分かるやつなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: いっぽう、自分から前に出る力の方は、最初から見えるの。姿勢も、話し方も、会った瞬間に届くわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: しかも、別の研究もあるの。自信たっぷりに見える人への高い評価は、何週間かたつと下がっていく、と報告されているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 最初に高くて、あとから下がるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: まとめると、こういうことね。まともさが弱いんじゃないのよ。効き始めるのが、遅いの。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 遅いなら、その時間は、どこで手に入れるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
