- id: 10
  title: 結び（真のモテ要素とは何か）
  chapter_title: null
  narration:
  - text: 答えを整理するわね。モテる要素は、段階ごとに違う。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 会う前は、感じの良さまで。「まじめです」と書いても、誠実さは行動で見せないと確認できない。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕が半年やってたのは、そこなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 初対面は、見た目、人当たり、自信と積極性。そして長い関係で、初めて誠実さが有利に働く。恋人の3人に2人は、友人から始まっていたわね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 誠実さは、三つ目の段階の力なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。誠実さが弱いんじゃない。有利に働き始めるのが遅いの。そして、何度か会う機会を作っていた仲人や見合いが、この数十年でほぼ消えたわ。
    speaker: めたん
    expression: serious
    pause_after: 0.7
  - text: 誠実さが嫌われているから、ではないのよ。誠実さが伝わる前に判断が終わる場面が、増えたの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 伝わる前に、終わってるのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: だから、うまくいっていないことを、自分の人格のせいにしなくていいのよ。ただし、これをやれば必ずうまくいく、という話でもないわ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 誠実さは、持っているだけでは伝わらないの。何回か会える場所まで、行かないといけないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 僕、プロフィールだけを書き直し続けるのは、もうやめるのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: あら。どうするの。
    speaker: めたん
    expression: surprised
    pause_after: 0.45
  - text: 書き直すより、同じ人と何回か会える場所を探すのだ。友達から始まる恋が3人に2人なら、同じ人と何度か会える出会い方の方がいいのだ。その方が、僕の誠実さを知ってもらえる気がするのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: それは研究で確かめられた方法ではないけれど、筋は通っているわね。
    speaker: めたん
    expression: smile
    pause_after: 1.0
  - text: 頑張って、ずんだもん。
    speaker: めたん
    expression: delighted
    pause_after: 0.45
  - text: 頑張るのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 2.5
