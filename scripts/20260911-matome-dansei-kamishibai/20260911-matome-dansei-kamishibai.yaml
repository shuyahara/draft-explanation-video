- id: 5
  title: では、実際には何が効いていたのか
  chapter_title: null
  narration:
  - text: その実験では、実際に惹かれた度合いと、相手のどんな特徴が結びついていたかも測っているのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: いちばん強かったのは、見た目の魅力。次が、人当たりの良さ。三番目が、稼ぐ力よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: やっぱり顔なのだ…。いちばん上は変わらないのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 落ち込むのは早いわ。順位だけじゃなくて、数字の開きを見てちょうだい。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 見た目は0.43から0.46。人当たりの良さは0.29から0.32。稼ぐ力は0.16から0.19よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: その数字、何なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 二つのものごとが、どれくらい一緒に動くかを表す数字ね。0だと関係なし、1に近いほど強く結びついている、と思ってちょうだい。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: じゃあ、人当たりの良さは、稼ぐ力より上なのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そうなの。しかも、たった4分の会話の中で、そうなっていたわ。
    speaker: めたん
    expression: smile
    pause_after: 1.5
  - text: 報われるのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: ただ、言葉には気をつけましょうね。この研究が測った「人当たりの良さ」は、話していて感じがいい、という評価なの。約束を守るとか、責任感があるとか、そこまでは測っていないわ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 「優しい」と全部同じじゃないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ。その違いは、あとでもう一度出てくるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: それにしても、優しさが効くなら、僕は最初の4分で何を落としてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
