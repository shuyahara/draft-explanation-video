- id: 8
  title: その「時間」は、誰が用意していたのか（会う前・歴史）
  chapter_title: その『時間』は、誰が用意していたのか
  narration:
  - text: 実はその時間、昔は自分で用意しなくてよかったのよ。少しさかのぼるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 明治より前の村では、若い人どうしが自分で相手を選ぶ形も、ふつうにあったの。それが明治になって、結婚は家が決めるものになったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 明治の民法には、家族が結婚するには戸主の同意がいる、と書いてあるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 本人の気持ちだけじゃ、結婚できなかったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ええ。その代わりに、仲人が間に立った。この人はちゃんとした人ですよ、と保証して、何度か会う段取りまで整える役ね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 慶應義塾大学の准教授、阪井裕一郎さんの研究によればね。見合い結婚は古い伝統ではなく、明治以降に広まった近代の制度なのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 昔ながらだと思ってたのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 1947年、憲法に「婚姻は両性の合意のみに基いて成立する」と書かれたわ。結婚は制度として初めて、本人が選ぶものになったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: それでも仲人の慣行はしばらく残ったわ。首都圏の結婚式で仲人を立てた割合は、1994年で63.9パーセント。それが2001年には7.3パーセント。たった7年で、ほぼ消えたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 7年で、63パーセントから7パーセント！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 出会い方も同じ向きに動いたわ。1930年代に結婚した夫婦では見合い結婚が69.0パーセント。2019年から2021年では9.9パーセント。かわりにネットで出会った夫婦が15.2パーセントで、見合いを追い抜いたの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 見合いと仲人には、二つのものが先に付いていたのよ。周りの人の保証と、何度も会う時間。まともさが効き始めるまでの時間を、他人が用意してくれていたの。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: だから「モテる」なんて言葉、昔はあまり要らなかったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 鋭いわね。2008年に「婚活」という言葉を提唱したのは、中央大学の教授、山田昌弘さんたちよ。結婚が自動的にやって来る時代は終わった、という趣旨ね。「モテる」が切実な言葉になったのは、自分で見せる市場ができてからよ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 昔がよかった、という話ではないわよ。家が決める時代は、本人の気持ちより家柄だったのだから。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕はずっと、その市場の、会う前の段階で止まってたのだ。じゃあ結局、僕は何に負けてるのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 1.2
