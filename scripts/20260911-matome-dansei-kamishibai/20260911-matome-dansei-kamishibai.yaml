- id: 14
  title: 結び（真のモテ要素とは何か）
  chapter_title: null
  narration:
  - text: 研究から言えることなら、あるわ。ただし、これをやれば必ずうまくいく、という話ではないの。そこは先に言っておくわね。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: それでいいのだ。聞きたいのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 最初に決めた三つの段階ごとに、分けて答えるわ。全部が同じものさしに並んでいるわけではないから。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: まず、会ったあと。実際に人が惹かれていたのは、見た目の魅力、人当たりの良さ、そして能力で尊敬される強さね。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: この中で、人当たりの良さは、稼ぐ力より強く効いていたわ。尊敬される強さの方は、短い関係でも、長い関係でも、ずっとプラスだったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 威張る方じゃなくて、尊敬される方なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ええ。威圧する方は、短い関係では選ばれることがあっても、長く続く関係では避けられていたわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 次に、続いてから。協調性も誠実性も、ちゃんと効くの。ただし、関係が始まったあとで、ね。
    speaker: めたん
    expression: normal
    pause_after: 0.6
  - text: 始まったあと…。だから、始めるところが要るのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そして、会う前。ここがいちばん薄いわ。写真とプロフィールからは、優しさも誠実さも、ほとんど読み取れないもの。文字で「まじめです」と書いても、伝わらないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕が半年やってたのは、そこなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 繰り返し会って相手を知る機会が、以前より減っている。昔は他人が用意してくれた場所を、今は自分で見つけないといけないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: それが、いちばんむずかしいのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そうね。むずかしいわ。だから、うまくいっていないことを、自分の人格のせいにしなくていいのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: まともさは、持っているだけでは伝わらないの。伝わる場所まで、行かないといけないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 僕、プロフィールを書き直すのは、もうやめるのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: あら。どうするの。
    speaker: めたん
    expression: surprised
    pause_after: 0.45
  - text: 書き直すより、同じ人と何回か会える場所を探すのだ。そっちの方が、僕の誠実さを知ってもらえる気がするのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: それは、この動画の研究から出てきた見立てで、確かめられた方法ではないわ。でも、筋は通っているわね。
    speaker: めたん
    expression: smile
    pause_after: 2.5
