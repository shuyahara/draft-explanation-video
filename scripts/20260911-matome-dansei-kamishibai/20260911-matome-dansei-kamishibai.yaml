- id: 9
  title: モテることと、結ばれることは同じか
  chapter_title: モテることと、結ばれることは同じか
  narration:
  - text: いい問いね。そこ、日本のデータで確かめられているのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 男性825人、女性757人。大手の結婚相談サービスに入会した人たちを、およそ1年4か月追いかけた研究が、2018年に出ているの。秋田大学と明星大学などの研究チームよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 実際に結婚したかどうかまで、見たのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ。そこで、二つのものさしを分けて測ったの。お見合いを申し込まれた数と、実際に結婚まで行ったかどうかよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 申し込まれた数で見ると、男性はとても分かりやすかったわ。学歴が高いこと、収入が高いこと、背が高いこと、細身であること。どれも人気と結びついていたの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: それ、僕にないものばかりな気がするのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: まだ半分よ。もう一つのものさしを見てちょうだい。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 結婚まで行ったかどうかで見ると、学歴も、身長も、体型も、結婚する確率とは結びついていなかったわ。例外は、収入の高さだけよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 人気なのに、結婚できてないのだ！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 正確には、申し込まれやすい条件と、結婚まで行く条件が、一致していなかったということね。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: この研究では、理由も分析されているわ。条件のいい人ほど、相手を厳しく選ぶようになっていたの。申し込まれる数は増えても、自分も相手を絞るから、結果として決まりにくくなるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 選ばれる側になると、選ぶ方も厳しくなるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: モテることと、結ばれることは、別のものさしなのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: じゃあ、結ばれる方には何が効くのだ？ 僕が知りたいのは、そっちなのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
