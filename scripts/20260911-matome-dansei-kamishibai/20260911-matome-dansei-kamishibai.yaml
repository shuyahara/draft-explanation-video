- id: 7
  title: 恋は、いつ始まるのか（長い関係①）
  chapter_title: 恋は、いつ始まるのか
  narration:
  - text: ここからが、ずんだもんの良さが出てくる段階よ。長い関係の話ね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: まず、恋人どうしは、いつ恋に落ちているのか。カナダのビクトリア大学などの研究チームが、2022年にまとめた分析があるの。7つの調査、合わせて1,897人分よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 出会ってすぐ、なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 違ったの。カナダとアメリカの調査でね。今の恋人か直近の恋人と、付き合う前は友人だった、と答えた人が68パーセント。3人に2人よ。
    speaker: めたん
    expression: normal
    pause_after: 1.0
  - text: 3人に2人が、友達からなのだ！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: しかも、友人でいた期間は平均で約2年。そして7割の人は、最初は恋愛目的ではなく、知っていくうちに惹かれた、と答えているの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 初対面で決まってるわけじゃ、なかったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: もう一つ。テキサス大学オースティン校とノースウェスタン大学の研究チームの、2015年の研究よ。167組のカップルに、付き合う前にどれくらい知り合いだったかを聞いたの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 知り合って1か月以内に付き合い始めたカップルは、二人の見た目の良さが、よく釣り合っていたの。相関で0.72よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ところが、付き合う前に9か月以上知り合いだったカップルでは、見た目の釣り合いは消えていたの。
    speaker: めたん
    expression: explain
    pause_after: 1.5
  - text: 9か月で、見た目が関係なくなるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 関係なくなる、とまでは言えないわ。言えるのは、知り合う時間が長いほど、見た目以外のもので選ばれる、ということよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: じゃあ、その「見た目以外のもの」が、誠実さなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
