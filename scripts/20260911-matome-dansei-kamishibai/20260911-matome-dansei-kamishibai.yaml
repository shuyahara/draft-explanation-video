- id: 4
  title: 会ったあと、実際に効いていたのは何か（会ったあと①）
  chapter_title: null
  narration:
  - text: そこが、次の段階への入口ね。会う前の言葉を、もう一つ見ておくわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: さっきの2021年の調査で、女性に結婚相手の男性の何を重視するか聞いているの。いちばん多いのは「人柄」で、重視すると答えた人は88.2パーセント。「容姿」は18.8パーセントよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: それなら僕の人柄、かなり有利なはずなのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 待って。それは会う前の、言葉の話。会ったあとを測ったのが、この実験よ。
    speaker: めたん
    expression: smile
    pause_after: 0.6
  - text: 2008年、ノースウェスタン大学のポール・イーストウィックたちが、163人の学生を集めたの。当時の彼は、まだ博士課程の大学院生だったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: まず全員に、理想の相手に何を求めるかを書いてもらう。そのあと、一人4分ずつ、9人から13人と実際に会ってもらったの。数分ずつ相手を替えて話す、スピードデートという形式ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 書いたとおりの人を、ちゃんと好きになってたのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ほとんど、当たらなかったわ。男性も女性も、自分が誰に惹かれるかを、うまく言い当てられなかったの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: じゃあ、実際には何に惹かれてたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 惹かれた度合いと結びついていたのは、強い順に、見た目の魅力、人当たりの良さ、稼ぐ力。数字で言うと0.43、0.29、0.19よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: その数字、何なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 二つのものごとがどれくらい一緒に動くかを表す数字ね。0だと関係なし、1に近いほど強く結びついている、と思ってちょうだい。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: じゃあ、人当たりの良さは、稼ぐ力より上なのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そうなの。たった4分の会話でも、効いていたわ。
    speaker: めたん
    expression: smile
    pause_after: 1.5
  - text: ただし、ここで測った「人当たりの良さ」は、話していて感じがいい、という評価よ。約束を守るとか、責任感があるとか、そこまでは測っていないの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 「優しい」と全部同じじゃないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。「優しい」には、会ってすぐ見える感じの良さと、時間がかかる誠実さの二つが混ざっているの。「まとも」が指しているのは、後の方よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 会ったあとの段階で効くのは、4分で見える方だけなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そういうことね。そして、その4分で見えるものが、もう一つあるのよ。
    speaker: めたん
    expression: normal
