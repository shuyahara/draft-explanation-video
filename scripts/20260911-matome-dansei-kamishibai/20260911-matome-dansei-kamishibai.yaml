video:
  title: "なぜ\"まとも\"な男性はモテないのか ― 真のモテ要素とは何か（めたん×ずんだもん 紙芝居版）"
  kamishibai:
    puppet_sink_ratio: 0.12
  characters:
    - name: "めたん"
      speaker: "四国めたん"
      sprites_dir: "C:/Users/shuya/Projects/assets-kamishibai/sprites/metan"
      side: "left"
      subtitle_color: "#E8A0BE"
      default_expression: "normal"
    - name: "ずんだもん"
      speaker: "ずんだもん"
      sprites_dir: "C:/Users/shuya/Projects/assets-kamishibai/sprites/zundamon"
      side: "right"
      subtitle_color: "#8FCF7A"
      default_expression: "normal"
  bgm: "../bgm/meisou-no-piano.mp3"
  bgm_credit: "BGM:「瞑想のピアノ」lei（DOVA-SYNDROME）"
  sfx: "chic"
scenes:
  - id: 1
    title: "フック（半年でマッチ3件）"
    chapter_title: null
    narration:
      - text: "めたん、僕、マッチングアプリを始めて半年になるのだ。"
        speaker: "ずんだもん"
        expression: "normal"
        pause_after: 0.35
      - text: "プロフィールは何回も書き直したのだ。仕事も趣味も、ちゃんと埋めたのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.35
      - text: "それで、成立したマッチは、半年で3件なのだ。送った「いいね」は、数えるのをやめたのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "半年で3件。それは、こたえるわね。"
        speaker: "めたん"
        expression: "sad"
        pause_after: 0.45
      - text: "しかも、実際に会えたのは、そのうちの1人なのだ。その1人とも、1回きりで終わったのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "会う前で止まったのが2件、会ったあとで止まったのが1件、ということね。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "僕、そんなに変なことは書いてないと思うのだ。悪いことも、してないつもりなのだ。"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.35
      - text: "掲示板で「まともな男ほどモテない」って見たのだ。返信欄も「自分もそうだ」ばっかりだったのだ。"
        speaker: "ずんだもん"
        expression: "angry"
        pause_after: 0.45
      - text: "その言葉、私も見たことがあるわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "本当にそうなのだ？ まともにしてたら、損をするのだ？"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "それを、一緒に確かめましょう。まともな男性は、本当にモテないのか。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "先に、答えの形だけ言っておくわね。優しさが嫌われている、という部分は違うわ。でも、優しいだけでは最初に選ばれにくい、という部分は当たっているの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 1.2
      - text: "嫌われてはいない。でも、選ばれにくい…。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.35
      - text: "その違いが、僕には分からないのだ。"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 2
    title: "「まとも」の中身を、ほどく"
    chapter_title: null
    narration:
      - text: "まず、その「まとも」という言葉に何が入っているのか、一つずつ分けてみましょう。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "ずんだもんが自分をまともだと思うとき、頭に浮かんでいるのは、どんなことかしら。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "えっと…犯罪はしてないのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.35
      - text: "浮気もしないのだ。ちゃんと働いてるのだ。人にも優しくしてるのだ。"
        speaker: "ずんだもん"
        expression: "normal"
        pause_after: 0.45
      - text: "いいわ。今の四つを並べてみると、何か気づかないかしら。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.45
      - text: "うーん…当たり前のことばかりなのだ。"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.45
      - text: "犯罪をしない。浮気をしない。働いている。優しい。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "最初の二つは、「悪いことをしていない」という話ね。三つ目の「働いている」も、無職ではない、という意味で挙げているでしょう？"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "あっ、そうなのだ。マイナスがない、って言ってるだけなのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "四つのうち三つは、減点がないという話なの。相手に向かっているのは、四つ目だけよ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 1.5
      - text: "そしてこれは、ずんだもん一人の話ではないわ。数字も見ておきましょう。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "国立社会保障・人口問題研究所が2021年に行った調査では、18歳から34歳の未婚男性のうち、72.2パーセントに交際相手がいなかったの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "7割以上！ 僕だけじゃなかったのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "同じ調査で、結婚するつもりがあるのに独身の人に、理由も聞いているわ。25歳から34歳でいちばん多かったのは、調査の言葉で「適当な相手にまだめぐり会わない」。つまり、自分に合う相手とまだ出会っていない、ね。男性で43.3パーセントよ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "断られてるんじゃなくて、出会えてないと感じてる人が多いのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "ええ。ただ、この調査はその人が優しいかどうかまでは測っていないの。背景の数字として見てちょうだい。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "それと、先に決めておきたいことがあるわ。この話は、段階を分けないと混ざるのよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "写真とプロフィールしか見えていない、会う前。実際に会ったあと。そして、付き合いが始まってから。この三つで、効くものが違うの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "僕は、会う前でも、会ったあとでも止まってるのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "だから、三つとも見ていくわ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.45
      - text: "でも、優しくしてるのに選ばれないなら…優しさが嫌われてるんじゃないのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 3
    title: "「優しい男は損をする」は、本当なのか"
    chapter_title: "『優しい男は損をする』は、本当なのか"
    narration:
      - text: "そこを最初に確かめましょう。いまの問いは、会ったあとの段階の話ね。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "2003年、サウスカロライナ大学の研究チームが、女子学生を相手に、こんな実験をしたわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "二人の男性を、写真と紹介文で見せるの。一人は見た目の評価が高いけれど、態度が意地悪。もう一人は見た目の評価は低いけれど、感じがいい人よ。どちらがいいか、と聞いたの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "顔がいい方なのだ。絶対そうなのだ。"
        speaker: "ずんだもん"
        expression: "smug"
        pause_after: 0.45
      - text: "選ばれたのは、感じがいい方だったの。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.45
      - text: "えっ、負けたのだ！？ 顔がいい方が負けたのだ？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "ええ。この実験は二度行われていて、48人でも194人でも、同じ方向の結果が出ているわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "結婚相手にするなら、交際相手にするなら、友人にするなら。どの聞き方でも、感じのいい方が高く評価されたの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "でも、見た目と態度の両方が違うのだ。それ、優しさだけの力なのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "いい疑問ね。この実験では、見た目の良さと態度の良さが、それぞれ別々に効いていたことも確かめられているわ。混ざってはいないのよ。"
        speaker: "めたん"
        expression: "delighted"
        pause_after: 0.35
      - text: "この実験で評価が低かったのは、見た目のいい男性ではなく、態度が意地悪な男性の方だったの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.0
      - text: "じゃあ「優しい男は損をする」っていうのは、何だったのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.45
      - text: "その言い方と関係が深い、別の研究もあるのよ。1999年、カナダのゲルフ大学の研究チームが、優しいけれど奥手な男性と、魅力的で経験の多い男性の、どちらを選ぶか聞いたの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "優しい方を選んだ女性が54パーセント。魅力的な方は18パーセントだったわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "3倍じゃないか！ 言われてることと逆なのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "ただし、こちらは優しさ以外もいろいろ違う比較だから、この数字を優しさの力とは読めないわ。俗説のもとになった設定でも、優しい方が選ばれた、というところまでね。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "じゃあ僕の「優しい」は、どこで止まってるのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 1.2
  - id: 4
    title: "人は、誰に惹かれるか分かっているのか"
    chapter_title: "人は、誰に惹かれるか分かっているのか"
    narration:
      - text: "そこを考えるために、会う前と、会ったあとを並べてみましょう。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "まず、会う前の話ね。さっきと同じ2021年の調査で、女性に「結婚相手の男性の何を重視しますか」と聞いているの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "いちばん多かったのは「人柄」よ。重視すると答えた人は88.2パーセント。いっぽう「容姿」は18.8パーセントだったわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "それなら僕の人柄、かなり有利なはずなのだ。"
        speaker: "ずんだもん"
        expression: "smug"
        pause_after: 0.45
      - text: "待って。ここからが本題よ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.6
      - text: "2008年、ノースウェスタン大学のポール・イーストウィックたちが、163人の学生を集めて実験したの。当時の彼は、まだ博士課程の大学院生だったわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "まず全員に、理想の相手に何を求めるかを書いてもらうの。そのあと、一人4分ずつ、9人から13人と実際に会ってもらったわ。数分ずつ相手を替えて話していく、スピードデートという形式ね。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "書いたとおりの人を、ちゃんと好きになってたのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "ほとんど、当たらなかったわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.45
      - text: "ほとんど当たらなかったのだ？ じゃあ、何を基準に好きになってたのだ？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "それは次に見るわ。先に、この結果がどのくらい確かかを言っておくわね。2014年には、同じ問いを扱った97本の研究をまとめた分析も出ているの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "事前に挙げた理想に合う人ほど実際にも好きになる、という関係は、そこでもほとんど見られなかったわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "それ、女性だけの話なのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.45
      - text: "いいえ。男性も同じだったの。自分が誰を好きになるかを、男女とも、うまく言い当てられなかったわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "じゃあ、あの88.2パーセントは嘘なのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.45
      - text: "嘘とは言えないわ。「誠実な人がいい」という気持ちは本物よ。ただ、本人の答えだけでは、実際に誰に惹かれるかまでは分からないの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "それに、調査が聞いているのは結婚相手の条件で、実験が見ているのは初対面の惹かれ方。同じものさしではないわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "人は、自分がなぜその相手に惹かれたのかを、正確には説明できないことがあるの。聞かれると、理由をあとから、もっともらしく整えてしまうのよ。これは、この研究者たちが挙げている説明ね。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 2.5
      - text: "本人にも分からない…。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 1.2
  - id: 5
    title: "では、実際には何が効いていたのか"
    chapter_title: null
    narration:
      - text: "その実験では、実際に惹かれた度合いと、相手のどんな特徴が結びついていたかも測っているのよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "いちばん強かったのは、見た目の魅力。次が、人当たりの良さ。三番目が、稼ぐ力よ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "やっぱり顔なのだ…。いちばん上は変わらないのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "落ち込むのは早いわ。順位だけじゃなくて、数字の開きを見てちょうだい。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.35
      - text: "見た目は0.43から0.46。人当たりの良さは0.29から0.32。稼ぐ力は0.16から0.19よ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "その数字、何なのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.45
      - text: "二つのものごとが、どれくらい一緒に動くかを表す数字ね。0だと関係なし、1に近いほど強く結びついている、と思ってちょうだい。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "じゃあ、人当たりの良さは、稼ぐ力より上なのだ！"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "そうなの。しかも、たった4分の会話の中で、そうなっていたわ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 1.5
      - text: "報われるのだ！"
        speaker: "ずんだもん"
        expression: "delighted"
        pause_after: 0.45
      - text: "ただ、言葉には気をつけましょうね。この研究が測った「人当たりの良さ」は、話していて感じがいい、という評価なの。約束を守るとか、責任感があるとか、そこまでは測っていないわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.45
      - text: "「優しい」と全部同じじゃないのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "ええ。その違いは、あとでもう一度出てくるわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "それにしても、優しさが効くなら、僕は最初の4分で何を落としてるのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 6
    title: "優しさの隣に、何が足りないのか"
    chapter_title: "優しさの隣に、何が足りないのか"
    narration:
      - text: "そこよ。ここからが、この動画のいちばん大事なところ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "人の魅力は、二つのものさしで見ると分かりやすいのよ。一つは、人に良くする力。優しさ、誠実さ、思いやりね。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "もう一つは、自分から前に出る力。自信や積極性を、姿勢や発言で相手に見せることよ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "優しい人の反対が、自信のある人ってことなのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "そこが、いちばん勘違いされやすいところね。反対ではないのよ。二つは別々のものさしなの。両方高い人も、両方低い人もいるわ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 1.0
      - text: "一本の線の右と左じゃないのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "ええ。だから「優しさを捨てて男らしくなれ」という話ではないの。優しさを減らしたからって、自信が上がるわけじゃないもの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "断っておくと、この二つで人の魅力が全部説明できる、という話でもないわ。人の評価を整理するのに、よく使われる二本、ということね。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "そのうえで、さっきずんだもんが挙げた四つを、思い出してほしいのよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "犯罪をしない、浮気をしない、働いてる、優しい…。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "四つとも、問題を起こさないか、相手に良くするか、という話なの。自分から前に出る力は、一つも入っていないわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "あっ…。本当に入ってないのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "だから、「まとも」だと言えるだけでは、前に出る力までは伝わらないのよ。"
