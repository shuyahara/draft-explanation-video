- id: 6
  title: なぜ、そこに惹かれるようにできたのか（起源）
  chapter_title: なぜ、そこに惹かれるようにできたのか
  narration:
  - text: ここで、よく聞く言い方を一つ取り上げるわ。「人間の脳は石器時代から変わっていない。だから恋愛の好みも、そのころのままだ」。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 聞いたことあるのだ。だから見た目と強さで選ばれる、って話なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 半分だけ、当たっているの。当たっている部分から行くわね。子どもを持つときの負担は、男女で同じではないでしょう？ 妊娠と授乳を抱える側の負担が、ずっと重いわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 1972年に提案された「親の投資」という考え方があるの。負担が重い側が相手を選ぶ側になり、軽い側が競う側になる、という説明よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 選ぶ側と、競う側に分かれるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そして選ぶ側は、相手を短い時間で見きわめないといけない。だから、見て分かる手がかりが使われたの。健康そうか、力がありそうか、周りから一目置かれているか。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: さっきの「尊敬される力」もここに入るわ。有能な人のそばにいれば学べるから、人はそういう相手に自然と敬意を払う。その敬意が、魅力として読まれるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 4分で見えるものに惹かれるのは、そういう仕組みだったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ここまでは、当たっている部分。言い過ぎの部分も言うわね。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: まず「石器時代」は、一つの時代ではないの。この考え方を作った研究者自身が、そう書いているの。進化の環境は特定の時代や場所ではなく、たくさんの選択圧をまとめたものだ、と。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: それに、進化は止まっていない。2007年、ウィスコンシン大学のジョン・ホークスたちが、人の遺伝子を調べたわ。農耕が始まってからの方が、選択がむしろ速まっている、という報告よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そして何より、好みの中身は社会で動くわ。地位や経済力を求める男女の差は、男女が平等な国ほど小さいの。それに、口で言う好みが初対面の惹かれ方を予測しなかったことは、さっき見たとおりよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ、どこが変わってなくて、どこが変わったのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 手がかりを素早く読む仕組みは、古い。でも、誰が選んで、何回会えるかという仕組みは、ごく最近変わったの。ずれているのは、そこよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 読む側は昔のまま、会う仕組みだけ新しいのだ。じゃあ、まともさみたいに時間がかかるものは、いつ効くのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
