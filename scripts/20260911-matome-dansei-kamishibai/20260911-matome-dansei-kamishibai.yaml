video:
  title: "なぜ\"まとも\"な男性はモテないのか ― 真のモテ要素とは何か（めたん×ずんだもん 紙芝居版）"
  kamishibai:
    puppet_sink_ratio: 0.12
  characters:
    - name: "めたん"
      speaker: "四国めたん"
      sprites_dir: "C:/Users/shuya/Projects/assets-kamishibai/sprites/metan"
      side: "left"
      subtitle_color: "#E8A0BE"
      default_expression: "normal"
    - name: "ずんだもん"
      speaker: "ずんだもん"
      sprites_dir: "C:/Users/shuya/Projects/assets-kamishibai/sprites/zundamon"
      side: "right"
      subtitle_color: "#8FCF7A"
      default_expression: "normal"
  bgm: "../bgm/meisou-no-piano.mp3"
  bgm_credit: "BGM:「瞑想のピアノ」lei（DOVA-SYNDROME）"
  sfx: "chic"
scenes:
  - id: 1
    title: "フック（半年でマッチ3件）"
    chapter_title: null
    narration:
      - text: "めたん、僕、マッチングアプリを始めて半年になるのだ。"
        speaker: "ずんだもん"
        expression: "normal"
        pause_after: 0.35
      - text: "プロフィールは何回も書き直したのだ。仕事も趣味も、ちゃんと埋めたのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.35
      - text: "それで、成立したマッチは、半年で3件なのだ。実際に会えたのは1人で、その1人とも、1回きりで終わったのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "会う前で止まったのが2件、会ったあとで止まったのが1件。それは、こたえるわね。"
        speaker: "めたん"
        expression: "sad"
        pause_after: 0.45
      - text: "僕、変なことは書いてないし、悪いこともしてないつもりなのだ。掲示板には「まともな男ほどモテない」って書いてあったのだ。"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.35
      - text: "本当にそうなのだ？ まともにしてたら、損をするのだ？"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "それを、一緒に確かめましょう。まともな男性は、本当にモテないのか。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "先に、答えの形だけ言っておくわね。優しさが嫌われている、という部分は違うわ。でも、優しいだけでは最初に選ばれにくい、という部分は当たっているの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 1.2
      - text: "嫌われてはいない。でも、選ばれにくい…。その違いが、僕には分からないのだ。"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 2
    title: "「まとも」の中身と、三つの段階"
    chapter_title: null
    narration:
      - text: "まず、その「まとも」に何が入っているのか、分けてみましょう。ずんだもんが自分をまともだと思うとき、頭に浮かぶのはどんなことかしら。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "犯罪はしてないのだ。浮気もしないのだ。ちゃんと働いてるし、人にも優しくしてるのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "最初の二つは「悪いことをしていない」。三つ目の「働いている」も、無職ではない、という意味で挙げているでしょう？"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "あっ、そうなのだ。マイナスがない、って言ってるだけなのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "四つのうち三つは、減点がないという話。相手に向かっているのは、四つ目だけよ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 1.5
      - text: "そしてこれは、ずんだもん一人の話ではないわ。国立社会保障・人口問題研究所が、2021年に行った調査があるの。18歳から34歳の未婚男性のうち、72.2パーセントに交際相手がいなかったわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "7割以上！ 僕だけじゃなかったのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "ここで、先に決めておきたいことがあるの。この話は、段階を分けないと混ざるのよ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "写真とプロフィールしか見えていない、会う前。実際に会ったあと。そして、付き合いが始まってから。この三つで、効くものが違うわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "僕は、会う前でも、会ったあとでも止まってるのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "だから今日の結論も、先に一行で言っておくわね。モテる要素は、段階ごとに違うの。そして「まとも」は、最後の段階でしか効かない力なのよ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 1.0
      - text: "なのに今は、そこまで届く前に、判断が終わってしまう。それを三つの段階で、順番に確かめていくわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.0
      - text: "でも、優しくしてるのに選ばれないなら、やっぱり優しさが嫌われてるんじゃないのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 3
    title: "「優しい男は損をする」は、本当なのか（会ったあと①）"
    chapter_title: "『優しい男は損をする』は、本当なのか"
    narration:
      - text: "会ったあとの段階から始めましょう。優しい男性は損をするのか。これは実験されているのよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "2003年、サウスカロライナ大学の研究チームが、女子学生に二人の男性を写真と紹介文で見せたの。一人は見た目の評価が高いけれど、態度が意地悪。もう一人は見た目の評価は低いけれど、感じがいい。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "顔がいい方なのだ。絶対そうなのだ。"
        speaker: "ずんだもん"
        expression: "smug"
        pause_after: 0.45
      - text: "選ばれたのは、感じがいい方だったの。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.45
      - text: "えっ、顔がいい方が負けたのだ？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "ええ。48人でも194人でも、同じ方向の結果よ。結婚相手でも、交際相手でも、友人でも、感じのいい方が高く評価されたわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "でも、見た目と態度の両方が違うのだ。優しさだけの力なのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "いい疑問ね。この実験では、見た目の良さと態度の良さが、別々に効いていたことも確かめられているの。混ざってはいないのよ。"
        speaker: "めたん"
        expression: "delighted"
        pause_after: 0.35
      - text: "評価が低かったのは、見た目のいい男性ではなく、態度が意地悪な男性の方だったの。優しさは、会ったあとの段階で、ちゃんと効いているわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.0
      - text: "会ったあとで優しさが効くなら、僕はあの1回で、何を落としてたのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 4
    title: "会ったあと、実際に効いていたのは何か（会ったあと②）"
    chapter_title: null
    narration:
      - text: "それを調べた実験があるの。ただその前に、会う前の言葉を一つ見ておくわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "さっきの2021年の調査で、女性に結婚相手の男性の何を重視するか聞いているの。いちばん多いのは「人柄」で、重視すると答えた人は88.2パーセント。「容姿」は18.8パーセントよ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "それなら僕の人柄、かなり有利なはずなのだ。"
        speaker: "ずんだもん"
        expression: "smug"
        pause_after: 0.45
      - text: "待って。それは会う前の、言葉の話。会ったあとを測ったのが、この実験よ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.6
      - text: "2008年、ノースウェスタン大学のポール・イーストウィックたちが、163人の学生を集めたの。当時の彼は、まだ博士課程の大学院生だったわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "まず全員に、理想の相手に何を求めるかを書いてもらう。そのあと、一人4分ずつ、9人から13人と実際に会ってもらったの。数分ずつ相手を替えて話す、スピードデートという形式ね。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "書いたとおりの人を、ちゃんと好きになってたのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "ほとんど、当たらなかったわ。男性も女性も、自分が誰に惹かれるかを、うまく言い当てられなかったの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.45
      - text: "じゃあ、実際には何に惹かれてたのだ？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "惹かれた度合いと結びついていたのは、強い順に、見た目の魅力、人当たりの良さ、稼ぐ力。数字で言うと0.43、0.29、0.19よ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "その数字、何なのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.45
      - text: "二つのものごとがどれくらい一緒に動くかを表す数字ね。0だと関係なし、1に近いほど強く結びついている、と思ってちょうだい。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "じゃあ、人当たりの良さは、稼ぐ力より上なのだ！"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "そうなの。たった4分の会話でも、効いていたわ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 1.5
      - text: "ただし、ここで測った「人当たりの良さ」は、話していて感じがいい、という評価よ。約束を守るとか、責任感があるとか、そこまでは測っていないの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.45
      - text: "「優しい」と全部同じじゃないのだ。会ったあとの段階で効くのは、4分で見える分だけなのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "そういうことね。そして、その4分で見えるものが、もう一つあるのよ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 1.2
  - id: 5
    title: "優しさの隣に、何が足りないのか（会ったあと③）"
    chapter_title: "優しさの隣に、何が足りないのか"
    narration:
      - text: "人の魅力は、二つのものさしで見ると分かりやすいの。一つは、人に良くする力。優しさ、誠実さ、思いやり。もう一つは、自分から前に出る力。自信や積極性を、姿勢や発言で相手に見せることよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "優しい人の反対が、自信のある人ってことなのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "そこが勘違いされやすいところ。反対ではないのよ。二つは別々のものさしで、両方高い人も、両方低い人もいるわ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 1.0
      - text: "そのうえで、さっきの四つを思い出して。犯罪をしない、浮気をしない、働いている、優しい。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "四つとも、問題を起こさないか、相手に良くするか、という話なの。自分から前に出る力は、一つも入っていないわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "あっ…。本当に入ってないのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "そして前に出る力は、会った瞬間に見えるの。2016年、カリフォルニア大学バークレー校の研究チームが、スピードデートと出会い系アプリで試したわ。体を開いた、ゆったりした姿勢の人と、縮こまった姿勢の人を比べたの。開いていた人の方が、「また会いたい」と選ばれやすさがおよそ1.76倍だったわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "姿勢だけで！？ じゃあ僕、胸を張って、腕を組んで、声を低くすれば完璧なのだ！"
        speaker: "ずんだもん"
        expression: "delighted"
        pause_after: 0.45
      - text: "待って。そこで急ぐと間違えるわ。前に出る力にも、二種類あるの。相手を威圧して従わせるやり方と、能力で尊敬されるやり方。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "2025年、トロント大学のニコラス・ルール教授たちの研究があるわ。威圧するやり方に惹かれるのは、短い関係を探している人だけだったの。長く続く関係を探している人は、むしろ避けていたわ。尊敬されるやり方は、どちらでもプラスよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "威張るんじゃなくて、尊敬される方なのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "会ったあとの段階で効くのは、見た目と、人当たりと、前に出る力。そして「まとも」には、三つ目が入っていないのよ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.0
      - text: "でも、なんで人は、そんな4分で見えるものに惹かれるようにできてるのだ？ まともさの方が、大事な気がするのだ。"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 6
    title: "なぜ、そこに惹かれるようにできているのか（起源）"
    chapter_title: "なぜ、そこに惹かれるようにできているのか"
    narration:
      - text: "ここで、よく聞く言い方を一つ取り上げるわ。「人間の脳は石器時代から変わっていない。だから恋愛の好みも、そのころのままだ」。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "聞いたことあるのだ。だから見た目と強さで選ばれる、って話なのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "半分だけ、当たっているの。当たっている部分から行くわね。子どもを持つときの負担は、男女で同じではないでしょう？ 妊娠と授乳を抱える側の負担が、ずっと重いわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "1972年に提案された「親の投資」という考え方があるの。負担が重い側が相手を選ぶ側になり、軽い側が競う側になる、という説明よ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "選ぶ側と、競う側に分かれるのだ。"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "そして選ぶ側は、相手を短い時間で見きわめないといけない。だから、見て分かる手がかりが使われたの。健康そうか、力がありそうか、周りから一目置かれているか。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "さっきの「尊敬される力」もここに入るわ。有能な人のそばにいれば学べるから、人はそういう相手に自然と敬意を払う。その敬意が、魅力として読まれるのよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "4分で見えるものに惹かれるのは、そういう仕組みだったのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "ここまでは、当たっている部分。言い過ぎの部分も言うわね。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 1.0
      - text: "まず「石器時代」は、一つの時代ではないの。この考え方を作った研究者自身が、そう書いているの。進化の環境は特定の時代や場所ではなく、たくさんの選択圧をまとめたものだ、と。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "それに、進化は止まっていない。2007年、ウィスコンシン大学のジョン・ホークスたちが、人の遺伝子を調べたわ。農耕が始まってからの方が、選択がむしろ速まっている、という報告よ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "そして何より、好みの中身は社会で動くわ。地位や経済力を求める男女の差は、男女が平等な国ほど小さいの。それに、口で言う好みが初対面の惹かれ方を予測しなかったことは、さっき見たとおりよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "じゃあ、どこが変わってなくて、どこが変わったのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 0.45
      - text: "手がかりを素早く読む仕組みは、古い。でも、誰が選んで、何回会えるかという仕組みは、ごく最近変わったの。ずれているのは、そこよ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "読む側は昔のまま、会う仕組みだけ新しいのだ。じゃあ、まともさみたいに時間がかかるものは、いつ効くのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 1.2
  - id: 7
    title: "続いてから効くものは、なぜ最初に見えないのか（続いてから）"
    chapter_title: "続いてから効くものは、なぜ最初に見えないのか"
    narration:
      - text: "やっと、ずんだもんの良さが分かる段階の話になるわ。付き合いが始まってから、ね。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.35
      - text: "協調性と誠実性の高い人は、関係の満足度も高い。それを、19の調査、合わせて3,848人分をまとめて確かめた分析があるの。2010年、オーストラリアのニューイングランド大学の准教授、ジョン・マラフたちよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "協調性と誠実性！ それ、僕が持ってるやつなのだ！"
        speaker: "ずんだもん"
        expression: "delighted"
        pause_after: 0.45
      - text: "そうね。だから、まともさが弱いわけではないのよ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.35
      - text: "ただし、この研究が見ているのは、関係が始まったあとの満足度なの。誰が最初に選ばれるかは、測っていないわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 1.5
      - text: "ここからは、研究そのものではなく、私の推論として聞いてちょうだい。約束を守る人かどうか、4分で見きわめられるかしら。困ったときに逃げない人かどうかは、どうかしら。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "分からないのだ…。何回か会って、何かあって、やっと分かるやつなのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "日本の実際のデータでも、同じ形が出ているのよ。男性825人、女性757人。大手の結婚相談サービスに入会した人たちを、およそ1年4か月追いかけた研究が、2018年に出ているの。秋田大学と明星大学などの研究チームよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "お見合いを申し込まれた数で見ると、学歴が高い、収入が高い、背が高い、細身。どれも人気と結びついていたわ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "それ、僕にないものばかりな気がするのだ…。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "まだ半分よ。実際に結婚まで行ったかどうかで見ると、学歴も身長も体型も、結婚する確率とは結びついていなかったの。例外は収入だけ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 2.0
      - text: "人気なのに、結婚できてないのだ！？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "申し込まれる段階と、結ばれる段階で、効くものが違っていたということね。まともさが弱いんじゃないのよ。効き始めるのが、遅いの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "遅いなら、その時間は、どこで手に入れるのだ？"
        speaker: "ずんだもん"
        expression: "confused"
        pause_after: 1.2
  - id: 8
    title: "その「時間」は、誰が用意していたのか（会う前・歴史）"
    chapter_title: "その『時間』は、誰が用意していたのか"
    narration:
      - text: "実はその時間、昔は自分で用意しなくてよかったのよ。少しさかのぼるわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "明治より前の村では、若い人どうしが自分で相手を選ぶ形も、ふつうにあったの。それが明治になって、結婚は家が決めるものになったわ。明治の民法には、家族が結婚するには戸主の同意がいる、と書いてあるのよ。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.45
      - text: "本人の気持ちだけじゃ、結婚できなかったのだ？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "ええ。その代わりに、仲人が間に立った。この人はちゃんとした人ですよ、と保証して、何度か会う段取りまで整える役ね。慶應義塾大学の准教授、阪井裕一郎さんの研究によればね。見合い結婚は古い伝統ではなく、明治以降に広まった近代の制度なのよ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "昔ながらだと思ってたのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "1947年、憲法に「婚姻は両性の合意のみに基いて成立する」と書かれたわ。結婚は制度として初めて、本人が選ぶものになったの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "それでも仲人の慣行はしばらく残ったわ。首都圏の結婚式で仲人を立てた割合は、1994年で63.9パーセント。それが2001年には7.3パーセント。たった7年で、ほぼ消えたの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "7年で、63パーセントから7パーセント！？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "出会い方も同じ向きに動いたわ。1930年代に結婚した夫婦では見合い結婚が69.0パーセント。2019年から2021年では9.9パーセント。かわりにネットで出会った夫婦が15.2パーセントで、見合いを追い抜いたの。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "見合いと仲人には、二つのものが先に付いていたのよ。周りの人の保証と、何度も会う時間。まともさが効き始めるまでの時間を、他人が用意してくれていたの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.0
      - text: "だから「モテる」なんて言葉、昔はあまり要らなかったのだ？"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "鋭いわね。2008年に「婚活」という言葉を提唱したのは、中央大学の教授、山田昌弘さんたちよ。結婚が自動的にやって来る時代は終わった、という趣旨ね。「モテる」が切実な言葉になったのは、自分で見せる市場ができてからよ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.35
      - text: "昔がよかった、という話ではないわよ。家が決める時代は、本人の気持ちより家柄だったのだから。"
        speaker: "めたん"
        expression: "normal"
        pause_after: 0.35
      - text: "それと、今の市場では、近づく役が男性に偏っているの。2009年、さっきのイーストウィックたちが、350人でスピードデートをしたわ。席を移動する役を、男性から女性に入れ替えてね。すると「男性の方が相手を広く受け入れる」という差が、消えたの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "席を替えただけで、消えたのだ？"
        speaker: "ずんだもん"
        expression: "surprised"
        pause_after: 0.45
      - text: "座って待つ側が、選ぶ側になるのよ。それも、生まれつきではなく、席順で決まっていたということね。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.0
      - text: "僕はずっと、送る側で、移動する側だったのだ。じゃあ結局、僕は何に負けてるのだ？"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 1.2
  - id: 9
    title: "結び（真のモテ要素とは何か）"
    chapter_title: null
    narration:
      - text: "整理するわね。冒頭の一行に戻るわ。モテる要素は、段階ごとに違う。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "会う前。写真と文字からは、優しさも誠実さも、ほとんど読み取れない。「まじめです」と書いても、伝わらないの。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "僕が半年やってたのは、そこなのだ。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "会ったあと。効くのは、見た目、人当たりの良さ、そして前に出る力。威張る方ではなく、尊敬される方ね。人当たりの良さは、稼ぐ力より強く効いていたわ。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.35
      - text: "続いてから。協調性も誠実性も、ちゃんと効く。ただし、関係が始まったあとで。"
        speaker: "めたん"
        expression: "explain"
        pause_after: 0.45
      - text: "「まとも」は、三つ目の段階の力なのだ。"
        speaker: "ずんだもん"
        expression: "thinking"
        pause_after: 0.45
      - text: "そう。まともさが弱いんじゃない。効き始めるのが遅いの。そして、その時間を用意してくれていた仕組みが、この数十年で薄くなったわ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 0.35
      - text: "まともな男性がモテなくなったんじゃないのよ。まともさが伝わる前に、判断が終わる場面が、増えたの。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "伝わる前に、終わってるのだ…。"
        speaker: "ずんだもん"
        expression: "sad"
        pause_after: 0.45
      - text: "だから、うまくいっていないことを、自分の人格のせいにしなくていいのよ。ただし、これをやれば必ずうまくいく、という話でもないわ。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 0.35
      - text: "まともさは、持っているだけでは伝わらないの。伝わる場所まで、行かないといけないのよ。"
        speaker: "めたん"
        expression: "serious"
        pause_after: 2.5
      - text: "僕、プロフィールを書き直すのは、もうやめるのだ。"
        speaker: "ずんだもん"
        expression: "smug"
        pause_after: 0.45
      - text: "あら。どうするの。"
        speaker: "めたん"
        expression: "surprised"
        pause_after: 0.45
      - text: "書き直すより、同じ人と何回か会える場所を探すのだ。そっちの方が、僕の誠実さを知ってもらえる気がするのだ。"
        speaker: "ずんだもん"
        expression: "smile"
        pause_after: 0.45
      - text: "それは研究で確かめられた方法ではないけれど、筋は通っているわね。"
        speaker: "めたん"
        expression: "smile"
        pause_after: 2.5
