- id: 4
  title: 初対面で有利なのは、何か（初対面①）
  chapter_title: null
  narration:
  - text: 初対面の4分で、どんな男性が選ばれるのか。その答えを示す実験があるの。
    speaker: めたん
    expression: explain
    pause_after: 0.6
  - text: ノースウェスタン大学のポール・イーストウィックたちが、2008年に発表した実験よ。163人の学生を集めたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: まず全員に、理想の相手に何を求めるかを書いてもらう。そのあと、一人4分ずつ、9人から13人と実際に会ってもらったの。数分ずつ相手を替えて話す、スピードデートという形式ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 会う前に書いたとおりの人を、ちゃんと好きになってたのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ほとんど、当たらなかったわ。男性も女性も、自分が誰に惹かれるかを、事前に言い当てることはできなかったの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: じゃあ、実際には何に惹かれてたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 惹かれた度合いと結びついていたのは、強い順に、見た目の魅力、人当たりの良さ、稼ぐ力。結びつきの強さを1までの数字で表す相関係数で、0.46、0.32、0.16よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 1に近いほど、強いのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そう。0なら関係なし。1に近いほど、強く結びついているの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: じゃあ、やっぱり見た目がいちばんなのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そう。初対面でいちばん有利に働いたのは、見た目。ここは正直に認めましょう。4分の会話は、見えるものが勝つ段階なのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: ただ、二番目の人当たりの良さは、稼ぐ力より上よ。人当たりは、初対面でもちゃんと有利に働いているの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ僕、初対面では分が悪いのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ただし、ここで測った「人当たりの良さ」は、話していて感じがいい、という評価よ。嘘をつかないとか、約束を守るとか、そこまでは測っていないの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 誠実さとは、別なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。人当たりの良さは、すぐ見える。誠実さは、時間がかかる。初対面で有利に働くのは、すぐ見える方だけよ。
    speaker: めたん
    expression: explain
    pause_after: 0.8
  - text: 僕が持ってるのは、時間がかかる方なのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そして、初対面で有利に働くものが、もう一つあるのよ。
    speaker: めたん
    expression: normal
    pause_after: 1.2
  beats:
  - type: board
    cut_reason: 【道しるべ】章カードは無いがここから段階が変わるので、冒頭に板を出す（②初対面）
    from: 1
    telop: '三つの段階

      ①会う前＝写真とプロフィール

      ②初対面＝会って数回まで

      ③長い関係＝付き合いが続いてから'
