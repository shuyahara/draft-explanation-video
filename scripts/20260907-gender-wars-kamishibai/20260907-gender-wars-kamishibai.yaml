scenes:
- id: 1
  title: フック（燃えている投稿を見た夜）
  chapter_title: null
  narration:
  - text: めたん、昨日の夜、寝る前にちょっとだけスマホを見たのだ。
    speaker: ずんだもん
    expression: sleepy
    pause_after: 0.35
  - text: そうしたら、男の人と女の人が、激しい言葉でお互いを責め合ってたのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.35
  - text: たった一つの投稿に、怒りのコメントが何百件も付いてたのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: それで、どうなったの？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 見るのをやめられなかったのだ。気づいたら一時間たってたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.35
  - text: しかも、こういうの、前にも何回も見た気がするのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: よくある光景ね。おごるか割り勘か、家事は誰がするのか、給料の差は誰のせいか。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そんなところが、入り口になるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: ねえ、めたん。僕、だんだん分からなくなってきたのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: 世の中の男の人と女の人って、本当にあんなに憎み合ってるのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そこに引っかかったのは、大事なことよ。その感覚は、的外れじゃないと私は思っているの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: え、あれが本当じゃないってことなのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そこを、今日は一緒に確かめていきましょうか。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 先に一つだけ言っておくとね。
    speaker: めたん
    expression: smug
    pause_after: 0.35
  - text: ああいう炎上に書き込んでいる人は、二百人に一人ほどなのよ。
    speaker: めたん
    expression: smug
    pause_after: 0.7
  - text: 二百人に一人！？ あんなに大勢いるように見えたのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: その話は、あとでするわ。まずは、何を「炎上」と呼ぶのかをそろえておきましょう。
    speaker: めたん
    expression: normal
    pause_after: 1.2
  readings:
  - surface: 怒り
    reading: イカリ
  - surface: 何百件
