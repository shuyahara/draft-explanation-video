    from: 14
    slot: 3
    credit: 'Photo: Pixabay'
  - type: board
    cut_reason: 【決め文】答えられる問いの範囲を黒板の文字で。間 1.5 秒を保持
    from: 15
    telop: '断言できないこと：対立が本物かどうか

      数えられること：あの激しさが誰の声でできているか'
  - type: image
    cut_reason: 【次章へ】スマホの別カットで「怒った投稿ばかり広がる」の問いへ
    from: 17
    slot: 4
    credit: 'Photo: Jakub Zerdzicki / Pexels'
