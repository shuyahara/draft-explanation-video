    credit: 'Photo: Sound On / Pexels'
- id: 2
  title: 何を確かめれば答えが出るのか
  chapter_title: null
  narration:
  - text: ずんだもんの疑問は「なぜ男女の論争は炎上しやすいのか」だったわね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 答えを急ぐより、三つに分けて見ていきましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 三つもあるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 一つ目は、そもそもどんな言葉の投稿が広がるのか。二つ目は、なぜ男女の話だと特に燃えるのか。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 三つ目は、燃えているのは誰で、どうして世の中全体の対立に見えるのか、ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 一つ目と二つ目で、炎上しやすい理由は分かりそうなのだ。三つ目は何のためなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 燃え広がる仕組みだけ見ていると、世の中が二つに割れているように思えてしまうの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: でも、実際に書いている人を数えると、見え方が変わるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: 数えるのだ？ 炎上する人の数を数えるなんて、考えたことなかったのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: じゃあ、一つ目なのだ。どうして、あんなに怒った投稿ばかり広がるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【問いの確認】ニュースサイトを見る手元。ずんだもんの疑問を確かめ直す（定義の板は直編集で台詞ごと削除）
    from: 1
    slot: 1
    credit: 'Photo: Michael Burrows / Pexels'
  - type: board
    cut_reason: 【この動画で確かめること】三つの問いを黒板の文字で（番号付き）
    from: 2
    telop: '今日確かめる三つのこと

      ① どんな言葉が広がるのか

      ② なぜ男女の話は特に燃えるのか

      ③ 燃えているのは誰か'
  - type: image
    cut_reason: 【三つに分ける理由】人混みの遠景へ。誰が・見え方まで調べる理由
