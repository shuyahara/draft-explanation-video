- id: 11
  title: 結び
  chapter_title: null
  narration:
  - text: それじゃあ、最初の疑問に戻りましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: なぜ男女の論争は、こんなに炎上しやすいのか。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕の言葉でまとめてみるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: まず、怒りや否定的な言葉と、相手をひとまとめに名指しする言葉があるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: そういう言葉が入った投稿は、広がりやすいのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: しかも、反応の多い順に並ぶ画面が、そういう投稿をもっと目立たせるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: そして男女の話は、ほとんどの人がどちらかの当事者なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: 「男は」「女は」という言い方が、そのまま敵の名指しになるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: そこには、不満の言葉も入りやすいのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: だから、他の話題より燃えやすいのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.8
  - text: よくまとまったわね。それが、最初の疑問への答えよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: それと、実際に書き込んでるのは、ネットを使う人の0.5パーセントだったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: 反応がつくと、書き続けやすくなるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: だから、少ない人の声が、世の中全部の声みたいに見えるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: あなたが見たのは、男の人と女の人が争っている場面に見えたわね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: でも、実際に書いていたのは、ごく一部の人だったかもしれないのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 世の中全体が憎み合っているかどうかは、あの画面の激しさだけでは判断できないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.7
  - text: ただ、ここで忘れちゃいけないこともあるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 見え方が作られていても、怒りのもとになっている問題まで消えるわけじゃないの。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 賃金の差や家事の時間の偏りのように、画面の外で解かれていない問題は残っているの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: それは、男性にも女性にもあるのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 炎上が静かになっても、それは残るのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そう。だから、画面の激しさに慣れて、現実の問題への関心まで失わないでほしいの。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: 燃えてるのを見て、「またやってる」で終わらせないってことなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: じゃあ、また今日も炎上している投稿を見たら、僕はどう受け止めればいいのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 燃えている投稿を見たら、思い出してほしいの。
    speaker: めたん
    expression: normal
    pause_after: 0.4
  - text: 男女の論争が燃えやすいのは、みんなが憎み合っているからじゃないの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 燃えやすい言葉と、全員が当事者になる話題が、重なっているから。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: それが、憎み合いのように見えているのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
