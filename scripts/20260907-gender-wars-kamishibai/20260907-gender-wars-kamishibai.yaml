    from: 11
    slot: 4
    credit: 'Photo: JESHOOTS / Pexels'
  - type: diagram
    cut_reason: '【比較: 同一研究内】道徳・感情の言葉を1倍としたときの、相手を名指しする言葉の効き目'
    from: 13
    diagram:
