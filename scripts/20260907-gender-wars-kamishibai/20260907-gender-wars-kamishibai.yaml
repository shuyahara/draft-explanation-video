- id: 4
  title: 相手を名指しする言葉
  chapter_title: null
  narration:
  - text: それもあるけど、それだけじゃないのよ。もっと広がりやすい言葉があるの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 怒りより広がる言葉があるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 相手をひとまとめにして、「あいつら」と呼ぶ言葉よ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: ……ただ、そう呼ぶだけなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ケンブリッジ大学とニューヨーク大学の共同研究が、2021年に調べているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ニュースメディアや政治家のアカウントの投稿を、273万件分析したの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 敵として見る相手を指す言葉が一つ入ると、シェアされる確率がおよそ67パーセント高かったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 67パーセント！ さっきの二割より、ずっと大きいのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ここは注意してね。さっきの二割は、別の研究の数字よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: この研究の中で、道徳や感情の言葉、つまり怒りや非難の言葉の効き目と比べると、およそ6.7倍だったの。
    speaker: めたん
    expression: explain
    pause_after: 0.6
  - text: 同じ研究の中で比べた数字なのだ。それなら分かるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 自分の側をほめた投稿と比べても、相手側を責めた投稿はおよそ2倍シェアされていたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: ほめる方が、負けちゃうのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 拡散をいちばん強く押し上げるのは、怒りそのものより、相手を名指しする言葉なのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.8
  - text: でも、広がるってことは、読む人がそういう投稿を見たがってるってことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  readings:
  - surface: 怒り
    reading: イカリ
  - surface: 拡散
    reading: カクサン
  - surface: 6.7倍
    reading: ロクテンナナバイ
  beats:
  - type: image
    cut_reason: 【転換】スマホに文字を打つ指先（別カット）。もっと広がる言葉の予告
    from: 1
    slot: 1
