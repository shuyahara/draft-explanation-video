- id: 9
  title: なぜ少数の声が、世の中の声に見えるのか
  chapter_title: なぜ少数の声が大きく見えるのか
  narration:
  - text: そこが、ここまでの話が一本につながるところよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 仮想敵を名指しする言葉が入った投稿は、広がりやすい。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そして、そういう投稿を書いているのは、ごく一部の人だったわね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 広告で収入を得るサービスでは、長く見てもらえるほど売り上げにつながるでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: その結果、反応を集める投稿ほど、多くの人の目に入る場所へ出やすくなるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 少ない人の声が、繰り返し目立つ場所に出てくるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: この流れは、日本の男女論でも実際に観察されているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ある女性ジャーナリストに向けられた中傷の返信を調べた研究があるの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 2800件あまりを分類したのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 2800件も送られてきたのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 攻撃の中心にいたのは、ごく少数の、フォロワーの多い人だったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: その投稿を引用したり、まねて書いたりする人が続くの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 最後に、内容に関係なく攻撃に加わる人が増えていったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 研究チームは、そういう三つの層が重なる形を見つけたのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 大勢に見えても、最初に動かしてるのは、ほんの何人かなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 少数の声でも、実際の人数よりずっと大きく見える形で、画面に出てくるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
  - text: 画面の中は、そうやってできてるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: 今度は、画面の外を見たいのだ。日本の人たち全体は、本当に男と女で二つに割れてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
