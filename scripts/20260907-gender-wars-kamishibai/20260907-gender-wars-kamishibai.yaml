    from: 23
    slot: 8
    credit: 'Photo: Pixabay'
- id: 2
  title: 何を確かめれば答えが出るのか
  chapter_title: null
  narration:
  - text: 「炎上」って、こういう状態のことよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 短い間に批判や非難がどっと集まって、まとめサイトやニュースにまで広がる。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 昨日見たやつは、まさにそれなのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: そうね。それで、ずんだもんの疑問は「世の中は本当に憎み合っているのか」だったわね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 答えを急ぐより、三つに分けて見ていきましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 三つもあるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 一つ目は、何があの激しさを作るのか。二つ目は、実際に書いているのは誰なのかよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 三つ目は、その声がどうして、世の中全体の声みたいに見えるのか、ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: あ。「本当に憎み合ってるか」を、そのまま調べるんじゃないのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ええ。世の中全体が本当に対立しているかどうかは、私には断言できないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: でも、あの激しさが誰の声でできているかなら、数えられるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: 数えられるなら、僕にも分かりそうなのだ。
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.35
  - text: じゃあ、最初の疑問なのだ。どうして、あんなに怒った投稿ばかり広がるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  beats:
  - type: board
    cut_reason: 【主題の定義】この動画で言う「炎上」を黒板の文字で
    from: 1
    telop: '「炎上」とは

      短い間に批判や非難がどっと集まり

      まとめサイトやニュースにまで広がること'
  - type: image
    cut_reason: 【当てはめ】ニュースサイトの別カットで、昨日見たものと重ねる
    from: 3
    slot: 1
    credit: 'Photo: Michael Burrows / Pexels'
  - type: board
    cut_reason: 【この動画で確かめること】三つの問いを黒板の文字で（番号付き）
    from: 6
    telop: '今日確かめる三つのこと

      ① 何があの激しさを作るのか

      ② 実際に書いているのは誰か

      ③ なぜ世の中全体の声に見えるのか'
  - type: image
    cut_reason: 【直接は測れない】人混みの遠景へ。世の中全体は直接測れない話
