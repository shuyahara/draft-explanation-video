- id: 12
  title: 結び
  chapter_title: null
  narration:
  - text: それじゃあ、最初の疑問に戻りましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 世の中は、本当にあんなに憎み合っているのか。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 僕の言葉でまとめてみるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: まず、道徳や感情に触れる言葉や、相手をひとまとめに名指しする言葉。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: そういう言葉が入った投稿は、広がりやすいのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: しかも、反応の多い順に並ぶ画面では、そういう投稿がもっと目立つのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: 男女の話は、多くの人が自分に関わる話として受け取るのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: だから「男は」「女は」と言われるたび、責められたと感じる人が出るのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: それでも、炎上に書き込んでるのは、ネットを使う人の0.5パーセント。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: 反応がつくと、強い言葉を書き続けやすくなる人もいるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: だから、少ない人の声が、世の中全部の声みたいに見えてたのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: よくまとまったわね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 「本当にみんなが憎み合ってるの？」というあなたの感覚の方が、数字に近かったのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕の勘、当たってたのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: あなたが見たのは、男の人と女の人が争っている場面に見えたわね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: でも、実際に書いていたのは、ごく一部の人だったかもしれないのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 世の中全体が憎み合っているかどうかは、あの画面の激しさだけでは判断できないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ただ、ここで忘れちゃいけないこともあるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 見え方が作られていても、問題そのものは消えないの。
    speaker: めたん
    expression: serious
    pause_after: 0.7
  - text: 賃金の差も、家事の時間も、入試の点数も、画面の外にある問題として残っているのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 炎上が静かになっても、それは残るのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そう。だから、画面の激しさに慣れて、現実の問題への関心まで失わないでほしいの。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: 燃えてるのを見て、「またやってる」で終わらせないってことなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: ……でも、今夜も指が止まらなくなったら、僕はどうしたらいいのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 画面で見たものを、世の中そのものだと思わないこと。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: それだけでも、だいぶ変わるわ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: ここで言う声の大きさは、どれだけ目立つか、ということね。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 声の大きさは、正しさでもないし、多数でもないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
