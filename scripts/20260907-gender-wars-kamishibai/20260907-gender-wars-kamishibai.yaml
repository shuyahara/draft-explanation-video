- id: 5
  title: 怒りではなく悲しみ／並べているのは誰か
  chapter_title: null
  narration:
  - text: そこも、意外な結果が出ているの。ただ、今度は別の行動の話よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 別の行動？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: さっきまでは、投稿を広めるかどうかの話。今度は、見出しを開くかどうかの話ね。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: あるニュースサイトが実際にやっていた比べ方を見ましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 同じ記事に見出しを二通り用意して、どちらがよく読まれるかを日々比べていたの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 見出しだけ変えて、勝負させてたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: その記録を、ニューヨーク大学などの研究チームが2023年に分析したわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: クリック570万回分よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 見出しを変えるだけで、そんなに差がつくのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: つくのよ。「悪い」「つらい」といった否定的な言葉が一つ増えるごとにね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: クリック率は2.3パーセントほど高かったの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: その否定的な言葉って、怒りの言葉だったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: それが、怒りの言葉には、はっきりした関連が出なかったのよ。
    speaker: めたん
    expression: surprised
    pause_after: 0.7
  - text: 出なかったのだ！？ じゃあ、何が効いてたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 悲しさを感じる見出しの方ね。怒りを出した見出しより、そちらが開かれていたの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 人間って、思ってたより単純じゃないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ここまでは、自分で何を開くかの話ね。でも、もう一つ大事なことがあるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そもそも、何が目の前に並ぶのか。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: ……並べる側の話なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: それを調べたのが、コーネル・テックやカリフォルニア大学バークレー校の研究チームよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 利用者に二つの画面を見せたの。反応の多い順の画面と、時間順の画面ね。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 反応の多い順の画面には、怒りを表す投稿がはっきり多く出ていたわ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: やっぱり、怒ってる投稿が上に出やすかったのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ええ。ただ、誰かが怒りを選んで並べたわけではないの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 反応の多い順に並べた結果として、怒りの投稿が上に来ていたのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: でも同じ研究で、利用者はその画面を、特に好んではいなかったわ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 自分でも好きじゃない画面が、勝手に並んでたのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 画面に上がってくるのは、私たちが見たいものというより、反応が多かったものなのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.6
  - text: でも、めたん。それなら政治の話も、宗教の話も、同じ仕組みが働くはずなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: なのに、どうして男女の話は、特によく燃えてるように見えるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
