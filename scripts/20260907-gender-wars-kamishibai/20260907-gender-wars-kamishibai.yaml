  - surface: 炎上
    reading: エンジョウ
- id: 3
  title: 何が対立を燃え上がらせるのか
  chapter_title: 何が対立を燃え上がらせるのか
  narration:
  - text: 手がかりは、人が怒るときの気持ちを調べた心理学にあるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: イェール大学の心理学者、クロケットが2017年にまとめた考え方があるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ネットには、怒りを書き込みやすくする仕組みが三つある、という考え方よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 三つ？ どんな仕組みなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 一つ目は、怒るきっかけを見る回数が増えること。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 二つ目は、怒りを表に出すときの負担が減ること。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 三つ目は、怒って書いたときに、いいねや返信が大きく返ってくることね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 負担が減るって、どういうことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 面と向かって「あなたは間違っている」と言うのは、けっこう勇気がいるでしょう？
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 僕、絶対に言えないのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: でも画面の向こうになら、驚くほど軽い気持ちで書けてしまうのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: ……確かに、心の中でなら、僕もけっこう言ってるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ここまでは、こう考えると説明しやすい、という話ね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 今度は、数字で確かめた研究を見ましょう。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ニューヨーク大学の研究チームが、銃規制や気候変動の投稿を56万件以上調べたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 56万件！？ ずんだを56万粒数えるより大変なのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: それは大変ね。分かったのは、こういうことよ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 「ひどい」「許せない」みたいな、道徳や感情に触れる言葉。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そういう言葉が一つ多い投稿ほど、広く拡散されていたの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 一つ多いだけで？ どのくらい違うのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: だいたい二割くらいね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 銃規制では19パーセント、同性婚では17パーセント。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 気候変動では24パーセントよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 話題が違っても、同じように広がるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そうなの。ただ、これは投稿を集めて比べた分析よ。言葉を足す実験ではないわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ、その中でも怒りの言葉がいちばん広がりやすいのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
