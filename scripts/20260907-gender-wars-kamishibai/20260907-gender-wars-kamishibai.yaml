  - text: でも、めたん。男性が困っていることも、ちゃんとあると思うのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そうね。男性の被害は、見えにくいことが多いの。
    speaker: めたん
