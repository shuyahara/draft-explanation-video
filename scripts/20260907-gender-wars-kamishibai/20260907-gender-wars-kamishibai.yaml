- id: 10
  title: 怒りの中身まで、作りものなのか
  chapter_title: 怒りの中身まで、作りものなのか
  narration:
  - text: そこは、はっきり分けておきたいところね。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: ここまで見てきた仕組みが作るのは、主に見え方の方よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: どういうことなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 今日見てきたのは、どんな投稿が広がりやすいか、誰が書いているか、という話でしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 怒りのもとになっている問題が本当にあるかどうかは、まだ一度も調べていないのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: あ。仕組みの話だけしてたのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: だから今度は、日本にどんな差や被害が実際にあるのかを、数字で見ておきましょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ジェンダーギャップ指数という指標があるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 教育や経済、政治の男女差を順位にしたものね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2024年、日本は146カ国中118位だったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 118位！ もっと上だと思ってたのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 2024年の賃金は、男性を100としたとき、女性は75.8よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 1976年に統計を取り始めてから、これでもいちばん差が小さい数字なの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: いちばん縮まって、それでも四分の一近く違うのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 総務省の調査だと、家事や育児にあてる時間は、男性が一日平均51分。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 女性は3時間24分よ。子育て世帯だけでなく、十歳以上の全体の平均ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 四倍くらい違うのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 2018年には、東京医科大学の入試で、女子受験者の点数を一律に減らしていたことが分かったわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: その年の合格率は、男子が女子のおよそ三倍だったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 文部科学省が81の大学を調べたところ、10校で不適切な扱いが認められたわ。
