- id: 11
  title: では、日本は二つに割れているのか
  chapter_title: null
  narration:
  - text: 世の中が本当に二つに割れているのかも、調べた人がいるのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: しかも、さっきの6万人調査に出てきた田中辰雄さんね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: さっきの人が、また出てきたのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 田中さんは浜屋敏さんと組んで、10万人規模に調査をしたの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そのうち5万人から回答を集めて、ネットを使うと考えが偏っていくのかを調べたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 同じ意見の人ばかり見て、どんどん過激になるって、よく聞くのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: それが、結果は逆だったのよ。
    speaker: めたん
    expression: surprised
    pause_after: 0.8
  - text: 逆なのだ！？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ネットを使っている人ほど、自分と反対の意見にも触れていたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そして、反対の意見に触れていた人ほど、意見はむしろ穏やかな方へ動いていたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: じゃあ、意見が両極に見えていたのは、どの層なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ネットをよく使う若い人ではなかったの。むしろ、あまり使わない中高年の層だったわ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 思ってたのと、全部逆なのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: この結果は、総務省の情報通信白書でも紹介されているのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ただし、これは一つの調査ね。それに、男女論そのものを測ったものではないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 中高年が悪い、という話でもないの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 集団の傾向であって、一人ひとりの評価ではないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ここまでの話とつなげると、こう見えてくるの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 日本全体が二つに割れているというより、目立つ場所で強い意見がぶつかって見えている。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 日本全体が割れてるとは、すぐには言えないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。そして、その「目立つ場所」を作っている仕掛けが、もう一つあるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ネットには、相手側をひとまとめに呼ぶ言葉があるでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 見たことあるのだ。なんとかフェミとか、弱者男性とか。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: あれは、学者が決めた学術用語じゃないの。ネットで自然に広まった呼び名よ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: そして思い出してほしいのだけれど、相手を名指しする言葉は、拡散を大きく強めていたわね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: もちろん、その呼び名そのもので数字が確かめられたわけではないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: あっ！ 呼び名をつけることが、燃えやすくする仕掛けにもなるのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そういう呼び名が広まると、そこに一つのまとまった集団がいるように見えてしまうのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.8
  - text: 本当は、いろんな人が、ばらばらにいるだけかもしれないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
