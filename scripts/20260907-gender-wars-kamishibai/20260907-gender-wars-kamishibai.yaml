- id: 7
  title: では、誰が書いているのか
  chapter_title: では、誰が書いているのか
  narration:
  - text: その疑問に答えるための、日本の調査があるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 国際大学の山口真一さんと、慶應義塾大学の田中辰雄さんの研究よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 2014年と2016年に二回、あわせて6万人規模でアンケートを取っているの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: アンケートだけじゃなくて、ツイッターの分析も合わせているわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: アンケートとツイッターの両方を見てるのだ。念入りなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 調べたのは、50回以上リツイートされて、まとめサイトができるくらい広がった炎上よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そこに、実際に書き込んだ人がどれくらいいるのかを数えたの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: うーん。あれだけ荒れてるんだから、一割くらいはいそうなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 一年以内に書き込んだ人は、ネットを使う人のおよそ0.5パーセントよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 0.5！？ 千人いたら、五人しかいないのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 過去に一度でも書いた人まで入れても、1.1パーセントだったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: つまり、あれだけ荒れて見えても、書いているのはネット利用者の0.5パーセントなのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: ただし、これは炎上全体を対象にした数字ね。男女論だけを数えたものではないわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: その0.5パーセントって、よっぽど暇な人なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.35
  - text: ……って、僕もいきなり決めつけてるのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 正直でよろしい。そこも意外よ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 書き込む動機は、6割から7割が正義感だったの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: どんな人が多いかを見ると、ネットを使う人全体と比べて、男性の割合が高かったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: しかも、主任や係長より上の役職の人も多かったの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: え、会社で偉い人なのだ！？ 想像と全然違うのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 似た偏りは、日本の外でも見つかっているわ。二つだけ挙げておくわね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: アメリカでは、国の政治についての投稿の97パーセントが、上位一割の利用者から出ていたの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: スイスでは、上位1パーセントの人が、ヘイトスピーチ全体の46パーセントを書いていたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 国も調べ方も違うのに、発信が一部の人に集まってるのは同じなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: でも、まだ腑に落ちないのだ。正しいと思ってるだけで、ずっと書き続けられるものなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
