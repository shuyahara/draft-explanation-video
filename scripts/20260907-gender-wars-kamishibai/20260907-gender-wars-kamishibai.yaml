    from: 13
    slot: 4
    credit: 'Photo: Jakub Zerdzicki / Pexels'
  readings:
  - surface: 炎上
    reading: エンジョウ
- id: 3
  title: 何が対立を燃え上がらせるのか
  chapter_title: 何が対立を燃え上がらせるのか
  narration:
  - text: 手がかりは、人が怒るときの気持ちを調べた心理学にあるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: イェール大学の心理学者、クロケットが2017年にまとめた考え方があるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ネットそのものに、怒りを書き込みやすくする仕組みが三つある、という考え方よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 三つ？ どんな仕組みなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 一つ目は、怒るきっかけを見る回数が増えること。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 二つ目は、怒りを表に出すときの負担が減ること。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 三つ目は、怒って書いたときに、いいねや返信が大きく返ってくることね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 負担が減るって、どういうことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 面と向かって「あなたは間違っている」と言うのは、けっこう勇気がいるでしょう？
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 僕、絶対に言えないのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: でも画面の向こうになら、驚くほど軽い気持ちで書けてしまうのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: ……確かに、心の中でなら、僕もけっこう言ってるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ここまでは、こう考えると説明しやすい、という話ね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 今度は、数字で確かめた研究を見ましょう。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ニューヨーク大学の研究チームが、銃規制や気候変動の投稿を56万件以上調べたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 56万件！？ ずんだを56万粒数えたら、腕がつるのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: それは大変ね。分かったのは、こういうことよ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 「ひどい」「許せない」みたいな、道徳や感情に触れる言葉が入っているかを見たの。怒りや非難の言葉、と考えてもらえばいいわ。
    speaker: めたん
    expression: explain
    pause_after: 0.5
  - text: そういう言葉が多い投稿ほど、広く拡散されていたの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: どのくらい違うのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そういう言葉が一つ入るごとに、拡散される確率がだいたい二割くらい高くなるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 銃規制では19パーセント、同性婚では17パーセント。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 気候変動では24パーセントよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 話題が違っても、同じように広がるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: じゃあ、男女論も怒りの言葉が入ってるから広がりやすいのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
