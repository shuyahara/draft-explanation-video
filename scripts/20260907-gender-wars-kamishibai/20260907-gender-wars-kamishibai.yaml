- id: 1
  title: フック（燃えている投稿を見た夜）
  chapter_title: null
  narration:
  - text: めたん、昨日の夜、寝る前にちょっとだけスマホを見たのだ。
    speaker: ずんだもん
    expression: sleepy
    pause_after: 0.35
  - text: そうしたら、男の人と女の人が、激しい言葉でお互いを責め合ってたのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.35
  - text: たった一つの投稿に、怒りのコメントが何百件も付いてたのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: こういうの、前にも何回も見た気がするのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: よくある光景ね。おごるか割り勘か、家事は誰がするのか、給料の差は誰のせいか。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そういう話題を入り口にして、度々炎上騒ぎになっているわね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: ねえ、めたん。僕、前から不思議だったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: なんで男女の論争って、こんなに炎上しやすいのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: いい疑問ね。理由は一つではないけれど、色々な研究を見ていくとかなり分かってくるのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 研究から分かるのだ！？ 教えてほしいのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そこを、今日は一緒に確かめていきましょうか。
    speaker: めたん
    expression: explain
    pause_after: 1.2
  readings:
  - surface: 怒り
    reading: イカリ
  - surface: 何百件
    reading: ナンビャッケン
  - surface: 炎上
    reading: エンジョウ
