- id: 9
  title: なぜ少数の声が、世の中の声に見えるのか
  chapter_title: なぜ少数の声が大きく見えるのか
  narration:
  - text: その通りよ。ここまでの話をつなぐと、見え方の仕組みが分かるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 相手を名指しする言葉が入った投稿は、広がりやすい。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そして、そういう投稿を書いているのは、ごく一部の人だったわね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 広告で収入を得るサービスでは、長く見てもらえるほど売り上げにつながるでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: その結果、反応を集める投稿ほど、多くの人の目に入る場所へ出やすくなるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 少ない人の声が、繰り返し目立つ場所に出てくるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: この流れは、日本の男女論でも実際に観察されているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ある女性ジャーナリストに向けられた中傷の返信を調べた研究があるの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 2800件あまりを分類したのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 2800件も送られてきたのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 攻撃の中心にいたのは、ごく少数の、フォロワーの多い人だったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: その投稿を引用したり、まねて書いたりする人が続くの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 最後に、内容に関係なく攻撃に加わる人が増えていったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 研究チームは、そういう三つの層が重なる形を見つけたのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 大勢に見えても、最初に動かしてるのは何人かなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: それに私たちは、相手側を実際より過激に見積もってしまうの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: モア・イン・コモンは2019年に調査をしたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 2100人あまりに、相手側をどう見ているか聞いたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 人々は、対立する側のおよそ55パーセントが過激な意見を持っていると思っていたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 画面を見てると、半分以上が過激に見えちゃうのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 実際に過激な意見を持っていたのは、およそ30パーセントよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 実際より、ずいぶん過激に見積もってたのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: これはアメリカの政治の対立を調べたものよ。日本の男女論の数字ではないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 日本でも同じずれがある、と断言はできないの。でも、手がかりにはなるわね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 少数の声でも、実際の人数よりずっと大きく見える形で、画面に出てくるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
  - text: 待つのだ。見え方が作られてるなら、怒ってる中身の方も、作りものなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
