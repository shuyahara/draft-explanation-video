    from: 6
    slot: 2
    credit: 'Photo: Pixabay'
    telop: Rathje et al. (2021) PNAS
  - type: image
    cut_reason: 【67％】コメント欄。名指しする言葉が入るとシェアが増える話へ
    from: 8
    slot: 3
    credit: 'Photo: William Fortunato / Pexels'
  - type: board
    cut_reason: 【混同を防ぐ】67％と6.7倍が別の比較であることを黒板の文字で（レビューの最優先指摘）
    from: 11
    telop: '67％と6.7倍は別の比較

      ① 67％＝敵を名指しする語を一語足したとき

