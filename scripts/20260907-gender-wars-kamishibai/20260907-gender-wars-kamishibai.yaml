- id: 8
  title: 書いている人は、なぜ引かないのか
  chapter_title: null
  narration:
  - text: そこが大事なところね。鍵は、意見を好みではなく、善悪として捉える心理よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: イリノイ大学シカゴ校のスキトカさんたちは、意見を善悪で考えるときの心理を長く調べているの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 「これは好みの違いじゃない。正しいか間違っているかの問題だ」と感じること、あるでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: そう感じているとき、人は妥協しにくくなるのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 好き嫌いじゃなくて、善悪の問題だと思ってるってことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。好みの違いなら「人それぞれね」で終われるでしょう？
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: でも善悪の問題だと思っていると、譲ることが、悪に負けることになってしまうの。
    speaker: めたん
    expression: serious
    pause_after: 0.6
  - text: それは、やめにくいのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そして、やめにくさを強めるものが、もう一つあるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: イェール大学の研究チームが2021年に報告しているの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: ツイッターの利用者7千人あまり、1270万件の投稿を追いかけた研究よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 怒りを込めた投稿にたくさん反応がつくと、その後も怒りを込めた投稿を書きやすくなっていたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 反応が返ると、次も強いことを書きやすくなるのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 同じ研究チームが別におこなった実験でも、同じ結果が出ているの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: それと、怒りは吐き出せばすっきりする、と思われがちよね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 言いたいこと言ったら、すっきりするのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ブッシュマンという心理学者が、2002年に確かめているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: サンドバッグをたたいて怒りを発散させても、すっきりしなかったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: むしろ、怒りを何度も思い返すほど、怒りは強くなっていたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 怒りは、出せば消えるわけではないの。反応が返ると、また書きたくなるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: じゃあ、あの人たちは目立ちたいだけなのだ？ 注目されて気持ちよくなってるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そこは、決めつけないでおきましょう。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: この研究は、注目されたい気持ちまでは測っていないの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 分かるのは、反応が返ると書き方が強くなりやすい、というところまでよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 分かったのだ。……でも、書いてるのは、たった0.5パーセントなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: それなのに、画面ではもっと大勢が書いてるように見える。この差はどこから来るのだ？
    speaker: ずんだもん
    expression: point
    pause_after: 1.2
