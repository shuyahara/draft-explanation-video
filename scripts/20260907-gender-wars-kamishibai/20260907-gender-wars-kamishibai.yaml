- id: 6
  title: なぜ男女の話だけ、特別に燃えるのか
  chapter_title: なぜ男女の話だけ、特別に燃えるのか
  narration:
  - text: 理由の一つは、男女の話が、みんなに近い話題だからよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 政治の対立なら、距離を置ける人がいるでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 選挙の話は興味ない、って言う友達がいるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 宗教の論争も、自分には関係ないと言える人が多いわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: でも男女の話は、多くの人が、自分に関わる話として受け取りやすいのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: あ……。「僕は関係ないのだ」って、画面の外に逃げにくいのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ここで、さっきの「相手を名指しする言葉」、つまり「仮想敵を作る言葉」の話を思い出してほしいの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 「男は」「女は」という大きな主語が出ると、自分が責められたと感じる人が出るわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: その一方で、自分の気持ちを代わりに言ってくれた、と感じる人も出るのよ。
    speaker: めたん
    expression: normal
    pause_after: 1.2
  - text: 責められたと思った人は言い返して、代弁だと思った人は応援するのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: 一つの投稿で、両方が同時に起きてるのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: それと、これは私の意見だけど、「男は」「女は」で始まる投稿は、たいてい不満から書かれるでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: だから、さっきの怒りや否定的な言葉も、自然と入りやすいの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 敵を名指しする言葉と、ネガティブな言葉が、最初からセットなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう、だから男女論は炎上しやすいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.8
  - text: こういう炎上の形は、昔から何度も繰り返されているの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 東京大学でジェンダー論を教えている瀬地山角さんが、炎上した広告を集めて分類しているわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: たとえば、男は仕事、女は家事という役割の描き方。それから、女性の容姿の扱い方ね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: その分析では、同じ型の炎上が何度も繰り返されていることが見えてくるのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 毎回、新しい事件みたいに見えて、実は同じ形なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ここまでの研究は、政治の話題で調べたものが多いの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: だから、男女の話で同じ数字が出たわけではないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: でも、仕組みはつながっているの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 燃えやすい言葉と、全員が当事者になる話題が、重なっているのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 二つ目の疑問は、これで解けたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: 残るは三つ目なのだ。炎上する時の言い争いを実際に投稿してるのは、どんな人たちなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
