        gen_prompt: "ancient Greece, 4th century BC: a tall Macedonian king in a bronze cuirass and red cloak with a plumed helmet, seen from behind, standing so that his long shadow falls across sunlit paving stones onto a seated beggar in rags, no medieval armor, low angle from behind the king, warm stone tones, painterly, no faces, no text, no lettering"

