# シーン YAML（ビート運用）。台本 Markdown（scripts/20260827-cynicism/20260827-cynicism.md、
# ドラフトv1）に対応するレンダリング指示書。
# 仕様（正）: C:\Users\shuya\Projects\script-to-video\docs\schema.md（beats[] 節）
#             C:\Users\shuya\Projects\script-to-video\docs\design-beat-rendering.md
# 検証: cd C:\Users\shuya\Projects\script-to-video && .venv\Scripts\python.exe -m script_to_video validate <このファイル>
#
# ナレーション本文は台本 Markdown から一字一句そのまま転記（文言変更なし）。
# セグメント分割は句点「。」の位置のみで行う（文中分割は台本の発音・ポーズメモが「〜の前に
# n秒」と指定した箇所のみ）。指定のない文境界にも 0.2〜0.5 秒のポーズを明示している。
#
# トーン設計（台本冒頭より）: 「時間を跨ぐ静かな考察」。古代パート＝石・砂・油灯の温かい光、
# 低コントラストの絵画的質感。現代パート＝昼の電車・オフィスの白い光と画面の冷たい光。
# 生成画像はナレーションが述べる場面・人物・行為の直接描写を既定とし、擬物化静物は
# ナレーション自身が口にする比喩（狐と葡萄＝シーン7、芥子＝シーン9）のみ例外で使う。
#
# 章構成（章カードは4枚。演出セットの非対称のためシーン13は章カードなしとした）:
#   シーン3「犬は、何に吠えていたのか」／シーン5「現代で冷笑が広がる理由① ― 冷笑は、安い」／
#   シーン7「現代で冷笑が広がる理由② ― 何を守るのか」／シーン11「安い知性の請求書は、誰が払うのか」
#
# 図解（4箇所。台本指定の箇所のみ。chart は使わない＝数字は telop で示す）:
#   シーン7「三つの防衛・1つ目」: schema の narrative 各型は最少件数が row=4/radiate=3/
#     converge=2 で、「3枠中1つだけ点灯・残り2つは伏せる」という部分点灯を満たす型が無い
#     （row は3枠を表現できず、radiate/converge は最少3件・2件を満たすには存在しない項目を
#     埋めることになり事実と異なる）。診断のうえ、シーン7では図解を使わずtelopで「1つ目の
#     答え：無力感」を示し、3つが揃うシーン10でのみ narrative/radiate として図解化する
#     判断とした（詳細は完了報告）。
#   シーン8: narrative/chain「善行者への貶め」
#   シーン10: narrative/radiate「三つの防衛」（中心＝冷笑という防衛、items 3件＝無力感／
#     責められる予期／不当だという感覚。items 3〜6件の下限に一致）／comparison「温かさ×
#     有能さ」（判断: 2軸2値の対比は schema に2×2型が無く、narrative 4レイアウトのいずれも
#     構造が合わない。2列比較として最も近い comparison を採用。詳細は完了報告）
#   シーン11: narrative/converge「安い知性の請求書」（判断: 台本は row を提案していたが、
#     row は最少4枠のため3項目の請求書には合わない。独立した3つの知見が1つの結論
#     ［安いものは後で高くつく］へ収束する構造として converge を採用。詳細は完了報告）
#
# 同一型・layout の重複は無し（radiate/chain/comparison/converge を1回ずつ使用）。
#
# シーン2の「問い2つの収束表示」は前作（20260824-net-gender-wars）YAMLのシーン2と同じ処理を
# 踏襲: converge図解は使わず、image ビート＋telopで問いを提示する。

video:
  title: "なぜ人は冷笑してしまうのか——犬は権力に吠え、冷笑は本気に吠える"
  speaker: "青山龍星"
  resolution:
    width: 1920
    height: 1080
  style: "cinematic documentary still, natural light, muted low-contrast palette, shallow depth of field, painterly warm stone tones only when the scene itself is ancient Greece, cool white daylight and screen glow for present-day scenes, no text, no lettering"
  bgm: "../bgm/kousatsu.mp3"
  bgm_credit: "「考察」shimtone（DOVA-SYNDROME）"
  # 古代パート向けの弦ドローン系候補（商用可フリー音源。ダウンロードは未実施。候補のみ）:
  #   - 「静かなる決意」武田菜々子（DOVA-SYNDROME）
  #   - 「暁の残響」しゃろう（DOVA-SYNDROME）
  #   - 「悠久」MoppySound（DOVA-SYNDROME）

scenes:
  # ============================================================
  # シーン1「フック（現代の場面）」
  # ============================================================
  - id: 1
    title: "フック（現代の場面）"
    visual_intent: "全画面実写。昼の電車内、吊り革を握る手ともう片方の手のスマートフォン。画面は白飛び気味で文字は読めない。顔は写さない。指が一瞬止まる→滑る、という変化を見せる"
    narration:
      - text: "昼の電車。"
        pause_after: 0.3
      - text: "誰かのスマートフォンの画面に、ひとつの投稿が流れてくる。"
        pause_after: 0.3
      - text: "海岸の清掃に参加しませんか、という呼びかけだ。"
        pause_after: 0.4
      - text: "その下に、返信が並んでいる。"
        pause_after: 0.3
      - text: "意識高いね。"
        pause_after: 0.3
      - text: "どうせ売名でしょ。"
        pause_after: 0.3
      - text: "はいはい。"
        pause_after: 0.5
      - text: "呼びかけについた反応は、数えるほどしかない。"
        pause_after: 0.3
      - text: "それを嗤った返信のほうが、何倍も広がっている。"
        pause_after: 0.6
      - text: "画面の上の指は、何事もなかったように、次の投稿へ滑っていく。"
        pause_after: 0.6
      - text: "こういう反応を、冷笑と呼ぶ。"
        pause_after: 0.4
      - text: "本気で何かをしようとする人を、一段高いところから、鼻で笑って済ませる態度のことだ。"
        pause_after: 1.0
    readings:
      - surface: "嗤った"
        reading: "ワラッタ"
      - surface: "冷笑"
        reading: "レイショウ"
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "昼の電車。誰かのスマートフォンの画面に投稿が流れてくる（三人称。画面を眺める視点）"
        cut_reason: "【冒頭の場面・三人称】キュー1〜3『昼の電車』『誰かのスマートフォンの画面に投稿が流れてくる』『海岸の清掃に参加しませんか』。前作の一人称（自分の指）ではなく、他人の画面で起きている冷笑を眺める画で開く"
        gen_prompt: "present-day scene, over-the-shoulder view on a bright daytime commuter train of a stranger's hand holding a smartphone, the screen showing a social feed layout with one post at the top, all text blurred and unreadable, no faces, soft window light, documentary still, no lettering, no ancient architecture, no columns, no ruins, no historical costume"

      - type: image
        from: 4
        slot: 2
        visual_intent: "投稿の下に並ぶ短い返信。文字は読めないが、短い一行が三つ並んでいることは分かる"
        cut_reason: "【並ぶ返信】キュー4〜7『その下に返信が並んでいる』『意識高いね』『どうせ売名でしょ』『はいはい』。返信欄に寄り、三つの短い返信が並ぶ画で嗤いの言葉を受ける"
        gen_prompt: "present-day scene, close-up of a smartphone screen showing a social media post with three short one-line replies stacked beneath it, every word blurred and unreadable, thumb at the edge of the frame, cool screen light, no faces, no lettering, no ancient architecture, no columns, no ruins, no historical costume"

      - type: image
        from: 8
        slot: 3
        visual_intent: "呼びかけの投稿についた小さな反応の数と、嗤った返信についた大きな反応の数の対比（数字は読めない）"
        cut_reason: "【反応の数の対比】キュー8〜9『呼びかけについた反応は数えるほど』『嗤った返信のほうが何倍も広がっている』。同じ画面の中で、上の投稿には反応アイコンが数個、下の返信には反応アイコンが密集している画"
        gen_prompt: "present-day scene, close-up of a smartphone screen: a post at the top with only two or three tiny reaction icons, and a short reply beneath it crowded with a dense row of reaction icons, numerals and text blurred and unreadable, cool screen light, no faces, no lettering, no ancient architecture, no columns, no ruins, no historical costume"

      - type: image
        from: 10
        slot: 4
        motion: zoom_out
        visual_intent: "画面の上の指が、何事もなかったように次の投稿へ滑っていく"
        cut_reason: "【指が滑る】キュー10『画面の上の指は、何事もなかったように次の投稿へ滑っていく』。返信欄から引いて、親指がスクロールする手元の画に戻る"
        gen_prompt: "present-day scene, a stranger's thumb scrolling upward across a smartphone screen on a bright commuter train, screen content blurred and unreadable, hand and phone only, no faces, soft daylight, no lettering, no ancient architecture, no columns, no ruins, no historical costume"

      - type: image
        from: 11
        slot: 5
        visual_intent: "冷笑の定義。本気で何かをしようとする人を、一段高いところから鼻で笑って済ませる態度。スマホを下ろした人の後ろ姿"
        cut_reason: "【冷笑の定義】キュー11〜12『こういう反応を冷笑と呼ぶ』『本気で何かをしようとする人を一段高いところから鼻で笑って済ませる態度』。画面から離れ、車内でスマホを少し下ろした人の後ろ姿で定義文を受ける"
        gen_prompt: "present-day scene, seen from directly behind on a daytime commuter train: the back of a person lowering a smartphone slightly, shoulders relaxed, the screen a plain glowing white rectangle, blurred passengers beyond, no faces, no lettering, no ancient architecture, no columns, no ruins, no historical costume"

  # ============================================================
  # シーン2「問いへの変換」
  # ============================================================
  - id: 2
    title: "問いへの変換"
    visual_intent: "前半は現代（返信欄に並ぶ短い言葉、読めない）。『2400年前のギリシャ』で画を切り替え、白い石と砂の色調へ。問い2つは前作シーン2と同じ処理（image＋telopでの収束表示）"
    narration:
      - text: "この態度は近ごろ、ネットでは冷笑系と呼ばれるようになった。"
        pause_after: 0.4
      - text: "だが、冷笑そのものは、新しいものではない。"
        pause_after: 0.4
      - text: "英語では、こうした態度をシニシズムと呼ぶ。"
        pause_after: 0.3
      - text: "そしてこの言葉のもとになったのは、およそ2400年前、古代ギリシャにいた哲学者たちだ。"
        pause_after: 0.4
      - text: "ところが彼らは、今の冷笑とは、まるで反対のことをしていた。"
        pause_after: 0.9
      - text: "なぜ人は、冷笑をしてしまうのか。"
        pause_after: 1.0
      - text: "この動画では、古代の哲学者の逸話から、現代の心理学の実験まで、その道筋をたどっていく。"
        pause_after: 0.5
    readings:
      - surface: "冷笑系"
        reading: "レイショウケイ"
      - surface: "冷笑"
        reading: "レイショウ"
    beats:
      - type: image
        from: 1
        slot: 1
        visual_intent: "ネットの返信欄に並ぶ短い言葉（読めない）。冷笑系というラベル"
        cut_reason: "【冷笑系というラベル】キュー1〜2『この態度は近ごろネットでは冷笑系と呼ばれる』『冷笑そのものは新しいものではない』。シーン1の返信欄の画を別角度で引き継ぐ"
        gen_prompt: "present-day scene, a smartphone lying on a cafe table, its screen showing rows of short blurred unreadable reply comments under a post, cool daylight, hand resting beside it, no faces, no lettering, no ancient architecture, no columns, no ruins, no historical costume"

      - type: image
        from: 3
        slot: 2
        visual_intent: "冷笑＝シニシズム。言葉のもとになった古代ギリシャの哲学者たち。画面が現代から古代の市場へ切り替わる"
        cut_reason: "【シニシズムという言葉の来歴】キュー3〜4『冷笑は英語でシニシズムという』『この言葉のもとになったのは2400年前の古代ギリシャの哲学者たち』。ここで光の温度を暖色へ切り替える"
        gen_prompt: "an empty sunlit ancient Greek marketplace at noon, pale stone paving and sand-colored walls, market stalls with clay pots, warm painterly light, no people, no text, no lettering"

      - type: image
        from: 5
        slot: 3
        visual_intent: "『彼らは今の冷笑とはまるで反対のことをしていた』。同じ古代の市場を保持し、粗末な衣の男の後ろ姿を遠景に置く"
        cut_reason: "【反対のことをしていた】キュー5『ところが彼らは、今の冷笑とはまるで反対のことをしていた』。次章の主人公を遠景で予告する"
        gen_prompt: "a sunlit ancient Greek marketplace at noon seen from a distance, a single small figure in a rough cloak standing alone in the open square among market stalls, seen from behind, warm stone tones, painterly, no faces, no lettering"

      - type: image
        from: 6
        slot: 4
        telop: "なぜ人は、冷笑をしてしまうのか"
        visual_intent: "問いの提示。同じ古代の市場を静止したまま保持し、問いをtelopで大きく示す"
        cut_reason: "【問いの提示】キュー6〜7『なぜ人は冷笑をしてしまうのか』『この動画では古代の哲学者の逸話から現代の心理学の実験までその道筋をたどる』。画は動かさず、問いの文言はtelopが担う"
        gen_prompt: "a sunlit ancient Greek marketplace at noon seen from a distance, a single small figure in a rough cloak standing alone in the open square among market stalls, seen from behind, warm stone tones, painterly, no faces, no lettering"

  # ============================================================
  # シーン3「古代① ディオゲネスの逸話」（章1）
  # ============================================================
  - id: 3
    title: "古代① ディオゲネスの逸話"
    chapter_title: "犬は、何に吠えていたのか"
    key_color: "#241F1A"
    visual_intent: "逸話ごとに一枚絵（ランプ／甕／アレクサンドロスの影が落ちる地面／犬）。人物は後ろ姿・遠景・影で顔を描かない"
    narration:
      - text: "紀元前4世紀、アテナイ。"
        pause_after: 0.3
      - text: "真昼の市場に、火のついたランプを掲げて歩く男がいた。"
        pause_after: 0.3
      - text: "何をしているのかと問われ、男は答える。"
        pause_after: 0.2
      - text: "人間を探している、と。"
        pause_after: 0.5
      - text: "男の名は、ディオゲネス。"
        pause_after: 0.4
      - text: "家を持たず、神殿のそばに置かれた、大きな素焼きの甕の中で寝起きした。夏は熱い砂の上を転がり、冬は雪をかぶった彫像を抱いて、自分の体を鍛えたと伝えられる。"
        pause_after: 0.4
      - text: "ある日、アレクサンドロス大王が彼の前に立ち、何か望みはないかと尋ねた。"
        pause_after: 0.3
      - text: "ディオゲネスの答えは、こうだった。"
        pause_after: 0.4
      - text: "そこをどいてくれ、日陰になる。"
        pause_after: 0.8
      - text: "人々は彼を、犬と呼んだ。"
        pause_after: 0.3
      - text: "彼はそれを誇りにした。"
        pause_after: 0.3
      - text: "くれる者には尾を振り、くれない者には吠え、悪党には噛みつくからだ、と。"
        pause_after: 0.5
      - text: "もうひとつ、彼の出発点を語る逸話がある。"
        pause_after: 0.3
      - text: "若い頃、通貨の偽造に関わって故郷を追われた彼は、デルフォイの神託で、通貨を変造せよ、と告げられたという。"
        pause_after: 0.3
      - text: "ギリシャ語で通貨を意味する言葉は、同時に、慣習も意味した。"
        pause_after: 0.3
      - text: "彼はそれを、世の中の慣習を作り変えよ、という使命として受け取った。"
        pause_after: 0.4
      - text: "これらの逸話は、紀元3世紀の伝記作家ディオゲネス・ラエルティオスが書き残したもので、どこまでが事実かは分からない。"
        pause_after: 0.4
      - text: "だが、ひとつだけ確かなことがある。"
        pause_after: 0.4
      - text: "この、犬という呼び名こそが、シニシズムという言葉の語源だということだ。"
        pause_after: 1.2
    readings:
      - surface: "犬"
        reading: "イヌ"
      - surface: "ディオゲネス"
        reading: "ディオゲネス"
      - surface: "アテナイ"
        reading: "アテナイ"
      - surface: "ラエルティオス"
        reading: "ラエルティオス"
      - surface: "甕"
        reading: "カメ"
      - surface: "日陰"
        reading: "ヒカゲ"
    beats:
      - type: chapter
        slot: 1
        cut_reason: "章の頭。次ビートのランプの男の画を下地に流用して章名を重ねる"

      - type: image
        from: 1
        slot: 2
        visual_intent: "真昼の市場をランプを掲げて歩く男。何をしているのかと問われ『人間を探している』と答える"
        cut_reason: "【ランプの逸話】キュー1〜4『紀元前4世紀、アテナイ』『火のついたランプを掲げて歩く男』『何をしているのかと問われ答える』『人間を探している、と』という一つの逸話の一続き。telopはこの場面のみ"
        gen_prompt: "seen from behind: an old bearded man with short grey hair, barefoot, wearing a rough patched cloak, walking through a sunlit ancient Greek marketplace at noon, holding a small lit clay oil lamp up in his raised hand, warm stone and sand tones, painterly, no faces, no text, no lettering"

      - type: image
