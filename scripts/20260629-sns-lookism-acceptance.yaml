    gen_prompt: "bar chart illustration comparing income by perceived attractiveness, blue tone, minimal style"
    emphasis:
      - at: 3
        text: "美の経済的プレミアム"
    cutaways:
      - slot: 1
        from: 2
        to: 2
        visual_intent: "1994年のハマーメッシュ＆ビドルの研究（容姿と収入データを分析する経済学者）を具体的な情景で見せる"
        gen_prompt: "two economists in a 1990s university office reviewing printed charts and data about income and appearance, full-bleed composition, subject fills the frame"
        telop: "ハマーメッシュ＆ビドル（1994）"
      - slot: 2
