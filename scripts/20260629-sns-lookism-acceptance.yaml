# シーン2のみナレーションのセグメント分割を追加調整した（文言そのものは変えていない）。

video:
  title: "なぜ今、キャバ嬢・AV女優は受け入れられていくのか — 写真SNSとルッキズムの社会学"
  speaker: "青山龍星"
  resolution:
    width: 1920
    height: 1080
  style: "flat vector illustration, muted desaturated palette, limited color range, soft geometric shapes, consistent line weight, calm editorial tone, no text, no lettering, no watermark, generous negative space in the lower third"
  bgm: "bgm/main.mp3"
  bgm_credit: "「落ち着いた？」ミルアージュ（DOVA-SYNDROME）"

scenes:
  - id: 1
    title: "フック"
    visual_intent: "街の雑踏とスマートフォン越しのSNS利用を重ね、かつては偏見の対象だった仕事が今は身近に受け入れられている変化の気配でつかみを作る"
    key_color: "#2E4A7D"
    narration:
      - text: "街を歩けば、SNSを開けば、テレビをつければ。かつては「夜の世界」「日陰の職業」と呼ばれ、人前で語ることがためらわれた仕事があります。キャバクラで働く女性、いわゆるキャバ嬢。あるいは、アダルトビデオに出演する女優。ほんの二十年ほど前なら、これらの職業は強い偏見の対象でした。"
      - text: "ところが、今はどうでしょう。彼女たちはユーチューブで人生を語り、本を出版し、ファッションのお手本として何十万人ものフォロワーを集めています。"
      - text: "世間のまなざしは、明らかに変わりつつあります。いったい、なぜなのでしょうか。"
        pause_after: 0.5
      - text: "今日はこの問いを、単なる印象論ではなく、心理学と経済学の研究を手がかりに、ひとつずつ論拠を積み上げて考えていきます。そして見えてくるのは、私たち自身の「美しさ」との付き合い方が、ここ十数年で大きく変わったという事実です。"
    telop: "なぜ今、受け入れられていくのか"
    readings:
      - surface: "日陰"
        reading: "ヒカゲ"
    search_query: "city street smartphone social media montage"
    assets:
      - url: "https://pixabay.com/videos/social-media-smart-phone-mobile-1360/"
        kind: video
        license: commercial-ok
        source_name: "Pixabay"
        note: "ページURL（直接ファイルURLはページ内のダウンロードボタンから取得。ギャラリー再検索でも代替可）"
      - url: "https://www.pexels.com/video/person-scrolling-through-instagram-853988/"
        kind: video
        license: commercial-ok
        source_name: "Pexels（Coverr, CC0）"
        note: "ページURL。人物の手元のみでスマホ画面が主体、顔は写らない"
      - url: "https://pixabay.com/videos/crosswalk-crowd-people-many-3630/"
        kind: video
        license: commercial-ok
        source_name: "Pixabay"
        note: "ページURL。横断歩道を歩く群衆。特定個人が判別しにくい引きの画"
    gen_prompt: "flat illustration of people walking a city street looking at smartphones, blue tone, wide empty space for text overlay"
    cutaways:
      - slot: 1
        from: 2
        to: 2
        visual_intent: "「今はどうでしょう」の場面。ユーチューブで人生を語り、本を出版する当事者の「今」を具体的な情景で見せる"
        gen_prompt: "a woman calmly recording a video talking to a camera in a bright modern room, a published book and a smartphone visible nearby, full-bleed composition, subject fills the frame"

  - id: 2
    title: "問題提起"
    chapter_title: "問題提起"
    visual_intent: "「受容」の定義を2要素の図解で示しつつ、背景に街の人混み・繁華街の気配を薄く敷いて、これが実社会で起きている変化であることを伝える"
    key_color: "#2E4A7D"
    narration:
      - text: "まず、言葉の意味をはっきりさせておきましょう。ここで言う「受け入れられている」とは、これらの職業をすばらしいと全員が称賛している、という意味ではありません。"
      - text: "そうではなく、第一に、これらの職業を公言する人が増えたこと。"
      - text: "第二に、その人たちが好意的に、あるいは少なくとも中立的に受け取られる場面が増えたこと。"
      - text: "この二つを指しています。"
      - text: "実際、かつては隠すものだった経歴を、自分から語る人が増えました。"
        pause_after: 0.5
      - text: "では、なぜ社会のまなざしはやわらいだのか。よくある説明は「多様性の時代になったから」というものです。しかし、これでは答えになっていません。なぜ多様性が認められるようになったのか、その中身を説明していないからです。"
      - text: "そこでこの動画では、複数の要因の中でも、とりわけ大きな柱だと考えられる一つの変化に注目します。それが、写真を中心としたSNSの広がりと、それがもたらした「外見の価値の上昇」、すなわちルッキズムの加速です。"
    telop: "「受容」とは何か／問いの定義"
    readings:
      - surface: "多様性"
        reading: "タヨウセイ"
    search_query: "diversity definition minimal infographic"
    assets:
      - url: "https://pixabay.com/photos/dignity-definition-dictionary-2724770/"
        kind: image
        license: commercial-ok
        source_name: "Pixabay"
        note: "採用（build/sns-lookism-assets/scene_02.jpg）。辞書で言葉の定義を引く画。問題提起シーンの「定義」というテーマに直接合致"
