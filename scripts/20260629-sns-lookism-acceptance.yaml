        gen_prompt: "participants in a 1970s psychology lab comparing portrait photographs of people with different attractiveness levels, full-bleed composition, subject fills the frame"
        telop: "ディオンら（1972）"

  - id: 4
    title: "論証② 美の経済的プレミアムと、フィルター時代の追試"
    chapter_title: "論証2 経済的プレミアム"
    visual_intent: "外見の良さ→賃金プレミアムという経済的な構造を図解で示し、背景に金融チャート・データのぼやけた画面を敷いて「数字・市場」の空気感を加える"
    key_color: "#2E7D5B"
    narration:
      - text: "この「美しいものは善い」という偏りは、心の中だけの話にとどまりません。お金、つまり労働市場にも、はっきりと表れます。"
      - text: "1994年、経済学者のダニエル・ハマーメッシュとジェフ・ビドルは、容姿と収入の関係を、大規模なデータで分析しました。"
      - text: "すると、平均より見た目が良いとされた人は賃金が最大で十数パーセント高く、逆に平均より見た目が劣るとされた人は、賃金が下がる傾向がありました。これは「美の経済的プレミアム」と呼ばれます。"
      - text: "さらに重要なのは、見た目の良い人ほど、外見が有利に働く職業に集まりやすい、という指摘です。つまり社会には、もともと「美しさが価値になる」構造があるのです。"
      - text: "では、SNSの時代になって、この偏りは弱まったのでしょうか。"
        pause_after: 0.5
      - text: "むしろ、逆かもしれません。"
        pause_after: 0.5
      - text: "2024年、ある研究チームが、およそ二千七百人を対象に、加工する前と、美顔フィルターをかけた後の顔写真を評価させました。"
      - text: "その結果、同じ人物でも、魅力的に見える写真のほうが、知性や信頼性まで高く評価されたのです。フィルターで誰もが美しく見せられる時代になっても、「美しいものは善い」という古い心理は、なお働き続けている。"
    telop: "美の経済的プレミアム／フィルターでも消えない偏り"
    readings:
      - surface: "十数パーセント"
        reading: "ジュウスウパーセント"
    search_query: "income chart beauty premium bar graph"
    assets:
      - url: "https://pixabay.com/photos/blur-chart-computer-data-finance-1853262/"
        kind: image
        license: commercial-ok
        source_name: "Pixabay"
        note: "採用（build/sns-lookism-assets/scene_04.jpg）。金融チャート・データのぼやけた画。賃金プレミアムという経済データのテーマに直接合致"
      - url: "https://pixabay.com/photos/stock-market-chart-phone-stocks-6693060/"
        kind: image
        license: commercial-ok
        source_name: "Pixabay"
        note: "予備候補。株価チャートとスマートフォン"
    diagram:
      rows:
        - items:
            - id: attract
              icon: face
              text: 外見の良さ
              at: 2
        - items:
            - id: wage
              text: 賃金プレミアム
              at: 3
            - id: sort
              text: 有利な職業に集中
              at: 4
        - items:
