  - id: 9
    title: "まとめ"
    key_color: "#5A2E7D"
    narration:
      - text: "最後に、今日の要点を振り返ります。"
      - text: "第一に、人には「美しいものは善い」と感じる、根深い心理がある。"
      - text: "第二に、写真SNSの普及が、その心理を加速させ、外見の価値と整形容認を広げた。"
      - text: "第三に、それが、働き方の多様化や、自己決定の価値観と重なり、美を価値とする職業への偏見をやわらげた。"
      - text: "そして第四に、その同じ力は、人を外見で選別する、新しい圧力にもなる。"
      - text: "受容の、その裏側にあるものまで含めて見つめること。それが、この変化を考えるうえで、いちばん大切な視点なのかもしれません。"
    telop: "まとめ（4点）"
    search_query: "summary four points recap flat icon list"
    diagram:
      rows:
        - items:
            - id: p1
              text: 美は善いという心理
              at: 2
            - id: p2
              text: SNSが整形容認を加速
              at: 3
            - id: p3
              text: 多様化・自己決定と重なる
              at: 4
            - id: p4
              text: 選別の圧力にもなる
              at: 5
        - items:
            - id: view
              text: 受容の裏側まで見る視点
              accent: true
              at: 6
      arrows:
        - from: p1
          to: view
        - from: p2
          to: view
        - from: p3
          to: view
