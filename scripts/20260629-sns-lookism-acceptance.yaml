    visual_intent: "指摘と整理を左右に並べる比較図解で3つの反証を提示する。論点が密なので背景は敷かず、無地下地で図に集中させる"
    key_color: "#7D5A2E"
    narration:
      - text: "ここで、立ち止まって反論を検討しなければなりません。誠実な解説は、自分に都合の悪い見方からも、逃げないからです。"
      - text: "第一に、因果の向きです。SNSがルッキズムを生んだのか、それとも、もともとあった傾向を、SNSが増幅しただけなのか。これは、簡単には決められません。ですから正確には、SNSは原因というより「加速装置」と言うべきでしょう。"
      - text: "第二に、ルッキズムは諸刃の剣だ、ということです。外見を重んじる社会は、美しい人に好意を向けると同時に、人を見た目で値踏みし、外見が基準に満たない人を、厳しく裁く社会でもあります。"
      - text: "つまり、ルッキズムの加速は、受容と排除の、両方を強めうるのです。"
        pause_after: 0.5
      - text: "にもかかわらず、なぜ受容の側に振れるのか。それは、これらの職業が、まさに「美しさ」を価値として提供する仕事だからです。外見が高く評価される時代において、美を体現する人は、追い風を受けやすい。"
      - text: "第三に、整形を受け入れることと、性産業を受け入れることは、本来、別の問題です。両者を同じものとして語るのは、乱暴です。"
      - text: "ただ、どちらも「美や性をめぐる古いタブーがゆるんでいる」という、同じ時代の空気を映している、とは言えるでしょう。"
