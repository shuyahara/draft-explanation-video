- id: 5
  title: SNS は相手を選ばせない
  chapter_title: null
  narration:
  - text: ひどくなるわ。SNSだと、比べる相手まで勝手に決まってしまうのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 友達を思い浮かべてみて。家で静かに過ごしている人と、パーティーによく行く人、どっちが先に浮かぶ？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: パーティーの人なのだ。ちなみに僕は、おうちが皆勤賞なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 皆勤賞のずんだもんに、ちょうどいい調査があるわ。ギロビッチ教授たちが2017年に、300人に聞いたの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 自分と他人、どちらがパーティーによく行くと思うか。82％が「他人の方が多い」と答えたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 82％！？ そんなに大勢が他人より少ないなんて、変なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 変でしょう？ 友人の数でも、外食の回数でも、同じ結果だったの。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: 理由は、さっきの質問と同じ。思い浮かぶのが、目立つ人ばかりだからよ。家で本を読んでいる人は、誰の頭にも浮かばないの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: じゃあ僕、家にいる友達は思い出さずに、パーティーの人とばかり比べてたのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そういうことね。そしてSNSは、この偏りをそのまま画面にしたようなものよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 家で本を読んでいる姿は、投稿されないでしょう？ 投稿されるのは、パーティーと昇進。それが何百人分も流れてくるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: SNSを開いた時点で、僕はもう目立つ人ばかり見せられてたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 相手を選ぶ前に、向こうから流れてくるのよ。しかも、いいところだけね。
    speaker: めたん
    expression: normal
    pause_after: 2.0
  - text: ただ、相手の数が増えたこと自体を測った研究は、まだ見つかっていないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕、相手も選べてないし、いいところしか見えてないのだ。なんていうか、勝負になってないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: じゃあ、投稿もしないで眺めてるだけでも、気分は落ちるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【開幕の受け】まだ板は出さず、賑やかなパーティー写真の気配だけで開く
    from: 1
