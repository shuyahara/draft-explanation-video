- id: 5
  title: 相手は正しい。見えているものが違う
  chapter_title: 相手の、何が見えているのか
  narration:
  - text: いい問いね。同期を選んだこと自体は、理論どおりよ。問題は、その人のどこが見えているか、なの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2011年、スタンフォード大学の研究チームが、大学生にこんなことを聞いたの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: この2週間で落ち込んだことを、人に隠したか。逆に、うれしかったことも隠したか、ってね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 落ち込んだときの方が、隠しそうなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 落ち込んだ出来事の40％は隠されていたわ。でも、うれしい出来事は13％だけだったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 3倍も違うのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 今度は別の学生80人に、「同級生の何％が落ち込んだと思う？」と予想してもらったの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: その予想は、実際より平均17ポイントも低かったわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 一方、うれしい出来事の割合は、ほぼ正しく予想できていたのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 他人が落ち込んでいることだけ、実際より少なく見積もっているのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そう。落ち込みは隠されるから、見えない。見えないから、ないことになる。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 同期の昇進は見えるわ。でも、その人が落ち込んだ夜までは見えないの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: だから相手の人生が、実際より順調に見えるのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 同期にも、3時まで眠れない夜があったかもしれないのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ただし、この研究が調べたのは対面の大学生活よ。SNS そのものは扱っていないの。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: つまり、この見えなさは、SNS が生まれる前からあったということね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: SNS の前からあるのだ。じゃあ SNS だと、もっとひどくなるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: board
    cut_reason: 【道しるべ】章頭に板を出し、この章が②相手の何を見るかの話だと示す
