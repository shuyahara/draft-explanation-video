- id: 10
  title: 結び（冒頭の夜に戻る）
  chapter_title: null
  narration:
  - text: それじゃあ、同期の昇進報告を見た昨日の夜まで、戻ってみましょうか。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 「おめでとう」は、もう送ったのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: そのあとに、もう一通打つのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 「今度、どうやったのか聞かせて」…これでいいのだ？
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: それでいいわ。見えている一枚の裏を、自分から見に行くの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 結果だけでなく過程まで知れば、同期は優劣の相手じゃなくて、手本になるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 眺めるだけの夜を、話しかける夜に変えるのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: 比べること自体は、自分の位置を知るための方法よ。ずんだもんを苦しめていたのは、その使い方だったの。
    speaker: めたん
    expression: normal
    pause_after: 1.5
  - text: それなら、今夜は眠れそうね。頑張って、ずんだもん。
    speaker: めたん
    expression: smile
    pause_after: 0.8
  - text: 今夜は、3時前に眠るのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 2.0
