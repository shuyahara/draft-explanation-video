- id: 6
  title: SNS は相手を選ばせない
  chapter_title: null
  narration:
  - text: ひどくなる理由を考えるには、もう一つ見ないといけないことがあるわ。SNS では「誰と比べることになるか」という問題よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ここもギロビッチ教授の研究から見てみましょう。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 2017年、300人に「自分と他人、どちらがパーティーによく行くか」を聞いたの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕は行かない方なのだ。パーティーより、おうちが皆勤賞なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 皆勤賞のずんだもんには、意外な数字かもね。82％が「他人の方が多い」と答えたわ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 82％！？ そんなに大勢が他人より少ないなんて、変なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そう、変なのよ。友人の数でも、外食の回数でも、同じ結果だったの。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: なぜかというと、比べる相手を思い浮かべるとき、目立つ人ばかり浮かんでしまうからよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 家で本を読んでいる人は、誰の頭にも浮かばないの。パーティーの主役だけが浮かぶ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 目立つ人が、勝手に比べる相手になっているのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ここから先は、研究じゃなくて私の推論ね。SNS は、この偏りをそのまま画面にしたものよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 家で本を読んでいる姿は、投稿されないでしょう？ 投稿されるのは、パーティーと昇進よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: しかも、そんな目立つ瞬間が、何百人分も流れてくるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕が相手を選ぶ前に、相手の方から流れてくるのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そうよ。比べる相手を選ぶ前に、相手の方から流れてくる。それも、一番いい瞬間ばかりがよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 推論と言ったのは、相手の数が増えたこと自体を測った研究が、見当たらないからよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 相手を選べなくて、相手のいい瞬間しか見えない。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: じゃあ、投稿もしないで眺めているだけでも、気分は落ちるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
