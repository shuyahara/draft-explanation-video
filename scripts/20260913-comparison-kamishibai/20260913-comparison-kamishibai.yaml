- id: 8
  title: 「やめればいい」への答え
  chapter_title: null
  narration:
  - text: 勢いがいいわね。でも、答えは半分だけ正解よ。やめれば少し楽になる。でも、比べる癖は消えないの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: SNS を実際にやめてもらう実験もあるのよ。スタンフォード大学とニューヨーク大学の経済学者たちが、2020年に発表したの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: Facebook の利用者をランダムに二組に分けて、片方だけ4週間、アカウントを止めてもらったの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 止めた組は、幸福感が上がったわ。大きくはないけれど、効果は出ているの。8割の人が「止めてよかった」と答えたわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 上がるのだ。でも、思ったより小さいのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: もう一つ、ペンシルベニア大学では、SNS を1日30分に制限して3週間続けてもらったの。孤独感が減ったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 参加した学生の一人は、こんな感想を残しているわ。「他人の人生と自分を比べなくなったことが、思ったよりずっと効いた」。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: やっぱりやめれば効くのだ！ 今すぐアプリを消す指がうなるのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: ただし、SNS をやめても残る偏りがあるわ。落ち込みを隠す癖と、目立つ人ばかり思い浮かべる癖。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: あの二つは、SNS のない場面で見つかった研究だったでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: あっ。スマホを封印しても、僕の頭の中の同期は消えないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そう。SNS を減らすのも効くわ。でも、それだけじゃ足りないの。比べ方の方も直すのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: それに、比較には良い面もあるわ。能力を比べるとき、人は自分より上の相手を目指しやすい、とフェスティンガーは書いているの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 相手を手の届く手本と見られるときは、「あそこまで行きたい」という目標にもなるのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 比べること自体を消すんじゃなくて、比べ方を変えるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: じゃあ、具体的には何をすればいいのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【勢いを受ける】机に伏せて置かれたスマホで開く
    from: 1
    slot: 1
