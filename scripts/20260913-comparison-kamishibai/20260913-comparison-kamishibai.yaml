- id: 2
  title: なぜ比べずにいられないのか
  chapter_title: なぜ、比べずにいられないのか
  narration:
  - text: 身長なら、目盛りがあるわ。170センチ、と数字が出る。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: でも、仕事がどれくらいできるかとか、人としての価値には、目盛りがないでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: ないのだ…。だから、他人を目盛りにするのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。目盛りがないものは、人は他人と比べて測るの。1954年に、アメリカの心理学者レオン・フェスティンガーが、そう説明したのよ。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: 人には、自分の能力や意見がどのくらいかを知りたい欲求があるの。それが出発点ね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 自分がどのくらいかは、知りたくなるのだ。それは分かるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: それで、比べる相手には、遠い人より近い人を選びやすいの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 近い人って、同期みたいな相手なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そうよ。差が大きすぎる相手と比べても、自分の位置は分からないもの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: だから、ずんだもんは芸能人の年収では落ち込まない。落ち込むのは、同期よ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: うっ。確かに、社長の給料を見ても何も感じないのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 比べるのは、ほかに使える目盛りがないからなのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: しかもこれ、気持ちの問題だけじゃなくて、脳の反応にも出るのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 脳が？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 自分の報酬は同じで、隣の人の報酬だけ変わったら、脳はどう反応するか。それをドイツのボン大学などの研究チームが、MRIで調べたの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 2人1組で、隣り合う2台のMRIに入ってもらうの。簡単な課題に正解するとお金がもらえて、隣の人がもらった額も見せられるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: すると、自分の額が同じでも、相手より少ないときは、脳の報酬に関わる部分の反応が下がったの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: もらう額は同じなのに？ 相手が多いだけで、脳が反応しちゃうのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 33人の小さな実験だけどね。はっきり出たわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: だから、意志の力だけで止めるのは難しいのよ。
    speaker: めたん
    expression: smile
    pause_after: 1.5
  - text: ただ、フェスティンガーも、目盛りがないときの話だと言っているわ。身長みたいに測れるものなら、他人はいらないの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: そうか。僕が落ち込むのは、測れないものばかりなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.35
  - text: じゃあ、上を見て苦しいのは、仕方ないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: image
    cut_reason: 【測れるものの例】体重計に乗る足元で開く
