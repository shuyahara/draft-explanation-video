- id: 9
  title: 結び（なぜ比べてしまうのか）
  chapter_title: null
  narration:
  - text: ずんだもん、なんで人と比べてしまうのか、もう答えられるでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: えっと…仕事の出来には目盛りがないから、他人で測るしかないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。脳もその差に反応する。ここまでは、誰でも同じよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 苦しくなるのは、比べる相手が向こうから流れてきて、しかも相手のいいところしか見えないからよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 僕は昨日、流れてきたAさんの昇進だけ見て、3時まで落ち込んでたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そういうこと。それで、昨日の夜の続きだけど。「おめでとう」の次は？
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 「今度、どうやったのか聞かせて」…会って聞くのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: それなら、今夜は眠れそうね。頑張って、ずんだもん。
    speaker: めたん
    expression: smile
    pause_after: 0.8
  - text: 今夜は、3時前に眠るのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 2.0
