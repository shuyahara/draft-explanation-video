- id: 6
  title: 眺めるだけの 10 分が、夜の気分を下げる
  chapter_title: 眺めるだけで、気分は落ちるのか
  narration:
  - text: 落ちるのよ。眺めるだけで落ちるのか、確かめた実験があるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ミシガン大学などの研究チームが、2015年に学生を二組に分けたの。10分間、Facebookを使ってもらったのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 一組は、投稿やコメント、メッセージを送る組。もう一組は、フィードや友人の写真を、ただ眺める組。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕は完全に、眺める組なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 気分は、使う前と直後、それからその日の夜に測ったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 眺めた組だけ、その日の夜に気分が下がっていたわ。使う前より約9％。動いた組は変わらなかったの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 眺めただけなのに、夜に下がるのだ？ すぐじゃなくて？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そう、すぐじゃないの。夜になって出るのよ。昨日のずんだもんと同じね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 実験の外でも調べているわ。1週間、1日5回、気分と使い方を記録してもらったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 眺めたあとの時間帯ほど、気分が下がっていた。逆に、気分が悪いから眺めた、という関係は出なかったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕、気分が悪いから見続けてたと思ってたのだ。でも、見たあとに落ち込んでたのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そうみたいね。眺めたあとに妬みが生まれて、それで気分が下がっていた、と考えられているの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 同じ10分でも、眺めるだけの組は夜に気分が落ちて、自分から動いた組は落ちなかったのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 僕のも、たぶんそれなのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.35
  - text: もう分かったのだ。SNSをやめれば全部解決なのだ！ 今すぐスマホを封印するのだ！
    speaker: ずんだもん
    expression: angry
    pause_after: 0.6
  beats:
