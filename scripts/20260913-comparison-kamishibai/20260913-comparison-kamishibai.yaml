scenes:
- id: 1
  title: フック（人と比較してしまうずんだもん）
  chapter_title: null
  narration:
  - text: めたん、昨日の夜、寝る前にスマホを見てたら、同期の昇進報告が流れてきたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: 「おめでとう」って送ったのだ。でも、打ちながら胸が重くなって、なかなか眠れなかったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 祝う気持ちもあったけど、悲しくなったのね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕は何も失ってないのに、なんで落ち込むのだ？ 人と比べるのって、やめられないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.9
  - text: 難しい問題ね。人は、自分がどのくらいなのかを知るために、本能的に比較してしまうのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.8
  - text: それも踏まえて、なんで人が比較をしてしまうのか、研究や調査を見ながら解説していきましょうか。
    speaker: めたん
    expression: smile
    pause_after: 0.6
  - text: ありがとうなのだ。ぜひ頼むのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【夜のスマホ】暗い部屋でスマホを見る手元で開く（台本指定の静止画）
    from: 1
    slot: 1
    credit: 'Photo: Jaroslav Maler / Pexels'
  - type: image
    cut_reason: 【昇進報告】スーツ姿の握手カットに替え、流れてきた投稿を示す（「同期の昇進報告」がcue1内に同居するため、congratulationsを送る自然な継続点へ後ろ倒し）
    from: 2
    slot: 2
    credit: 'Photo: Khwanchai Phanthong / Pexels'
  - type: image
    cut_reason: 【異常事態】眠れない人の寝室に替え、無音でも伝わるようテロップを添える
    from: 3
