- id: 4
  title: 上を見るから苦しいとは限らない
  chapter_title: 上を見るから、苦しいのか
  narration:
  - text: その「上を見るから苦しい」という前提を、二つ目の話でひっくり返しましょう。上を見ること自体が原因とは限らないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: でも、上を見たら自分が下に見えるのだ。それが苦しいのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: それを考えるのに、面白い調査があるわ。コーネル大学のギロビッチ教授たちが、1992年のバルセロナ五輪で行ったの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: メダリストの競技直後の表情を録画して、スポーツを知らない学生20人に見せたのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 「この人はどのくらい幸せそうか」を、10点満点で採点してもらったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 金が一番、銀が二番、銅が三番になりそうなのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 銀と銅を比べると、逆だったの。銅メダリストの平均は7.1点。
    speaker: めたん
    expression: smug
    pause_after: 0.35
  - text: 銀メダリストは、4.8点よ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 銀の方が低い！？ 順位は銀が上なのに、なんでなのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 研究チームの解釈はこうよ。銀メダリストが見ていたのは、金。「あと一歩で金だった」と思っている。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ銅の人は、4位を見て「あと一歩でメダルなしだった」と思ったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: その通り。同じ表彰台なのに、見ている相手が違うのよ。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: 気分を決めるのは、順位だけじゃないの。何と比べたか、よ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: ただし、ここは注意ね。これは表情を採点した結果で、本人に聞いたわけではないの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: それに、これは他人との比較というより、何を基準にしたかの話よ。同じなのは、気分が結果だけでなく基準で変わる、という点ね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕にも覚えがあるのだ。テストで80点でも、平均が90点だと落ち込むのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ええ。同じ80点でも、90点の平均を見た途端に低く感じてしまうのね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: でも待つのだ。僕はちゃんと近い同期を選んだのだ。それでも壊れるのは、なぜなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
