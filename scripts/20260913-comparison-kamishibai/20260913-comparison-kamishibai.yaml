- id: 8
  title: じゃあ、どうすればいいのか
  chapter_title: じゃあ、どうすればいいのか
  narration:
  - text: 比べる理由は「目盛りがないから」だったでしょう？ だったら、目盛りのあるものを一つ持てばいいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 目盛りのあるもの？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 資格の合否、走ったタイム、書き上げた枚数。他人がどうでも、自分の数字が出るものよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そこでは他人を見る必要がないから、比べようがないの。実験で確かめた話じゃなくて、理屈の上での話だけどね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 資格の勉強なら、隣の人の点数は見えないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: それから、SNSは眺めるだけで終えないこと。落ち込んだら、いま誰と比べているのか、一人だけ名指ししてみて。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 昇進した、同期のAさんなのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: フィードを眺めているときは、何百人分のいい瞬間と比べているの。Aさん一人になれば、普通の人間よ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 思い浮かべる相手を、目立つ人じゃない特定の知人に指定すると、劣等感が消えたの。ギロビッチ教授たちの別の実験よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: でも、昇進した相手に聞くのは、ちょっと気まずいのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 気まずいわよね。でも、Aさんに「どうやったのか」を聞くのよ。メッセージでもいいし、会う約束をして聞くのが一番いいわ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 自分から動いた組は気分が下がらなかったし、会えば、投稿に出ていない部分まで見えるでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 眺める10分の代わりに、Aさんを飲みに誘うのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: SNSをやめてしまってもいいし、続けるなら、眺めるだけで終えないことね。
    speaker: めたん
    expression: serious
    pause_after: 2.0
