- id: 8
  title: どうすればいいのか
  chapter_title: どうすればいいのか
  narration:
  - text: 比べる理由は「目盛りがないから」だったでしょう？ だったら、目盛りのある趣味とかを一つ持てばいいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 目盛りのあるもの？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 資格の合否、走ったタイム、書き上げた枚数。他人がどうでも、自分の数字が出るものよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: そこでは他人を見る必要がないから、比べようがないの。実験で確かめた話じゃなくて、理屈の上での話だけどね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 資格の勉強なら、隣の人の点数は見えないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: それから、SNSは眺めるだけで終えないこと。気になった相手がいたら、その人に話しかけてみるの。ずんだもんなら、誰？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 昇進した、同期のAさんなのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: でも、昇進した相手に話しかけるのは、ちょっと気まずいのだ…。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そう思うわよね。でも、その気まずさは、たいてい思い過ごしなのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: ピッツバーグ大学などの研究で、しばらく連絡していない友人に、実際に一言メッセージを送ってもらったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 送った側は「そんなに喜ばないだろう」と予想していたけど、受け取った側は、その予想より喜んでいたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 予想と逆なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.6
  - text: だから、Aさんに「どうやったのか」を聞いていいのよ。メッセージでもいいし、会う約束をして聞くのが一番いいわ。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 自分から動いた組は気分が下がらなかったし、会えば、投稿に出ていない部分まで見えるでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 眺める10分の代わりに、Aさんを飲みに誘うのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: SNSをやめてしまってもいいし、続けるなら、眺めるだけで終えないことね。
    speaker: めたん
    expression: serious
    pause_after: 2.0
