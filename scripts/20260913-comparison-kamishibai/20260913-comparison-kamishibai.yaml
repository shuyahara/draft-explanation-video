- id: 2
  title: 「比較」とは何か、答えを先に
  chapter_title: null
  narration:
  - text: まず、「比較」って何かを揃えておきましょうか。自分がどのくらいなのかを、他人を見て測ることよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 仕事ができるか。話が面白いか。ちゃんと生きているか。こういうことも、他人を見ながら測っているの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 確かに、僕が「仕事ができる方だ」と思うときは、誰かと比べているのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: じゃあ、先に結論を言うわね。比較は、やめられないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 壊れているのは二つ。「誰と比べるか」と、「相手の何を見るか」よ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: だから、その二つを自分で選び直せばいいの。
    speaker: めたん
    expression: smile
    pause_after: 1.5
  - text: 誰と比べるか、と、相手の何を見るか…。まだ、ぴんと来ないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: このあと、思い込みが三つひっくり返るわ。順番に見ていきましょう。
    speaker: めたん
    expression: smug
    pause_after: 0.35
  - text: まず一つ目ね。比較は、悪い癖じゃないわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 二つ目。苦しいのは、上を見るからとは限らないの。銀メダルより銅メダルの方が、幸せそうに見えるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 銀より銅？ 順位は銀が上なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: その謎は、あとで解くわね。三つ目は、みんなが自分より充実して見える理由よ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 三つとも、気になるのだ。じゃあまず、なんで僕は比べずにいられないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  beats:
  - type: board
    cut_reason: 【用語の定義】比較の定義を黒板に固定し、以後の章が参照できるようにする
