  sfx: chic
scenes:
- id: 1
  title: フック（同期の昇進を見た夜）
  chapter_title: null
  narration:
  - text: めたん、昨日の夜、寝る前にスマホを見てたら、同期の昇進報告が流れてきたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: 「おめでとう」って送ったのだ。でも、打ちながら胸が重くなって、3時まで眠れなかったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 3時まで。それはこたえるわね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕は何も失ってないのに、なんで落ち込むのだ？ 人と比べるのって、やめられないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.9
  - text: やめられないわ。比べるのは、性格が悪いからじゃないの。自分がどのくらいなのかを知る方法が、他人を見ることしかないからよ。
    speaker: めたん
    expression: explain
    pause_after: 0.8
  - text: ただね、いまのずんだもんは、比べる相手が勝手に流れてきて、その相手のいいところしか見えていないの。
    speaker: めたん
    expression: serious
    pause_after: 1.2
  - text: 流れてきて、いいところしか見えない…。じゃあまず、なんで僕は比べずにいられないのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  beats:
  - type: image
    cut_reason: 【夜のスマホ】暗い部屋でスマホを見る手元で開く（台本指定の静止画）
    from: 1
    slot: 1
    credit: 'Photo: Jaroslav Maler / Pexels'
  - type: image
    cut_reason: 【昇進報告】スーツ姿の握手カットに替え、流れてきた投稿を示す（「同期の昇進報告」がcue1内に同居するため、congratulationsを送る自然な継続点へ後ろ倒し）
    from: 2
    slot: 2
    credit: 'Photo: Khwanchai Phanthong / Pexels'
  - type: image
    cut_reason: 【異常事態】3時台を示す時計に替え、無音でも伝わるようテロップを添える
