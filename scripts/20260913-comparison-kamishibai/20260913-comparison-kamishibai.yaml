- id: 5
  title: SNS は相手を選ばせない
  chapter_title: null
  narration:
  - text: ひどくなるわ。SNSだと、比べる相手まで勝手に決まってしまうのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 友達を思い浮かべてみて。家で静かに過ごしている人と、パーティーによく行く人、どっちが先に浮かぶ？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: パーティーによく行く人なのだ。ちなみに僕は、おうち派なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: そんなずんだもんに、ちょうどいい調査があるわ。ギロビッチ教授たちが2017年に、300人に聞いたの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 自分と他人、どちらがパーティーによく行くと思うか。82％が「他人の方が多い」と答えたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 82％！？ そんなに大勢が他人より少ないなんて、変なのだ。本当なら50%のはずなのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 変でしょう？ 友人の数を聞いても、外食の回数でも、同じように他人の方が多いと思う結果だったの。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: 理由は、さっきの質問と同じ。思い浮かぶのが、目立つ人ばかりだからよ。家でゆっくりしているような人は、頭にも浮かびにくいの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: じゃあ僕、家にいる友達は思い出さずに、パーティーの人とばかり比べてたのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そういうことね。そしてSNSは、この偏りをそのまま画面にしたようなものよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 家でスマホを見ているような姿は、投稿されないでしょう？ 投稿されるのは、華やかなパーティー、旅行や祝い事。それが何百人分も流れてくるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: SNSを開いた時点で、僕はもう目立つ人ばかり見せられてたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 相手を選ぶ前に、向こうから流れてくるのよ。しかも、いいところだけね。
    speaker: めたん
    expression: normal
    pause_after: 2.0
  - text: 僕、相手も選べてないし、いいところしか見えてないのだ。なんていうか、勝負になってないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: じゃあ、投稿もしないで眺めてるだけでも、気分は落ちるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
