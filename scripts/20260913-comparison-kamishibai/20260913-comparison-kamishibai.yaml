- id: 7
  title: 眺めるだけの 10 分が、夜の気分を下げる
  chapter_title: 眺めるだけで、気分は落ちるのか
  narration:
  - text: ええ。眺めるだけでどうなるかを、ミシガン大学などの研究チームが2015年に確かめているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 学生を二組に分けて、10分間、Facebook を使ってもらうの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 一組は、投稿やコメント、メッセージを送る組。自分から動く使い方ね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: もう一組は、フィードや友人の写真を、ただ眺める組よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕は完全に、眺める組なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 気分は、使う前と直後、それからその日の夜。全部で3回測ったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 眺めた組だけ、その日の夜の気分が、使う前より約9％下がったわ。動いた組には変化がなかったの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 眺めただけなのに、その日の夜に気分が下がるのだ？ 時間差があるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そう、直後には出ないの。夜になって出るのよ。昨日のずんだもんみたいね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 実験の外でも調べているわ。1週間、1日5回ずつ、気分と使い方を記録してもらったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 眺めた後の時間帯ほど、気分が下がっていた。反対に、「気分が悪いから眺めた」という関係は見つからなかったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 落ち込んでいるから眺めるんじゃなくて、眺めるから落ち込むのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 眺めてから気分が下がるまでに、何があったのか。妬みよ。眺める、妬む、気分が下がる、の順ね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 同じ10分でも、眺めるだけなら夜の気分が下がる。自分から動いた組は、下がらなかったのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: ただし、下がったのは気分で、生活への満足度は変わらなかったわ。それに、対象は大学生よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 生活への満足度じゃなくて、気分だけなのだ。でも僕には、その気分こそが問題なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: もう分かったのだ。SNS をやめれば全部解決なのだ！ 今すぐスマホを封印するのだ！
    speaker: ずんだもん
    expression: angry
    pause_after: 0.6
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: image
    cut_reason: 【実験の準備】明るい部屋でノートPCに向かう学生で開く
    from: 1
    slot: 1
    credit: 'Photo: kaboompics / Pexels'
  - type: image
    cut_reason: 【研究の出典】同じ写真を保持したまま、実施機関と年をテロップで出す
    from: 3
    slot: 2
    credit: 'Verduyn, P. et al. (2015). Passive Facebook usage undermines affective well-being. Journal of Experimental Psychology: General, 144(2), 480–488.／Photo: kaboompics / Pexels'
    telop: ミシガン大学など 学生67人（2015）
  - type: image
    cut_reason: 【時間差】暗い部屋でスマホの光に照らされた顔に替え、夜になって出る変化を示す
    from: 8
    slot: 3
    credit: 'Photo: SHVETS production / Pexels'
  - type: diagram
    cut_reason: 【因果の鎖】眺めるだけ→妬み→夜の気分が下がる、を1本の鎖で見せる。動く組の変化なしはcaptionで補う
    from: 10
