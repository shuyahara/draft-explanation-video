scenes:
- id: 1
  title: フック（同期の昇進を見た夜）
  chapter_title: null
  narration:
  - text: めたん、聞いてほしいのだ。昨日の夜、寝る前にスマホを見てたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: そしたら、同期の昇進報告が流れてきたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.35
  - text: 「おめでとう」って送ったのだ。でも、文字を打つほど胸が重くなったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ちゃんと「おめでとう」を送ったのね。それで、そのあと眠れたのかしら。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 3時まで眠れなかったのだ。僕は何も失ってないのに、なんでこんなに落ち込んだのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.35
  - text: 人と比べるのって、やめようとしてもやめられないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.9
  - text: いい問いね。今日は、その理由を一緒に確かめましょう。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 先に、答えだけ言っておくわね。比べるのは、性格の欠点じゃないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 仕事の出来みたいに目盛りのないものは、他人を見るしか測りようがないの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ただ、その測り方がいま、壊れているのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
  - text: 壊れてる？ 比べるのって、測り方なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そうよ。道具みたいなものね。使い方を間違えると、夜中の3時まで眠れなくなるの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 比較にも説明書が必要だったのだ。じゃあまず、比べるって何なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  beats:
