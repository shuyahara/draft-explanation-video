- id: 3
  title: なぜ比べずにいられないのか
  chapter_title: なぜ、比べずにいられないのか
  narration:
  - text: 1954年にね、アメリカの心理学者レオン・フェスティンガーが、「社会的比較」の理論を出したの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 人には、「自分の能力や意見を評価したい」という欲求があるの。ここが出発点よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 自分がどのくらいかは、知りたくなるのだ。それなら分かるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 問題は、何で測るかね。身長や体重なら、目盛りがあるでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: でも、仕事がどれくらいできるか、人としての価値には、体重計みたいな目盛りがないの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 目盛りがない…。だから、他人を目盛りにするのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: その通り。目盛りがないとき、人は他人と比べて自分を測る。これが理論の中心よ。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: もう一つ大事なことがあるわ。比べる相手は、遠い人より近い人を選びやすいの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 近い人って、同期みたいな相手なのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そうよ。自分と差が大きすぎる相手とは、比べても自分の位置が分からないでしょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: だから、ずんだもんは芸能人の年収では落ち込まない。落ち込むのは、同期よ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: うっ。確かに、社長の給料を見ても何も感じないのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: つまり、比べるのは、ほかに使える目盛りがないからなのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: しかもね、比べた結果は、感想だけじゃなくて、脳の活動にも表れるの。それを調べた実験があるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ドイツのボン大学などの研究チームが、2人1組の参加者を集めたの。隣り合う2台の MRI に、一人ずつ入ってもらったのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 簡単な課題に正解すると、お金がもらえる。ただし、隣の人がもらった額も見せられるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 結果、自分がもらう額は同じでも、相手より少ないと、脳の報酬に関わる部分の反応が下がったの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: もらう額は同じなのに？ 相手が多いだけで、脳の反応が変わるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そう。33人の小さな実験だけど、相手より少ないと反応が下がる、という結果がはっきり出たわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 比べるのは意志の弱さじゃなくて、脳の反応まで動かす仕組みなのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: ただ、フェスティンガーも、「目盛りがないとき」と限っているの。身長みたいに測れるものなら、他人はいらないわ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: そうか。僕が落ち込むのは、測れないものばかりなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.35
  - text: じゃあ、上を見て苦しいのは、仕方ないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
