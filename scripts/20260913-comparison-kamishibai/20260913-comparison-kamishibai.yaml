- id: 9
  title: 使い直す三つ
  chapter_title: どう、使い直すのか
  narration:
  - text: できることは三つよ。ここからは研究の結果じゃなくて、私の提案ね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 最初の二つは「相手の何を見るか」に、三つ目は「誰と比べるか」に当たるわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 一つ目。見えていない部分も、あるものとして数に入れること。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 同期にも、投稿されなかった落ち込む夜があるかもしれないわ。他人の落ち込みは、17ポイントも少なく見積もられていたでしょう？
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 見えている一枚が、全部じゃないのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 二つ目。眺めるだけで終えずに、話しかけること。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 「おめでとう」のあとに、「今度、どうやったのか聞かせて」と続けるの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 相手の見える範囲が広がるかもしれないわ。それに話しかけるのは、実験で言う「自分から動く使い方」に近いでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: なるほど。眺める10分を、話しかける10分に変えるのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: 三つ目。比べる相手を、自分で決めること。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ギロビッチ教授たちの別の実験では、比べる相手をあらかじめ指定したの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: あまり社交的じゃない知人を思い浮かべて答えてもらうと、「自分の方が劣っている」という感覚が消えたの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: それどころか、生活の満足度は、かえって上がったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: この実験は社交生活の話だから、仕事に当てはめるのは私の提案ね。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 相手を変えただけで、感覚が消えるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 銀と銅で、何を見たかによって気分が違って見えたのと同じね。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: ただし、「下を見ろ」という話じゃないのよ。流れてきた相手を、そのまま基準にしなくていい、という話。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 違いは、流れてきた相手をそのまま基準にするか、自分で選び直すか、なのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 比べるのをやめるんじゃない。誰と、何を見て比べるかを、自分で決めるのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: じゃあ、フィードに出てきた順に落ち込むのは、もうやめるのだ。相手は僕が選ぶのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: それなら、僕にもできそうなのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 1.2
