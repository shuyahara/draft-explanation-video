- id: 3
  title: 順位がよければ、楽になるのか
  chapter_title: 順位がよければ、楽になるのか
  narration:
  - text: 上を見たら苦しい。それは合っているわ。むしろ、順位がよくても、上を見ていれば苦しいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 順位がよくても？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: オリンピックの銀メダリストよ。銅メダルの人より、暗い顔をしていることが多いの。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 銀メダルの方が上なのに、なんでなのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: コーネル大学のギロビッチ教授たちが、1992年のバルセロナ五輪の映像で調べたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: メダリストの競技直後の表情を、スポーツを知らない学生20人に見せたのよ。どのくらい幸せそうか、10点満点で採点してもらったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 銅メダリストの平均は7.1点。銀メダリストは、4.8点だったわ。
    speaker: めたん
    expression: smug
    pause_after: 0.45
  - text: 銀メダリストの方がだいぶ低いのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 2位の人は、1位を見ているの。「あと一歩で金だった」と思っている。研究チームは、そう考えたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ3位の人は、4位を見て「あと一歩でメダルなしだった」と思ったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: その通り。同じ表彰台にいても、頭の中で比べている相手が違うのよ。
    speaker: めたん
    expression: delighted
    pause_after: 0.35
  - text: 同じ銀メダルでも、1位を見ていれば苦しいし、4位を見ていれば楽なの。しかもどっちを見るかは、本人が選んだのではなく、状況が決めていたのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: もっとも、本人に聞いたわけじゃないわ。学生が表情を見て採点した結果よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 僕にも覚えがあるのだ。テストで80点でも、平均が90点だと落ち込むのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そうそう。80点は変わらないのに、90点を見た途端に低く感じるのよね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 僕の場合はどうなのだ？ 同期は近い相手だから、比べる相手としては間違ってないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
  beats:
