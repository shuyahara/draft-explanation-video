- id: 7
  title: 「やめればいい」への答え
  chapter_title: null
  narration:
  - text: 勢いがいいわね。半分は正解よ。やめれば少し楽になるわ。
    speaker: めたん
    expression: smile
    pause_after: 0.8
  - text: 実際に止めてもらった実験があるの。スタンフォード大学とニューヨーク大学の経済学者たちが、2020年に発表したのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: Facebookの利用者をランダムに二組に分けて、片方だけ4週間、アカウントを止めてもらったの。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 止めた組は、幸福感が少し上がったわ。大きくはないけど、確かに出ているの。8割の人が「止めてよかった」と答えているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 上がるのだ。でも、思ったより小さいのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ペンシルベニア大学でも、SNSを1日30分に制限して3週間続けてもらったの。こっちは孤独感が減ったわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 参加した学生の一人は、こう書いているの。「他人の人生と自分を比べなくなったことが、思ったよりずっと効いた」。
    speaker: めたん
    expression: smile
    pause_after: 0.9
  - text: やっぱりやめれば効くのだ！ 今すぐアプリを消す指がうなるのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: ちょっと待って。落ち込みを隠す話と、目立つ人ばかり浮かぶ話、どっちもSNSのない場面の研究だったでしょう？
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: あっ。スマホを封印しても、僕の頭の中の同期は消えないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そうなの。SNSを減らすのも効くけど、それだけだと、頭の中で比べるところまでは止まらないのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: それにね、比べることには良い面もあるの。能力を比べるとき、人は自分より上の相手を目指しやすい、とフェスティンガーは書いているわ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 手が届きそうな相手なら、「あそこまで行きたい」という目標になるのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: じゃあ僕、比べちゃったこと自体を責めなくていいのだ。誰をどう見るかを変えればいいのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.35
  - text: でも、具体的には何をすればいいのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.2
