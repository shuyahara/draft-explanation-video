- id: 4
  title: 相手との比較で見えているもの
  chapter_title: 相手との比較で見えているもの
  narration:
  - text: 相手の選び方は、間違ってないわ。問題は、その同期のどこが見えているかよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: どこって…昇進したところなのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そう、それだけよ。でも、同期の人にもつらいことや落ち込んだことがあったはずよ。それ、ずんだもんに見えるかしら。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 見えないのだ。落ち込んでるときは、誰にも言わないと思うのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 実際そうなの。スタンフォード大学の研究チームが、2011年に大学生に聞いたのよ。この2週間で落ち込んだことを、人に隠したかって。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 落ち込んだ出来事の40％は、隠されていたわ。うれしい出来事で隠されたのは、13％だけ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 3倍も違うのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: ここからが面白いの。別の学生80人に、同級生の何％が落ち込んだと思うか、予想してもらったのよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: 予想は、実際より平均17ポイントも低かったわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 逆にうれしい出来事の方は、ほぼ正しく予想できていたのよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: みんな、他人の落ち込みは少なく見積もってるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そうなの。隠されていると、そもそもなかったように見えるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 同期の昇進は分かっても、その人が落ち込んだ夜までは分からないでしょう？ だから、相手の人生が実際より順調に見えるのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 同期にも、なかなか眠れない夜があったかもしれないのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: あったかもしれないわね。ちなみにこの研究、SNSが登場する前の大学生活の状況を調べたものよ。
    speaker: めたん
    expression: normal
    pause_after: 0.35
  - text: つまり、この状況はSNSが生まれる前からあったということね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: SNSの前からなのだ。じゃあSNSだと、もっとひどくなるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 1.2
  beats:
  - type: chapter
    cut_reason: 【章の入口】黒板に問いを書いて本題へ
  - type: board
    cut_reason: 【道しるべ】章頭に板を出し、この章が②相手のどこを見ているかの話だと示す
    from: 1
    telop: '比較の、おかしくなっている二つ

      ① 相手が勝手に流れてくる

      ② いいところしか見えない'
    highlight_lines:
