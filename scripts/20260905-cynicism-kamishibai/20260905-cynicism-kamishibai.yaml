- id: 5
  title: 探索①（第一の安さ・考えなくて済む）
  chapter_title: 冷笑は、なぜ安いのか
  narration:
  - text: 冷笑が安い。この意味を、三つに分けて見ていくわ。まず一つ目。メディア論を研究する、慶應義塾大学の津田正太郎さんは、現代のシニシズムを、他人の言動をつねに利己的な動機で解釈しようとする態度と定義したの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 利己的な動機……。「どうせ売名でしょ」も、それなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そのとおりよ。「あの人はカネのためにやっている」「売名だ」「ポーズだ」。こう決めてしまえば、相手の主張の中身を吟味する手間は、丸ごと省けるでしょう？
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: あ……。僕、あの投稿の中身、読んでなかったのだ。海岸のどこを、いつ掃除するのかも知らないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 情報が多すぎる時代に、これほど効率のいい処理はないのよ。津田さんが例に挙げたのは、アニメ調の女性キャラクターを使った献血ポスターをめぐる論争だったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 批判する側も、擁護する側も、「相手には邪悪な動機がある」と決めつけ合っていたの。どちらの側にいても、動機を疑えば、考えずに済むのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 敵同士なのに、やってることは同じなのだ……。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: しかもこの疑いは、中身に反論しなくても相手を黙らせられるうえ、正義を掲げる相手ほど、よく効くの。理想を語る人ほど、動機を疑われたときの傷が深いからよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 本気の人ほど、深く刺さるのだ。ひどい話なのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 冷笑の第一の安さは、考えなくて済むことにあるのよ。
    speaker: めたん
    expression: point
    pause_after: 1.0
  - text: 一つ目が「考えなくて済む」。じゃあ、二つ目は何なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 二つ目は、ちょっと耳が痛いかもしれないわ。冷笑すると、賢く見えるのよ。
    speaker: めたん
    expression: smug
    pause_after: 1.2
