- id: 7
  title: 探索③（第三の安さ・防衛）と、ひとつ目の答え（無力感）
  chapter_title: 冷笑は、何を守っているのか
  narration:
  - text: 第三の安さは、防衛の安さよ。期待しなければ、失望しない。動かなければ、負けない。嗤う側にいれば、嗤われない。
    speaker: めたん
    expression: explain
    pause_after: 0.8
  - text: 嗤う側にいれば、嗤われない……。確かに、笑ってる間は安全なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: だとすれば、冷笑は、何かから自分を守っているの。では、何から守っているのか。調べていくと、守っているものが、少なくとも三つ見えてくるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 三つも。一つ目は何なのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ひとつ目は、無力感よ。
    speaker: めたん
    expression: serious
    pause_after: 0.5
  - text: 日本財団が2019年に行った18歳意識調査では、「自分で国や社会を変えられると思う」と答えた日本の若者は、18.3パーセントだったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 18パーセント！？ 五人に一人もいないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 9カ国の中で最下位よ。2番目に低い韓国が39.6パーセントだから、その半分にも満たないの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕も、聞かれたら「変えられない」って答えてた気がするのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 「どうせ変わらない」。この前提に立つと、変えようとする人は、無駄なことをしている愚か者に見えてしまうのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 海岸掃除の人も、僕にはそう見えてたのだ。でも、なんで愚か者に見えちゃうのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 哲学者のヤン・エルスターが、いい名前をつけているわ。手に入らないものの価値を人が切り下げてしまう仕組みを、イソップの狐になぞらえて、酸っぱい葡萄と呼んだの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 知ってるのだ！ 狐が届かない葡萄を、「あれは酸っぱいに決まってる」って言って去っていく話なのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: そう。届かない葡萄は、酸っぱいことにすればいい。そうすれば、届かない自分を責めずに済むでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 変えられない社会なら、変えようとする人を嗤えばいい。そうすれば、動かない自分を責めずに済むのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 葡萄を酸っぱいことにするのと、海岸掃除を「意識高い」で済ませるのが、同じ形なのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ただ、正直に言っておくわ。無力感が冷笑の土壌になっている、というのは、ここから立てられる私の仮説よ。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 一つ目は、無力感。じゃあ二つ目は？ もっと意外なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 二つ目は、もっと意外よ。標的にされるのは、優れた人ではないの。
    speaker: めたん
    expression: smug
    pause_after: 1.2
