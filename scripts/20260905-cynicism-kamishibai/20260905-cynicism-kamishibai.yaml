- id: 9
  title: 三つ目の答え（嫉妬）
  chapter_title: null
  narration:
  - text: ケンタッキー大学の心理学者、リチャード・スミスたちは1996年、優秀な学生のインタビュー映像を人々に見せたあとで、「その学生が挫折した」と伝える実験を行ったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: わざと挫折したって伝えたのだ？ 何を調べるためなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 誰がその挫折を喜ぶか、よ。結果は、優秀さへの嫉妬を感じていた人ほど、その挫折を喜んだの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 人の挫折を喜ぶって、嫌な気持ちなのだ。でも、分かる気もするのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: オーストラリアのフリンダース大学のノーマン・フェザーは、自尊心の低い人ほど、高く昇った人の転落を望むことを、繰り返し確かめているわ。オーストラリアには、「高く伸びた芥子は刈り取られる」という言い回しがあるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 目立った花だけ、切られちゃうのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 自分と似た立場の誰かが、先に行った。認めたくないその痛みを、人は、笑いに変えるの。「意識が高い」という言葉に含まれている棘は、ここから来ているのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 棘……。でも僕、海岸掃除の人に嫉妬なんて、してないと思うのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そこは、付け加えておかなければならないところよ。フェザーが2002年に行った実験では、転落を喜ぶ気持ちを直接に予測したのは、嫉妬そのものよりも、「あの評価は不当だ」という憤りだったの。
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: 不当だ、という気持ち！ 「なんであの人だけ褒められるのだ」みたいな。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そうよ。嫉妬は、しばしば、冷笑の奥にあるの。それが表に出るときは、「不当だ」という言葉の形を取るのよ。
    speaker: めたん
    expression: explain
    pause_after: 2.0
  - text: 「どうせ売名でしょ」も、「本気じゃないのに評価されるのは不当だ」って言ってるのだ……。無力感、責められる予期、嫉妬。この三つは、全部同じ人に向かうのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: いい質問ね。実は、三つの答えは、冷笑の向かう相手も変えるのよ。それを整理してみましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
