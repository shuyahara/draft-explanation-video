- id: 11
  title: 安い知性の請求書——中盤の反転②
  chapter_title: 安い知性の請求書は、誰が払うのか
  narration:
  - text: 皮肉屋の方が賢い、と、56パーセントから70パーセントの人が答えたわね。では、実際はどうだったのか。研究チームは、ドイツの成人9000人あまりと、30カ国およそ20万人のデータで、皮肉の強さと認知能力の関係を調べたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 20万人！ すごい規模なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 結果は、逆だったのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 逆！？ 皮肉屋のほうが、賢くなかったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 皮肉の強い人ほど、読解や数学の成績は低かったの。相関は弱いけれど、30カ国で、ほぼ一貫していたわ。研究チームはこれを、皮肉屋の天才幻想と名付けているの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 賢く見えるだけで、賢くはなかったのだ……。幻想なのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 話は、これで終わらないのよ。同じチームがアメリカの全国調査を追跡したところ、人を信じない度合いが強い人は、9年後の収入が低かったの。
    speaker: めたん
    expression: explain
    pause_after: 0.5
  - text: 収入まで！？ なんで信じないだけで、収入が下がるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 研究チームの説明は、こうよ。信じないために協力の機会を逃し、警戒に力を使いすぎるからだ、と。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2024年には、もっと切ない結果も出ているわ。シニカルな人ほど権力を欲しがるのに、実際にリーダーに選ばれることは少なかったの。約9000人を、最長10年追った結果よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 仲間はずれの実験もあるのよ。シンガポール経営大学のチームが調べたところ、仲間はずれにされたあと、普通の人は他者への共感が高まって、つながり直そうとしたの。でも、シニシズムの強い人には、その反応が起きなかった。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 傷ついたあとに、つながり直せないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 傷つく前に切り捨てるから、つながり直す動きが起きにくいのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 精神科医のジョージ・ヴァイラントは、心の防衛を成熟度で並べたとき、ユーモアを最も成熟した防衛に置いて、直接ぶつからずに相手を傷つける受動攻撃を、未成熟な防衛に分類したわ。「冗談だった」と言い逃れできる皮肉は、この未成熟な側に近いの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 「冗談なのだ」って、僕、よく言うのだ……。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 冷笑は安い。
    speaker: めたん
    expression: serious
    pause_after: 0.5
  - text: 安いから、広がる。
    speaker: めたん
    expression: serious
    pause_after: 0.5
  - text: だけど、安いものはたいてい、後で高くつくのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 請求書は、笑った本人に来るのだ……。でも、めたん。これって結局、皮肉屋の性格が悪い、って話になっちゃうのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: それで終わらせてはいけないの。ここからは、冷笑を育てている、環境の話をするわ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
