- id: 4
  title: 古代②（反転）
  chapter_title: null
  narration:
  - text: ギリシャ語で犬は、キュオーン。そこから、ディオゲネスたちの一派は、キュニコス、犬のような者たちと呼ばれたの。英語のシニック、シニシズムは、この犬に由来するのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: キュオーン、キュニコス、シニック。音がつながってるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: では彼らは、何を嗤っていたのか。富と、権力と、慣習よ。人はもっと少ないもので生きられるはずだと考えて、それを言葉ではなく、自分の暮らしそのもので示したの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 甕で寝てたのも、大王にどいてくれって言ったのも、全部それなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: フランスの哲学者ミシェル・フーコーは晩年の講義で、彼らを、真理を語る勇気を生き方そのもので体現した人々と評しているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: つまり最初のシニシズムとは、力を持たない側から権力へ向かう、下から上への嗤いだったの。
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: 下から上！ 海岸掃除の人を笑うのとは、向きが逆なのだ。
    speaker: ずんだもん
    expression: point
    pause_after: 0.45
  - text: そうよ。ところが、この言葉はやがて意味を変えるの。英語のシニックが、哲学の一派ではなく、人の動機を疑って鼻で笑う性格を指すようになったのは、19世紀半ばのことだとされているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 文学研究者のデイヴィッド・マゼラは、これを弱まりではなく、反転と呼んだの。かつては欲望を抑える鍛錬を意味した言葉が、いまや無関心と受動性を意味している、と。
    speaker: めたん
    expression: explain
    pause_after: 0.6
  - text: 鍛錬が、無関心に……。同じ言葉で、中身が反対になったのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ドイツの哲学者ペーター・スローターダイクは1983年、この二つを、綴りで分けたわ。古代の、身体で示す嗤いをキュニシズム。近代の、知っていながら何もしない態度をシニシズム。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 彼はそれを、啓蒙された偽りの意識と呼んだの。近代の冷笑家は、世の中の仕組みを、すべて見抜いているつもりでいる。だからこそ、何もしない。知った上で、動かないのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 見抜いてるなら、動けばいいのに。なんで動かないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 動かないほうが、傷つかないからよ。世の中の欺瞞が新たに暴かれても、「どうせそういうものだ」という自分の前提が、裏付けられただけで済むの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 哲学者のスラヴォイ・ジジェクは、この態度を一行にまとめたわ。「彼らは、それが欺瞞だと知っている。それでも、そうする」。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: それ、ちょっと、僕の親指に似てるのだ……。分かってて、次へ滑るのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 犬は、権力に吠えていたのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.5
  - text: 今の冷笑は、本気に吠えている。矛先は、いつの間にか反転していたの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 権力から、本気へ……。でも、なんでなのだ？ なんで人は今、本気を嗤うようになったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: いい問いね。その答えの最初の手がかりは、意外なところにあるの。冷笑が、驚くほど安上がりだという事実よ。
    speaker: めたん
    expression: smile
    pause_after: 1.2
