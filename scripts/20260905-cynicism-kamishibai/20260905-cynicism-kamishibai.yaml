- id: 13
  title: 疑うことと、嗤うことは違う
  chapter_title: null
  narration:
  - text: 政治学者のジャック・シトリンとローラ・ストーカーは、不信を二種類に分けたの。制度を批判的に見張る懐疑と、制度そのものを見放すシニシズムよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 見張るのと、見放すの。似てるけど、違うのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 制度を見張る懐疑は、民主主義に必要なものよ。問題なのは、それが「もう何をしても無駄」というシニシズムに変わることだ、と二人は言うの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: スタヴロヴァの研究にも、重なる結果があるわ。認知能力の高い人は、腐敗の多い社会でだけ、シニシズムを強めていたの。疑うべき状況を見ていた、と読めるわ。一方、認知能力の低い人は、環境にかかわらず、シニカルな傾向が強かったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 疑うかどうかじゃなくて、いつ疑うか、だったのだ！
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そう。疑いが、状況を見て使う道具ではなく、癖になっていたの。ずんだもん、あの投稿を見て「どうせ売名でしょ」と思ったとき、それは道具だったかしら。それとも、癖だったかしら。
    speaker: めたん
    expression: point
    pause_after: 1.0
  - text: ……癖だったのだ。中身も読まずに笑ったのだから、道具とは言えないのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: スタンフォード大学の心理学者、ジャミール・ザキは、その間に「希望を持った懐疑」があると言うの。主張は疑う。でも、人が変わる力までは、疑わないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 冷笑をやめることは、疑うのをやめることではないの。疑ったあとに、何をするかなのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 疑ったあとに、何をするか。……めたん、最初のランプの人は、疑ったあとに何をしたのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: いい戻り方ね。もう一度、あの真昼のアテナイへ行きましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
