- id: 8
  title: ふたつ目の答え（責められる予期）——中盤の反転①
  chapter_title: null
  narration:
  - text: それを確かめた研究があるの。スタンフォード大学の心理学者、ブノワ・モナンたちの研究チームは2012年、肉を食べる人に尋ねたの。「ベジタリアンと聞いて、何を思い浮かべますか」とね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: ベジタリアンの連想……。健康的、とかなのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: すると47パーセントの人が、否定的な言葉を挙げたのよ。そして、とくに否定的だった人ほど、「ベジタリアンは、自分たちを道徳的に見下しているはずだ」と思っていたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 見下されてる、と思ってたのだ？ 実際に見下されたのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 実際に見下されたわけではないのよ。「そう思われそう」と感じただけで、人は相手を貶めてしまうの。研究チームはこれを、善い行いをした人を低く見る反応、という意味で、善行者への貶め、と名付けたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 感じただけで！ 相手は何も言ってないのに、貶めちゃうのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 2008年の実験では、もっとはっきりした違いも出たの。差別的な内容の課題を断った人を、その課題を受け入れた参加者は、嫌ったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 断った人のほうが、正しいことをしたのに？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: でも、その場に関係のない第三者は、むしろ断った人を好んだの。正しいことをした人が気に障るのは、その正しさで自分も問われた人だけだったのよ。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: ここで、冒頭の画面に戻ってみましょう。ずんだもん、あの俳優の投稿は、ずんだもんを責めていたかしら。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: ……責めてはいないのだ。ただ「行ってきました」って書いてあっただけなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: でも、投稿を見たとき、「何もしていない自分まで責められるかも」って、少し感じなかったかしら。
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: ……そうかもなのだ。読んだ瞬間、ちょっとだけ、ちくっとしたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: この実験で嫌われたのは、ただ優れた人だったからではないの。自分を責めてきそうだ、と感じさせる人だったのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 僕が笑ったのは、あの人がすごいからじゃなくて……。僕の中が、ちくっとしたからなのだ。これが二つ目の、「責められる予期」なのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.8
  - text: ……三つ目は、何なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 三つ目は、たぶんいちばん認めにくいものよ。嫉妬。正確には、嫉妬から来る気持ちなの。
    speaker: めたん
    expression: serious
    pause_after: 1.2
