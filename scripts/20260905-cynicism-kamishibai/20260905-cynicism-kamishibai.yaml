- id: 7
  title: 探索③（第三の安さ・防衛）と、ひとつ目の答え（無力感）
  chapter_title: 冷笑は、何を守っているのか
  narration:
  - text: 第三の安さは、防衛の安さよ。期待しなければ、失望しない。動かなければ、負けない。嗤う側にいれば、嗤われない。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: 嗤う側にいれば、嗤われない……。確かに、笑ってる間は安全なのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: つまり冷笑は、何かから自分を守ろうとしているのね。では、何からかしら。見えてくるものは、少なくとも三つあるわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 三つも。一つ目は何なのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ひとつ目は、無力感よ。
    speaker: めたん
    expression: serious
    pause_after: 0.5
  - text: 日本財団が2019年に行った18歳意識調査では、「自分で国や社会を変えられると思う」と答えた日本の若者は、18.3パーセントだったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 18パーセント！？ 五人に一人もいないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 9カ国の中で最下位よ。2番目に低い韓国が39.6パーセントだから、その半分にも満たないの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 僕も、聞かれたら「変えられない」って答えてた気がするのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 「どうせ変わらない」と思っていると、変えようとする人まで、「無駄なことをしてる人」に見えてしまうのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 海岸掃除の人も、僕にはそう見えてたのだ。でも、なんでそう見えちゃうのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 哲学者のヤン・エルスターは、これをイソップの狐になぞらえて、酸っぱい葡萄と呼んだの。手に入らないものを、価値がないことにしてしまう心の動きよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 知ってるのだ！ 狐が届かない葡萄を、「あれは酸っぱいに決まってる」って言って去っていく話なのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: そう。届かない葡萄は、酸っぱいことにすればいい。そうすれば、届かない自分を責めずに済むでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 社会なんて変えられない、と思うなら、変えようとする人を嗤えばいい。そうすれば、動かない自分を責めずに済むのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 葡萄を酸っぱいことにするのと、海岸掃除を「意識高い」で済ませるのが、同じ形なのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: ここは正直に言っておくわね。無力感が冷笑の土壌になっている、というのは私の推論よ。このデータだけで、原因だと断言できるわけではないの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 一つ目は、無力感。じゃあ二つ目は、もっと意外なものなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 二つ目は、もっと意外よ。標的にされるのは、優れた人ではないの。
    speaker: めたん
    expression: serious
    pause_after: 1.2
