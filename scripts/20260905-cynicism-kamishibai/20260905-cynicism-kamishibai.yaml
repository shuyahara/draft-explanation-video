- id: 4
  title: 古代②（反転）
  chapter_title: null
  narration:
  - text: ギリシャ語で犬は、キュオーン。ディオゲネスたちは、そこからキュニコス、犬のような者たちと呼ばれたの。英語のシニックやシニシズムも、この犬につながっているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: キュオーン、キュニコス、シニック。音がつながってるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: じゃあ、その犬たちは誰に吠えていたのかしら。富や権力、それから「みんなこうするもの」という慣習よ。人はもっと少ないもので生きられる、と、暮らしそのもので示したの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 甕で寝てたのも、大王にどいてくれって言ったのも、全部それなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: フランスの哲学者ミシェル・フーコーも、晩年の講義で彼らを高く評価したの。言葉だけじゃなく、生き方で真理を見せた人たちだ、とね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: つまり最初のシニシズムは、力のない側が権力へ向ける嗤いだったの。下から上へ、吠えていたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 下から上！ ……でも、僕があの俳優を笑ったのも、下から上なのだ？ 相手は有名人なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: いい反論ね。でも、ずんだもんが笑ったのは、その人の名声やお金そのものじゃないでしょう？ 「被災地に行った」という、本気の部分よ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 犬は、持っている側を嗤った。今の冷笑は、やっている側を嗤うの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 持っている側と、やっている側……。向きが違うのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そうよ。けれど、この言葉はやがて意味を変えるの。英語のシニックが、「人の動機を疑って鼻で笑う性格」を指すようになるのは、19世紀半ばだとされているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 文学研究者のデイヴィッド・マゼラは、これは意味が薄くなっただけじゃない、と言うの。昔は欲望を抑える鍛錬だったものが、いまは無関心や受け身を指す。反対向きになったのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.9
  - text: 鍛錬が、無関心に……。同じ言葉で、中身が反対になったのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ドイツの哲学者ペーター・スローターダイクは1983年、この二つを呼び分けたの。古代の、体を張って示す嗤いがキュニシズム。近代の、知っていながら動かない態度がシニシズムよ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 世の中を全部見抜いたつもりで、「どうせ無駄」と動かなくなる意識。彼はこれを、啓蒙された偽りの意識、と呼んだの。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 見抜いてるなら、動けばいいのに。なんで動かないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 動かないほうが、傷つかずに済むからよ。世の中のひどさを見ても、「ほら、やっぱり」で終われるでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 哲学者のスラヴォイ・ジジェクは、この感じをこう言ったの。「それが欺瞞だと知っている。それでも、そうする」。
    speaker: めたん
    expression: explain
    pause_after: 0.8
  - text: それ、ちょっと、僕の親指に似てるのだ……。分かってて、次へ滑るのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 犬は、権力に吠えていたのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.5
  - text: 今の冷笑は、本気に吠えている。矛先は、いつの間にか反転していたの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 権力から、本気へ……。でも、なんでなのだ？ なんで人は今、本気を嗤うようになったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: いい問いね。手がかりは、意外なところにあるの。冷笑って、びっくりするほど安上がりなのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
