- id: 9
  title: 三つ目の答え（嫉妬）
  chapter_title: null
  narration:
  - text: ケンタッキー大学の心理学者、リチャード・スミスたちは1996年、優秀な学生のインタビュー映像を見せたあとで、「その学生が挫折した」と伝える実験をしたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: わざと挫折したって伝えたのだ？ 何を調べるためなのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 誰がその挫折を喜ぶか、よ。結果は、優秀さへの嫉妬を感じていた人ほど、その挫折を喜んだの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 人の挫折を喜ぶって、嫌な気持ちなのだ。でも、分かる気もするのだ……。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: オーストラリアのフリンダース大学のノーマン・フェザーは、自尊心の低い人ほど、高く昇った人の転落を望みやすいことを、繰り返し確かめたわ。オーストラリアには、「高く伸びた芥子は刈り取られる」という言い回しもあるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 目立った花だけ、切られちゃうのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 自分と似た立場の誰かが、先に行く。その痛みを認めたくなくて、人は笑いに変えてしまうことがあるの。「意識が高い」に棘があるのも、そのためかもしれないわ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 棘……。でも僕、海岸掃除の人に嫉妬なんて、してないと思うのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ただ、ここは少し違いがあるの。フェザーが2002年に行った実験で、転落を喜ぶ気持ちを直接に予測したのは、嫉妬そのものより、「あの評価は不当だ」という憤りだったわ。
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: 不当だ、という気持ち！ 「なんであの人だけ褒められるのだ」みたいな。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そうよ。嫉妬は、冷笑のもっと奥に隠れていることがあるの。それが出てくるときは、「不当だ」という言い方になるのよ。
    speaker: めたん
    expression: explain
    pause_after: 2.0
  - text: 「どうせ売名でしょ」って、本当は「本気じゃないのに評価されるのは不当だ」とも言ってるのかもなのだ。無力感、責められる予期、嫉妬。この三つは、みんな同じ人に向かうのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: いい質問ね。実は、三つの答えは、冷笑の向かう相手も変えるのよ。それを整理してみましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
