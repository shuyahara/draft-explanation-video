    from: 12
    telop: なぜ人は、冷笑してしまうのか
- id: 3
  title: 古代①（ディオゲネスの逸話）
  chapter_title: 犬は、何に吠えていたのか
  narration:
  - text: 紀元前4世紀、アテナイ。真昼の市場に、火のついたランプを掲げて歩く男がいたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 真昼にランプ？ 明るいのに、何をしてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 周りの人も同じことを聞いたのよ。男はこう答えたの。「人間を探している」。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 市場に人はいっぱいいるのに……。まともな「人間」を探してる、ってことなのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そういうこと。男の名は、ディオゲネスよ。家を持たず、大きな素焼きの甕の中で寝起きしていたそうなの。夏には熱い砂の上を転がって、体も鍛えたそうよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 甕の中で寝てたのだ！？ 何のために、そんな暮らしをしてたのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: その暮らしを選んだ理由は、次の話を聞くと少し分かるわ。ある日、アレクサンドロス大王が彼の前に立って、何か望みはないかと尋ねたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 大王が直々に！ 何でも叶えてもらえるチャンスなのだ！
    speaker: ずんだもん
    expression: delighted
    pause_after: 0.45
  - text: ディオゲネスの答えは、こうよ。「そこをどいてくれ、日陰になる」。
    speaker: めたん
    expression: smile
    pause_after: 1.0
  - text: 大王に、どいてくれって言ったのだ！？ 怖いもの知らずなのだ……。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 人々は彼を、「犬」と呼んだの。でも本人は、その名を誇りにしたわ。「くれる人には尾を振り、くれない人には吠え、悪党には噛みつく犬だから」ってね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 犬って、悪口のはずなのに、自分で名乗っちゃったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: もうひとつ、神託の話があるわ。若い頃、彼はデルフォイの神殿で、神のお告げとして「通貨を変造せよ」と告げられたそうよ。面白いのは、ギリシャ語では「通貨」が「慣習」の意味も持っていたことなの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: じゃあ、「世の中の慣習を作り変えよ」って言われたのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 彼はそう受け取ったのよ。それが、犬の一生の使命になったの。
    speaker: めたん
    expression: explain
    pause_after: 0.6
  - text: ただし、ここまでの話は、紀元3世紀の伝記作家、ディオゲネス・ラエルティオスが残した逸話よ。どこまで事実かは、分からないわ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: でも、「犬」という呼び名がシニシズムの語源になったことは、確かよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
  - text: 犬が、シニシズムの語源！？ でも、甕で寝てる犬と、スマホの返信欄が、どうつながるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そこがこの話のいちばんの急所よ。言葉の意味が、途中で、ひっくり返ったの。その反転を見ていきましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
