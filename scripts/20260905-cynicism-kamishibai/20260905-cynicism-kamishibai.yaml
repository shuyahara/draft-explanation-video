scenes:
- id: 1
  title: フック（現代の場面）
  chapter_title: null
  narration:
  - text: めたん、見てこれ。「海岸の清掃に参加しませんか」だって。意識高いのだ〜。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 呼びかけの投稿ね。……ずんだもん、今、笑ったでしょう。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 笑ったのだ。返信も見て。「意識高いね」「どうせ売名でしょ」「はいはい」。みんな同じこと思ってるのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: 呼びかけそのものについた反応は、数えるほどしかないわね。それを笑った返信のほうが、何倍も広がっているわ。
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: そういうものなのだ。じゃあ次の投稿……。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 待って。指がもう次へ滑っていったわね。ひとつ聞いていいかしら。ずんだもんは、どうして笑ったの？
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: どうしてって……。なんか、笑うところだったのだ。理由は、うまく言えないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: その、うまく言えない笑いのことを、冷笑と呼ぶのよ。本気で何かをしようとする人を、一段高いところから、鼻で笑って済ませる態度ね。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: 冷笑……。僕、冷笑してたのだ？
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 責めているわけじゃないのよ。私も、同じ画面を見たら、少し口の端が動いたかもしれないわ。だからこそ、今日はそこを考えてみたいの。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  readings:
  - surface: 冷笑
    reading: レイショウ
  - surface: 口の端
    reading: クチノハ
  beats:
