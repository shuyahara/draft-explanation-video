- id: 5
  title: 探索①（第一の安さ・考えなくて済む）
  chapter_title: 冷笑は、なぜ安いのか
  narration:
  - text: その安さには、三つの種類があるの。まず一つ目から見るわね。慶應義塾大学でメディア論を研究する、津田正太郎さん。現代のシニシズムを、こう定義したの。「他人の言動を、つねに利己的な動機で解釈しようとする態度」。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 利己的な動機……。僕の「売名なのだ」も、それなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そのとおりよ。「あの人はカネのためにやっている」「売名だ」「ポーズだ」。こう決めてしまえば、相手が何を言っているか、ちゃんと考えなくて済むでしょう？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: あ……。僕、あの投稿の中身、読んでなかったのだ。どこで何日、何をしてきたのかも知らないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: 写真と返信欄だけ食べて、本文を残してたのだ……。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 情報が多すぎる今、これはとても手軽な考え方なのよ。津田さんは、アニメ調の女性キャラクターを使った献血ポスターをめぐる論争を、例に挙げているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 批判する側も、擁護する側も、「相手には邪悪な動機がある」と決めつけ合っていたの。立場が違っても、動機だけを疑えば、中身を考えずに済むのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 敵同士なのに、やってることは同じなのだ……。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: しかも、動機を疑うだけなら、中身に反論しなくても相手を退けやすいの。正義を掲げる人ほど、そこを疑われると深く傷つくからよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 本気の人ほど、深く刺さるのだ。ひどい話なのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 冷笑の第一の安さは、考えなくて済むことにあるのよ。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: 一つ目が「考えなくて済む」。じゃあ、二つ目は何なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 二つ目は、ずんだもんにも少し耳が痛いかもしれないわ。冷笑すると、賢く見えるのよ。
    speaker: めたん
    expression: smile
    pause_after: 1.2
