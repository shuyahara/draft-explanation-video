- id: 10
  title: 三つの標的（図解でまとめる）
  chapter_title: null
  narration:
  - text: プリンストン大学の心理学者、スーザン・フィスクたちは、人が他の集団をどう見るかを、二つの軸で整理したの。温かさと、有能さよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 温かさと、有能さ。二つの軸なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 有能だけれど冷たい、と見られた相手には、妬みが向くの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: じゃあ、無能で冷たいと思われた相手は、見下されるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ、軽蔑が向くわ。同じ人でも、有能だと見られれば妬まれて、無能だと見られれば見下されるの。
    speaker: めたん
    expression: point
    pause_after: 0.35
  - text: 「意識が高い」と呼ばれる人は、しばしば「有能だけど冷たい」側に置かれるわ。だから妬みの標的になりやすいの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 本気で何かを変えようとする人は、まだ成果が見えないと、「無能で冷たい」側に置かれやすいの。だから、成功者は妬まれ、ボランティアは見下されやすいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 海岸掃除の人は……後のほうにされたのだ。ゴミ袋の数まで見ないと、僕はすぐ「無能」って札を貼っちゃうのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 標的は違っても、三つの答えには共通点があるわ。どれも、自分を守るための反応だ、ということよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 守るための反応……。でも、それって、本当に僕を守ってくれてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.0
  - text: いいところに気づいたわね。ここで、さっきのスタヴロヴァの研究に戻りましょう。皮肉屋は、本当に賢かったのかしら。
    speaker: めたん
    expression: smile
    pause_after: 1.2
