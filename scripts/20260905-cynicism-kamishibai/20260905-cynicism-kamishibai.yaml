- id: 6
  title: 探索②（第二の安さ・賢く見える）
  chapter_title: null
  narration:
  - text: オランダのティルブルフ大学の心理学者、オルガ・スタヴロヴァたちの研究チームが、アメリカ、ドイツ、イギリスの、あわせて674人に質問したの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 「人はどうせ利己的だと思う皮肉屋」と、そうでない人。どちらが認知課題でいい成績を取ると思うか、とね。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: うーん……。皮肉屋のほうが、世の中をよく見てそうなのだ。賢そうなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ずんだもんと同じ答えの人は、多かったわ。調べ方によって、56パーセントから70パーセントの人が、皮肉屋の方が賢いと答えたの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 半分以上！ みんな、そう思ってるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 人を信じない人って、世の中を見抜いているように見えるのよね。何かを信じて動く人より、腕を組んで眺めている人の方が、賢そうに見えるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 腕を組んで「はいはい」って言ってると、確かに一段上にいる気分なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: しかも、その「賢そう」という印象は、ほとんどタダで手に入るの。第二の安さは、何もしなくても、賢い側に立てることよ。
    speaker: めたん
    expression: point
    pause_after: 1.0
  - text: 考えなくていいし、賢く見える。安いのだ……。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ただ、この研究には、続きがあるのよ。
    speaker: めたん
    expression: smug
    pause_after: 0.6
  - text: 続き？ 皮肉屋は本当に賢かったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: その答えは少しあとに回して、もう一つ見ておきましょう。三つ目は、自分を守るための安さよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 守る？ 冷笑が、何かを守ってるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ええ。そして、何を守っているのかを調べると、冷笑の正体にいちばん近づけるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
