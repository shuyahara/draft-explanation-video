- id: 5
  title: 探索①（第一の安さ・考えなくて済む）
  chapter_title: 冷笑は、なぜ安いのか
  narration:
  - text: 「冷笑は安い」って、どういうことかしら。三つに分けて見ていきましょう。慶應義塾大学でメディア論を研究する津田正太郎さんは、現代のシニシズムを、他人の言動をつねに利己的な動機で解釈しようとする態度と定義したの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 利己的な動機……。「どうせ売名でしょ」も、それなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そのとおりよ。「あの人はカネのためにやっている」「売名だ」「ポーズだ」。こう決めてしまえば、相手が何を言っているか、ちゃんと考えなくて済むでしょう？
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: あ……。僕、あの投稿の中身、読んでなかったのだ。海岸のどこを、いつ掃除するのかも知らないのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.35
  - text: 場所も時間も読まずに、意識の高さだけ測ってたのだ……。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 情報が多すぎる今、これはとても手軽な考え方なのよ。津田さんが例に挙げたのは、アニメ調の女性キャラクターを使った献血ポスターをめぐる論争だったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 批判する側も、擁護する側も、「相手には邪悪な動機がある」と決めつけ合っていたの。立場が違っても、動機だけ疑えば、中身を考えずに済むのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 敵同士なのに、やってることは同じなのだ……。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: しかも動機を疑うだけなら、中身に反論しなくても、相手を黙らせやすいの。正義を掲げる人ほど、そこを疑われると深く傷つくからよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 本気の人ほど、深く刺さるのだ。ひどい話なのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 冷笑の第一の安さは、考えなくて済むことにあるのよ。
    speaker: めたん
    expression: point
    pause_after: 1.0
  - text: 一つ目が「考えなくて済む」。じゃあ、二つ目は何なのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 二つ目は、ちょっと耳が痛いかもしれないわ。冷笑すると、賢く見えるのよ。
    speaker: めたん
    expression: smug
    pause_after: 1.2
