- id: 10
  title: 三つの標的（図解でまとめる）
  chapter_title: null
  narration:
  - text: 冷笑がどんな相手に向くのかを見るために、一枚の地図を借りましょう。プリンストン大学の心理学者、スーザン・フィスクたちは、人が他の集団をどう見るかを、「温かさ」と「有能さ」の二つで整理したの。集団についての理論だけど、ここでは個人の見え方の補助線として使うわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 温かさと、有能さ。二つの軸なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 「有能だけど冷たい」と見られた相手には、妬みが向きやすいの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: じゃあ、無能で冷たいと思われた相手は、見下されるのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ええ、軽蔑が向くわ。同じ人でも、有能だと見られれば妬まれて、無能だと見られれば見下されるの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 「意識が高い」と呼ばれる人は、しばしば「有能だけど冷たい」側に置かれるわ。だから妬みの標的になりやすいの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 本気で何かを変えようとする人は、まだ成果が見えないと、「無能で冷たい」側に置かれやすいの。だから、成功者は妬まれ、ボランティアは見下されやすい。そんな傾向があるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: あの俳優は、成功者でもあって、ボランティアでもあるのだ……。妬みと見下しの、二枚抜きなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 標的は違っても、三つの答えには共通点があるわ。どれも、自分を守るための反応だ、ということよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 守るための反応……。でも、それって、本当に僕を守ってくれてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.0
  - text: いいところに気づいたわね。ここで、さっき預けたスタヴロヴァたちの続きを開けましょう。同じチームが、別の大きなデータで、実際の成績を調べているの。皮肉屋は、本当に賢かったのかしら。
    speaker: めたん
    expression: smile
    pause_after: 1.2
