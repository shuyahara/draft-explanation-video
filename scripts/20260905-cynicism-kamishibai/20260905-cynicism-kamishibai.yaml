- id: 11
  title: 安い知性の請求書——中盤の反転②
  chapter_title: 安い知性の請求書は、誰が払うのか
  narration:
  - text: 皮肉屋の方が賢い、と、56パーセントから70パーセントの人が答えたわね。でも、実際はどうだったのかしら。研究チームは、ドイツの成人9000人あまりと、30カ国およそ20万人のデータで確かめたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 20万人！ すごい規模なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 結果は、逆だったのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 逆！？ 皮肉屋のほうが、賢くなかったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 皮肉の強い人ほど、読解や数学の成績が低かったの。相関は弱いけれど、30カ国でほぼ一貫していたわ。研究チームはこれを、皮肉屋の天才幻想と呼んでいるの。
    speaker: めたん
    expression: explain
    pause_after: 0.7
  - text: 賢く見えるだけで、賢くはなかったのだ……。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 話はそれだけではないわ。同じチームがアメリカの全国調査を追ったら、人を信じない度合いが強い人ほど、9年後の収入が低かったの。
    speaker: めたん
    expression: explain
    pause_after: 0.5
  - text: 収入まで！？ なんで信じないだけで、収入が下がるのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 研究チームは、人を信じないと協力の機会を逃して、警戒することに力を使いすぎるからではないか、と説明しているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 2024年には、もっと切ない結果も出ているわ。シニカルな人ほど権力を欲しがるのに、リーダーには選ばれにくかったの。約9000人を、最長10年追った結果よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 権力は欲しいのに、選ばれないのだ……。それは切ないのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 仲間はずれの実験もあるのよ。シンガポール経営大学のチームの実験では、仲間はずれにされた普通の人は、他者への共感を強めて、もう一度つながろうとしたの。でも、シニシズムの強い人には、その反応が起きなかったわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 傷ついたあとに、つながり直せないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 傷つく前に切り捨てるから、つながり直す動きが起きにくいのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 精神科医のジョージ・ヴァイラントは、心の防衛にも、成熟した形と未成熟な形があると考えたの。ユーモアは成熟した側。一方、直接ぶつからず相手を傷つける受動攻撃は、未成熟な側に置いたわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 「冗談だった」と逃げられる皮肉は、後者に近いのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 「冗談なのだ」って、僕、よく言うのだ……。あれ、僕の小さい盾だったのだ。
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 冷笑は安い。だから、広がるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.5
  - text: でも、安いものはたいてい、後で請求書が来るの。
    speaker: めたん
    expression: serious
    pause_after: 2.0
  - text: 請求書は、笑った本人に来るのだ……。でも、めたん。これって結局、「皮肉屋は性格が悪い」って話になっちゃうのだ？ 僕まで悪者なのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そこで終わらせてはいけないの。ここからは、冷笑を育てている、環境の話をするわ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
