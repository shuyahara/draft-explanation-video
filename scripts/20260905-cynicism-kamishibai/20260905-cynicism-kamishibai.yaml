- id: 6
  title: 探索②（第二の安さ・賢く見える）
  chapter_title: null
  narration:
  - text: オランダのティルブルフ大学の心理学者、オルガ・スタヴロヴァたちの研究チームが、アメリカ、ドイツ、イギリスで、あわせて674人に、こう尋ねたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 皮肉屋、つまり、人はどうせ利己的だと考える人と、そうでない人、どちらが認知課題の成績が良いと思うか。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: うーん……。皮肉屋のほうが、世の中をよく見てそうなのだ。賢そうなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: ずんだもんと同じ答えの人が、多かったのよ。調査によって、56パーセントから70パーセントの人が、皮肉屋の方が賢いと答えたの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 半分以上！ みんな、そう思ってるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 人を信じない態度は、世の中を見抜いている証しに見えるの。何かを信じて動く人より、腕を組んで見ている人の方が、賢そうに見えるのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 腕を組んで「はいはい」って言ってると、確かに一段上にいる気分なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: そしてこの見え方の利益は、ほとんどタダで手に入るの。冷笑の第二の安さは、何もしなくても、賢い側に立てることよ。
    speaker: めたん
    expression: point
    pause_after: 1.0
  - text: 考えなくていいし、賢く見える。安いのだ……。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ただ、この研究には、続きがあるのよ。
    speaker: めたん
    expression: smug
    pause_after: 0.6
  - text: 続き？ 皮肉屋は本当に賢かったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: それは後で見ることにして、先に、三つ目の安さを見ておきたいの。それは、自分を守るための安さよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 守る？ 冷笑が、何かを守ってるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ええ。そして、何を守っているのかを調べると、冷笑の正体にいちばん近づけるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
