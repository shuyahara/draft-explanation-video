    from: 21
    telop: 冷笑＝本気を、一段高いところから鼻で笑って済ませる態度
- id: 2
  title: 問いへの変換
  chapter_title: null
  narration:
  - text: この態度は近ごろ、ネットでは「冷笑系」と呼ばれるわね。でも、冷笑そのものは、新しいものじゃないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 昔からあったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 英語では、こうした態度をシニシズムと呼ぶの。この言葉のもとになったのは、およそ2400年前、古代ギリシャにいた哲学者たちよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 2400年前！ 哲学者が、冷笑の元祖なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そう思うでしょう？ ところが彼らは、今の冷笑とは、まるで反対のことをしていたの。
    speaker: めたん
    expression: smug
    pause_after: 0.9
  - text: 反対？ 反対の冷笑って、何なのだ……。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: なぜ人は、冷笑をしてしまうのか。今日はこの問いを、古代の哲学者の逸話から、現代の心理学の実験まで、順にたどっていくわ。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 僕が笑った理由も、その先にあるのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ええ。最後には、ずんだもんの親指のところへ戻ってくるわ。まずは、2400年前のアテナイから始めましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  readings:
  - surface: 冷笑系
    reading: レイショウケイ
  - surface: 冷笑
    reading: レイショウ
  beats:
