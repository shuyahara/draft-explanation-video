- id: 8
  title: ふたつ目の答え（責められる予期）——中盤の反転①
  chapter_title: null
  narration:
  - text: スタンフォード大学の心理学者、ブノワ・モナンたちの研究チームは2012年、肉を食べる人に、ベジタリアンについて自由に連想してもらったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: ベジタリアンの連想……。健康的、とかなのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 47パーセントの人が、否定的な言葉を連想したのよ。そして、否定が強い人ほど、ある予期を抱いていたの。「ベジタリアンは、自分たちを道徳的に見下しているだろう」という予期よ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 見下されてる、と思ってたのだ？ 実際に見下されたのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 実際に見下されたわけではないの。「そう思われるだろう」と予期しただけで、人は相手を貶めるのよ。研究チームはこれを、善行者への貶め、と名付けたわ。
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: 予期しただけで！ 相手は何も言ってないのに、貶めちゃうのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: さらに2008年の実験では、こんな非対称も見つかっているの。差別的な内容の課題を拒否した人がいたとき、同じ課題を言われるまま実行してしまった参加者は、その拒否した人を嫌ったの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 拒否した人のほうが、正しいことをしたのに？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。でも、無関係な第三者は、むしろその人を好んだのよ。つまり、正しいことをした人を嫌うのは、その正しさに自分が巻き込まれている人だけだったの。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: ここで、冒頭の画面に戻ってみましょう。ずんだもん、あの海岸清掃の呼びかけは、ずんだもんを責めていたかしら。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: ……責めてはいないのだ。ただ「参加しませんか」って書いてあっただけなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: でも、「自分も責められるのではないか」と、ずんだもんの中の何かが予期したの。海岸に行かない自分を。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: ……そうかもなのだ。読んだ瞬間、ちょっとだけ、ちくっとしたのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: この実験で標的になったのは、優れた人だからではないの。自分を責めそうな人なのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 僕が笑ったのは、あの人がすごいからじゃなくて、僕がちくっとしたからなのだ……。二つ目が「責められる予期」。三つ目は何なのだ？
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 三つ目は、たぶんいちばん認めにくいものよ。嫉妬なの。
    speaker: めたん
    expression: normal
    pause_after: 1.2
