- id: 12
  title: 環境が育てる（個人に還元しない）
  chapter_title: null
  narration:
  - text: 冷笑は、個人の性格だけで育つわけではないの。ペンシルベニア大学のジョセフ・カペラとキャスリーン・ジェイミソンは1997年、政治を政策ではなく勝ち負けの駆け引きとして報じると、視聴者のシニシズムが高まることを、実験で示したわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 「誰が勝った、誰が負けた」ばっかりのニュースなのだ。見てると「どうせ政治家は」って気分になるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: この結果は、一つの実験だけではないの。その後、32の研究と、およそ3万9000人分をまとめたメタ分析でも、一貫して確かめられているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: SNSはどうなのだ？ 僕が冷笑を見たのも、SNSなのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: SNSには別の道筋もあるわ。2020年のアメリカ大統領選挙の期間に約1800人を追った調査では、政治的な攻撃投稿を見るほど怒りが高まって、その怒りが、シニシズムを強めていたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 怒りが、冷笑になるのだ？ 反対の感情に見えるのに。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 画面を開くたびに、「どうせみんな利己的だ」という見方を、また覚えさせられるのよ。冷笑は、性格である前に、毎日浴びる環境の産物でもあるの。
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: じゃあ、日本はどうなのだ？ 日本人は冷笑しやすいって、よく言われるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 日本は、人を信じない国というわけではないのよ。世界価値観調査でも、「たいていの人は信頼できる」と答える割合は、世界の中で特別に低くはないの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 意外なのだ。じゃあ、何が低いのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 2021年のOECDの調査で、政府への信頼は24パーセント。先ほどの調査でも、社会を変えられると思う若者は18.3パーセントだったわ。日本で目立つのは、不信よりも、無力感なのよ。
    speaker: めたん
    expression: explain
    pause_after: 1.5
  - text: 人は信じてるのに、変えられるとは思ってない……。それ、僕そのものなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: この無力感には、歴史もあるの。1972年の連合赤軍事件と翌年のオイルショックのあと、学生運動の熱は急速に冷めたわ。若者の無気力、無関心、無責任は、三無主義と呼ばれたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 五十年も前から、言われてたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 社会学者の北田暁大さんは2005年、2ちゃんねるに生まれたやり取りを、皮肉な共同体と分析したわ。嗤いながらも、同時に本気の感情を分け合う場だったの。冷笑には、形を変えながら続く、半世紀の系譜があるのよ。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: 環境のせいなら、疑うこと自体が悪いってことなのだ？ 何も疑わずに信じたほうがいいのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そうじゃないのよ。疑うことと、嗤うことは、違うの。最後にそこを分けておきましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
