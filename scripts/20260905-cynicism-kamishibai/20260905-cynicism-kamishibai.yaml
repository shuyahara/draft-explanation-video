- id: 6
  title: 探索②（第二の安さ・賢く見える）
  chapter_title: null
  narration:
  - text: ずんだもんに、ひとつ質問。「人はどうせ利己的だ」と思う皮肉屋、つまり冷笑しがちな人と、そうでない人。読解や計算みたいな、考える力を測る課題でいい成績を取るのは、どちらだと思う？
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: うーん……。皮肉屋のほうが、世の中をよく見てそうなのだ。賢そうなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 同じ質問を、オランダのティルブルフ大学の心理学者、オルガ・スタヴロヴァたちの研究チームが、アメリカ、ドイツ、イギリスの、あわせて674人にしたの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: ずんだもんと同じ答えの人は、多かったわ。調べ方によって、56パーセントから70パーセントの人が、皮肉屋の方が賢いと答えたの。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 半分以上！ みんな、そう思ってるのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 人を信じない人は、世の中を見抜いているように見えるのよね。本気で動く人より、少し離れて見ている人のほうが、一段上に見えるの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 腕を組んで「はいはい」って言ってると、確かに偉くなった気分なのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: しかも、その「賢そう」という印象は、ほとんどタダで手に入るの。第二の安さは、何もしなくても、賢い側に立てることよ。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: 考えなくていいし、賢く見える。安いのだ……。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ただ、この研究には、続きがあるのよ。
    speaker: めたん
    expression: smug
    pause_after: 0.6
  - text: 続き？ 皮肉屋は本当に賢かったのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: その答えは、もう少しあとで分かるわ。その前に、もう一つ見ておきましょう。三つ目は、自分を守るための安さよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 守る？ 冷笑が、何かを守ってるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ええ。そして、何を守っているのかを調べると、冷笑の正体にいちばん近づけるのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.2
