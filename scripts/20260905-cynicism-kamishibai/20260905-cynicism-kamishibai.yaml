- id: 10
  title: 三つの標的（図解でまとめる）
  chapter_title: null
  narration:
  - text: プリンストン大学の心理学者、スーザン・フィスクたちは、人が他の集団に向ける感情を、温かさと有能さの二つの軸で整理したの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 温かさと、有能さ。二つの軸なのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 有能だが冷たい、と見なした相手には、妬みが向くの。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 無能で冷たい、と見なした相手には、軽蔑が向くのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.4
  - text: 同じ「冷たい」でも、有能なら妬まれて、無能なら見下されるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。同じ人でも、有能だと見られれば妬まれ、無能だと見られれば見下されるの。「意識が高い」と呼ばれる人は、しばしば前者に置かれるわ。
    speaker: めたん
    expression: point
    pause_after: 0.35
  - text: 一方で、本気で何かを変えようとする人は、成果が見えにくいぶん、しばしば後者に置かれるの。だから、成功者は妬まれ、ボランティアは見下されやすいのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 海岸掃除の人は……後者にされたのだ。成果が見えにくいから。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 標的は違っても、三つの答えには共通点があるわ。どれも、自分を守るための反応だ、ということよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 守るための反応……。でも、それって、本当に僕を守ってくれてるのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 1.0
  - text: いいところに気づいたわね。ここで、さっき預けておいた、スタヴロヴァの研究の続きを開けましょう。皮肉屋は、本当に賢かったのか。
    speaker: めたん
    expression: smug
    pause_after: 1.2
