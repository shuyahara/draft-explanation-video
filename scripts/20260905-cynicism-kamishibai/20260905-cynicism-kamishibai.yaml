    from: 20
    telop: 冷笑＝本気を、一段高いところから鼻で笑って済ませる態度
- id: 2
  title: 問いへの変換
  chapter_title: null
  narration:
  - text: こういう態度、最近のネットでは「冷笑系」なんて呼ばれるわね。でも、冷笑そのものは、新しいものじゃないのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 昔からあったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 英語では、こういう態度をシニシズムと呼ぶの。この言葉は、およそ2400年前、古代ギリシャにいた哲学者たちにつながっているのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 2400年前！ 哲学者が、冷笑の元祖なのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そう思うでしょう？ ところが彼らは、今の冷笑とは、まるで反対のことをしていたの。
    speaker: めたん
    expression: smile
    pause_after: 0.9
  - text: 反対？ 反対の冷笑って、何なのだ……。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: なぜ人は、冷笑をしてしまうのか。古代の哲学者の話と、現代の心理学の実験を見比べながら、ずんだもんが笑った理由を探してみましょうか。
    speaker: めたん
    expression: serious
    pause_after: 1.0
  - text: 僕が笑った理由も、分かるのだ？
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: ええ。最後には、ずんだもんがあの投稿を見て、親指を次へ滑らせた理由に戻ってくるわ。じゃあ、まずは2400年前のアテナイへ行きましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  readings:
  - surface: 冷笑系
    reading: レイショウケイ
  - surface: 冷笑
    reading: レイショウ
  beats:
  - type: board
    cut_reason: 【冷笑系】写真なし。二人だけで言葉の来歴に入る
