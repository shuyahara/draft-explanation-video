scenes:
- id: 1
  title: フック（現代の場面）
  chapter_title: null
  narration:
  - text: めたん、見てこれ。「海岸の清掃に参加しませんか」だって。意識高いのだ〜。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 呼びかけの投稿ね。……ずんだもん、今、笑ったでしょう。
    speaker: めたん
    expression: normal
    pause_after: 0.45
  - text: 笑ったのだ。ほら、返信も見て。「意識高いね」「どうせ売名でしょ」「はいはい」ばっかりなのだ。みんな同じこと思ってるのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 呼びかけそのものには、ほとんど反応がないのね。なのに、笑った返信のほうは、何倍も広がっているわ。
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: そういうものなのだ。じゃあ次の投稿……。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 待って。指がもう次へ滑っていったわね。ひとつ聞いていいかしら。ずんだもんは、どうして笑ったの？
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: どうしてって……。なんか、笑うところだったのだ。理由は、うまく言えないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: その、うまく言えない笑いのことを、冷笑と呼ぶのよ。本気で何かをしようとする人を、自分は一段高いところから分かっている、という顔で、鼻で笑って済ませる態度ね。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: 冷笑……。僕、冷笑してたのだ？
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 責めているわけじゃないのよ。私だって同じ画面を見たら、つい笑いそうになるかもしれないもの。だからこそ、一緒に考えてみたいの。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  readings:
  - surface: 冷笑
    reading: レイショウ
  beats:
  - type: image
    cut_reason: 【昼の電車】肩越しに見るスマホの画面。冒頭の場面をそのまま
