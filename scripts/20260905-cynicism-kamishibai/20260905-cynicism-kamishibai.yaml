- id: 14
  title: 回帰と結び
  chapter_title: null
  narration:
  - text: ランプを掲げた男は、人間を探していたわ。権力や慣習を嗤ったけれど、自分だけ安全な場所から嗤っていたわけじゃないの。暮らしも体も、そこに賭けていたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 甕で寝て、大王にどいてくれって言って……。嗤われる側に回るのを、恐れなかったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。犬は、権力に吠えた。今の冷笑は、本気に吠える。反転したのは矛先だけじゃないの。自分で賭けるものも、なくなったのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: 僕は、何も賭けずに笑ってたのだ。安全な場所から。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 安全な場所から、何も賭けずに嗤っていると、自分を守っているようで、自分の力も少しずつ削ってしまうの。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 信じる力も、つながり直す力も、いつか動き出す力もね。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: あの画面を、もう一度思い出してみて。「売名なのだ」と笑った一瞬、ずんだもんは何から、自分を守っていたのかしら。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 無力感か。責められる予期か。それとも、嫉妬から来る、「不当だ」という感覚か。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: ……たぶん、全部少しずつなのだ。一人が行っても変わらないって、思ってたのだ。何もしてない自分が、ちくっともしたのだ。褒められてるのが、ちょっと悔しかったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 正直ね。それが分かれば、次に嗤いたくなったとき、少し違う選択ができるかもしれないわ。見ている人の中にも、似た気持ちがあるかもしれないわね。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 僕、あの投稿、もう一回ちゃんと読んでみるのだ。笑うかどうかは、読んでから決めるのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: それで十分よ。疑ったあとで、何をするか、だもの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 冷笑は安い。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: だから、広がる。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: そして、冷笑が守っているのは、たいてい、正しさじゃなくて、傷つきたくない気持ちなのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: ……めたん。僕の親指、今日は、次に滑らなかったのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 2.0
