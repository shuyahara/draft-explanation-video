scenes:
- id: 1
  title: フック（現代の場面）
  chapter_title: null
  narration:
  - text: めたん、見てこれ。有名な俳優が、「被災地でボランティアをしてきました」って写真を上げてるのだ。はいはい、売名なのだ〜。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 投稿を見ただけで、売名だって決めちゃうの？ ……ずんだもん、今、笑ったでしょう。
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: 笑ったのだ。ほら、返信も見て。「売名だ」「偽善だ」「はいはい」ばっかりなのだ。みんな同じこと思ってるのだ。
    speaker: ずんだもん
    expression: smug
    pause_after: 0.45
  - text: 「ありがとう」より、笑った返信のほうが、ずっと広がってるわね。
    speaker: めたん
    expression: thinking
    pause_after: 0.45
  - text: そういうものなのだ。じゃあ次の投稿……。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 待って。指がもう次へ滑っていったわね。ひとつ聞いていいかしら。ずんだもんは、どうして笑ったの？
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: どうしてって……。なんか、笑うところだったのだ。理由は、うまく言えないのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そういう笑いのことを、冷笑って呼ぶのよ。本気の人を、「自分は分かってます」って顔で、鼻で笑って終わらせることね。理由がうまく言えないのも、冷笑の特徴なの。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: 冷笑……。僕、冷笑してたのだ？
    speaker: ずんだもん
    expression: shy
    pause_after: 0.45
  - text: 責めているわけじゃないのよ。私だって、同じ画面を見たら笑いそうになるかもしれないもの。だから、一緒に考えてみたいの。
    speaker: めたん
    expression: smile
    pause_after: 1.2
  readings:
  - surface: 冷笑
    reading: レイショウ
  beats:
  - type: image
    cut_reason: 【昼の電車】肩越しに見るスマホの画面。冒頭の場面をそのまま
