- id: 14
  title: 回帰と結び
  chapter_title: null
  narration:
  - text: ランプを掲げた男は、人間を探していたわ。権力や慣習を嗤ったけれど、自分は何も失わずに嗤っていたわけではないの。暮らしも体も、そこに賭けていたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 甕で寝て、大王にどいてくれって言って……。嗤われる側に回るのを、恐れなかったのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: そう。犬は、権力に吠えた。今の冷笑は、本気に吠える。反転したのは、矛先だけではないの。賭けているものが、なくなったのよ。
    speaker: めたん
    expression: serious
    pause_after: 1.5
  - text: 僕は、何も賭けずに笑ってたのだ。安全な場所から。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 安全な場所から、何も賭けずに嗤っていると、自分を守っているようで、少しずつ自分の力も削ってしまうの。信じる力も、つながり直す力も、いつか動き出す力もね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: あの画面を、もう一度思い出してみて。「意識高いね」と笑った一瞬、ずんだもんは何から、自分を守っていたのかしら。
    speaker: めたん
    expression: serious
    pause_after: 0.35
  - text: 無力感か。責められる予期か。それとも、嫉妬から来る、「不当だ」という感覚か。
    speaker: めたん
    expression: thinking
    pause_after: 0.8
  - text: ……たぶん、全部少しずつなのだ。海岸なんて変わらないと思ってたし、行かない自分がちくっとしたし、褒められてるのがちょっと悔しかったのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 正直ね。それが分かれば、次に嗤いたくなったとき、少し違う選択ができるかもしれないわ。ずんだもんだけじゃなく、見ている人にも、似た気持ちはあるはずよ。
    speaker: めたん
    expression: smile
    pause_after: 0.45
  - text: 僕、あの投稿、もう一回ちゃんと読んでみるのだ。行くかどうかは、読んでから決めるのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 0.45
  - text: それで十分よ。疑ったあとに、何をするか、だもの。
    speaker: めたん
    expression: smile
    pause_after: 0.35
  - text: 冷笑は安い。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: だから、広がる。
    speaker: めたん
    expression: serious
    pause_after: 0.4
  - text: でも、安いものはたいてい、後で高くつくの。
    speaker: めたん
    expression: serious
    pause_after: 0.8
  - text: そして、冷笑が守ろうとしているのは、正しさではなくて、傷つきたくない、という気持ちなのよ。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: ……めたん。僕の親指、今日は、次に滑らなかったのだ。
    speaker: ずんだもん
    expression: smile
    pause_after: 1.2
