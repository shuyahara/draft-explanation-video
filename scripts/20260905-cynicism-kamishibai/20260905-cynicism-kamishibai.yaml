- id: 4
  title: 古代②（反転）
  chapter_title: null
  narration:
  - text: ギリシャ語で犬は、キュオーン。ディオゲネスたちの一派は、そこからキュニコス、犬のような者たちと呼ばれたの。英語のシニック、シニシズムも、この犬につながっているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: キュオーン、キュニコス、シニック。音がつながってるのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: では、彼らは何に吠えていたのかしら。富や権力、それから「みんなこうするもの」という慣習よ。人はもっと少ないもので生きられる、と、暮らしそのもので示したの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 甕で寝てたのも、大王にどいてくれって言ったのも、全部それなのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: フランスの哲学者ミシェル・フーコーは、晩年の講義で彼らを高く評価したの。真理を語る勇気を、言葉だけでなく生き方で見せた人たちだ、とね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: つまり最初のシニシズムは、力のない側が権力へ向ける嗤いだったの。下から上へ、吠えていたのよ。
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: 下から上！ 海岸掃除の人を笑うのとは、向きが逆なのだ。
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: そうよ。ところが、この言葉はやがて意味を変えるの。英語のシニックが、哲学の一派ではなく、「人の動機を疑って鼻で笑う性格」を指すようになったのは、19世紀半ばだとされているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 文学研究者のデイヴィッド・マゼラは、これはただ意味が弱まったのではなく、反転したのだと言うの。かつては欲望を抑える鍛錬だったものが、いまは無関心や受け身を指す、と。
    speaker: めたん
    expression: explain
    pause_after: 0.6
  - text: 鍛錬が、無関心に……。同じ言葉で、中身が反対になったのだ。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: ドイツの哲学者ペーター・スローターダイクは1983年、この二つを呼び分けたの。古代の、体を張って示す嗤いをキュニシズム。近代の、知っていながら動かない態度をシニシズム、とね。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 彼はそれを、啓蒙された偽りの意識と呼んだの。世の中の仕組みは全部見抜いたつもりでいる。だから、「どうせ無駄」と知った顔で、動かないのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.45
  - text: 見抜いてるなら、動けばいいのに。なんで動かないのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 動かないほうが、傷つかずに済むからよ。世の中のひどさをまた見ても、「ほら、やっぱりそうだった」で終われるでしょう。
    speaker: めたん
    expression: explain
    pause_after: 0.35
  - text: 哲学者のスラヴォイ・ジジェクは、この態度をこんなふうに言ったわ。「彼らは、それが欺瞞だと知っている。それでも、そうする」。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: それ、ちょっと、僕の親指に似てるのだ……。分かってて、次へ滑るのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: 犬は、権力に吠えていたのよ。
    speaker: めたん
    expression: serious
    pause_after: 0.5
  - text: 今の冷笑は、本気に吠えている。矛先は、いつの間にか反転していたの。
    speaker: めたん
    expression: serious
    pause_after: 2.5
  - text: 権力から、本気へ……。でも、なんでなのだ？ なんで人は今、本気を嗤うようになったのだ？
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: いい問いね。手がかりは、意外なところにあるの。冷笑って、びっくりするほど安上がりなのよ。
    speaker: めたん
    expression: smile
    pause_after: 1.2
