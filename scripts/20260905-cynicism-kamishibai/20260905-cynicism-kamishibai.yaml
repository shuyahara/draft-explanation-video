- id: 12
  title: 環境が育てる（個人に還元しない）
  chapter_title: null
  narration:
  - text: 冷笑は、環境が育てるのよ。ペンシルベニア大学のジョセフ・カペラとキャスリーン・ジェイミソンは1997年、政治を、政策の中身ではなく勝ち負けの駆け引きとして描く報道が、視聴者のシニシズムを高めることを、実験で示したの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 「誰が勝った、誰が負けた」ばっかりのニュースなのだ。確かに、見てると「どうせ政治家は」って気分になるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: のちに32の研究、およそ3万9000人分の結果をまとめたメタ分析も、この効果が一貫して存在することを確かめているわ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: SNSはどうなのだ？ 僕が冷笑を見たのも、SNSなのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: SNSには、別の経路があるの。2020年のアメリカ大統領選挙の期間に約1800人を追跡した調査では、政治的な攻撃投稿に触れるほど怒りが高まって、その怒りが、シニシズムを高めていたのよ。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 怒りが、冷笑になるのだ？ 反対の感情に見えるのに。
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: 画面を開くたびに、「どうせみんな利己的だ」という前提が補給されるのよ。冷笑は、個人の性格である前に、毎日浴びている環境の産物でもあるの。
    speaker: めたん
    expression: point
    pause_after: 0.45
  - text: じゃあ、日本はどうなのだ？ 日本人は冷笑しやすいって、よく言われるのだ。
    speaker: ずんだもん
    expression: thinking
    pause_after: 0.45
  - text: 日本は、人を信じない国ではないのよ。世界価値観調査で、「たいていの人は信頼できる」と答える割合は、世界の中で際立って低いわけではないの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 意外なのだ。じゃあ、何が低いのだ？
    speaker: ずんだもん
    expression: surprised
    pause_after: 0.45
  - text: 政府への信頼は、2021年のOECDの調査で24パーセント。自分で社会を変えられると思う若者は、先ほどの18.3パーセント。日本で目立つのは、不信よりも、無力感なのよ。
    speaker: めたん
    expression: explain
    pause_after: 1.5
  - text: 人は信じてるのに、変えられるとは思ってない……。それ、僕そのものなのだ。
    speaker: ずんだもん
    expression: sad
    pause_after: 0.45
  - text: そして、この無力感には歴史があるの。1972年の連合赤軍事件と、翌年のオイルショックを経て、学生運動の熱は急速に冷めたわ。若者の無気力、無関心、無責任が、三無主義と呼ばれたの。
    speaker: めたん
    expression: explain
    pause_after: 0.45
  - text: 五十年も前から、言われてたのだ。
    speaker: ずんだもん
    expression: normal
    pause_after: 0.45
  - text: 社会学者の北田暁大さんは2005年、2ちゃんねるに生まれたコミュニケーションを、嗤いながら、同時に本気の感情を分かち合う、皮肉な共同体と分析しているわ。冷笑には、形を変えながら続いてきた、半世紀の系譜があるのよ。
    speaker: めたん
    expression: explain
    pause_after: 1.0
  - text: 環境のせいなら、疑うこと自体が悪いってことなのだ？ 何も疑わずに信じたほうがいいのだ？
    speaker: ずんだもん
    expression: confused
    pause_after: 0.45
  - text: そうじゃないのよ。疑うことと、嗤うことは、違うの。最後にそこを分けておきましょう。
    speaker: めたん
    expression: smile
    pause_after: 1.2
